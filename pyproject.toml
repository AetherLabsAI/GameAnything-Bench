[project]
name = "gameanything-bench"
version = "1.0.0"
description = "GameAnything-Bench: coding agents build and edit game mods from multimodal references"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Wenyi Wu"},
    {name = "Siqi Liu"},
    {name = "Yuru Feng"},
    {name = "Zixuan Song"},
    {name = "Aayush Salvi"},
    {name = "Sibo Zhu"},
    {name = "Kun Zhou"},
    {name = "Biwei Huang"},
]
keywords = ["benchmark", "coding-agents", "game-development", "multimodal", "llm-evaluation"]
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.19,<5", "huggingface_hub>=0.20", "pillow>=10"]

[project.urls]
Homepage = "https://huggingface.co/spaces/GameAnything/GameAnything"
Paper = "https://arxiv.org/abs/2611.29238"
Dataset = "https://huggingface.co/datasets/GameAnything/GameAnything-Bench"
Repository = "https://github.com/AetherLabsAI/GameAnything-Bench"
Issues = "https://github.com/AetherLabsAI/GameAnything-Bench/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
# the Steam login QR code in the terminal (gab/setup/steamsetup.py; installed on first use if missing)
steam = ["zxing-cpp>=2.2", "segno>=1.6", "pillow>=10"]

[project.scripts]
gab = "gab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gab*"]

[tool.setuptools.package-data]
gab = ["**/*.yaml", "**/*.lua", "**/*.md", "**/*.sh", "tools/*", "game/**/*", "agent/container_files/*", "refine/memory_seed/*.json", "report/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
