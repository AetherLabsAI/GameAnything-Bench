# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-HY-vid_969a6e261ae3.t1
source_inventory:
- 'clip 00:02.5-00:03.4: a man carrying bundles and two girls (an older one in yellow and orange, a small one in pink) walk up a sunken earthen
  path between wooded banks toward a red roof'
- 'clip 00:03.4-00:05.0: an old house in a meadow of tall grass and yellow flowers: a tall weathered wooden wing with a steep red roof joined
  to a lower Japanese tiled-roof wing; the two girls run toward it'
- 'clip 00:05.0-00:06.0: the older girl leans out of a round window in a plaster wall, a washtub below'
- 'clip 00:06.0-00:08.5: the yard: the girls run past a roofed hand-pump well beside a wooden side building with a balcony and a round window;
  the small girl tumbles in the grass'
- 'clip 00:08.5-00:09.9: both girls peer down / climb a dark narrow wooden staircase, seen from below'
- 'clip 00:10.0-00:11.3: on a dark plank floor a small black fuzzy ball with two eyes floats beside the small girl, who stares wide-eyed'
- 'clip 00:11.5-00:12.4: the small girl in a straw hat crouches by a wall, looking back'
- 'clip 00:12.5-00:13.9: a small blue rabbit-eared creature carrying a sack and a smaller white one walk along a grassy dirt path'
- 'clip 00:14.0-00:15.9: overlay ''FROM ACADEMY AWARD-WINNING DIRECTOR HAYAO MIYAZAKI'' over an enormous tree with massive roots; the tiny girl
  clambers over the roots'
- 'clip 00:16.0-00:16.9: the girl in a sunny clearing at the edge of a huge grey furry body seen from behind'
- 'clip 00:17.0-00:18.9: overlay ''ONE OF THE MOST BELOVED FILMS OF ALL TIME'' over a green, ferny tunnel of tree trunks and leaves'
- 'clip 00:19.0-00:20.4: a huge round grey creature with a pale chevron-marked belly lies asleep in a ferny hollow; the girl climbs up onto its
  belly'
- 'clip 00:20.5-00:22.9: the girl sits on its belly while the creature opens an enormous toothy mouth (a yawn) right beside her'
- 'clip 00:23.0-00:24.4: the girl laughs and grins, delighted, not afraid'
- 'clip 00:24.5-00:25.9: close shot of the giant''s face with a wide toothy grin, whiskers and pointed ears; the small white and blue creatures
  in the foreground (montage, possibly another moment)'
- 'audio: trailer music only; no usable speech'
- 'text p001: 1950s Japan; professor Tatsuo Kusakabe and daughters Satsuki (~10) and Mei (~4) move into an old house near the hospital where the
  mother Yasuko is recovering; the house is inhabited by small dark dust-like house spirits (susuwatari), seen when moving from bright places
  to dark ones, who leave to find another empty house; Mei finds two small spirits who lead her into the hollow of a large camphor tree; she befriends
  a larger spirit whose roars she reads as ''Totoro'' and takes for the troll from her picture book; she falls asleep on him but is on the ground
  when Satsuki finds her; she cannot show her family the tree despite many attempts; Tatsuo comforts her that Totoro will reveal himself when
  he wants to'
- 'img01: the red-roofed old house with its tiled wing, the two girls running toward it through tall grass and flowers'
- 'img02: the two girls in a bright doorway looking into a dark kitchen with a hand pump, its walls and floor covered in black soot balls'
- 'img03: the small girl swats at a swarm of black fuzzy soot balls on a dark wooden wall; some cling to her'
- 'img04: the small girl crawls through a tunnel of bent trees after a small white creature and a blue one carrying a sack'
- 'img05: top view into a lush green hollow of ferns and flowers; the small girl lies on the belly of the huge sleeping grey creature'
- 'img06: close view of the girl lying on the giant''s belly, touching its nose; it looks at her calmly'
