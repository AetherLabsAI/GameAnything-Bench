  U4: CR2
  U5: 'FP5 | dropped: already scored by FP5 (removal as the win)'
  F1: FP1
  F2: FP2 (existence of the small enemies -> CR1, their meadow -> CR2)
  F3: FP3
  F4: FP4
  F5: FP5
  F6: CR3 (event order seen by inspection)
