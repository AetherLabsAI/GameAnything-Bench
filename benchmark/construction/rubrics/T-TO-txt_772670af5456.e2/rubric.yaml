# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-TO-txt_772670af5456.e2
source_inventory:
- 'c44.p001: Sunday rest at home; the elder boys report that the maize and potato plantations need a few days'' work'
- 'c44.p002: next morning Fritz and Jack have taken the cart wheels to fetch pine trunks for fountain pipes; the father lays out the colonnade
  on the ground (a straight line in front of the rock that forms the house front, divided into equal spaces, the two ends kept for two pavilions);
  at Tent House the water must come a long way over uneven ground in buried pipes, bamboo is rejected for its knots, Fritz will make the pipes;
  twelve bamboo columns are set up'
- 'c44.p003-c44.p004: evening reading from the captain''s library keeps the mother unaware; Ernest asks to join the work; his straw bonnet'
- 'c44.p005-c44.p007: in a hollow of the rocks near Tent House the boys have a forge and hammer an iron bar to a point for an auger; they want
  bellows'
- 'c44.p008 (first part): kangaroo-skin bellows on boards; the iron twisted into a screw auger with a cross handle; trunks bored from both ends;
  iron joints made and the pipes buried in trenches, with Ernest''s surveying help'
- 'c44.p008 (middle): the colonnade is roofed: an arched plank on the columns, bamboos sloping back to the rock fixed with iron cramps, clay and
  gum making a glossy striped roof; the floor raised a foot and paved with stones from the rock cutting; many days of work while the mother still
  cannot walk; Ernest secretly makes a new bonnet'
- 'c44.p008 (end): the pavilions, pagoda-like, square on four columns, higher than the gallery, with pointed parasol roofs; a fountain in the
  middle of each, breast-high basins of turtle shell'
- 'c44.p009 (first part): the pipe decorated with shells, water falling through an urn-shaped volute into the basin and led out by a small channel;
  the work shields the dwelling from the heat; ''The Franciade'' written on the middle arch, ''Fritzia'' and ''Jackia'' over the pavilions; Ernest
  is not named'
- 'c44.p009 (middle): Fritz and Ernest make long excursions and bring game, natural curiosities and new plants (guajaraba, date-palm)'
- 'c44.p009 (end): the father tends the garden at Tent House; the dwelling lies among picturesque rocks and trees, facing the Bay of Safety; the
  garden is behind'
- 'c45.p001-c45.p003: the rope ladder is missing; the father and Jack walk into the garden along the foot of the rocks, past the cold forge, and
  hear knocking inside the rock; the father fears an earthquake, Jack guesses people'
- 'c45.p004: stones fall out and Fritz and Ernest appear; inside is a round grotto with a vaulted roof split by a narrow crevice for light and
  air, two gourd lamps, the rope ladder hanging from the opening at the top; nothing showed it from outside; Ernest presents it as a resting place
  for his mother on her way to the garden, the Grotto Ernestine'
- 'c45.p005-c45.p006: Jack jokes about a dwelling for the first to marry; the father asks how they found it'
- 'c45.p007: Fritz''s account: the path is too narrow for a tent and the sun-heated rock is like a stove; chasing a small antelope they climb
  a ravine near Tent House to the rock summit with a wide view; a crevice opens into a white-floored cavity; its floor seems level with the path
  to the garden; they choose to work from inside (cooler, rubble for benches, secrecy)'
- 'c45.p008: they haul the rope ladder up, check the depth and the level, test the air with candles and a fire, make iron tools at the forge,
  rig gourd lamps, go down and work until they hear the voices outside'
- 'c45.p009-c45.p011: the father approves and keeps the name; the mother will prefer Tent House to Falcon''s Nest and its winding staircase; the
  opening is enlarged, Jack builds benches from the rubble inside and two seats outside; the ladder is taken back; Falcon''s Nest to be only a
  pleasure-house; a plan to keep cattle there'
- 'c46.p001: the grotto finished: a few stalactites, a salt block made into an altar on four pillars with a citron-wood vase of erica; Ernest''s
  character, the bonnet and verses; the boys prepare flowers and a cold dinner on a table in the middle of the Franciade'
- 'c46.p002-c46.p004: the day of the visit; the mother comes down the staircase of her aerial dwelling; an osier carriage drawn by the cow and
  the young bull, Francis driving, the sons as escort; the new bonnet; they reach Family Bridge'
- 'c46.p005-c46.p009: the father proposes to cross over to Tent House; she worries about heat and food and expects no water there; Jack and Fritz
  ride ahead; arrival before the colonnade'
- 'c46.p010-c46.p013: the mother is speechless; Francis shows the Franciade and its inscription; Jack toasts her with water from the fountain
  in his pavilion, then Fritz receives her in the other; she drinks the fountain water and is served the dinner'
- 'c46.p014-c46.p016: Ernest''s song; the family''s happiness on the island'
- 'c46.p017: she decides to live at Tent House, near her kitchen and stores, walking in the colonnade; Falcon''s Nest is kept as it is; plans
  to fetch the cart, utensils and poultry'
- 'c46.p018-c46.p022: after a rest the sons carry her in a litter straight to the grotto; a sung verse; Ernest''s inscription on the salt block'
- 'c46.p023-c46.p024: she rests on a moss-covered bench; the father presents the garden, the embankment, the pond (for watering) and the shady
  arbour with her tools and two gourd watering-pans; she returns to Tent House and lists her gifts'
