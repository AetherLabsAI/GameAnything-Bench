    text: I really want the round cave chamber inside the cliff that gets its light and air through a narrow crack in its vaulted roof.
    covers:
    - CR4
    - VP2
rubric:
  content_realization:
  - id: CR1
    item: Tent House is a dwelling set into a rock face, the rock forming its front
    anchors:
      '1': the dwelling is built into / against a cliff whose rock face is its front
      '0.5': a dwelling stands near rocks but free of them, or the rock face is only a backdrop beside it
      '0': no dwelling, or no rock face at it
    evidence:
    - c44.p002
    - c44.p008
    - c44.p009
  - id: CR2
    item: A roofed colonnade (the Franciade) runs along the rock front of the house, with a pavilion at each of its two ends
    anchors:
      '1': a roofed gallery along the house's rock front, and one pavilion at each end of it
      '0.5': colonnade and pavilions exist, but the arrangement is wrong (gallery away from the rock front, unroofed, pavilions placed elsewhere
        or only one)
      '0': no colonnade
    evidence:
    - c44.p002
    - c44.p008
    - c44.p009
    - c46.p009
    - - c46.p011
      - c46.p012
  - id: CR3
    item: A fountain with flowing water stands in the middle of each pavilion
    anchors:
      '1': a fountain with visibly flowing water at the centre of each pavilion
      '0.5': a fountain in only one pavilion, or without water
      '0': no fountains
    evidence:
    - c44.p008
    - c44.p009
    - c46.p011
    - c46.p013
  - id: CR4
    item: The Grotto Ernestine is a chamber inside the cliff whose vaulted roof is split by a narrow crevice open to the sky
    anchors:
      '1': an enclosed chamber within the rock mass, with a narrow crack in its vaulted roof that opens to the outside and lets daylight in
      '0.5': a cave in the cliff, but without the roof crevice, or a shallow niche / built room rather than a chamber inside the rock
      '0': no grotto
    evidence:
    - c45.p004
    - c45.p007
    - c45.p010
  - id: CR5
    item: The garden has a pond and a shady arbour
    anchors:
      '1': a garden in which both a pond and a shaded arbour are recognisable
      '0.5': a garden with only one of them
      '0': no recognisable garden
    evidence:
    - c46.p023
    - c46.p024
  functions_playability:
  - id: FP1
    item: The player can walk the colonnade along the house front from one end to the other and enter the pavilion at each end
    anchors:
      '1': a continuous walkable gallery along the house front with an enterable pavilion at each end
      '0.5': the gallery cannot be walked through without leaving it, or a pavilion cannot be entered from it
      '0': no colonnade to move through
    evidence:
    - c44.p002
    - c44.p008
    - - c46.p009
      - c46.p013
    - c46.p017
  - id: FP2
    item: The player can walk from the house along the foot of the rocks to the garden, entering the grotto from that route on the way
    anchors:
      '1': the player can go from the house along the rock foot, into the grotto from the path, on to the garden, and back
      '0.5': the grotto or the garden is not reached from this route on foot (a detour, a teleport, entry only from above) or the grotto cannot
        be entered
      '0': the grotto or the garden cannot be reached
    evidence:
    - c45.p001
    - c45.p004
    - c45.p007
    - c45.p011
    - c46.p018
    - c46.p023
  visual_presentation:
  - id: VP1
    cat: style
    item: The pavilions rise higher than the gallery and end in pointed roofs
    anchors:
      '1': pavilions clearly taller than the gallery, with pointed roofs
      '0.5': pavilions distinct from the gallery, but flat-roofed or no taller than it
      '0': no distinct pavilions
    evidence:
    - c44.p008
  - id: VP2
    cat: style
    item: The grotto's interior reads as a rounded natural rock chamber, not a built room
    anchors:
      '1': inside, rounded, irregular natural-rock walls curving up into the roof
      '0.5': a cave interior, but built-looking
      '0': no grotto interior
    evidence:
    - c45.p004
    - c45.p010
  - id: VP3
    cat: spatial
    item: The gallery reads as one straight row of evenly spaced columns whose roof slopes back to the rock face
    anchors:
      '1': a straight line of regularly spaced columns in front of the rock, the roof leaning from them back onto the rock face
      '0.5': a roofed gallery, but the columns are irregular or not in one line, or the roof stands free of the rock (flat slab or ridge roof
        not joining the cliff)
      '0': no gallery with columns
    evidence:
    - c44.p002
    - c44.p008
play_suggestions:
  FP1:
  - walk the whole colonnade from one pavilion to the other without leaving it
  - enter each pavilion from the gallery and stand at its fountain
  FP2:
  - 'start at the house front and follow the foot of the rocks to the garden: is the grotto entrance on the way?'
  - enter the grotto from the path and come back out the same way
  - walk back from the garden to the house
  robustness:
  - 'try to walk along the top of the rock face or through the rock: is the cliff solid?'
  - 'leave the site and come back: are the landmarks where they were?'
  - 'look for the grotto from outside before entering: does the opening sit in the cliff beside the path?'
