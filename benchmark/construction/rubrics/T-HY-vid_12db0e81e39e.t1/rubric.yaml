  on a hill on the horizon ahead, a lone tree, scattered rocks; a small glowing fairy follows him'
- 'clip 01:04.0-01:05.0: he swims in a clear turquoise lake; a tall round stone tower with a platform on top stands on rocks at the left shore
  beside cliffs and buildings; a flat-topped red rock pillar rises from the water on the right'
- 'clip 01:05.5-01:07.0: a forested gorge with grass-topped round rock pillars; he glides from pillar to pillar holding a white bird above his
  head; a stone arch in the background'
- 'clip 01:07.5-01:08.5: a paved town square with gabled half-timbered houses, red roofs, a large tree, a stone fountain basin, flower pots and
  banners; townspeople, a dancing couple, a girl in a blue dress, a running white bird; he runs across it'
- 'clip 01:09.0-01:10.0: a fenced grass paddock in low golden backlight; three horses and the boy standing among them; a tall ruined rock or tower
  silhouette and hills behind the wooden fence'
- 'clip 01:10.5-01:13.0: he rides a brown horse with a white mane across rolling green hills under a blue sky with clouds; a mesa and distant
  mountains on the horizon; a tall wooden plank fence on a hill at 01:12.5-01:13.0'
- 'clip 01:13.5-01:14.0: the horse rears on the grassland; behind it a lone, tall cone volcano with a white smoke plume and a pink cloud above
  the summit'
- 'clip 01:14.5-01:16.5: a girl in a white-and-purple headdress and pink tunic looks through a window in a stone wall with ivy, then turns to
  the camera'
- 'clip 01:17.0-01:18.0: a bald moustached man in blue overalls clutches his head; dialogue box ''Talon: Oh— Oh NO! I left her all on her own!''
  with ''Hide'' and ''Conversation Log'' prompts'
- 'clip 01:18.5-01:19.5: a bald man with a hand organ in a warm-lit room with purple music notes; dialogue box ''Music Man: What the heck! How
  dare you!'''
- 'audio (Whisper): narration 01:03.9-01:07.0 ''Your quest takes place in the vast kingdom of Hyrule.''; from 01:17.2 ''Meet lively characters,
  battle ferocious monsters, and solve puzzles scattered throughout dungeons.'' (the segment runs past the clip end); music not transcribed'
- 'img01: hand-drawn parchment map, top-down with pictorial landmarks; labelled CASTLE (towered castle on a rocky hill, north centre), TOWN (walled
  town, west, with a small harbour), LAKE (large lake, south-west, with a round tower on an island and jetties on the shore), RANCH (fenced paddocks
