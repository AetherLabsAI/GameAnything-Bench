  modality: video+image
  roles:
    video: the look of each zone (castle on a hill over grassland, turquoise lake with a stone tower, timber-framed town square, fenced horse
      ranch, smoking volcano), the open grassland between them, what stays visible from afar, and how the place is crossed (on foot, swimming,
      on horseback)
    images: 'img01 is an independent top-down map of a kingdom with the same kinds of zones (castle, town, lake with a tower, ranch, volcano,
      plus a forest) and the roads between them: it gives the arrangement and connections the 1-2 s cuts cannot show'
  cross_reference_requirement: The zones the clip shows must be placed in the relative arrangement and road network of the map in img01 (castle
    north, town west, lake south-west, ranch at the central crossroads, volcano north-east), each looking like its counterpart in the clip.
