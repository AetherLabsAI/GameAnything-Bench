rubric:
  content_realization:
  - id: CR1
    item: 'The region contains the five distinct zones the clip shows, each an area of its own: a castle, a lake, a town, a horse ranch and a
      volcano'
    anchors:
      '1': all five zones present as separate, identifiable areas
      '0.5': three or four of the five zones
      '0': fewer than three, or the place built as one undifferentiated landscape
    evidence:
    - - '01:02.0'
      - '01:14.0'
    - img01
  - id: CR2
    cross: true
    item: 'The zones the clip shows (video) are placed in img01''s relative arrangement (map): castle to the north, town to the west, lake to
      the south-west, ranch at the centre, volcano to the north-east'
    anchors:
      '1': at least four zones present and every present zone placed relative to the others as in img01 (north up)
      '0.5': one or two zones out of img01's arrangement, or fewer than four zones to place
      '0': no distinct zones, most zones out of img01's arrangement, or an arrangement unrelated to img01
    evidence:
    - img01
    - - '01:02.0'
      - '01:14.0'
  - id: CR3
    item: Wide open, rolling green grassland lies between the zones (video), crossed by routes that link the zones and meet in a central area
      at or near the ranch (img01)
    anchors:
      '1': open grassland between the zones, with routes across it joining at a central meeting area at or near the ranch
      '0.5': open land without routes, or routes that only run zone to zone without a central meeting point
      '0': no open land between the zones and no routes
    evidence:
    - - '01:02.0'
      - '01:03.5'
    - - '01:10.5'
      - '01:13.0'
    - img01
  - id: CR4
    item: The castle and the volcano are both visible from far away across the open grassland
    anchors:
      '1': standing on the grassland, both the castle and the volcano are visible in the distance
      '0.5': only one of them is visible from afar
      '0': neither is visible from the grassland, or they are missing
    evidence:
    - - '01:02.0'
      - '01:03.5'
    - - '01:13.5'
      - '01:14.0'
  functions_playability:
  - id: FP1
    item: Following the routes across the open land, the player can travel from any zone to any other
    anchors:
      '1': every zone can be reached from every other over connected routes
      '0.5': most zones are reachable but one cannot be reached, or only by leaving the routes
      '0': the zones are not connected or not reachable
    evidence:
    - img01
    - - '01:02.0'
      - '01:03.5'
  - id: FP2
    item: The place can be crossed on foot, swum in the lake, and ridden across on a rideable mount over the open grassland
    anchors:
      '1': walking, swimming in the lake and riding a mount across the grassland all work in the place
      '0.5': two of the three
      '0': walking only
    evidence:
    - - '01:02.0'
      - '01:03.5'
    - - '01:04.0'
      - '01:05.0'
    - - '01:10.5'
      - '01:14.0'
  visual_presentation:
  - id: VP1
    cat: spatial
    keyframes:
    - '01:02.0'
    - '01:03.5'
    item: A walled castle stands on high ground at the edge of wide green grassland
    anchors:
      '1': a walled castle on a hill above open grassland
      '0.5': a castle without the high ground or without open grassland before it
      '0': no castle
    evidence:
    - - '01:02.0'
      - '01:03.5'
    - img01
  - id: VP2
    cat: spatial
    keyframes:
    - '01:04.0'
    - '01:05.0'
    item: The lake is a broad stretch of clear, bright turquoise water with a tall round stone tower standing at or in it
    anchors:
      '1': clear, light-coloured open water with a stone tower rising at or in it
      '0.5': a lake without the tower, or a tower by dark, murky water
      '0': no lake
    evidence:
    - - '01:04.0'
      - '01:05.0'
    - img01
  - id: VP3
    cat: style
    keyframes:
    - '01:07.5'
    - '01:08.0'
    item: The town centre is an open paved square ringed by gabled, half-timbered houses
    anchors:
      '1': an open paved square enclosed by half-timbered gabled houses
      '0.5': a town of other buildings, or houses without an open square
      '0': no town
    evidence:
    - - '01:07.5'
      - '01:08.5'
  - id: VP4
    cat: spatial
    keyframes:
    - '01:09.0'
    - '01:10.0'
    item: The ranch is a grass paddock enclosed by a wooden fence with horses in it
    anchors:
      '1': a fenced grass paddock with horses
      '0.5': a fence or horses, not both
      '0': no ranch
    evidence:
    - - '01:09.0'
      - '01:10.0'
    - img01
  - id: VP5
    cat: spatial
    keyframes:
    - '01:13.5'
    - '01:14.0'
    item: A lone, tall cone-shaped volcano with a smoking summit rises above the grassland
    anchors:
      '1': a single tall cone with smoke rising from its summit
      '0.5': a mountain without the cone shape or without smoke
      '0': no volcano
    evidence:
    - - '01:13.5'
      - '01:14.0'
    - img01
play_suggestions:
  CR2:
  - 'from a high point or an overhead view, compare the zone positions with img01 (north up): castle north, town west, lake south-west, ranch
    centre, volcano north-east'
  - walk to each zone and screenshot it next to the clip frame
  FP1:
  - 'travel castle -> ranch -> lake -> town -> volcano along the routes: is any leg blocked?'
  - check whether the routes really meet near the ranch or only run zone to zone (CR3)
  FP2:
  - swim out to the lake tower and back
  - mount and ride from the ranch across the grassland to the volcano zone
  robustness:
  - 'try to leave the region at its edges: is there a sensible boundary?'
  - 'dismount in the lake and in the town: does the mount behave sensibly?'
  - 'stand on the grassland and turn around: are the castle and the volcano both visible from afar?'
