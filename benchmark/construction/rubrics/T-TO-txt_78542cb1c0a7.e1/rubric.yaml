# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-TO-txt_78542cb1c0a7.e1
source_inventory:
- 'c13.p001-c13.p002: letter heading and dateline, Kanaya''s, Nikko, June 15'
- 'c13.p003: the house: a quiet two-storied pavilion on a stone-faced terrace up stone steps, bright garden, the mountain rising just behind,
  one stream supplying water and another passing under the house through a fish-pond to the river; the grey village of Irimichi across the road,
  shut in by the rushing Daiya, wooded hills with ravines and waterfalls beyond'
- 'c13.p004: arrival; polished verandahs and stairs, fine white mats; the narrator''s room (front of sliding shoji, wood ceiling, two alcoves
  with a cherry-blossom kakemono and a painted cabinet, single flowers in hanging vases, almost no furniture), Ito''s room at the back, stair
  to bath-house and garden, a room downstairs and the domestic space, a tiled fire-proof kura to the right of the house'
- 'c13.p006: Kanaya (chief man of the village, leads music at the Shinto shrines, embellishes house and garden), his mother, sister, servant and
  the sister''s children; he lets the rooms to foreigners without Europeanising them'
- 'c13.p007-c13.p008: supper on a gold-lacquer zen; prices of rooms and food; interest of living in a private home; signature'
- 'c14.p001-c14.p003: letter heading and dateline, June 21; nine days at Nikko'
- 'c14.p004: the surroundings of Nikko: snow mountains round Nantaizan, forests, lakes, the Kegon falls, the Daiyagawa passes, azaleas, rich vegetation
  around the shrines of the two Shoguns'
- 'c14.p005: history: the burial of Iyeyasu on the hill-slope of Hotoke Iwa in 1617, his deification; the shrine since stripped of its Buddhist
  ritual, a few Shinto priests selling tickets'
- 'c14.p006: the grand approach: the Red Bridge, a broad road with steps at intervals between embankments topped by cryptomeria, a great granite
  torii at the summit, then an array of bronze lanterns on stone pedestals, a roofed granite holy-water cistern, a bronze bell, lantern and candelabra,
  and on the left a five-storied carved and painted pagoda'
- 'c14.p007: the grand entrance (Ni-o) gate up a flight of steps beyond the torii, curtain and carvings; the overwhelming first view of the court'
- 'c14.p008: the first court, pebbled and enclosed by a red timber wall: treasure buildings, the stable of the sacred white horses, the cistern,
  the scripture library; steps up to a smaller court with bell-tower, drum-tower, a shrine and bronze lanterns'
- 'c14.p009: steps up to the Yomei gate (white columns, kirin capitals, dragons, carved figures); a carved piazza encloses the next court against
  a stone wall built into the hill, with the dance stage, incense altar and the hall of the sacred cars; ''from splendour to splendour'''
- 'c14.p010-c14.p011: the gilded trellis enclosure in the middle with the chapel (haiden); after all the magnificence the dim golden temple holds
  simply a black lacquer table with a metal mirror; the matted hall with the empty Shogun''s and Abbot''s rooms, carved and painted panels, a
  stone-paved chapel behind and an inaccessible black-and-gold inner chapel'
- 'c14.p012: the tomb is not in the shrines: leaving the courts by a covered gateway in the eastern piazza into a mossy stone gallery, a long
  stone staircase climbs to the hilltop, where above and behind the shrines Iyeyasu lies in a plain massive tomb of stone and bronze with an urn,
  a stone table with bronze ornaments, a walled enclosure, in perpetual twilight under large cryptomeria, silent'
- 'c14.p013: the mortarless masonry of retaining walls, gallery and staircase; the overflowing granite cistern'
- 'c14.p014: the nearby temples of Iyemitsu, still Buddhist: a series of gates with guardian figures (Ni-o, gods of wind and thunder, the four
  quarters) up flights of steps to the main temple with gilded Buddhas, a subdued devil and rows of painted idols; an old priest''s remarks'
- 'c14.p015: an earthquake rings the roof wind-bells and priests drum; Iyemitsu''s tomb up steps to the right of the chapel, with bronze gates;
  a view from the uppermost gate framed by cryptomeria'
- 'c14.p016: the roofs: sheet-copper or coppery-grey tiles with gold-badged ends, massive, on carved timbers'
- 'c14.p017-c14.p018: the shrines in their setting of huge cryptomeria; gold, black, dull red and white lacquer; bronze fret-work; deep open-work
  carvings of birds and flowers'
- 'c14.p019-c14.p020: the lasting impression: masses of black and red lacquer and gold, silent matted halls with slanting sunbeams, bronze lanterns,
  priests, and the cryptomeria forest lit by azaleas; signature'
- 'c15.p001-c15.p003: letter heading, Yashimaya, Yumoto, June 22; a fifteen-mile, eight-hour ride on a pack-horse: the gentle mares, the led horse,
  the pack-saddle and how a rider balances on it, a fall into a mud-hole'
- 'c15.p005: the exquisite yadoya at the end of the day: scented planed-wood fusuma, white matting, polished pine balconies; tea and sweets on
  arrival; the evening spent outdoors'
- 'c15.p007: Yumoto: a village squeezed between the lake and the mountains, neat houses one above another of new reddish cedar; snow ten feet
  deep in winter, the houses wrapped in matting and abandoned October to May but for one watchman; the proper way up is by kago'
- 'c15.p008: two short narrow streets made entirely of yadoyas (deep eaves, balconies, lanterns, open lower fronts), full of bathers with blue
  towels; four bathing-sheds; mountains of jungle allow walking only in the streets or along the track; a covered boat, geishas; the great sulphur
  spring beyond the village in a square tank in a mound, invalids lying on boards over its steam; the water cools along an open wooden pipe to
  the village; high and cold'
- 'c15.p009-c15.p010: back at Irimichi: how a ''squeeze'' on the bill is shared between host and servant; signature'
- 'c16.p001-c16.p003: letter heading, Irimichi, June 23; the quiet life there nearly at an end'
- 'c16.p004-c16.p006: the village: about three hundred houses along three roads with steps across them at intervals and a rapid stream in a stone
  channel down the middle of each, children''s water-wheel toys; the drum at 7 a.m. and the Europeanised school (benches, maps, black-board, recitation);
  the syllabary poem and comment'
- 'c16.p007-c16.p008: school punishments; children leave at noon in two divisions; afternoons and evening lesson preparation; a procession of
  children with flags; the water-wheel toys'
- 'c16.p009-c16.p011: a formal children''s party given by the house-child Haru, received at the top of the stone steps; her dress and make-up;
  tea and sweets; forms of address and girls'' names; a game of doctor and funeral; etiquette'
- 'c16.p012-c16.p013: Yuki, Haru''s mother: housework, garden, simple sewing of garments, reading from circulating libraries; her son''s calligraphy;
  samisen lessons'
- 'c16.p014: flower arrangement: the room newly decorated almost daily with a single kakemono and single flowers; contrast with western bouquets'
- 'c16.p015: Kanaya again (music leader, sells drugs); his garden works: a waterfall, a stream, a small lake, a bamboo bridge, grass banks, transplanted
  trees; he goes out with the narrator, Ito interprets'
- 'c16.p016-c16.p017: the household day: rise at daylight, quilts into the press, sweeping, opening the amado shutters and throwing back the paper
  windows, meals, work and visits; evening visitors, chess, stories, samisen, singing and sake'
- 'c16.p018: an evening of guide books, picture books and old treasures brought from the kura; rooms kept uncluttered, one object shown at a time'
- 'c16.p019-c16.p020: planning routes on Brunton''s map with Kanaya and his sister; Kanaya''s wish to build a hotel; the god-shelf with memorial
  tablets, offerings each morning and a lamp each evening'
- 'c17.p001-c17.p002: letter heading; dismal lighting: the paper andon and the wax candle; an andon burns all night'
- 'c17.p003: the villages are full of shops: nearly every house sells food and small goods on stands at the open front, domestic work visible
  in the room behind; match-cutting and foot-worked rice husking in house fronts'
- 'c17.p004: women weaving, spinning, at their toilet; the rhythm of the village day (silent while the children are at school, livelier at sunset,
  baths, lessons recited); at dark the paper windows drawn, the amado closed, a lamp before the family shrine, games round the andon, the family
  sleeps in one room'
- 'c17.p005: parents'' delight in children; men gathering at six each morning on a low wall with their infants; the docile, adult-dressed children'
- 'c17.p006-c17.p007: hair styles of girls and boys by age; skin diseases and smallpox among the villagers'
- 'c18.p001-c18.p002: letter heading; shopping in Hachiishi: open shop fronts with a raised polished ledge to sit on, the shopwoman at her brazier,
  bowing and bargaining'
- 'c18.p003: barbers working in the raised open shop fronts in the evening'
- 'c18.p004: a seed shop with painted seed packets; purchases for the journey (an oiled-paper waterproof, baggage covers, a hat for Ito); Ito''s
  vanity'
- 'c18.p005: departure tomorrow for the interior and the Sea of Japan by a road ''all among the mountains'' to Tajima; the repaired bed; the Land
  Transport Company and its rates'
- 'c18.p006-c18.p007: Japanese money and distance units; what ''road'' means in the coming letters; signature'
