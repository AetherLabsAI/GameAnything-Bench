rubric:
  content_realization:
  - id: CR1
    item: Kanaya's house stands raised on a terrace reached by steps, with the mountain rising directly behind it and the village of Irimichi
      across the road in front, shut in by the river beyond
    anchors:
      '1': the house raised on a terrace with steps, the mountain right behind it, and the village across the road with the river beyond, all
        placed correctly relative to each other
      '0.5': the house and the village both present, but one relation missing or wrong (e.g. no mountain behind, the village not across the road,
        the house at ground level)
      '0': the house or the village missing, or the two not related spatially
    evidence:
    - c13.p003
  - id: CR2
    item: Irimichi's streets each have a rapid stream running in a channel down the middle of the road
    anchors:
      '1': village streets lined with houses, each with a stream channel running down its middle
      '0.5': the village has water, but not in the streets (e.g. a stream beside or crossing the street, a river beside the village)
      '0': missing, or an ordinary village with no street streams
    evidence:
    - c16.p004
    - c16.p008
  - id: CR3
    item: The shrine precinct is approached from a bridge by a road climbing to a great torii, followed by a long array of lanterns and a tall
      pagoda, and then a gate up steps into a walled court
    anchors:
      '1': bridge, climbing approach, torii, lantern array, pagoda and the gate up steps into a walled court, in this processional order
      '0.5': some of these landmarks, but the approach is not recognisable as this processional entry (e.g. no climb, landmarks scattered, no
        gate into a court)
      '0': no approach to the precinct
    evidence:
    - - c14.p006
      - c14.p008
  - id: CR4
    item: Beyond the gate the precinct is a chain of courts, each higher than the one before and entered up steps through a gate, ending in a
      gilded enclosure whose chapel is almost empty
    anchors:
      '1': several courts in an ascending chain, each entered by steps and a gate, ending at an innermost gilded enclosure with a near-empty chapel
      '0.5': several courts but not as an ascending chain (e.g. side by side on one level), or the innermost chapel missing or filled like the
        other buildings
      '0': a single court or a single building only
    evidence:
    - - c14.p008
      - c14.p011
  - id: CR5
    item: Iyéyasu's tomb is not inside the shrine courts but outside them, above and behind them, reached by leaving the courts and climbing a
      long stair up the wooded hill
    anchors:
      '1': the tomb outside the enclosures, above and behind the shrines, at the top of a long stair that starts from the courts
      '0.5': the tomb on the hill, but its relation to the courts wrong or vague (e.g. beside the first court, no stair from the courts)
      '0': no tomb, or the tomb inside the chapel or the courts
    evidence:
    - c14.p012
  - id: CR6
    item: Yumoto is a separate small spa village of inns, squeezed between a lake and the mountains, joined to the base by a mountain track, with
      its hot spring just beyond the village
    anchors:
      '1': a separate village of inns closed in between a lake and mountains, a track joining it to the base, and the spring at its edge
      '0.5': Yumoto present but one of these missing (no lake or mountains closing it in, no track to the base, no spring), or it is merged into
        Irimichi
      '0': missing
    evidence:
    - c15.p007
    - c15.p008
  functions_playability:
  - id: FP1
    item: 'The house, the village and the shrine precinct form one place the player can move through: from the house down to the road and the
      village streets across it, and along an approach to the shrines'
    anchors:
      '1': the player can walk between the house, the village streets and the shrine precinct as connected parts of one area
      '0.5': all three exist but are not connected by movement (separate levels picked from a menu), or one of them cannot be entered
      '0': only one of the three, or no free movement
    evidence:
    - c13.p003
    - c14.p006
    - c16.p004
  - id: FP2
    item: 'The shrine visit plays as a climb: the player walks up the approach and passes court by court, each reached only from the one before,
      to the innermost chapel, and can leave the courts to climb on to the tomb above'
    anchors:
      '1': the courts are walked through in order, climbing, up to the chapel, and the tomb is reached on foot by an onward climb out of the courts
      '0.5': the courts are walkable but can be entered out of order or without climbing, or the tomb cannot be reached on foot
      '0': no walkable shrine route
    evidence:
    - - c14.p006
      - c14.p012
  - id: FP3
    item: The player can travel from the base to Yumoto along the track and move about the village, kept to its short streets and the track by
      the lake and the mountains, and walk to the spring
    anchors:
      '1': Yumoto reached on foot from the base along the track; inside it movement is bounded by the lake and the mountains, and the spring can
        be walked to
      '0.5': Yumoto walkable but reached only by a menu jump or teleport, or its bounds do not hold the player to the streets and track, or the
        spring cannot be reached
      '0': Yumoto cannot be visited
    evidence:
    - c15.p003
    - - c15.p007
      - c15.p008
  visual_presentation:
  - id: VP1
    cat: style
    item: The rooms of the house are open and nearly empty, walled by sliding paper screens, with sparse, restrained decoration
    anchors:
      '1': rooms with sliding paper-screen walls whose sparse, uncluttered character is recognisable
      '0.5': sliding paper screens present but the sparse character is not recognisable, or sparse rooms without sliding screens
      '0': missing, or the interior unrelated to the description
    evidence:
    - c13.p004
    - c16.p014
    - c16.p018
  - id: VP2
    cat: style
    item: 'The precinct shows its two looks: ornate gilded and lacquered buildings among huge dark cryptomeria, and above them the plain tomb
      in the twilight of the trees'
    anchors:
      '1': ornate gilded and lacquered buildings in a forest of tall dark trees, and a visibly plain, shaded tomb
      '0.5': one of the two looks only, or both without the forest setting
      '0': missing, or the precinct looks plain throughout
    evidence:
    - - c14.p016
      - c14.p019
    - c14.p012
  - id: VP3
    cat: style
    item: 'The whole place looks like a deep mountain valley: steep, densely wooded mountains rise close around the house, the village and Yumoto,
      with a rushing river below the village'
    anchors:
      '1': steep wooded mountain slopes visibly enclosing the base and Yumoto, and the river below the village shown as fast-flowing water
      '0.5': mountains present but bare, distant or only around one location, or the river shown as still water
      '0': missing, or the place sits on open flat land
    evidence:
    - c13.p003
    - c14.p004
    - c15.p008
play_suggestions:
  FP1:
  - 'walk from the house down its steps to the road and into the village: is it a continuous route?'
  - from the village, find the way to the shrine approach without a menu jump
  FP2:
  - 'walk the approach from the bridge: do the courts follow one after another, each up steps?'
  - try to reach an inner court without passing the outer ones
  - 'from the last court, find the way out and up to the tomb: is it above and behind the shrines?'
  FP3:
  - 'travel from the base to Yumoto: is it joined to the base by a track?'
  - 'in Yumoto, walk to the edges: do the lake and the mountains close the village in? find the spring'
  robustness:
  - 'walk off the routes into the mountain slopes, the river and the stream channels: are you stuck, or does the place hold up?'
  - go back and forth between the house, the shrines and Yumoto several times
  - leave the game in the shrine courts and come back
