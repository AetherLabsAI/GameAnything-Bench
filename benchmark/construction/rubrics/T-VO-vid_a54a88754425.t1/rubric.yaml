source_inventory:
- 'throughout: semi-transparent ''DRONE SNAP'' watermark at the bottom right; no other text or UI inside the ranges'
- 'audio: music only; the offline transcript at 00:15-00:39 (''Father, save my son, come on back'', ''Much trouble I must leave behind'') is song
