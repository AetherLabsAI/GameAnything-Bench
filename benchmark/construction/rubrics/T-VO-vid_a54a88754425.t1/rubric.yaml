- '00:15.5-00:28.0 high, wide, slowly drifting daytime view across deep-blue harbour water: the shell-roofed opera house sits on the tip of a
  headland left of centre, a wooded park and a few mid-rise blocks behind it on the right, a low city skyline with scattered towers and more harbour
  arms on the horizon; a speedboat crosses the foreground leaving a long white wake, a smaller boat with a wake further back'
- '00:28.0-00:37.0 cut: sunny with white clouds, teal water; the opera house shells fill the lower left foreground; behind, across the water,
  a long steel arch bridge with stone pylons spans the harbour, a cluster of downtown towers rises beyond its right end, a residential point with
  trees and apartment blocks lies on the right shore; several ferries and speedboats cross at once in different directions, each leaving a long
  white wake; the drone moves forward and turns'
- 00:37.0-00:46.0 a large white cruise ship is moored at a quay on the left, across the water from the opera house; the opera house podium with
  its broad paved forecourt and steps and the trees of the park appear in the lower left; ferries cross between the opera house and the bridge;
  dark office blocks behind the forecourt at 00:43-00:46
- '00:46.5-00:54.0 cut: long, nearly static view across deep-blue open water to the arch bridge seen broadside with a stone pylon at each end,
  waterfront buildings and long finger wharves on the shore at the right, a tall tower at the far right edge; small boats cross leaving short
  wakes'
- '00:54.5-01:03.0 cut: high oblique flight from over a park (lawns, large trees, paths) along a curving seawall promenade toward the opera house
  at the top of the frame; small jetties / pontoons at the corner of the forecourt; a small yellow boat on teal water; boats with wakes in the
  distance'
- '01:03.0-01:12.0 the drone closes on the opera house: the forecourt, steps and jetties below, the shell roofs in a large and a smaller group
  plus a small separate shell, on a raised podium with dark sides dropping into the water'
- 01:12.0-01:22.0 the drone climbs over the roofs to a near top-down view of the shell tips and the podium edge with people-sized dots; a speedboat
  wake crosses the water beyond
- '01:22.8-01:36.5 cut (second clip): nearly static daytime view; a green-and-cream harbour ferry crosses calm blue water toward a cove, a broad
  foamy wake behind it; the cove is lined by a low waterfront terminal and wharves with a moored vessel and older low-rise buildings on the right;
  a dense skyline of glass and sandstone towers stands behind; a low modern building and trees on the left shore'
- '01:36.8-01:49.6 cut: dusk with an orange-pink sky and calm grey-blue water; the opera house in the lower left foreground, its podium lit warm
  orange; across the water a white cruise ship moored at a quay in front of the downtown towers (left), a stone bridge pylon and the bridge arch
  to the right; the camera drifts sideways and reveals more of the bridge'
- '01:49.8-01:57.0 cut: darker dusk over a wide stretch of harbour water; a small wooded island in the middle distance, a dark headland at the
  right, and the distant downtown skyline with a tall spire tower and the bridge arch along the horizon under a warm glow; a few boats and a ship
  leave wakes'
- '01:57.8-02:11.0 cut: golden-hour low flight just above the surf at an ocean beach; waves build, break and throw spray, white foam washes over
  dark rocks in the foreground; a sand beach with a row of low beachfront buildings and a few taller blocks along the shore behind (no downtown
  skyline in view)'
- '02:11.8-02:20.0 cut: sunset with a strong red colour cast; a wide view over dense low suburban rooftops and trees, a bay with small islands
  and the downtown skyline on the horizon under an orange-yellow band of sky'
- '02:20.5-02:31.0 a white lighthouse rises into the bottom of the frame as the camera moves toward it; from 02:25 it is seen whole: a tall white
  tower with a lantern on a low, stepped white base, a row of low white cottages / outbuildings to its left, lawn around it, suburbs behind and
  the skyline on the horizon'
