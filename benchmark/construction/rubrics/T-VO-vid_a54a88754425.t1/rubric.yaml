      a small separate shell) on a broad raised podium with a paved forecourt and steps, whose sides drop straight into the water'
    anchors:
      '1': white overlapping pointed shells in groups, on a raised paved podium with forecourt and steps, at the water's edge
      '0.5': shell roofs present but the podium / forecourt or the grouping missing or wrong, or the building set back from the water
      '0': missing, or a generic building
    evidence:
    - - '00:28.0'
      - '00:46.0'
    - - '01:03.0'
      - '01:22.0'
  - id: CR2
    item: The game contains a long steel arch bridge spanning the harbour, with a stone pylon at each end
