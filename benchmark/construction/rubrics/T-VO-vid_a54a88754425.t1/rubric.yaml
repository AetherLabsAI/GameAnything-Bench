play_suggestions:
  FP1:
  - look across the water at the harbour core from afar
  - zoom close to the landmark's roofs and podium
  - 'go to the island view, the surf beach and the lighthouse: are they reachable, intact and viewable up close?'
  FP2:
  - 'watch the harbour for a few in-game minutes: how many vessels move at once, do they leave wakes?'
  - 'follow a ferry: does it reach the terminal in the cove and keep running?'
  FP3:
  - advance or set the time to dusk and back to day
  - check that the change applies to the harbour core and the outer settings alike
  robustness:
  - 'leave the region and come back: is it unchanged?'
  - 'let the game run unattended for a while: do traffic and lighting keep working without errors?'
  - 'move the camera to the map edges and under / through the landmark: no holes or missing faces'
