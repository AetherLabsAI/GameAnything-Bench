rubric:
  content_realization:
  - id: CR1
    item: The site has two rock-cut temples, a great one and a small one, side by side in neighbouring cliffs at the river bank, with a slope
      of drifted sand between them that slants down across the great temple's front
    anchors:
      '1': two temples cut into neighbouring cliffs at the river's edge, the sand-slope between them, slanting down across the great temple's
        front
      '0.5': both temples at the river, but the sand-slope between them is missing or does not reach across the great front, or the temples are
        not side by side
      '0': only one temple, or the temples are free-standing buildings away from the river
    evidence:
    - - c38.p029
      - c38.p031
    - c38.p033
    - c38.p075
  - id: CR2
    item: The great temple's front is the cliff itself, facing east toward the sunrise and carved into four colossal seated statues of the same
      king, two on each side of the central doorway
    anchors:
      '1': an east-facing cliff front with four seated statues of one king cut into it, two on each side of the door
      '0.5': giant statues on the great front, but not seated, not two either side of the door, the wrong number, free-standing figures placed
        before the cliff rather than cut into it, or the front does not face east
      '0': no statued front on the great temple
    evidence:
    - c38.p005
    - c38.p018
    - c38.p020
    - c38.p023
    - c38.p029
  - id: CR3
    item: The small temple's front is a row of recesses holding colossal standing statues of the king and his queen, on both sides of the doorway
    anchors:
      '1': standing statues of both a king and a queen set in recesses along the small temple's front, on both sides of its door
      '0.5': statues on the small temple's front, but not standing, not in recesses, only on one side, or the queen is missing
      '0': no statues on the small temple's front
    evidence:
    - c38.p036
    - c38.p037
  - id: CR4
    item: 'Inside the great temple the rooms follow one axis from the doorway: a first hall lined with two rows of standing statues of the king,
      then further halls, and at the far end the sanctuary with seated figures and an altar before them'
    anchors:
      '1': a straight sequence from the door through the statue-lined first hall and further chambers to the sanctuary, which holds seated figures
        with an altar
      '0.5': halls and a sanctuary exist, but not in a line from the door, the first hall's statue rows are missing, or the sanctuary has no seated
        figures and altar
      '0': no interior, or a single room
    evidence:
    - c38.p041
    - c38.p042
  - id: CR5
    item: One wall of the great temple's first hall is filled from floor to ceiling by a single huge battle relief
    anchors:
      '1': a wall of the first hall carries one wall-filling battle scene (armies, chariots, a besieged city or the like)
      '0.5': reliefs or images on the first hall's walls, but no single wall-filling battle scene
      '0': no battle relief in the first hall
    evidence:
    - c38.p048
    - c38.p049
    - c38.p056
  functions_playability:
  - id: FP1
    item: The player can move around the outside of the site between the two temple fronts at the river bank, and can climb the sand-slope that
      lies between them
    anchors:
      '1': both temple fronts can be reached on foot from each other along the outside, and the sand-slope between them can be climbed
      '0.5': only one temple front is reachable, or the sand-slope is scenery that cannot be walked
      '0': no walkable exterior
    evidence:
    - c38.p016
    - c38.p029
    - c38.p032
    - c38.p033
    - c38.p075
  - id: FP2
    item: The player can enter the great temple through its doorway and walk its halls in order, from the first hall deeper in to the sanctuary
      at the end
    anchors:
      '1': the interior is entered from the front door and traversed through successive halls to the sanctuary
      '0.5': an interior exists but is a separate scene not entered from the front, or the sanctuary cannot be reached
      '0': the temple cannot be entered
    evidence:
    - c38.p041
    - c38.p042
    - c38.p044
    - c38.p061
  - id: FP3
    item: 'The sunrise alignment works in play: at dawn a beam of sunlight comes through the doorway, along the halls, and lights the sanctuary
      altar, and the player can be there to see it'
    anchors:
      '1': a sunrise (by a day cycle or a triggered event) sends light along the temple axis to the altar, and the player can witness it inside
      '0.5': a sunbeam effect exists but stops short of the sanctuary, does not depend on sunrise, or cannot be witnessed by the player
      '0': no sunrise light event
    evidence:
    - - c38.p056
      - c38.p058
  visual_presentation:
  - id: VP1
    cat: spatial
    item: The great front's seated colossi tower far above a person standing at their feet
    anchors:
      '1': the colossi are clearly enormous relative to the player, many times a person's height, and dominate the front
      '0.5': the colossi are larger than the player but not much taller than their surroundings, so they do not dominate the front
      '0': the statues are near human scale
    evidence:
    - c38.p018
    - c38.p019
    - c38.p025
  - id: VP2
    cat: spatial
    item: 'The small temple''s front looks boldly sculpted: tall figures well above a person, framed by massive buttress walls that throw strong
      light and shadow'
    anchors:
      '1': figures well above the player's height, set between deep, massive buttress-like walls whose projection gives the front strong light
        and shadow
      '0.5': the figures are tall but the front reads flat (shallow or no buttress walls), or the buttresses are there but the figures are near
        human scale
      '0': a flat front with near-human-scale figures, without a monumental look
    evidence:
    - c38.p036
    - c38.p037
  - id: VP3
    cat: style
    item: 'One warm sandstone yellow dominates the whole place: mountains, temples and sand alike'
    anchors:
      '1': cliffs, statues, temples and sand share one warm yellow-orange sandstone palette
      '0.5': sandstone colours present on some of the main structures, but the place does not read as one dominant sandstone hue
      '0': no sandstone look
    evidence:
    - c38.p027
    - c38.p076
  - id: VP4
    cat: style
    item: 'The great temple''s interior grows darker the deeper one goes: twilight in the first hall, near-total darkness in the rooms beyond'
    anchors:
      '1': dim light near the entrance fading to darkness toward the inner halls and sanctuary
      '0.5': the interior is dark, but evenly so, or only slightly dimmer inside than out
      '0': the interior is evenly lit like the outside
    evidence:
    - c38.p041
    - c38.p044
    - c38.p061
    - c38.p063
play_suggestions:
  FP1:
  - walk from one temple front to the other
  - 'climb the sand-slope between the temples: how high does it reach against the great facade?'
  FP2:
  - 'enter the great temple from the facade door and walk straight on: which rooms come in which order?'
  - check that the sanctuary is reachable and holds seated figures with an altar before them
  FP3:
  - 'wait or advance time to sunrise and stand in the sanctuary: does the beam arrive through the doorway and fall on the altar?'
  - check at another time of day that the beam does not appear
  robustness:
  - try to walk into the river and off the edge of the site
  - climb onto the colossi or up the cliff above the facade
  - go back and forth between inside and outside several times, and leave and return to the site
