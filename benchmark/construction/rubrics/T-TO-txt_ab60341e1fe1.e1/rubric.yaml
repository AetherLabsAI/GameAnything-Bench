# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-TO-txt_ab60341e1fe1.e1
source_inventory:
- 'c38.p001: the party''s stay at Abou Simbel (31 Jan - 18 Feb): fourteen days at the foot of the great temple''s rock, four on an excursion to
  Wady-Halfeh'
- 'c38.p002-c38.p003: waking under the steep bank to the row of giant faces against the sky; at dawn they seem to flush, glow and come alive,
  then turn to stone in the daylight'
- 'c38.p004-c38.p006: the colossi are hard to see properly (too near from the bank, too far from the island, only a side view from the sand-slope);
  they are four portraits of the same man, Rameses the Great; his features'
- 'c38.p007-c38.p011: comparison with youthful portraits of the king in reliefs elsewhere; the facade colossus shows him in his prime, serene
  and implacable'
- 'c38.p013-c38.p017: profile of the southernmost colossus, the only nearly perfect one; the one true viewpoint is where the sand-slope meets
  the northern buttress, at the level of the beards; foreshortened from below; the badly placed cast in the British Museum'
- 'c38.p018-c38.p019: the artists hollowed a mountain into one great hall and fifteen chambers, smoothed the cliff toward the river and cut four
  seated statues facing the sunrise, two on each side of the doorway; their dimensions'
- 'c38.p020-c38.p023: how they are carved: heads finished as portraits, bodies treated broadly as decoration; seated side by side, hands on knees;
  the huge scale of the features; carved straight from the rock'
- 'c38.p024-c38.p026: state of the four: southernmost nearly whole, the second shattered to the waist with its head at its feet, the third nearly
  perfect, the fourth badly broken; old inscriptions on the legs; dress, double-crowns, collars, cartouches'
- 'c38.p027-c38.p028: probably never painted, natural sandstone; the colossi sit in a light vein against darker rock, like a cameo at noon seen
  from the island; above the door a statue of Ra in a niche, then an inscription, cartouches, a frieze of apes and a cornice; the ''Nubia'' sign
  with the cartouches'
- 'c38.p029-c38.p031: the two temples are cut into two adjacent mountains divided by a cataract of sand; the small temple''s front runs parallel
  to the Nile, the great facade faces due east toward boats coming upriver; the sand-drift fans out and slants down across the great facade, endlessly
  accumulating, only to be cleared, never stopped; its level in 1813 and at the visit (to the lap of the northernmost colossus, the doorway clear)'
- 'c38.p032-c38.p034: first day: the painter''s tent on the brink of the bank facing the colossi, the writer''s higher up on the sand-slope, its
  pole sunk in stones against the steady north wind; the other travellers leave'
- 'c38.p035-c38.p037: the small temple of Hathor: a first hall with six square pillars, a transverse corridor, side chambers and a small sanctuary
  with a broken cow-headed Hathor; its facade a frame of six recesses with thirty-foot standing statues of Rameses II and his queen Nefertari,
  with their children at their knees; buttresses, a porch, deep hieroglyphs readable from the island'
- 'c38.p038-c38.p040: the small temple''s dedications: built by the king for his queen and by the queen for him; their names coupled everywhere;
  the writer''s musing on their love'
- 'c38.p041-c38.p043: the great temple: a first hall in twilight with eight 25-foot Osiride statues of the king, four on each side down the centre,
  darkness beyond; a second hall on four pillars, a transverse chamber with coloured reliefs of gods, the sanctuary with four seated figures (Ptah,
  Amen-Ra, Ra, Rameses deified) and a rock-cut altar; lingering smoke of magnesium wire'
- 'c38.p044-c38.p047: wandering hall to hall by faint daylight and candles; wall reliefs of war, triumph and worship: the king''s chariot attack
  on a fortress, prisoners, captives presented to the gods, the procession of the sacred bark'
- 'c38.p048-c38.p052: the wonder of the place, a huge battle-piece filling the north wall of the great hall: a whole campaign with a river, a
  besieged city, the Egyptian camp in great detail, a frieze of charging chariots; low, damaged relief with patches of colour; the horses'
- 'c38.p053-c38.p055: the subject identified (Kadesh, the Orontes, the Kheta, the poem of Pentaur); the combatants told apart by their features;
  a group of Sardinian soldiers uncovered by scraping away sand'
- 'c38.p056-c38.p058: only at sunrise does daylight stream through the doorway enough to make out the battle-piece; on certain mornings one level
  sunbeam pierces through the doorway to the sanctuary and falls on the altar at the feet of the gods, clearly a calculated alignment'
- 'c38.p059-c38.p061: repeated visits at all hours; the temple''s dark, silent, ancient atmosphere, eerier the farther in; the writer''s panic
  in the sanctuary; eight pitch-dark side chambers at odd angles, some with rock benches, one with unfinished inscriptions'
- 'c38.p062-c38.p063: hunting for secret hiding places; the view from the dark hall out through the doorway onto the sunlit river, sand-island,
  palms and eastern mountains in the afternoon'
- 'c38.p064-c38.p065: the days pass; heat on shore, a steady north breeze from after sunrise to before sunset, cool on the boat; the happy couple''s
  boat trips and a feast at a local sheik''s'
- 'c38.p066-c38.p068: a fresh crocodile trail on the island and the idle man''s vain ambush in a sand-pit; the sailors grow bored and the companion
  boat leaves'
- 'c38.p069-c38.p074: the crew cleans old plaster from the face of the northernmost colossus from a scaffolding of spars and oars, tinting it
  with coffee; the first week passes'
- 'c38.p075-c38.p079: difficulties of sketching: the great temple about twenty-five yards and the small one twenty-five feet from the bank''s
  brink, so the small temple is sketched from the boat; everything but sky and river is one sandstone yellow; heat, glare, sand and flies; leaving
  for Wady Halfeh'
