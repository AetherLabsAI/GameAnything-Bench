rubric:
  content_realization:
  - id: CR1
    item: 'Ranger is devoted to Harlow alone: the game shows him attached to Harlow and indifferent or cold to everyone else'
    anchors:
      '1': Ranger's devotion to Harlow is shown, and it is exclusive (other people are kept at a distance or merely tolerated)
      '0.5': Ranger is shown attached to Harlow, but no different with other people
      '0': no visible bond between Ranger and Harlow
    evidence:
    - - c06.p006
      - c06.p007
    - c06.p012
    - c06.p013
  - id: CR2
    item: 'The bond''s origin: Harlow has rescued the weakened Ranger and nurses him back to strength, the first real love Ranger knows'
    anchors:
      '1': the game shows Ranger weak and recovering in Harlow's care, presented as the start of their bond
      '0.5': Harlow and Ranger together at the start, but no rescue or recovery that grounds the bond
      '0': missing
    evidence:
    - c06.p001
    - - c06.p003
      - c06.p004
  - id: CR3
    item: 'The rapids: Harlow is swept into wild water toward deadly rapids, and Ranger saves his life'
    anchors:
      '1': the game contains a river event in which Harlow is in mortal danger in the current and is saved by Ranger
      '0.5': a river event with both of them, but Harlow is not in mortal danger or it is not Ranger who saves him
      '0': missing
    evidence:
    - - c06.p020
      - c06.p028
  - id: CR4
    item: 'The wager: Harlow''s own boast about Ranger''s strength pulls him into a bet on what Ranger can do'
    anchors:
      '1': Harlow boasts about Ranger, and that boast is what leads to the bet on Ranger
      '0.5': a bet on Ranger exists, but it does not come from Harlow's boast
      '0': no bet
    evidence:
    - - c06.p029
      - c06.p034
  - id: CR5
    item: 'The haul test: Ranger alone, in harness, against a load far heavier than any other dog is claimed to move, over a marked distance'
    anchors:
      '1': a haul in which Ranger alone pulls a load set out as extraordinarily heavy, toward a marked end point
      '0.5': a sled haul exists, but with a team, an ordinary load or no marked distance
      '0': missing
    evidence:
    - - c06.p029
      - c06.p032
    - c06.p035
    - c06.p039
    - c06.p043
  - id: CR6
    item: 'Ranger''s wild side: a call from the wild forest pulls him away from the camp, and only his love for Harlow brings him back'
    anchors:
      '1': the game shows Ranger drawn off toward the wild and returning to Harlow because of his bond with him
      '0.5': Ranger is shown as wild or fierce, but without the pull away and the return to Harlow
      '0': Ranger is a fully tame dog with no wild side
    evidence:
    - - c06.p008
      - c06.p011
    - c06.p012
  functions_playability:
  - id: FP1
    item: 'The river rescue plays as a challenge: Ranger must reach Harlow against the current and bring him to the bank, with a clear outcome'
    anchors:
      '1': reaching Harlow takes effort against the current, success ends with Harlow safe on the bank, and failure gives a retry or a consequence
      '0.5': the rescue can be played, but it succeeds without effort, or failure has no outcome
      '0': the rescue cannot be played (cutscene only, or missing)
    evidence:
    - - c06.p021
      - c06.p026
  - id: FP2
    item: 'The haul plays as an effortful challenge whose success wins the bet: the bet is laid before the test, and reaching the end mark resolves
      it'
    anchors:
      '1': the bet is set before the haul, the haul takes sustained effort toward the marked end, and reaching it wins the wager
      '0.5': the haul can be played, but succeeds without effort, or its result is not tied to the bet
      '0': the haul cannot be played
    evidence:
    - - c06.p033
      - c06.p039
    - - c06.p050
      - c06.p058
  - id: FP3
    item: 'The story plays in causal order: an opening that builds the bond, then the rapids, then the wager and the haul, ending with the haul''s
      outcome'
    anchors:
      '1': the bond phase comes before the trials, the situations follow in this order, and the story concludes with the haul's result
      '0.5': the situations are reachable but out of order, or there is no bond phase before the trials, or no ending
      '0': unconnected scenes with no progression
    evidence:
    - - c06.p001
      - c06.p012
    - c06.p020
    - c06.p029
    - - c06.p058
      - c06.p059
  visual_presentation:
  - id: VP1
    cat: style
    item: 'The harsh northern frontier: untamed wilderness and rough mining settlements under severe cold'
    anchors:
      '1': a recognisably harsh northern frontier of wilderness and rough settlements
      '0.5': a generic wilderness or town without the northern frontier or cold character
