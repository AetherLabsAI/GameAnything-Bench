# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-TO-txt_347c15d5ad77.e1
source_inventory:
- 'recap (NOT scoreable): Ranger''s earlier life on Judge Hartley''s estate, sale north as a sled dog, fight with Frost, the team sold to Hal,
  Charles and Mercedes, Harlow cutting his traces'
- 'c06.p001-c06.p003: spring by the river; Harlow, his feet healed, waits for his partners'' raft; Ranger slowly recovers; the setter Pippa nurses
  him, the big black dog Bram befriends him; games; Ranger feels love for the first time, unlike his old bonds at Judge Hartley''s'
- 'c06.p004-c06.p006: Harlow as the ideal master who treats his dogs like children; their rough embrace and love-curses, Ranger''s love-bite;
  Ranger adores him from a distance, watching his face'
- 'c06.p007: Ranger follows Harlow everywhere and checks on him at night, afraid he will lose him as he lost Gaudet and Lucien'
- 'c06.p008-c06.p011: Ranger stays wild: steals from other camps, fights strange dogs without mercy (law of club and fang); ancestral shades and
  a call deep in the forest pull him away, love for Harlow draws him back to the fire'
- 'c06.p012: Harlow alone holds him; cold to strangers; the partners Gus and Nate arrive with the raft, Ranger tolerates them because they are
  close to Harlow; raft taken to Dawson'
- 'c06.p013-c06.p017: on the way to the Tanana, Harlow on a whim orders Ranger to jump off a cliff and has to grab him at the edge; Nate: no one
  should lay hands on Harlow while Ranger is around'
- 'c06.p018-c06.p019: Circle City bar: ''Black'' Calloway strikes Harlow, Ranger goes for his throat and badly hurts him; a miners'' meeting rules
  the dog provoked; his name spreads through Alaska'
- 'c06.p020-c06.p023: Forty-Mile Creek: lining a boat down rapids, the boat capsizes and Harlow is swept toward deadly water; Ranger reaches him,
  Harlow clings to a rock and orders him ashore; Ranger is pulled out just above the falls'
- 'c06.p024-c06.p028: the partners run upstream and tie the rope to Ranger; first attempt misses (wrong angle), he is dragged under and half drowned;
  at Harlow''s faint voice he goes again, swims straight out, comes down on Harlow, and the rope hauls both to the bank; Ranger injured, they
  camp until he heals'
- 'c06.p029-c06.p038: Dawson winter, Eldorado Saloon: men boast of their dogs; Harlow claims Ranger can start a thousand pounds and walk off a
  hundred yards; Prescott bets a thousand dollars; Harlow has no money and borrows the stake from Jim Flanagan; the win will fund the partners''
  trip east'
- 'c06.p039-c06.p042: the crowd moves to the street; the flour sled has frozen fast at sixty below; dispute over ''break out'' decided for Prescott,
  odds go to three to one; Harlow, doubting, and the partners stake their whole two hundred dollars'
- 'c06.p043-c06.p049: Ranger harnessed alone; his powerful look brings the odds down; a Skookum Bench king offers eight hundred for him, refused;
  Harlow whispers ''As you love me''; Ranger answers with the hand-bite'
- 'c06.p050-c06.p058: on ''Gee'' and ''Haw'' Ranger swings right and left and breaks the runners loose, on ''mush'' he hauls the sled, it gains
  momentum and passes the firewood pile marking a hundred yards; the crowd erupts'
- 'c06.p059-c06.p062: Harlow kneels and shakes Ranger, cursing him lovingly; refuses twelve hundred for him, in tears; Ranger takes his hand in
  his teeth; the crowd draws back and leaves them alone'
