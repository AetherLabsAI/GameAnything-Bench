# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-TO-txt_884615e315af.e1
source_inventory:
- 'c04.p005-c04.p013: broad agreement that people keep streaming from the country into overcrowded cities; quoted voices (London as a tumour draining
  the rural districts, ''get the people back to the land'', squalid town housing, the rural exodus)'
- 'c04.p014-c04.p022: press of all parties and trade-union leaders sound the same warning about the drift from the country'
- 'c04.p023: all agree on the problem; restoring the people to the land is called a master-key to many other social problems'
- 'c04.p024: the causes of city growth are summed up as ''attractions''; each city is a magnet, each person a needle; only a stronger magnet can
  redistribute the people'
- 'c04.p025: the false choice between town life and country life; a third alternative combines the advantages of both; the diagram of ''The Three
  Magnets'' is announced'
- 'c04.p026-c04.p027: illustration placeholder ''The Three Magnets, No. 1'' (the picture itself is not delivered)'
- 'c04.p028: the Town magnet: wages, work, amusement and lit streets, against high rents, long hours, the ''isolation of crowds'', lost sunlight,
  soot and slums'
- 'c04.p029: the Country magnet: beauty, fresh air and low rents, against dullness, lack of capital and work, closed land, poor water and drainage'
- 'c04.p030: the two magnets must be made one; town and country ''must be married''; the work will show how to build a Town-country magnet'
- 'c04.p031-c04.p033: what Town-country promises (society with nature, higher wages with lower rents, healthy homes and gardens); many such magnets
  would turn the tide of migration; fuller description to follow'
- 'c05.p001: footnote: country schoolchildren share one basin of dirty water for washing and drinking'
- 'c06.p001-c06.p003: epigraphs (Blake; Ruskin: limited towns with clean streets within, open country without, a belt of garden and orchard round
  them, fresh air a few minutes'' walk from anywhere)'
- 'c06.p004-c06.p005: an agricultural estate of 6,000 acres is bought and held in trust for the people of Garden City; ground rents fund the public
  works; the aims (better work and wages, healthier surroundings, a market for the farmers at their doors)'
- 'c06.p006-c06.p008: illustration placeholder ''No. 2 Garden City''; the town covers 1,000 acres near the centre of the estate, circular, about
  three-quarters of a mile from centre to edge; the description is ''merely suggestive'''
- 'c06.p009-c06.p011: six wide boulevards run from centre to circumference and divide the town into six equal wards; at the centre a watered circular
  garden ringed by the large public buildings (town hall, concert hall, theatre, library, museum, gallery, hospital) in their own grounds; illustration
  placeholder ''No. 3 Ward and Centre'''
- 'c06.p012-c06.p013: a large public park with recreation grounds around the centre, encircled by the ''Crystal Palace'', a wide glass arcade
  opening onto the park (cut only by the boulevards): wet-weather resort, shopping for manufactured goods, a Winter Garden; within 600 yards of
  every dweller'
- 'c06.p014: walking outward: tree-lined Fifth Avenue, rings of houses facing the circular avenues or fronting the radial roads; population about
  30,000 in town and 2,000 on the farms; building lots; very varied architecture, some common gardens and co-operative kitchens; the municipality
  controls only street line and sanitation'
- 'c06.p015: ''Grand Avenue'': a 420-foot-wide green belt over three miles long that divides the outer town into two belts, a park of its own
  within 240 yards of everyone, holding school sites with playgrounds and gardens and church sites; in one ward the houses facing it are set in
  crescents'
- 'c06.p016: the outer ring: factories, warehouses, dairies, markets, coal and timber yards, all fronting the circle railway round the whole town,
  with sidings to a main line through the estate; goods go directly between buildings and trucks, sparing cartage and the town roads; all machinery
  electric, so no smoke'
- 'c06.p017-c06.p018: town refuse goes to the farmland of the estate (large farms, small holdings, allotments, cow pastures); farming methods
  compete by the rent occupiers offer; the rents are common property spent on improvements'
- 'c06.p019-c06.p020: the town, with a store in each ward, is the farmers'' natural market but they may sell anywhere; manufacturers and private
  suppliers keep their freedom; no rigid municipal monopoly'
- 'c06.p021: charitable and philanthropic institutions dotted about the estate on land let at a pepper-corn rent'
