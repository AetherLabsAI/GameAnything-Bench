  roles:
    video: 'the look and the space of the dive site as it is swum through: sunlit shallows and deep blue water, a coral reef slope and wall, a
      dense fish school, a sea turtle near the surface, and an encrusted, open-framed wreck on sand that a diver enters head-first'
    images: 'the layout of a wreck site: dive-site maps and a drawing of different wrecks that agree on one ship lying lengthwise on its own on
      a flat bottom, bow at one end (intact in img01, img02, img04, broken up into plating and parts in img03), with reef patches well apart from
      it on img01; two photos show a diver over an overgrown reef and a turtle swimming over wreck structure'
  cross_reference_requirement: The wreck must lie as the images lay it out (one ship lying lengthwise on open sand, apart from the reef) while
    looking and being enterable like the clip's encrusted, open-framed wreck; the clip's reef zone and the images' separate sand-and-wreck zone
    together make the site's layout.
