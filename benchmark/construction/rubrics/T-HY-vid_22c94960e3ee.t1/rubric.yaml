rubric:
  content_realization:
  - id: CR1
    item: The site has a coral reef zone formed as a coral-covered slope and a steep wall that drops away into open blue water
    anchors:
      '1': a coral-covered reef with both a slope and a steep wall falling away into open water
      '0.5': a coral-covered bottom, but flat or with only a gentle slope, no wall
      '0': no reef zone
    evidence:
    - - '00:07.0'
      - '00:09.5'
    - - '00:13.5'
      - '00:15.5'
    - img05
  - id: CR2
    item: The wreck is one whole ship lying lengthwise on the bottom with a readable bow end, intact or broken up along its length
    anchors:
      '1': a ship-length wreck lying along the bottom with a recognisable bow end (an intact hull or a broken-up one both count)
      '0.5': wreckage on the bottom without a readable one-ship shape or bow end
      '0': no wreck
    evidence:
    - img01
    - img02
    - img03
    - img04
  - id: CR3
    cross: true
    item: 'The site is laid out as two zones: the reef of the clip, and apart from it an open sand bottom on which the wreck lies on its own,
      as the images place it'
    anchors:
      '1': a reef zone and, separated from it, open sand with the wreck lying alone on it
      '0.5': reef and wreck both present, but the wreck sits on or inside the reef, or has no open sand around it
      '0': reef or wreck missing, so no two-zone layout
    evidence:
    - - '00:07.0'
      - '00:09.5'
    - - '00:13.5'
      - '00:15.5'
    - - '00:26.5'
      - '00:32.0'
    - img01
    - img02
  - id: CR4
    item: The wreck has an open framework of beams with openings that lead into an interior space
    anchors:
      '1': open beams and openings in the wreck with a hollow interior behind them
      '0.5': openings or gaps on the surface, but no interior space behind them
      '0': a solid, closed wreck shape (or no wreck)
    evidence:
    - - '00:16.0'
      - '00:20.5'
    - img06
  - id: CR5
    item: 'The site''s signature life is there: a school of fish and a sea turtle'
    anchors:
      '1': both a fish school (many fish swimming together) and a sea turtle are in the site
      '0.5': only one of the two, or fish only as scattered single ones
      '0': neither
    evidence:
    - - '00:02.5'
      - '00:06.5'
    - - '00:21.0'
      - '00:26.0'
    - img06
  functions_playability:
  - id: FP1
    item: The player can swim freely through the site in three dimensions, from the surface down to the seabed, and reach the reef, the open water
      and the wreck
    anchors:
      '1': free swimming up, down and around, with the reef, open water and wreck all reachable by swimming
      '0.5': the area can be swum, but a main part is unreachable or the movement is restricted (e.g. a fixed path, no descent)
      '0': the site cannot be explored by swimming
    evidence:
    - - '00:02.5'
      - '00:09.5'
    - - '00:13.5'
      - '00:20.5'
    - - '00:26.5'
      - '00:32.0'
  - id: FP2
    item: The player can swim from the reef across to the wreck, go down into it through its openings, swim through the interior and get out again
    anchors:
      '1': the wreck is reached by swimming from the reef, entered through an opening, swum through inside and left again
      '0.5': the wreck is reachable but cannot be entered, or the interior is entered but cannot be swum through or left
      '0': no reachable wreck
    evidence:
    - - '00:16.0'
      - '00:20.5'
    - - '00:26.5'
      - '00:32.0'
  - id: FP3
    item: 'Kept at the user''s request (keep): the player can swim into the fish school so that it is around them, and swim right up next to the
      sea turtle'
    anchors:
      '1': the player can swim into the school and have fish around them, the school staying together (it may part around the player and close
        again), and can come right up beside the turtle
      '0.5': only one of the two can be reached up close (e.g. the school breaks up for good or keeps swimming off out of reach as the player
        approaches, or the turtle is penned, flees or is unreachable)
      '0': neither the school nor the turtle can be reached by swimming (or neither exists)
    evidence:
    - - '00:02.5'
      - '00:06.5'
    - - '00:21.0'
      - '00:26.0'
  visual_presentation:
  - id: VP1
    cat: style
    keyframes:
    - '00:08.0'
    - '00:22.5'
    - '00:29.0'
    item: 'Underwater light: bright cyan water under a sunlit surface in the shallows, deep blue in open water and at depth around the wreck'
    anchors:
      '1': a visible change from bright shallow water to deep blue at depth
      '0.5': underwater with one uniform water colour
      '0': not underwater-looking
    evidence:
    - - '00:07.0'
      - '00:09.5'
    - - '00:21.0'
      - '00:26.0'
    - - '00:26.5'
      - '00:32.0'
  - id: VP2
    cat: style
    keyframes:
    - '00:17.0'
    - '00:20.0'
    - '00:27.0'
    item: 'The wreck looks old and sunken: rusted, weathered metal covered with marine growth'
    anchors:
      '1': a wreck that reads as rusted and encrusted with growth
      '0.5': a recognisable ship, but clean and new-looking, with no growth or rust
      '0': no recognisable wreck
    evidence:
    - - '00:16.0'
      - '00:20.5'
    - - '00:26.5'
      - '00:29.5'
    - img06
  - id: VP3
    cat: key_moment
    keyframes:
    - '00:03.0'
    - '00:05.0'
    - '00:23.0'
    item: 'Encounters with the site''s life look as in the clip: a fish school dense enough to fill the view around the player, and a large sea
      turtle seen up close'
    anchors:
      '1': the school fills the view around the player and the turtle looks large at close range
      '0.5': one of the two looks right, or both look sparse or small
      '0': neither encounter looks like the clip
    evidence:
    - - '00:02.5'
      - '00:06.5'
    - - '00:21.0'
      - '00:26.0'
    - img06
play_suggestions:
  FP1:
  - 'start the game and swim straight down: can you reach the seabed?'
  - swim from the reef across open water to the wreck and back
  - try to swim up to the surface from the deepest point
  FP2:
  - 'find the wreck from the reef without directions: is it on open sand?'
  - look for an opening in the wreck and swim inside; can you get out again?
  - swim along the whole hull from one end to the other
  FP3:
  - 'swim into the fish school: does it stay together around you (parting and closing again is fine) or scatter for good?'
  - 'swim right up beside the turtle: does it stay reachable, and does it move?'
  robustness:
  - 'stay underwater for a long time: is there drowning or an air rule, and is it fair?'
  - 'swim far beyond the site: is there a bound or does the world continue sensibly?'
  - 'get stuck inside the wreck on purpose: can you find the way out?'
