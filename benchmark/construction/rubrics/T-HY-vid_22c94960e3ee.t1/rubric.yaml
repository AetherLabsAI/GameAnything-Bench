source_inventory:
- 'clip 00:00-00:02.3: surface, selfie shots of a diver in a green dinosaur-shaped hood, mask and vest on a dive boat, open sea and a green tropical
  coast behind; numbers 1, 2, 3 overlaid on successive shots (an edit countdown); other divers seated on the boat; a second boat on the water;
  logo watermark top-left throughout'
- 'clip 00:02.5-00:06.5: underwater, a dense school of silvery fish fills the frame in purple-blue water, sunlit surface above; the hooded diver
  beside it, exhaled bubbles rising'
- 'clip 00:07-00:09.5: two divers swim down a rocky coral reef slope in bright cyan water, the bright surface visible above, bubble trails'
- 'clip 00:10-00:13: the hooded diver with a silver tank in open purple-blue water; a large dark fin or flipper of an unidentified animal at the
  right edge'
- 'clip 00:13.5-00:15.5: a diver with red mask in blue water; a steep coral-covered wall on the left, other divers further down along it, bubbles'
- 'clip 00:16-00:20.5: a diver in red shorts descends head-first over the deck of a rusted, growth-encrusted wreck with an open framework of beams
  and openings, and goes down into its interior; bubbles rising'
- 'clip 00:21-00:26: near the surface over coral, the hooded diver with a selfie stick swims right beside a large sea turtle; sunlit, rippled
  surface above'
- 'clip 00:26.5-00:32: a diver in a white hood and red shorts kneels on the sand bottom next to the wreck''s encrusted hull in deep blue water,
  holding a small device, exhaling large bubbles'
- 'audio: music only, no speech'
- 'img01: dive-site map ''Wreck of the SAS Pietermaritzburg'': a long ship hull drawn lying on a sand bottom, reef patches with depth contours
  some 100 m to the east, compass rose, legend (pinnacle, swim-through, cave, gully, overhang, wall; reef depth 0-39 m; sand bottom; kelp forest)'
- 'img02: dive-site map ''SAS Bloemfontein wreck'': one long hull outline on sand, bow (1, 50 m), quarterdeck (3) and stern (2, 56 m, sand) marked;
  compass, depth legend'
- 'img03: dive-site map ''MV Daeyang Family wreck'': a broken-up wreck as a large irregular area of hull plating at 11-18 m, with engine block,
  pump, boiler, scattered structural plating and fragments, and a lifeboat lying apart; compass, legend'
- 'img04: line drawing of the wreck ''E.M. Clark'' lying on the seabed in side view: a long hull with deck structures, debris and broken parts
