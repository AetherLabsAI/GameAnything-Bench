- 00:47-00:48 track running; a yellow train passes on the left; a red-white striped barrier ahead on the runner's track (00:48)
- 00:49 the runner vaults over a low red-white striped barrier, hands on it
- 00:50-00:52 tracks with a train with headlights ahead, tanker cars on the left, a green train passing on the right
- 00:53-00:54 a boxcar stands ahead on the runner's track with a red-white striped barrier in front of it
