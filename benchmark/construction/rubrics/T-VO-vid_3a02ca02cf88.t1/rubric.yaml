play_suggestions:
  CR1:
  - count the parallel tracks at several points along the course
  CR4:
  - 'inspect each off-track section (e.g. a train interior, an elevated section, a platform): is it on the running route and does it lead back
    down to the track?'
  FP1:
  - 'run the course from start to the furthest reachable point: is the forward direction ever unclear?'
  FP2:
  - 'stand on a track with an oncoming train and wait: what happens?'
  - dodge a train by switching tracks at the last moment
  - check whether trains really move (watch one from a fixed spot)
  FP3:
  - try to walk or jump through a raised barrier instead of sliding under it
  - try to slide under a low barrier and to go around barriers at the side
  FP4:
  - reach a train roof by each available way up
  - jump from a roof to a train on the next track, also while it moves
  - drop off the roof and keep running
  FP5:
  - start a new run and watch who triggers it
  - 'stop running right after the start: does the pursuer come after you?'
  FP6:
  - run through each raised or enclosed section (e.g. a train interior, an elevated section, a platform) from end to end
  - after each section, check that it leads back down to the track and the run continues
  robustness:
  - 'fail on purpose (hit a train, fall off a roof): can you continue or restart sensibly?'
  - run backwards against the course direction
  - try to leave the corridor sideways over the street edge
  - stand still on a moving train roof for a while
