rubric:
  content_realization:
  - id: CR1
    item: The course is a corridor of several parallel tracks side by side used as the running lanes, with the street sides running alongside
      rather than being the running surface
    anchors:
      '1': several parallel tracks side by side form the course, the street sides lying along its edges
      '0.5': a track course, but a single track, or an open area without track lanes
      '0': no track course
    evidence:
    - - 00:13
      - 00:27
    - - 00:20
      - 00:22
    - - 00:47
      - 00:54
  - id: CR2
    item: 'Trains appear in two roles: traffic trains on the running tracks and standing trains / freight cars placed along the route as terrain
      to climb onto or run beside'
    anchors:
      '1': both traffic trains on the running tracks and standing trains / freight cars used as route terrain are present
      '0.5': trains in only one of the two roles
      '0': no trains
    evidence:
    - - 00:13
      - 00:18
    - - 00:23
      - 00:27
    - - 00:34
      - 00:38
    - - 00:53
      - 00:57
  - id: CR3
    item: 'Two kinds of track barriers are placed on the course and told apart by height: low barriers standing on the track and raised bar barriers
      spanning it'
    anchors:
      '1': both kinds are on the running tracks and clearly distinguishable by height
      '0.5': only one kind, or two kinds that cannot be told apart
      '0': no barriers on the tracks
    evidence:
    - - 00:14
      - 00:14
    - - 00:19
      - 00:19
    - - 00:48
      - 00:49
    - - 00:53
      - 00:55
  - id: CR4
    item: Besides the track and the train roofs, the route includes sections off the track level (enclosed or raised, e.g. through a train, up
      onto an elevated section, along a platform), joined into one continuous course with each section leading back down to the track
    anchors:
      '1': at least two such sections, both on the running route and both leading back to the track
      '0.5': only one such section, or sections that are separate places not joined to the running route
      '0': the course is track only (apart from train roofs)
    evidence:
    - - 00:26
      - 00:31
    - - 00:35
      - 00:39
    - - 00:42
      - 00:46
  functions_playability:
  - id: FP1
    item: 'Forward run: the player keeps moving forward along a long course with a clear forward direction and steady progress'
    anchors:
      '1': a long course that the player runs forward along, the forward direction always clear and progress steady
      '0.5': a forward course exists but it is so short / open that there is no sense of a run, or the direction is often unclear
      '0': no forward course
    evidence:
    - - 00:13
      - 00:27
    - - 00:47
      - 00:54
  - id: FP2
    item: 'Moving trains as hazards: trains travel along the tracks, some toward the player on the player''s track, and the player avoids them
      by switching to another track'
    anchors:
      '1': trains move along the tracks including toward the player on the player's track, and the player can avoid them by switching to a free
        track
      '0.5': trains move but never come toward the player, or there is no free track to dodge to
      '0': trains do not move
    evidence:
    - - 00:13
      - 00:18
    - - 00:23
      - 00:27
    - - 00:33
      - 00:34
  - id: FP3
    item: 'Each barrier kind needs its own move: low barriers must be jumped or vaulted over and raised barriers slid or ducked under, each blocking
      the player until the right move is used'
    anchors:
      '1': each kind blocks the player until its own move is used, and that move gets the player past it
      '0.5': only one kind needs its move, or barriers can be passed without the move (walked through or trivially around)
      '0': barriers do not block the player or cannot be passed at all
    evidence:
    - - 00:19
      - 00:19
    - - 00:48
      - 00:49
    - - 00:54
      - 00:55
  - id: FP4
    item: 'Train-top route: the player can get up onto trains, run along the roofs, jump from roof to roof including onto a train on the next
      track, and drop back to the track to continue'
    anchors:
      '1': a way up onto a train, roof running with roof-to-roof jumps, and a drop back to the track all work
      '0.5': the roofs can be reached but there is no roof-to-roof jumping, or the player cannot get back down and continue
      '0': train roofs cannot be reached
    evidence:
    - - 00:55
      - 01:06
  - id: FP5
    item: 'Chase start: the run begins when a guard / dog-like pursuer spots the player, and the pursuer then follows from behind, giving a reason
      to run'
    anchors:
      '1': a pursuer appears at the start, triggers the run and moves after the player
      '0.5': a pursuer is present but static or decorative, or does not start the run
      '0': no pursuer
    evidence:
    - - 00:09
      - 00:15
  - id: FP6
    item: 'Off-track sections can be run through: the player can enter each raised or enclosed section from the run, cross it and get back down
      to the track to continue'
    anchors:
      '1': every off-track section can be entered from the run, crossed and left back to the track in normal play
      '0.5': some sections can be run through, but at least one cannot be entered, crossed or left back to the track in normal play
      '0': no off-track section can be run through
    evidence:
