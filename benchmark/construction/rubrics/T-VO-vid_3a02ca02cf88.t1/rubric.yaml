- 00:28-00:30 the runner runs down the inside of a passenger carriage (seats on both sides, ceiling lights, posters)
- 00:31 the runner is airborne back on the street track, orange plastic barriers lining the right side
- 00:32-00:33 the runner runs past metal crowd barriers and orange barriers; a train approaches head-on (00:33)
