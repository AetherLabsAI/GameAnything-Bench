play_suggestions:
  FP1:
  - enter the dome and walk the ground level, then find the way up onto the bridge
  - look at the waterfall from the basin and from the bridge
  FP2:
  - 'stand still near the track for a minute: does the train pass, and pass again?'
  FP3:
  - 'walk up to the statue and watch the water for a while: does it keep flowing into the bay?'
  - check from the promenade that the skyline is across the water
  FP4:
  - walk among the lattice trees at ground level
  - 'unscored: note how the places are linked (one walkable district, separate areas, a travel link or only commands)'
  robustness:
  - 'jump into the waterfall basin and the bay: can you get out again?'
  - try to fall off the bridge or the promenade edge
  - check that the world loads with the places intact after leaving and rejoining
  - 'wait through a day-night cycle at the bayfront: do the lights read at dusk?'
