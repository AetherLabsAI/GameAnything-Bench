rubric:
  content_realization:
  - id: CR1
    item: The game contains a glass lattice dome filled with dense terraced greenery, whose centrepiece is a tall cylindrical waterfall falling
      from a round opening in the centre of the roof into a basin below
    anchors:
      '1': an enclosed dome with a lattice / glass roof, dense greenery all around, and a waterfall that falls from a central roof opening into
        a basin
      '0.5': an indoor garden with a waterfall, but the waterfall does not come from the roof (e.g. a cliff or wall waterfall) or there is no
        dome enclosure
      '0': no dome or no waterfall
    evidence:
    - - '00:00.9'
      - '00:03.9'
    - - '00:06.9'
      - '00:08.9'
    - - '00:12.9'
      - '00:14.9'
  - id: CR2
    item: 'Inside the dome the features stack vertically around the waterfall: a footbridge crosses in front of it high up, and a track with a
      small train on it passes in front of its base'
    anchors:
      '1': a bridge crossing in front of the waterfall high up and a track carrying a train laid past it near the bottom
      '0.5': bridge and train track both exist but only one is placed correctly relative to the waterfall, or the track has no train
      '0': neither a bridge nor a train track near the waterfall
    evidence:
    - - '00:00.9'
      - '00:03.9'
    - - '00:09.4'
      - '00:10.9'
    - - '00:12.9'
      - '00:14.9'
  - id: CR3
    item: 'The game contains the landmark hotel: three tall glass towers standing side by side, joined at the top by one long ship-shaped deck
      that overhangs both ends'
    anchors:
      '1': three separate towers and a single rooftop deck spanning all three and overhanging the ends
      '0.5': tall towers with a rooftop element, but the count is wrong, the deck does not join them, or it does not overhang
      '0': no such towers
    evidence:
    - - '00:17.4'
      - '00:18.4'
    - - '00:28.0'
      - '00:31.0'
  - id: CR4
    item: 'The bayfront is laid out across water: a promenade at the water''s edge faces across the bay to the three linked towers, with the white
      petal-shaped building low at the water in front of them at left, and the blue-glass office cluster rising as a separate group on another
      stretch of the bay'
    anchors:
      '1': a promenade on the water's edge looking across water at the towers, the petal building low in front / left of them, and the office
        cluster as its own group across the water
      '0.5': promenade and landmarks across water exist, but the petal building or the office cluster is missing or misplaced relative to the
        towers
      '0': no waterfront, or the landmarks are not set across water from a promenade
    evidence:
