      - '00:31.0'
  - id: CR5
    item: At the bayfront stands a white statue with a lion's head and a fish-scale body at the water's edge, with the office skyline behind it
    anchors:
      '1': a white lion-headed, fish-bodied statue on the water's edge with the office towers behind it
      '0.5': a statue or fountain at the water, but not recognisably lion-headed and fish-bodied, or not at the bayfront
      '0': no such statue
    evidence:
    - - '00:32.0'
      - '00:35.0'
  - id: CR6
    item: The game contains an outdoor garden where several giant artificial lattice trees stand together, rising high above it
    anchors:
      '1': several tall tree-like structures grouped together in an outdoor garden
      '0.5': only a single such structure, or ordinary (natural) trees in their place
      '0': no outdoor lattice-tree garden
    evidence:
