source_inventory:
- 'c11.p001-c11.p008: the nursery is full of carpet-brought Persian cats and musk-rats; a large policeman in the kitchen accuses the four children
  of ill-treating a cat; Robert retorts that police should only act when people shout ''murder'' and ''stop thief'''
- 'c11.p009-c11.p017: the Phoenix slips out unnoticed; the animals'' noise drowns the children''s four different explanations; the policeman pushes
  past to inspect the next room'
- 'c11.p018-c11.p030: a shrill voice outside screams ''Murder! Stop thief!''; the policeman runs off after it; the Phoenix flies back, says he
  does not know where the house is, and goes to bed'
- 'c11.p031-c11.p040: Cyril writes a note telling the carpet to take the rats away and bring milk; Robert points out that the three wishes for
  the day are spent, so the cats must stay the night; the children stroke the cats quiet'
- 'c11.p041-c11.p047: the carpet comes back with a Jersey cow instead of milk; the children''s attempt to milk it fails (saucer knocked away,
  feet trodden on); Jane breaks down'
- 'c11.p048-c11.p059: council in the cold, neglected drawing-room; the boys set off to leave cats on doorsteps like foundlings; the girls fall
  asleep under a blanket and hearthrug'
- 'c11.p060-c11.p068: Jane wakes, follows footsteps to the basement and finds a burglar sitting among the cats, overwhelmed; the cow reminds him
  of his father''s cow Daisy'
- 'c11.p069-c11.p084: Jane talks to him kindly, promises not to call the police, and persuades him to milk the cow so the cats will drink, sleep
  and stop the noise that could bring the police back'
- 'c11.p085-c11.p094: boots on the stairs are only the boys; Jane passes him off as a friend; he milks the cow; Cyril tells how a second policeman
  nearly caught them with cat-bags'
- 'c11.p095-c11.p105: milking soothes the burglar and the fed cats purr; he says it is his first job: a barrow seller who overheard the servants''
  plan for a night out, was robbed of his takings and came to burgle; the cats have turned him honest'
- 'c11.p106-c11.p118: the children offer him the valuable cats if he takes them away; he returns in the night with a pal, a barrow and sacks,
  and the sleepy cats are carted off; he gloomily calls himself a fence'
- 'c11.p119-c11.p123: past one o''clock counts as the next day, so a new wish sends the cow back, tied to a corner of the carpet; next morning
  that corner is badly torn'
- 'c12.p001-c12.p013: late breakfast; Robert''s booby trap catches the returning servants; the children silence them with what they know of the
  servants'' night out'
- 'c12.p014-c12.p029: the Phoenix warns that the carpet is wearing out from wishes, travels, claws and the cow; held to the light it is full of
  holes, thin places and a torn strip'
- 'c12.p030-c12.p040: the children buy ordinary wool (no wishing-wool exists) and the girls darn all day; the Phoenix tells of the carpet''s royal
  Persian past and begins a story, cut off by the boys'' return'
- 'c12.p041-c12.p054: the boys report that the police have arrested ''our burglar'' on suspicion of stolen cats (his sister-in-law blames the
  cats he paraded in blue ribbons); he is in the cells for the magistrate in the morning'
- 'c12.p055-c12.p065: the truth would never be believed; the Phoenix suggests a rescue; he cannot be hidden at home, so Jane proposes the sunny
  southern shore where the cook is queen; the girls darn on so he cannot fall through a hole'
- 'c12.p066-c12.p080: at night the children wish themselves into his cell (a small plain whitewashed room, no dungeon); the sleeping burglar throws
  off the boys and shouts; a warder calls through the door and goes away'
- 'c12.p081-c12.p098: whispered persuasion; he would like Boolong but has no living there; a shore with nothing to do suits him; gardening was
  his hobby; he lets himself be pulled onto the carpet'
- 'c12.p099-c12.p111: the sunny southern shore: rainbow sands, tropical flowers, brilliant sun; the cook, crowned with white flowers and looking
  young, sits with her court and takes it all for a dream; the burglar bathes in a rock pool'
- 'c12.p112-c12.p124: the burglar, crowned with a woven wreath, asks the cook to walk out with him; Anthea proposes marriage; the cook will only
  marry before a clergyman; he agrees to marry if one is brought'
- 'c12.p125-c12.p129: the carpet, instructed in chalk inside Cyril''s cap, fetches the Reverend Septimus Blenkinsop from his study; he stands
  half on an ordinary-wool darn, so he is only half there, see-through, and sees his study through everything; he marries the couple anyway, then
  wanders off botanising'
- 'c12.p130-c12.p133: wedding feast, flowers and dancing around the couple; the burglar''s speech: happy, honest, with an allotment, asks for
  seeds and for the see-through parson to be taken away; the children leave and return the clergyman to his study'
- 'c12.p134-c12.p137: the Phoenix brings the seeds and reports the pair are happy (he has a wooden spade, she weaves him white clothes); the police
  never learn how he escaped (''the Persian mystery''); the clergyman blames over-study, takes his aunts to Paris and tells no one'
