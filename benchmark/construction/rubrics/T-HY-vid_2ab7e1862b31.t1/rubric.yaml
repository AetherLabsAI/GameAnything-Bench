      '0.5': some lit signs along the avenue, but no large billboards or screens dominating the buildings
      '0': plain, unlit or sign-less buildings
    evidence:
    - - '01:18.0'
      - '01:26.9'
    - img03
    - img05
    - img06
  - id: VP4
    cat: spatial
