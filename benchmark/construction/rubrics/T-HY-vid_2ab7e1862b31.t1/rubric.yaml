    - img06
play_suggestions:
  FP1:
  - 'travel the avenue from one end to the other: is there a passage beneath the elevated crossing, and does it stay open?'
  - 'time a run along the avenue: is it clearly faster than walking (vehicle, sprint, the game''s own movement)? (unscored: the clip''s ride pace)'
  FP2:
  - enter a side street from the avenue and try to come back to the avenue by another street
  - 'count dead ends: can the narrow streets be explored as a network?'
  robustness:
  - 'leave the district''s edges: are there invisible walls or holes into the void?'
  - 'look around under the crossing and in a side street: are the lights, signs and rain consistent from every side?'
  - check that rain and reflections persist after a respawn or a reload
