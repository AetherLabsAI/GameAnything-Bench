rubric:
  content_realization:
  - id: CR1
    item: The district has a wide multi-lane avenue that runs through it as its main road
    anchors:
      '1': a clearly wide, multi-lane avenue running through the district, much broader than the other streets
      '0.5': a main street exists but is not clearly wider than the rest, or is only a short stub
      '0': no wide avenue
    evidence:
    - - '01:06.0'
      - '01:07.4'
    - - '01:18.0'
      - '01:20.0'
    - img03
    - img05
    - img06
  - id: CR2
    item: 'The layout of the map: a dense grid of small blocks and narrow streets lies right beside a broad rail corridor and is bounded by wide
      avenues'
    anchors:
      '1': a grid of small blocks and narrow streets, with a broad rail corridor along one side and wide avenues bounding it
      '0.5': a narrow-street grid exists, but the rail corridor or the bounding avenues are missing or not beside it
      '0': no grid of narrow streets, or a single street
    evidence:
    - img01
  - id: CR3
    cross: true
    item: Where the avenue meets the rail corridor, an elevated railway bridge (images) spans the avenue's full width, and the avenue runs beneath
      it as an underpass (the clip's overhead crossing the road passes under)
    anchors:
      '1': a raised railway bridge spanning the whole avenue at the rail corridor, with the road passing beneath it
      '0.5': an overhead structure over the avenue that is not a railway bridge, or a rail line that does not cross the avenue
      '0': no elevated crossing over the avenue
    evidence:
    - - '01:06.0'
      - '01:07.4'
    - - '01:11.0'
      - '01:14.0'
    - img01
    - img02
    - img03
  - id: CR4
    item: The narrow side streets open off the avenue, and one of them is entered under a lit arch gate at its mouth
    anchors:
      '1': several side-street mouths opening off the avenue, one marked by a lit arch gate
      '0.5': side streets open off the avenue but no gate marks an entrance, or a gate stands with no side street behind it
      '0': no side street opens off the avenue
    evidence:
    - img01
    - img04
    - img06
  functions_playability:
  - id: FP1
    cross: true
    item: The player can travel the wide avenue of the images from end to end without interruption, passing through the underpass beneath the
      elevated crossing (the clip's red-lit underpass)
    anchors:
      '1': the avenue can be travelled end to end, passing beneath the elevated crossing
      '0.5': a route exists, but the crossing is missing or blocks the way
      '0': no traversable avenue route
    evidence:
    - - '01:06.0'
      - '01:07.4'
    - - '01:11.0'
      - '01:12.5'
    - - '01:14.2'
      - '01:17.9'
    - img01
    - img02
    - img03
  - id: FP2
    item: The player can walk from the avenue into the narrow side streets, move between them and come back to the avenue by another way, exploring
      them as a district of blocks, not a single corridor
    anchors:
      '1': several side streets enterable from the avenue, linked into a loop or grid that leads back to the avenue
      '0.5': side streets can be entered but are dead ends or decoration only
      '0': only the avenue is reachable
    evidence:
    - img01
    - img04
    - img06
  visual_presentation:
  - id: VP1
    cat: style
    keyframes:
    - '01:05.2'
    - '01:15.7'
    - '01:19.7'
    item: 'Rainy neon night: falling rain, dark sky, and wet roads that reflect the coloured lights, in a teal-and-magenta palette'
    anchors:
      '1': rain, night and visible reflections on the road in the clip's cool teal / magenta light
      '0.5': a neon night without rain or reflections, or rain without the neon palette
      '0': a dry, daylight or neutral-lit scene
    evidence:
    - - '01:05.2'
      - '01:06.0'
    - - '01:14.2'
      - '01:20.0'
    - img03
    - img05
  - id: VP2
    cat: key_moment
