    - '01:12.2'
    item: 'The underpass: the underside of the overhead crossing outlined by bright red neon strips over the road, set apart from the teal street
      around it'
    anchors:
      '1': a red-lit overhead underside over the road, recognisable as the clip's underpass
      '0.5': an overhead crossing without the red neon look, or red lighting not tied to an overhead structure
      '0': none
    evidence:
    - - '01:11.0'
      - '01:14.0'
  - id: VP3
    cat: spatial
    keyframes:
    - '01:19.7'
