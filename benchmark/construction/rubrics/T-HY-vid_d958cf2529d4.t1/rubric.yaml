play_suggestions:
  FP1:
  - 'walk from the welcome sign to the far side of the market: which boardwalks and stairs connect the buildings?'
  - 'step off a boardwalk into the water: can you wade, swim or take a boat to another dock?'
  - try to reach a stall that sits out on the water
  FP2:
  - 'find the way from the market to the club: do you enter the club through the corridor?'
  - go back from the club to the market
  - check that no loading break or teleport separates the zones
  robustness:
  - 'fall or jump into the water at several places: can you always get back onto a boardwalk?'
  - 'look up from the market and from the corridor entrance: is the giant arching tube readable?'
  - 'check the club''s lighting in daytime and at night in the target game: does it stay dark and magenta?'
  - 'optional, unscored: if a tube, slide or hatch can be entered, where does it take you, and do you come out through a hatch or into the water?'
