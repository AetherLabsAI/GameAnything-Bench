rubric:
  content_realization:
  - id: CR1
    item: 'The market is built on the water: its buildings stand on their own stilts, piers or platforms over open water, joined by boardwalks
      and by stairs down to the water, and the water between them is the district''s street, with boats moored at the docks'
    anchors:
      '1': a dense district of buildings on piers or platforms over open water, linked by boardwalks and stairs to the water, with boats at the
        docks
      '0.5': buildings by the water, but standing on land or along a quay, or not linked to each other over the water
      '0': missing, or an ordinary dry-land market
    evidence:
    - - '00:45.1'
      - '00:46.5'
    - - '00:52.6'
      - '00:55.0'
    - img01
    - img03
    - img05
  - id: CR2
    cross: true
    item: 'Tubes thread the whole district: an enormous tube arches over the market from one side to the other (images, glimpsed behind the welcome
      sign in the clip), and slide tubes on scaffolds run down from the buildings into the water (clip and images)'
    anchors:
      '1': both a giant tube arching over the market and slide tubes descending from buildings or scaffolds into the water
      '0.5': only one of the two (only slides, or only the arch), or the arch stands off to the side instead of over the market
      '0': missing
    evidence:
    - - '00:45.1'
      - '00:46.5'
    - - '00:50.6'
      - '00:51.5'
    - img01
    - img02
    - img03
  - id: CR3
    item: The club is an enclosed nightclub interior whose patrons are reptiles (lizards, a snake)
    anchors:
      '1': an enclosed club room with a crowd of reptile patrons
      '0.5': a club or bar room exists but without reptiles, or it is an open-air space
      '0': missing
    evidence:
    - - '00:57.6'
      - '00:58.6'
    - - '00:59.1'
      - '01:02.1'
    - '01:02.6'
  - id: CR4
    item: The club is reached from the open market through a dim corridor lined with round doors, with a pink glow at its end where it opens into
      the club
    anchors:
      '1': a corridor leading from the market into the club, with round doors along it and a pink glow at the club end
      '0.5': a passage into the club exists but without the round doors or the glow, or it does not start from the market
      '0': no corridor; the club is entered directly or not at all
    evidence:
    - - '00:55.6'
      - '00:57.1'
    - - '00:57.6'
      - '00:58.6'
  - id: CR5
    item: A large welcome sign naming the market stands at the water's edge, with the pier-built market spread out behind it
    anchors:
      '1': a prominent name sign at the water's edge, seen together with the market behind it
      '0.5': a name sign exists but is small, hidden or placed away from the market view
      '0': missing
    evidence:
    - - '00:45.1'
      - '00:46.5'
    - img02
  functions_playability:
  - id: FP1
    item: 'The player can move through the water market: along boardwalks and docks between the pier-built buildings, with the water as part of
      the route (wading, swimming or by boat), and reach its stalls and landmarks'
    anchors:
      '1': free movement through the district along boardwalks and across the water, with the stalls and landmarks reachable
      '0.5': the boardwalks can be walked but the water only blocks or is only scenery, or large parts cannot be reached
      '0': the market cannot be moved through
    evidence:
    - - '00:45.1'
      - '00:46.5'
    - - '00:52.6'
      - '00:55.0'
    - img01
    - img03
  - id: FP2
    cross: true
    item: 'One continuous place joining both references: the player can walk from the market laid out as in the images through the clip''s dim
      corridor into the club, and back again, without a break in the world'
    anchors:
      '1': the player walks from the pier-built market through the corridor into the club and back, all in one continuous world
      '0.5': the zones are joined only by a teleport or a break, or the way back is missing or blocked
      '0': the player cannot get between the market and the club
