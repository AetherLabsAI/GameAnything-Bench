task_id: T-TO-txt_1d6c9c635dfd.e3
source_inventory:
- 'c31.p001-c31.p003: Walter and the Maid come through a narrow mountain pass into a small dale and find a camp of armed men with tents and saddled
  horses; Walter fears thraldom and separation, the Maid rejoices; they decide to go to them quietly'
- 'c31.p004: six men-at-arms bow to Walter without a word and lead the pair to an old armoured knight, who also bows silently; they are fed in
  the main pavilion, the camp is struck, and the two are put in separate horse-litters and escorted off, Walter keeping his sword'
- 'c31.p005: the company rides down the passes and through the night; Walter fears sacrifice and losing the Maid; at dawn they enter a huge walled
  city by its gate (horn blown thrice), cross a great square to a palace, Walter is separated from the Maid, led to a vast chamber, made to strip
  and lie in a bed, his clothes taken; he sleeps'
- 'c32.p001: he wakes in a splendid chamber with a great ivory chair under a cloth of estate'
- 'c32.p002-c32.p003: two servants and three old men, still only by signs, take him naked to a bath, then back between a double hedge of warriors
  and sages; great men stand in a ring round the ivory chair; Walter expects the altar'
- 'c32.p004-c32.p005: on two benches beside the chair lie two sets of raiment, gem-laden robes of peace fit for a great king and plain, weather-
  and battle-worn war-gear; signed to choose, Walter lays his hand on the war-gear; a glad murmur; the old men arm him; a golden crown sits on
  the helm'
- 'c32.p006-c32.p011: armed, he sits on the ivory throne with a sword across his knees and asks why no one speaks; all hail him ''King of Battle'';
  the elder promises they will do only as he bids and will answer truly'
- 'c32.p012-c32.p017: Walter asks after the Maid (she has only slept, eaten, bathed), orders her brought to a chair beside his, dressed as she
  wills; three lords go for her'
- 'c33.p001-c33.p002: the elder explains: Walter is king of the mighty city of Stark-wall with subject cities, lands, havens and an army; the
  custom: a male heir succeeds; with no heir a great lord with knights and sergeants watches the mountain pass and takes the first man who comes,
  because the forefathers came down by it; the great men view him naked; an ill-fashioned man is cast out, a simple guileless man is given as
  thrall to a craftsman, and in either case the watch resumes as if none had come; a well-fashioned man chooses between the ancient armour and
  the golden raiment; war-gear makes him king; peace raiment leaves him the choice of thraldom or a test of wisdom with death on failure'
- 'c34.p001-c34.p006: a roar is heard outside; the Maid enters in her white coat with roses, kneels and asks to be his handmaid; Walter seats
  her beside him and tells the lords to worship her as queen or let them both go in peace; all acclaim her, the young men brandishing swords'
- 'c35.p001-c35.p005: at the gallery window the King and the Maid see the square packed with armed folk who cheer and toss spears; the Maid blesses
  Walter''s valiant heart; he stands as in a dream'
- 'c35.p006-c35.p009: two neighbours in the crowd: one praises the ancient armour of the Battle of the Waters and the sword of the Day of the
  Doubtful Onset as good luck, the other the Queen''s beauty'
- 'c35.p010: the Queen is attired by damsels, the King unarmed but keeps the Sword of the King''s Slaying; they kiss on the dais, eat and drink
  before all, ride white horses through the throng to the great church led by one unarmed squire (the custom), are met by bishop and folk, mass
  is sung, the King anointed and crowned; they walk back alone; a neighbour now finds the crowned Queen as goodly as the King'
- 'c35.p011-c35.p014: the second neighbour praises her holiness and foretells blessings for her descendants; the King and Queen feast with the
  lords far into the night'
