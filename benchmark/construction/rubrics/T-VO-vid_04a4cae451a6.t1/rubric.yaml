play_suggestions:
  FP1:
  - 'start the journey and ride for a while: does the ride move you, is the route snowy, and is the companion with you?'
  - 'dismount / leave the vehicle mid-route and come back: can you continue?'
  FP2:
  - 'during the ride, wait for the predators and then use fire or light against them: is that response available?'
  - 'let the predators reach you without defending: what happens, and can you still go on?'
  FP3:
  - talk to the companion several times
  - 'trigger the companion falling apart, talk to it while in pieces, then put it back together: is it whole and following again?'
  - walk away while it is in pieces
  FP4:
  - 'reach the creature: does it act on the party (throwing, attacking)?'
  - 'react to it (throw something, flee, take cover): does it matter, and does the encounter end or hand over?'
  FP5:
  - play from start to end and note the order of the beats and whether a purpose or progression is clear
  - check that characters comment on what happens at the beats
  robustness:
  - 'skip ahead to the creature without doing the journey: is the story still sensible?'
  - 'die or fail during the wolf attack: can you retry?'
  - replay the whole sequence a second time
