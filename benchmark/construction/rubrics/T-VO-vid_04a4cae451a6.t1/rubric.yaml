rubric:
  content_realization:
  - id: CR1
    item: 'The game contains the travelling party with their roles: a young woman as the heroine, a man who drives the reindeer sleigh, and the
      reindeer that carries them (pulling the sleigh or ridden)'
    anchors:
      '1': all three present and told apart by role (heroine, sleigh driver, the reindeer that carries them)
      '0.5': the characters are present but their roles are not recognisable, or one of them is missing
      '0': missing or a different cast
    evidence:
    - - '01:05.1'
      - '01:19.6'
    - - '01:40.6'
      - '01:41.1'
  - id: CR2
    item: The game contains a small living snowman as a member of the travelling party, going along with the heroine and the driver
    anchors:
      '1': a recognisable snowman character that belongs to the party and is found with it
      '0.5': a snowman is present but not with the party (e.g. standing elsewhere as a figure on its own)
      '0': no snowman
    evidence:
    - - '01:14.6'
      - '01:19.6'
    - - '01:27.1'
      - '01:34.1'
    - - '01:40.6'
      - '01:41.1'
    - - '01:44.1'
      - '01:48.1'
  - id: CR3
    item: The game contains a wolf pack as the danger on the party's snowy night route
    anchors:
      '1': wolves (or clearly wolf-like predators) placed on the night journey route as a threat to the travellers
      '0.5': wolves are in the game but away from the journey, or not at night
      '0': no wolves
    evidence:
    - - '01:21.1'
      - '01:25.6'
  - id: CR4
    item: The game contains a giant white snow creature, many times the size of the people, standing at a glowing ice palace
    anchors:
      '1': a snow creature clearly huge against the characters, placed at an ice palace / wall of ice crystal
      '0.5': the creature is present but not giant, or not at an ice palace (or the palace without the creature)
      '0': missing
    evidence:
    - - '01:39.1'
      - '01:39.6'
    - - '01:44.1'
      - '01:46.1'
    - - '01:50.1'
      - '01:50.6'
  - id: CR5
    item: 'The game contains the ice-powered woman as the heroine''s sister: she makes ice with her hands and body (streaming crystals, a staircase
      of ice forming as she climbs), and the game makes her the heroine''s sister'
    anchors:
      '1': a woman with visible ice-making powers who is identified (in lines or text) as the heroine's sister
      '0.5': the ice-powered woman is present without the sister link, or a sister is named without ice powers
      '0': missing
    evidence:
    - - '01:38.6'
      - '01:42.1'
  - id: CR6
    item: 'The game connects the journey to the climax under a freeze: the same companions who cross the frozen wilderness end up at the ice palace
      facing the giant creature, while a deep freeze grips the land'
    anchors:
      '1': the wilderness journey leads to the ice palace as its end point with the same companions, and the land is shown gripped by a freeze
        (e.g. a whiteout storm over a settlement)
      '0.5': the journey and the palace exist as unconnected places, or the freeze over the land is missing
      '0': missing
    evidence:
    - - '01:05.1'
      - '01:19.6'
    - - '01:34.6'
      - '01:41.1'
    - - '01:44.1'
      - '01:48.1'
  functions_playability:
  - id: FP1
    item: 'A snowbound journey: the player travels through snowy wilderness, by day or at night, on an animal-drawn vehicle or a ridden mount
      with a companion, and the route leads on toward the later events'
    anchors:
      '1': a ride (drawn or ridden) that actually moves the player across a snowy route, by day or at night, with a companion present, leading
        somewhere
      '0.5': the vehicle / mount exists but does not move the player, or the route is not snowy, or no companion
      '0': no journey
    evidence:
    - - '01:05.1'
      - '01:13.1'
    - - '01:14.6'
      - '01:17.1'
  - id: FP2
    item: 'Predator ambush on the road: wolf-like predators attack during the journey, the player can take up fire or a light against them, and
      the encounter resolves so the journey can go on'
    anchors:
      '1': predators attack during travel, a fire / light response is available to the player, and the encounter ends with the player able to
        continue
      '0.5': predators appear but no fire / light response is available, or the attack never resolves or is unrelated to the journey
      '0': no predator encounter
    evidence:
    - - '01:21.1'
      - '01:27.6'
  - id: FP3
    item: 'The snowman companion comes apart and is put back together: it speaks to the player, can lose its head or parts, keeps talking while
      in pieces, and the player can put the parts back, after which it is whole and keeps going'
    anchors:
      '1': the companion talks, comes apart, still talks while apart, and is restored by the player's action
      '0.5': it comes apart and is restored but falls silent while apart, or it comes apart but cannot be restored by the player
      '0': it never comes apart
    evidence:
    - - '01:17.6'
      - '01:18.1'
    - - '01:27.1'
      - '01:34.1'
    - - '01:44.6'
      - '01:48.1'
  - id: FP4
    item: 'Climactic encounter with a giant snow creature: it acts against the party (throws or attacks, e.g. scatters the companion), the player
      can react, and the encounter leads to an outcome or a way to continue'
    anchors:
      '1': a reachable staged confrontation in which the creature acts on the party and the player's reaction matters; it ends or hands over to
        what comes next
      '0.5': the creature is present but passive or purely decorative, or the encounter has no end
      '0': no creature encounter
    evidence:
    - - '01:39.1'
      - '01:39.6'
    - - '01:44.1'
      - '01:53.6'
  - id: FP5
    item: 'A coherent start-to-end progression: the beats the build takes from the clip follow in a sensible order with a purpose or progression,
      characters react to what happens in spoken or written lines, and the sequence reaches an end or a way to continue'
    anchors:
      '1': the chosen beats connect into one progression with a purpose, character reactions at the beats, and an end or continuation
      '0.5': the beats exist as unconnected spots, or there is no purpose / end, or the characters never react
      '0': no progression
    evidence:
    - - '01:05.1'
      - '01:53.6'
