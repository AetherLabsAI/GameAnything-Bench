  U7: CR3 (turned-city route), VP3 (look)
  FP1: FP1
  FP2: FP2 (+ pursuer push as the trigger, from U5), CR2 (the turning street with its objects exists)
  FP3: FP3
  FP4: FP4, CR1 (existence of the pursuers)
  FP5: FP5
  VP1: VP1
  VP2: VP2
  VP3: VP3, CR3 (which turned-city parts exist and connect)
