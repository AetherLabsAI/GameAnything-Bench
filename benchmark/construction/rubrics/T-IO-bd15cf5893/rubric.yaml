  building in the distance'
- 'img02: a bronze relief model of the fort site (photographed rotated, seen from above): the rocky ridge with the walled enclosure along its
  edge, round bastions, a dense block of palace buildings at one end, an inner walled enclosure with round corner towers, and a zigzag route with
  gate structures at the far end; a visitor''s shoe at the edge'
- 'img03: a street map: the fort as an elongated walled outline on open hill ground, a road and parking approaching from the north, a green walled
  garden on its west side, a temple symbol at its southern tip, dense streets of the town wrapping round the south and east; small labels mostly
  illegible at this size'
- 'img04: view up from the foot of the walls: sheer stone walls with crenellations, a massive round bastion, a tall square tower with a projecting
