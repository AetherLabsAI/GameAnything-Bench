# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-HY-vid_b5be7373833d.t1
source_inventory:
- 'clip 01:20.8-01:22.7: a crowd of costumed characters bursts out in a flash of flying paper in a checkered palace hall'
- 'clip 01:22.7-01:26.8: title ''The Hunter'' on a rock in a snowy pine forest; a hunter with a feathered hat and a gun stalks; the boy (golden
  hair, green outfit) plays a flute nearby; then the hunter waves in a hut of barrels with a crossbow and a gun'
- 'clip 01:26.8-01:30.3: a white burst of paper; the businessman (checked suit, red tie) appears with arms out, a briefcase at his feet, the boy
  and a small purple fox watching; a white-uniformed armoured figure bows beside him'
- 'clip 01:30.8-01:34.8: title ''The Businessman'': he and the boy on a small bare rocky planet under stars with floating asteroids; he opens
  his briefcase into a drawer of coloured flowers and seeds; he holds up a counting machine printing a ticker tape, talking to the boy'
- 'clip 01:35.3-01:38.3: a flash in a green-and-blue corridor; a trench-coated figure in a hat reads a large book'
- 'clip 01:38.8-01:42.0: title ''The Geographer'': a map unrolled on a table under the stars; the geographer (hat, coat, bow tie) studies it with
  the boy at his side (the hunter also present); he peers through a magnifier among tall towers of books'
- 'clip 01:42.3-01:46.0: a burst of light in a lit-up hall between two tall robed figures reveals the king (crown, red beard, white ruff, ermine
  robe, gold sceptre), who poses grandly'
- 'clip 01:46.3-01:52.8: title ''The King'': the king climbs to the top of a tall stone stair tower, raises his arm, topples and slides down the
  stairs on his cape to the foot of a blue-and-white building'
- 'clip 01:53.3-01:55.8: small planets in starry space; a bubble around a planet streaks with blue light; the boy looks out, worried'
- 'clip 01:56.3-01:59.0: the boy with the hunter, the geographer, the king and the businessman stand together looking out at space; fade to black'
- 'clip audio: music only, no speech'
- 'text p001: the prince tells the narrator (repairing his plane) his story: he lived alone on a house-sized asteroid (B-612; an anecdote about
  the Turkish astronomer who found it), with three tiny volcanoes and baobabs he had to uproot; a vain, demanding rose grew there and he cared
  for her (screen, glass globe); feeling used, he resolved to leave and explore; at the goodbye she apologised and said she would protect herself;
  he then visited six other planets, each inhabited by one adult'
- 'text p002: the six inhabitants in order: a king who claims everyone as his subject but only gives orders that can be obeyed (the sun to set
  at sunset); a conceited man who wants only to be admired; a tippler who drinks to forget the shame of drinking; a businessman who counts and
  catalogues the stars to own them, blind to their beauty; a lamplighter on a planet so small a day lasts a minute, lighting and putting out his
  lamp every 30 seconds by orders (the prince liked this planet most, for its sunsets); an elderly geographer who has never been anywhere and
  only records what explorers report; he persuades the prince to visit Earth next'
- 'img01: the little prince in storybook watercolour: wild golden hair, a long green coat lined red, a sash, boots and a small sword'
- 'img02: a single red rose on the curve of a small planet, a yellow sun behind'
- 'img03: a king in a crown and a huge star-patterned ermine robe sitting on a throne, the robe covering his tiny yellow planet'
- 'img04: a businessman in a suit and tie at a desk on a small planet, pointing at a written sheet of figures, stars around'
- 'img05: a lamplighter on a tiny planet lighting a lamp post with a long pole, a red sun beside the planet'
- 'img06: an old bearded geographer at a desk on a planet with a large open book and a magnifying glass'
