rubric:
  content_realization:
  - id: CR1
    item: The game contains a working horse with a condition of its own that has both a general side (strength and spirits) and the soundness
      of its feet
    anchors:
      '1': a working horse is present, and its condition covers both its general strength / spirits and its feet (sound vs sore or lame)
      '0.5': the horse has a condition, but only a single generic value with no separate state of the feet
      '0': no horse with a condition of its own
    evidence:
    - c28.p008
    - c29.p029
    - c30.p002
    - c31.p009
    - c31.p015
  - id: CR2
    item: 'The roads the horse travels differ in the conditions the rules depend on: stony or loose stretches vs smooth ones'
    anchors:
      '1': the roads available include both stony / loose and smooth stretches
      '0.5': the roads differ, but not in surface (e.g. only in gradient)
      '0': a uniform road, or no road to travel
    evidence:
    - c28.p006
    - c29.p002
    - c29.p003
    - c29.p005
  - id: CR3
    item: 'The horse has a keeping place in the game where its day-to-day care happens: its feed, the cleanliness of its litter and its exercise'
    anchors:
      '1': a keeping place exists, and feed, clean litter and exercise are all parts of the care that can be given or neglected
      '0.5': a keeping place exists, but care covers only one or two of feed, litter and exercise
      '0': no keeping place, or no care to be given
    evidence:
    - c30.p001
    - c30.p002
    - c31.p002
    - c31.p011
    - c31.p015
  - id: CR4
    item: 'The horse can suffer two distinct problems of the feet, told apart by where they come from: a stone picked up on the road and lodged
      in the hoof, and a foot disease from standing in a foul box'
    anchors:
      '1': both problems exist in the game as different problems, one arising on stony road and one from foul litter
      '0.5': only one of the two problems exists, or there is only one generic foot problem whatever its origin
      '0': the horse has no such problems
    evidence:
    - - c28.p006
      - c28.p008
    - c28.p015
    - c31.p009
    - c31.p013
  functions_playability:
  - id: FP1
    item: The animal's condition changes with how it is driven and kept, carries over between outings, and in turn affects how it performs
    anchors:
      '1': the condition is changed by handling and care, persists across sessions or outings, and feeds back into the animal's performance
      '0.5': the condition changes but is cosmetic, resets each outing, or does not affect performance
      '0': the condition never changes in play
    evidence:
    - c28.p008
    - c29.p004
    - c30.p002
    - c31.p009
    - c31.p015
  - id: FP2
    item: 'The way the horse is driven decides how it wears: driving that adapts to the road keeps it fresh and going well, while driving that
      ignores the road wears or harms it faster'
    anchors:
      '1': how the horse is driven (pace, adapting to the road surface) changes its condition clearly differently, with adapting to the road
        reducing wear
      '0.5': driving changes the condition only weakly or uniformly (by distance or time alone, the road playing no part)
      '0': the way the horse is driven has no effect on it
    evidence:
    - - c28.p002
      - c28.p009
    - - c29.p001
      - c29.p006
    - - c29.p023
      - c29.p028
  - id: FP3
    item: A problem picked up while travelling keeps worsening while the animal is driven on, until someone stops and deals with it; afterwards
      an after-effect lingers for a while
    anchors:
      '1': a problem from travelling that escalates while ignored, is removed by a deliberate action, and leaves a temporary after-effect
      '0.5': such a problem happens, but it does not worsen while ignored, or is fixed instantly with no after-effect
      '0': no such problem arises in play
    evidence:
    - - c28.p006
      - c28.p008
    - c28.p015
    - c28.p017
  - id: FP4
    item: 'Care decides the animal''s health over time: sustained lapses produce a gradual decline, and correcting the cause brings recovery'
    anchors:
      '1': lapses in care lead to a gradual decline, and putting the cause right restores the animal over time
      '0.5': care affects the animal, but the decline is instant or generic, or recovery does not depend on fixing the cause
      '0': care has no effect
    evidence:
    - c30.p002
    - c31.p002
    - c31.p009
    - c31.p011
    - c31.p015
  - id: FP5
    item: 'The animal''s habits are shaped by its treatment: harsh or hurried treatment builds lasting bad habits, while patient, fitting treatment
      lets them fade'
    anchors:
      '1': habits arise from treatment, persist across outings, and can be worsened or undone by later treatment
      '0.5': habits exist but are fixed traits, or change immediately and do not persist
      '0': no habits
    evidence:
    - c28.p005
    - c29.p014
    - c29.p019
    - c29.p021
  - id: FP6
    item: 'Problems must be found from the animal''s signs: it cannot say what is wrong, attentive or knowledgeable inspection reveals the cause,
      and only an identified cause can be treated properly'
    anchors:
      '1': problems show as observable signs, attention or inspection identifies the cause, and treatment works only when aimed at that cause
      '0.5': problems are announced directly (e.g. a message names the cause), or any treatment fixes any problem
      '0': no detection or treatment
    evidence:
    - c28.p007
    - c28.p011
    - c30.p010
    - c31.p011
    - c31.p013
  visual_presentation:
  - id: VP1
    cat: presentation
    item: The animal's condition is visible on the animal itself, in its movement or look, so the player can read that something is wrong
    anchors:
      '1': at least one condition problem is clearly visible in the animal's movement or look, not only in a number or a menu
      '0.5': visible changes on the animal exist but are weak, intermittent or ambiguous
      '0': condition is shown only as a number, bar or text, or not at all
    evidence:
    - c28.p008
    - c28.p011
    - c29.p010
    - c30.p004
    - c31.p009
  - id: VP2
    cat: spatial
    item: 'The road surface can be read on sight: loose stones are recognisable, so the driver can keep to the smoother parts or ease off in time'
    anchors:
      '1': stony / loose stretches are clearly recognisable in the play space before the horse reaches them
      '0.5': only slopes are recognisable, or stony stretches only once the horse is already on them
      '0': the road surface cannot be told apart by looking
    evidence:
    - c28.p006
    - c28.p007
    - c29.p002
    - c29.p005
  - id: VP3
    cat: spatial
    item: The state of keeping (clean or foul) can be seen in the keeping place
    anchors:
      '1': a clean and a foul state of the keeping place look clearly different
      '0.5': the state shows only weakly or only in text
      '0': the keeping place looks the same whatever its state
    evidence:
    - c30.p002
    - c31.p002
    - c31.p015
play_suggestions:
  FP1:
  - drive or keep the animal badly for a while, then check its condition in a later outing
  - compare performance (speed, stamina, stumbling) of a fresh and a run-down animal
  FP2:
  - drive the same route once easing off on slopes and loose stones and once at full pace throughout; compare the wear
  - 'drive a short stretch hard and a longer one gently: does the hard short drive take more out of the horse?'
  FP3:
  - 'drive carelessly over a rough stretch; keep going after the first sign of trouble: does it get worse?'
  - 'remove the cause, then drive hard at once: is there an after-effect?'
  FP4:
  - 'skip one kind of care for several days: does a decline appear gradually?'
  - apply the wrong remedy, then the right one
  FP5:
  - 'punish the animal each time it is frightened, then try patience: does the habit change over outings?'
  FP6:
  - 'look for a problem without being told: are the signs readable?'
  - try to treat before identifying the cause
  robustness:
  - 'neglect the animal completely: does the game respond sensibly (a breakdown, a sale, a way to continue)?'
  - do nothing for a long time, then return
  - 'alternate good and bad treatment rapidly: do condition and habits stay consistent?'
