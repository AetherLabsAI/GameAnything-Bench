# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-TO-txt_24be49c33161.e2
source_inventory:
- 'c28.p001: the narrator is a ''job horse'' let out to anyone who hires him; being gentle and dependable, he is more often given to ignorant
  drivers'
- 'c28.p002-c28.p003: tight-rein drivers keep a constant hard pull on the mouth; tormenting for a sound horse with a tender mouth'
- 'c28.p004-c28.p005: loose-rein drivers have no control when a horse shies, starts or stumbles; slovenly driving teaches bad habits that later
  have to be whipped out; Squire Ashford kept his horses to their best paces and manners'
- 'c28.p006-c28.p009: a careless driver chats with his passengers in the phaeton on a road full of loose stones; a sharp stone wedges in a fore
  foot and works in deeper with every step; a good driver would have seen it or felt it through the rein; after half a mile the horse is lame,
  and the driver blames the horse and whips'
- 'c28.p010-c28.p018: a passing farmer reads the gait, lifts the foot and gets the stone out with a stone-pick; he explains that horses pick stones
  up on such roads, that the foot is bruised and the lameness will last, and advises gentle driving'
- 'c28.p019-c28.p020: the driver drives on regardless; the horse is relieved but still in pain; such treatment is common for job horses'
- 'c29.p001-c29.p006: ''steam-engine'' drivers from town expect the same pace and load on any road, never walk up hills, misuse the brake (none
  downhill, or left on uphill), start at full speed, stop and turn sharply; this wears a horse out faster than any other driving'
- 'c29.p007-c29.p009: the narrator and Rory, a carriage pair with a considerate driver, are hit at a blind corner by a gig on the wrong side of
  the road; Rory is badly hurt and later sold for coal-carting on steep hills'
- 'c29.p010-c29.p019: Peggy, a strong, willing mare with short legs, has a broken, jumping pace from being hurried and whipped to keep up with
  longer-legged horses and fast masters; sold to two ladies who drive at a steady pace, she goes well and is contented'
- 'c29.p020-c29.p022: a young horse that shies explains that he was hurried and scolded when he looked at strange things; an old gentleman says
  a horse shies from fear and whipping makes the habit worse; he is not afraid of what he knows'
- 'c29.p023-c29.p029: good driving: a gentleman checks the bit and collar, has the curb taken off, drives with a light rein; the narrator goes
  his best pace and is happy; he is sold to Mr. Barry as a riding horse'
- 'c30.p001-c30.p002: Mr. Barry, who knows little of horses, orders plenty of good food; the groom Filcher keeps the stable well but replaces
  most of the oats with bran; over weeks the horse loses strength and spirits and cannot tell anyone'
- 'c30.p003-c30.p010: a farmer friend notices the horse has gone down, dismisses the groom''s excuse (horses are dull in autumn), feels him warm
  and damp, concludes that he is not getting his corn and urges Barry to look into his stable'
- 'c30.p011-c30.p014: the horse has watched the groom and his boy carry oats off in a basket; police catch the boy and find the empty bag at the
  corn-bin; Filcher is taken away and imprisoned'
- 'c31.p001-c31.p002: the new groom Alfred Smirk polishes the horse''s look for the master but neglects feet, tack and real grooming, and never
  clears out the litter; the foul vapours make the eyes smart and spoil the appetite'
- 'c31.p003-c31.p010: the master notices the smell; Smirk talks him out of washing the box and blames the drains; a bricklayer finds nothing;
  standing on wet straw, the horse''s feet grow tender and he goes clumsily'
- 'c31.p011: no exercise for days while being fed as for hard work disorders his health; no green food or bran mash; horse balls and draughts
  given instead make him feel worse'
- 'c31.p012-c31.p015: after two stumbles on fresh stones a farrier finds thrush, caused by a foul stable; the feet are cleaned and dressed, the
  box is to be cleared daily, the diet changed (bran mashes, green food, less corn); the horse recovers; Barry gives up keeping a horse and sells
  him'
