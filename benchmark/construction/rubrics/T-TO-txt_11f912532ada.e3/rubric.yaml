rubric:
  content_realization:
  - id: CR1
    item: The game contains a river valley that divides the place into two sides and broadens into the harbour, crossed by a viaduct
    anchors:
      '1': a river in a valley separating two sides of the place, widening into the harbour, with a viaduct spanning the valley
      '0.5': the river and valley present but not dividing the place into two sides or not running into the harbour, or no viaduct across it
      '0': no river valley
    evidence:
    - c07.p002
    - c07.p026
  - id: CR2
    item: 'On the far side of the valley the game shows the landmarks stacked in order: the old town on the slope, the parish church with its
      graveyard above it, and the abbey ruin above everything'
    anchors:
      '1': the old town, the church with its graveyard and the abbey ruin all present on one side, in that order from bottom to top
      '0.5': the three landmarks present but their order wrong or unclear, or one of them missing
      '0': missing or a different layout
    evidence:
    - c07.p002
    - c07.p026
  - id: CR3
    item: The churchyard sits on a steep cliff directly over the harbour, facing out along the bay to a headland reaching into the sea
    anchors:
      '1': a churchyard on a steep cliff right above the harbour, with the bay and a headland out to sea in front of it
      '0.5': the churchyard on high ground or a cliff but not over the harbour, or no bay with a headland in front of it
      '0': missing, or an ordinary level churchyard
    evidence:
    - c07.p002
    - c07.p020
    - c07.p043
    - c07.p046
  - id: CR4
    item: A long flight of very many steps runs from the town up to the church on the cliff
    anchors:
      '1': a long flight of many steps whose foot is in the town and whose top is at the church
      '0.5': steps near the church, but short or not running from the town up to it
      '0': no stair between the town and the church
    evidence:
    - c07.p007
    - c07.p008
    - c07.p021
  - id: CR5
    item: The harbour is enclosed by two piers reaching out from either side, each ending in a lighthouse, with a narrow mouth between them that
      widens inside
    anchors:
      '1': two piers, a lighthouse at the end of each, and a narrow entrance opening into a wider harbour
      '0.5': a harbour with piers or lighthouses, but not the pair of lighthouse-tipped piers or not the narrow mouth
      '0': missing or a different harbour
    evidence:
    - c07.p003
  functions_playability:
  - id: FP1
    item: 'The player can walk between the place''s two levels: from the town by the river and harbour up the long stair to the cliff-top churchyard,
      and back down'
    anchors:
      '1': the player climbs from the town up the stair to the churchyard and walks back down the same way on foot, and the stair is the way between
        them
      '0.5': only one direction works, or the cliff top is reached without the stair (teleport, a plain slope, a shortcut that makes the stair
        irrelevant)
      '0': the player cannot move between the town and the cliff top
    evidence:
    - c07.p002
    - c07.p007
    - c07.p008
  - id: FP2
    item: 'The cliff-top churchyard works as a lookout: the player can reach its edge and see the harbour, the town and the bay laid out below'
    anchors:
      '1': a reachable spot at the churchyard's cliff edge from which the harbour, the town and the bay are all in view
      '0.5': the edge can be reached, but from it the harbour or the town cannot be seen; or it is seen only from a spot the player cannot reach
      '0': no reachable lookout over the harbour
    evidence:
    - c07.p002
    - c07.p026
    - c07.p043
  visual_presentation:
  - id: VP1
    cat: spatial
    item: 'The far side reads as one composition: houses piled up one over another on the hillside, crowned by a vast abbey ruin'
    anchors:
      '1': the old town piles up the slope with the church below a huge ruined abbey on top, visible together as one view
      '0.5': the landmarks are there but do not read together as one view, or the abbey looks like an intact or small building rather than a vast
        ruin
      '0': missing
    evidence:
    - c07.p002
  - id: VP2
    cat: spatial
    item: The valley looks deep and steep-sided, and the viaduct crossing it stands tall on high piers
    anchors:
      '1': steep valley sides falling deep to the river, spanned by a tall viaduct on high piers
      '0.5': a valley that is shallow or gently sloped, or a low bridge instead of a tall viaduct
      '0': missing
    evidence:
    - c07.p002
  - id: VP3
    cat: spatial
    item: The churchyard looks like a big old graveyard, its gravestones spread across the cliff top right out to the edge above the harbour
    anchors:
      '1': a large graveyard filled with many gravestones that reaches out to the cliff edge, reading as a big old churchyard on the cliff top
      '0.5': a graveyard is there but small or with only a few scattered stones, or it stops well short of the cliff edge
      '0': missing, or no visible graves by the church
    evidence:
    - c07.p002
    - c07.p009
    - c07.p016
