task_id: T-TO-txt_11f912532ada.e3
source_inventory:
- 'c07.p001-c07.p002: Edith Ashby''s journal, 24 July, Whitby. Rosalind meets her; they stay at the Crescent. The Esk runs through a deep, steep,
  green valley that broadens toward the harbour; a high viaduct crosses it. The red-roofed old town is piled up on the far side; the huge abbey
  ruin stands right over the town (legend of a white lady in a window); between abbey and town the parish church with a big graveyard on the cliff
  over the harbour, with a view up the bay to the Kettleness headland. The bank has fallen away and some graves are destroyed; walks with seats
  run through the churchyard, where old men sit all day'
- 'c07.p003-c07.p004: the harbour below: a long granite pier on the far side curving out with a lighthouse, an elbowed pier on the near side also
  ending in a lighthouse, a narrow mouth that widens inside. Nice at high water; at low tide only the Esk stream between sandbanks and rocks.
  A reef runs out about half a mile from behind the south lighthouse, with a bell buoy at its end that swings and sounds in bad weather; legend
  of bells heard at sea when a ship is lost'
- 'c07.p005-c07.p008: the very old man (nearly a hundred, once a Greenland whaler) dismisses the legends as tales for trippers; at six he leaves
  for home down the steps: hundreds of steps from the town up to the church, winding in a gentle curve, so shallow a horse could use them'
- 'c07.p009-c07.p015: 1 August, Edith and Rosalind with the old man (Mr. Tolliver) and his two cronies; his dialect sermon that ghosts and omens
  are invented and the tombstones are lies, since many graves are empty: the sailors named on them were lost at sea; Edith reads a stone for a
  mariner murdered by pirates'
- 'c07.p016-c07.p024: argument about what tombstones are for; the stone laid flat under the seat at the cliff edge (a ''thruff-stean'') is read:
  George Canon, fell from the rocks at Kettleness; Tolliver says it was a suicide to spite his mother; Rosalind is upset that her favourite seat
  is over a suicide''s grave; Tolliver jokes and leaves when the clock strikes'
- 'c07.p025-c07.p026: Rosalind talks about Edmund and her marriage; Edith misses Gerald. The same day at nine, alone on the cliff: town lights
  scattered and in rows along the streets, running up the Esk and dying away in the valley''s curve; the roofline of the old house next to the
  abbey on her left; sheep behind, a donkey on the paved road below, a band on the pier and a Salvation Army meeting in a back street, both heard
  from up here'
- 'c07.p027-c07.p034: Dr. Hartley''s diary, 5 June-19 July: his patient Pelham collects flies, feeds them to spiders, then the spiders to sparrows,
  keeps a notebook of summed figures, and begs for a kitten, then a cat; the doctor refuses and sees a look of killing'
- 'c07.p035-c07.p041: 19-20 July: Pelham begs again; the sparrows are gone and he vomits feathers; the doctor drugs him, reads the notebook and
  names him a ''zoophagous'' (life-eating) maniac who absorbs lives cumulatively; he is tempted to complete the experiment, and reflects on losing
  Rosalind and on work'
- 'c07.p042-c07.p045: Edith''s journal, 26 July-3 August: a strange short letter from Gerald from Castle Valerian; Rosalind has resumed sleepwalking,
  so Edith locks their door at night; Rosalind''s fiance Edmund Brackenridge is delayed by his father''s illness; Rosalind, though well, searches
  the room for the key in her sleep'
- 'c07.p046: 6 August: a storm is expected; a grey day: grey rock, clouds and sea with only the grass green, sun hidden over Kettleness, sea roaring
  over the shallows and sandy flats in drifting mist, figures on the beach, fishing boats racing into the harbour'
- 'c07.p047-c07.p049: Tolliver, changed and gentle, apologises for his talk about the dead, says he is not afraid of dying, and feels death coming
  in the wind from the sea'
- 'c07.p050-c07.p051: the coastguard with his spyglass watches a strange ship, Russian by the look of her, steered erratically as the storm approaches,
  unable to decide whether to run north or put in here'
