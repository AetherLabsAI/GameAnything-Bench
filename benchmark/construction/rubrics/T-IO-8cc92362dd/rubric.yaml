  U2: CR2 (climbing itself scored in FP2)
  U3: CR4
  U4: CR3
  U5: CR5 (the player's own taking of the treasures scored in FP4)
  U6: CR6 (chase and cutting the stalk scored in FP3)
  FP1: FP1
  FP2: FP2 (existence of stalk and upper land moved to CR2)
  FP3: FP3 (harp's alarm and ending moved to CR6)
  VP1: CR2 (rooted at home, leads up) + VP1 (plant-like look)
  VP2: CR2 (separate, barren upper land) + CR4 (giant's house)
  VP3: VP2 (look of the escape with a treasure); giant's size in CR4, recognisable treasures in CR5
  VP4: VP3 (giant's size left to CR4)
  VP5: 'dropped: editing (the requested winter look of the home ground; moved to editing_seed.yaml)'
