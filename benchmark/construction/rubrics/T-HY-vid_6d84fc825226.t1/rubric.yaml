- 'clip 00:42-00:44.5: golden-hour aerial of the amphitheatre in its setting, low buildings in front, greenery and hills beyond'
- 'clip 00:45-00:51: the white monument seen frontally at sunset, terraces and colonnade, flanked by ochre buildings'
- 'clip 00:51.5-00:57.5: street level, a domed temple''s columned portico with an inscribed pediment, a fountain with a carved grotesque face
  spouting water in the foreground, a square with people and cars'
- 'audio: music only, no speech'
- 'text p001-p003: chapter heading ''A Moonlight Ramble''; a party of friends sets out on a moonlit walk through the city from a palace'
- 'text p004-p008: they reach a famous fountain in a piazza (named Fountain of Trevi: a palace front with niches and statues, a basin reached
  down some steps); Miriam drinks for the tradition that a parting draught ensures return; Donatello drinks with her'
- 'text p009-p016: Miriam sees three shadows in the basin; the strange model, who follows her, washes his hands in the fountain and urges her
  to do the same; she flings water in his face as an exorcism, which fails; the party laughs uneasily'
- 'text p017-p025: Donatello in a fury offers to drown the model; Miriam calms him; walking apart, Donatello says the joy has gone out of his
  life and that she is in the midst of his burning heart'
- 'text p026-p028: chapter ''Miriam''s Trouble''; the party sits among ruins in the arena of the Coliseum at night, other people race and play
  among the ground-tier arches'
- 'text p029-p034: Hilda and Kenyon recognise a kneeling pilgrim circling the shrines; Miriam has hidden in a dark arch and, believing herself
  unseen, gives way to a fit of wild despair, watched by Donatello'
- 'text p035-p042: Miriam tells Donatello to flee from the evil hanging over her; he refuses to leave her; she accepts his aid and resolves to
  tell him all; the pilgrim (the model) detects her in the arch'
- 'text p043-p048: chapter ''On the Edge of a Precipice''; the friends have gone down the Capitoline Hill, Miriam and Donatello are alone at the
  brow of the precipice; the model comes out of a niche in a palace wall; Hilda turns back and, through a courtyard door, sees the deed in one
  instant'
- 'text p049-p054: Donatello says he did to a traitor what Miriam''s eyes bade him as he held him over the precipice; the model is dead; Miriam
  wishes she were dead too'
- 'text p055-p061: days later Hilda and Kenyon (a sculptor) enter the Pantheon: a great circle of recesses and altars, a dome with an open eye
  to the sky, moss on the pavement below it'
- 'text p062-p067: a veiled female penitent kneels under the open eye; it is Miriam; she blesses them with extended hands that also keep them
  away, and leaves without a greeting; Hilda asks whether Donatello was really a Faun'
- 'text p068-p069: Kenyon wins Hilda as his bride, they resolve to go back to their own land; Hilda weeps over the mystery of Miriam''s life and
  asks where Donatello is'
