  FP1:
  - 'go straight to the domed temple first: does the ending play before the earlier scenes?'
  - 'skip the arena and go to the precipice: what happens?'
  FP2:
  - after the precipice, check whether the ending in the temple follows from the deed (Miriam's changed state)
