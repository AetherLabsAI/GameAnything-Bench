# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-TO-txt_61059729ca86.e2
source_inventory:
- 'c03.p001-c03.p004: morning chores aboard the We''re Here; more schooners have crept up overnight; Dan explains that the Fleet follows Disko
  because he knows the cod; Disko studies the fish and wants to draw away and make his berth alone'
- 'c03.p005-c03.p011: Dan asks leave to go out in a dory; Harvey is given fisherman''s clothes; Troop warns them not to visit around the Fleet;
  the boys board the little dory Hattie S. astern'
- 'c03.p012-c03.p023: Harvey rows badly with the heavy sea-oars; Dan tells him to row short, since a cramped oar can turn the dory over; the dory''s
  gear (small anchor, water jugs, roding, horn, maul, gaff, gob-stick, hand-lines on reels); no sail, dories are pulled; the oar loom kicks Harvey
  under the chin'
- 'c03.p024-c03.p029: Manuel, a mile away, signals the depth by arm (thirty fathom); the boys bait and heave out their lines and drift, not anchoring
  until sure of good ground; Dan lands a cod and unhooks it with the gob-stick'
- 'c03.p030-c03.p036: Harvey''s hook brings up strawberry-bottom growth; touching it stings like nettles: only fish should be touched with bare
  fingers; talk of wages'
- 'c03.p037-c03.p043: Harvey hooks a big halibut, gives it line according to its strength, and the boys need twenty minutes to gaff and land it;
  Dan reads the signs: the fish are running smaller and smaller, and everything on the Banks is signs, read right or wrong'
- 'c03.p044-c03.p057: a pistol shot and a basket run up in the rigging call all the dories back; on the way they free Penn''s fouled anchor; Penn
  has lost two anchors this trip and will be given a kelleg (a stone instead of an anchor, a mark of shame the whole fleet recognises) if he loses
  another'
- 'c03.p058-c03.p068: while rowing back Dan tells Penn''s story (the Johnstown flood, his lost memory, Uncle Salters taking him in and bringing
  him to fish)'
- 'c03.p069-c03.p076: back at the schooner Troop orders dressing down; Dan names the schooners that have edged up and wait on Disko; Disko says
  they are too crowded and will leave the others to ''bait big an'' catch small''; the catch is small and level; he is waiting on the weather'
- 'c03.p077-c03.p086: the Bank fog drops suddenly; dressing down stops, the anchor is weighed, sails are set and the schooner slips away into
  the fog; Tom Platt and Disko recall the war'
- 'c03.p087-c03.p094: sailing in the fog; Disko steers so waves drench Uncle Salters until he agrees to set the staysail; Salters takes Penn below
  to play checkers'
- 'c03.p095-c03.p118: Long Jack teaches Harvey the ropes on the cluttered deck; Harvey explains how to reef the foresail; Long Jack calls ropes
  and Harvey must lay his hand on each at the run, enforced with a rope''s end; the crew approve'
- 'c03.p119-c03.p130: in thick fog Tom Platt arms the deep-sea lead with tallow and casts it; ''your dipsey lead''s all the eye you''re like to
  hev''; sixty fathom, then a quarter hour later fifty, and Disko judges they are over the nick of Green Bank'
- 'c03.p131-c03.p141: the boys fish from the rail and land a big cod at once; the cod are covered with sea-lice, a sign they are herded by the
  thousand and hungry, biting even on a bare hook; the anchor goes down and all hands fish from the bulwarks; boat-fishing works only until dressing
  down begins, as heads and offal scare the fish; hauling over the freeboard is harder than from a dory'
- 'c03.p142-c03.p152: Penn and Uncle Salters have missed the fishing over checkers, so Disko makes them clean up; the boys must bait trawl while
  the catch is dressed down'
- 'c03.p153-c03.p159: the boys bait the trawl tubs with cod offal; each tub holds a long line with a hook every few feet, baited and coiled so
  it runs clear when shot from the dory; Harvey cuts his fingers; Dan explains trawling is one of Disko''s experiments'
- 'c03.p160-c03.p167: Tom Platt and Long Jack take the tubs and buoys out in a loaded dory at dusk into a rough sea, threatening the boys if the
  trawl is snarled; Harvey rings the bell steadily so the dory can find its way back; it returns and is hoisted aboard: ''nary snarl'''
- 'c03.p168-c03.p173: supper; Harvey falls asleep; Penn pities Harvey''s parents; Manuel praises him; thick weather and rising wind at night;
  the men take turns watching the wheel and the anchor'
