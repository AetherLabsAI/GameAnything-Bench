  explicit_requirements:
  - type: keep
    text: I really want the ship's signals to its boats, a recall I can spot from my boat out on the water and a sound I can row home by when
      I can't see the ship.
    covers:
    - CR2
    - FP1
    - VP2
  - type: specify
    text: 'In fog, finding the fishing ground should work like in the text: you keep sounding the depth with a lead, and when the depth changes
      from one cast to the next you know you''re over the ground, so you anchor and fish there.'
    covers:
    - CR3
    - FP4
rubric:
  content_realization:
  - id: CR1
    item: 'The game contains a mother vessel on open sea that is the base of its own small boats: it lies at its berth while the boats put out
      from it and fish at a distance around it'
    anchors:
      '1': a mother vessel at its berth on open water and its own small boats, which start from it and are found fishing visibly apart from it
      '0.5': the vessel and small boats both exist, but the boats are not tied to the vessel as their base, or are never found apart from it
      '0': no mother vessel with small boats; all fishing is done from one craft
    evidence:
    - c03.p002
    - c03.p010
    - - c03.p024
      - c03.p025
    - c03.p046
    - c03.p069
    - c03.p098
  - id: CR2
    item: 'The vessel has two signals to its boats: a recall that calls all boats back, and a sound signal for a boat that cannot see the vessel'
    anchors:
      '1': both a recall signal and a sound signal from the vessel to its boats exist in the game
      '0.5': only one of the two signals exists
      '0': no signal from the vessel to its boats
    evidence:
    - - c03.p044
      - c03.p045
    - - c03.p163
      - c03.p166
  - id: CR3
    item: The game has a sounding lead for measuring the depth, and a fishing ground set apart from the surrounding sea by its depth
    anchors:
      '1': a sounding lead is present as the vessel's depth-measuring tool, and a fishing ground lies at a depth different from the water around
        it
      '0.5': the lead is present but no ground is set apart by depth, or a ground differs in depth but there is no lead
      '0': no sounding lead and no depth-defined ground
    evidence:
    - - c03.p120
      - c03.p130
  - id: CR4
    item: The catch is gathered aboard the vessel and dressed down there as a work stage of its own
    anchors:
      '1': the landed catch is gathered aboard and dressed down (cleaned / processed) as a distinct activity
      '0.5': the catch is gathered aboard, but nothing is done with it beyond storing it
      '0': no handling of the catch aboard the vessel
    evidence:
    - c03.p070
    - c03.p074
    - c03.p077
    - c03.p151
  functions_playability:
  - id: FP1
    item: 'The player can take a small boat out from the vessel, fish away from it and get back aboard, and the vessel''s signals work in play:
      the recall brings the boats back and the sound lets a boat out of sight find the vessel'
    anchors:
      '1': a playable out-and-back loop between the vessel and a small boat, with the recall and the sound signal both usable to get back
      '0.5': the out-and-back loop works, but the signals have no use in play, or only one of them does
      '0': the small boat cannot go out from the vessel and return to it, or cannot be controlled
    evidence:
    - - c03.p010
      - c03.p027
    - - c03.p044
      - c03.p045
    - - c03.p069
      - c03.p070
    - - c03.p163
      - c03.p166
  - id: FP2
    item: 'Fishing works as play: the player hooks and lands fish by their own action, and the catch is kept and accumulates as the result of
      the outing'
    anchors:
      '1': fish are caught by the player's action and the catch is kept as progress
      '0.5': fish can be caught, but the catch is not kept or does not accumulate
      '0': no working fishing
    evidence:
    - - c03.p026
      - c03.p029
    - c03.p074
    - c03.p141
  - id: FP3
    item: 'Fishing grounds differ and the catch shows it: on poor ground fish come small or few, and moving the vessel to another berth can change
      the catch'
    anchors:
      '1': catch size or rate depends on where the vessel is, the player can read this from the catch, and moving changes it
      '0.5': grounds differ but nothing in the catch shows it, or the vessel cannot be moved to a new berth
      '0': the catch is the same everywhere
    evidence:
    - c03.p043
    - - c03.p074
      - c03.p078
    - - c03.p133
      - c03.p138
  - id: FP4
    item: 'When the player cannot see far, the fishing ground is found by sounding: each cast of the lead reports the depth where the vessel is,
      a change of depth from one cast to the next shows the vessel is over the ground, and the vessel can anchor there and fish'
    anchors:
      '1': repeated casts give position-dependent depths, the change of depth marks the ground, and anchoring there and fishing yields fish
      '0.5': soundings can be cast but the depth does not depend on position or does not mark the ground, or the ground is found but the vessel
        cannot anchor and fish there
      '0': soundings do not work in play
    evidence:
    - c03.p077
    - - c03.p119
      - c03.p136
  - id: FP5
    item: 'Dressing down drives the fish from the vessel''s side: once it starts, fishing from the side stops yielding fish'
    anchors:
      '1': fishing from the vessel's side yields fish before dressing down and stops yielding while or after it runs, as a consequence of the
        dressing down itself (e.g. its waste in the water), not of an unrelated timer or switch
      '0.5': the catch from the side only drops during dressing down, or the effect holds inconsistently
      '0': dressing down has no effect on fishing from the side, or there is no fishing from the vessel's side
    evidence:
    - - c03.p136
      - c03.p141
  visual_presentation:
  - id: VP1
    cat: key_moment
    item: 'The fog: under it, sight shrinks to a short distance around the vessel'
    anchors:
      '1': dense fog in which little beyond the vessel is visible
      '0.5': fog shown only as a tint that does not limit sight
      '0': no fog
    evidence:
    - - c03.p077
      - c03.p078
    - c03.p119
    - c03.p132
    - c03.p162
  - id: VP2
    cat: presentation
    item: 'The vessel''s recall is visible from out on the water: a player in a small boat away from the vessel can see that it has signalled
      the boats back'
    anchors:
      '1': a recall signal shown on the vessel that stays noticeable while the player is operating away from it
      '0.5': a recall exists but is only readable close to the vessel or only through a menu / text message unrelated to the vessel
      '0': no visible recall
    evidence:
    - - c03.p044
      - c03.p045
play_suggestions:
  FP1:
  - 'row out well away from the vessel, then trigger or wait for the recall: is it noticeable and can you get back?'
  - 'go out in fog or at dusk: can you find the vessel again by its signal?'
  FP2:
  - 'land several fish in one outing: does the catch add up?'
  - check that the catch is kept after returning to the vessel
  FP3:
  - 'fish the same place for a while, then move the vessel: does the size or rate of the catch change?'
  - can you tell poor ground from good ground by the catch alone?
  FP4:
  - 'sound repeatedly while moving in fog: does the depth change with position?'
  - 'when the depth changes, anchor and fish there; then anchor and fish somewhere else: is the ground better?'
  FP5:
  - 'fish from the vessel''s side, start dressing down, keep fishing: does the catch stop?'
  - is the stop tied to the dressing down (e.g. its waste), not to a fixed time?
  robustness:
  - 'capsize or lose the small boat, or stay out very long: is the result sensible and can play continue?'
  - move the vessel while boats are out
  - sound and fish in clear weather as well as in fog
v4_map:
