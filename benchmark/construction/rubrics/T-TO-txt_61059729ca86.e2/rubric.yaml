  U3: CR3 (lead and depth-defined ground exist); sounding, the depth change marking the ground, anchoring and fishing there in FP4
  U4: CR4 (dressing down exists); its link to deck fishing, with dressing down as the cause, in FP5
  U5: CR1
  FP1: FP1 (behaviour); existence split to CR1 (vessel and boats) and CR2 (signals)
  FP2: FP2
  FP3: FP3
  FP4: FP4 (behaviour, now including anchoring at the ground); existence split to CR3
  FP5: FP5 (effect on deck fishing); existence of dressing down split to CR4
  VP1: CR1 (spatial arrangement of vessel and boats)
  VP2: VP1
  VP3: VP2
