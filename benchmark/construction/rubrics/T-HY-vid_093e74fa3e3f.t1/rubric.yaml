rubric:
  content_realization:
  - id: CR1
    item: The palace stands by itself high on a snowy mountainside, above the slope among mountain peaks
    anchors:
      '1': a lone palace set high on a snowy mountainside, raised above a slope that is part of the built world
      '0.5': in snowy mountains, but not set above a slope (on flat ground, in a valley), or the mountainside is only a distant backdrop
      '0': missing, or a different setting (a town, a plain, festival grounds)
    evidence:
    - - '02:22.4'
      - '02:27.0'
    - - '02:27.4'
      - '02:29.4'
  - id: CR2
    item: Outside, the palace is a cluster of tall ice spires of uneven height standing on a broad flat platform raised on ice pillars
    anchors:
      '1': several spires of clearly different heights grouped on a broad flat platform, and the platform itself held up on pillars above the
        ground
      '0.5': an ice building with towers, but no raised platform on pillars, or spires of one height / a single tower
      '0': no recognisable exterior, or a different form (a single dome, a walled castle)
    evidence:
    - - '02:27.4'
      - '02:32.4'
  - id: CR3
    item: Inside the palace, on its platform, is one wide open hall lined along its sides by tall columns
    anchors:
      '1': a single wide open hall inside the spired exterior on the platform, with tall columns standing along its sides
      '0.5': a column-lined hall that is cramped, split into rooms, or not inside the exterior (a separate build)
      '0': no hall
    evidence:
    - - '02:31.4'
      - '02:34.4'
    - - '02:33.9'
      - '02:38.4'
  - id: CR4
    item: A large radial snowflake is laid into the hall floor and repeated above it, where the ceiling ribs rising from the columns converge
      on a snowflake at the vault's centre
    anchors:
      '1': a recognisable radial snowflake on the hall floor and a snowflake at the centre of the vault above it, with ribs from the columns running
        to it
      '0.5': a snowflake in only one of the two places, or ceiling ribs that do not converge on it, or a radial pattern not recognisable as a
        snowflake
      '0': no snowflake motif in the hall
    evidence:
    - - '02:36.4'
      - '02:39.4'
    - - '02:41.9'
      - '02:54.4'
  - id: CR5
    cross: true
    item: 'The clip''s palace (spires, platform pillars, hall columns and walls) is built in the images'' ice construction: its walls, spires
      and columns are themselves built up of stacked ice blocks'
    anchors:
      '1': the clip's spires, platform pillars, hall columns and walls are built up of ice blocks as the images' walls, towers and pillars are
      '0.5': 'only one reference used: the clip''s palace forms with ice only as a skin or trim over another material, or the images'' ice-block
        construction used for buildings that are not the clip''s palace (e.g. a copied pagoda or hotel)'
      '0': the palace is not built of ice at all
    evidence:
    - - '02:29.4'
      - '02:31.4'
    - - '02:33.9'
      - '02:36.4'
    - img01
    - img02
    - img04
    - img05
  functions_playability:
  - id: FP1
    item: The player can reach the palace on foot from the snowy mountainside it stands on and get up onto its raised platform
    anchors:
      '1': the palace can be reached on foot from the surrounding slope and its platform climbed onto
      '0.5': the palace is reachable only by teleport / spawning on it, or the slope exists but does not lead up to it
      '0': no outside approach (only the interior is built)
    evidence:
    - - '02:22.4'
      - '02:27.0'
    - - '02:27.4'
      - '02:32.4'
  - id: FP2
    item: The player walks from the platform among the spires into the hall without a cut
    anchors:
      '1': the player walks from the platform into the hall continuously, without a cut or teleport
      '0.5': the hall can be entered only by teleport or through a separate, disconnected route
      '0': no way into the palace
    evidence:
    - - '02:31.4'
      - '02:34.4'
  - id: FP3
    item: The hall is an open space the player can cross freely among the columns to its centre, beneath the snowflake of the vault
    anchors:
      '1': the hall floor is walkable from the sides to the centre, the columns stand around it and do not block it
      '0.5': the hall can be entered but much of it is blocked, too cramped to move through, or the centre cannot be reached
      '0': the hall cannot be walked
    evidence:
    - - '02:33.9'
      - '02:41.4'
    - - '02:51.4'
      - '02:54.4'
  visual_presentation:
  - id: VP1
    cat: style
    keyframes:
    - '02:30.9'
    item: The palace reads as translucent ice that glows with light from within, like the lit ice architecture of the images
    anchors:
      '1': walls, spires and columns look like clear / translucent ice and glow from inside or behind, recognisably like the images' lit ice
      '0.5': an ice or blue material but opaque and unlit, or glowing but not readable as ice
      '0': ordinary stone / wood / snow look
    evidence:
    - img01
    - img02
    - img04
    - img05
    - - '02:29.9'
      - '02:31.4'
  - id: VP2
    cat: spatial
    keyframes:
    - '02:34.9'
    - '02:36.9'
    item: The hall's glossy dark-blue floor mirrors the tall glowing blue columns along its sides
    anchors:
      '1': a glossy dark-blue floor in which the glowing columns are visibly reflected, seen together with the columns
      '0.5': a smooth dark or blue floor that does not read as a mirror, or a reflective floor without the glowing columns showing in it
      '0': an ordinary matte floor
    evidence:
    - - '02:33.9'
      - '02:38.4'
  - id: VP3
    cat: style
    keyframes:
    - '02:27.9'
    - '02:35.4'
    item: 'Night atmosphere in deep blues and cyan: the glowing ice palace against a dark sky and moonlit snow'
    anchors:
      '1': night, a blue / cyan palette, the palace's glow standing out against the dark
      '0.5': blue ice but in daylight, or night without the palace glowing
      '0': neither
    evidence:
    - - '02:22.4'
      - '02:27.0'
    - - '02:27.4'
      - '02:38.4'
play_suggestions:
  FP1:
  - 'start on the slope below: can you walk up to the palace and onto the platform without flying or teleporting?'
  FP2:
  - 'from the platform, walk into the hall: do you arrive without a loading cut or teleport?'
  - 'step back out: is the hall on the platform, inside the exterior you saw?'
  FP3:
  - 'walk from where you enter to the centre of the hall, then along the columns: anything blocking?'
  - 'look up from the centre: is the ceiling snowflake above you?'
  robustness:
  - walk off the platform edge and come back up
  - 'break or place blocks at the way in and inside the hall (survival sandbox): does the place stay recognisable and enterable?'
  - 'visit at another in-game time of day: is the glow still readable?'
