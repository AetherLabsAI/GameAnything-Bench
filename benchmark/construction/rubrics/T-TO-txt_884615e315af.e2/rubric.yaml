# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-TO-txt_884615e315af.e2
source_inventory:
- 'c07.p005-c07.p007: chapter heading (revenue and the agricultural estate); Garden City''s entire revenue comes from rents, which are to pay
  (a) interest on the purchase money, (b) a sinking fund, (c) all works usually paid from compulsory rates, and (d) after redemption a surplus
  for pensions and insurance'
- 'c07.p008-c07.p010: town rent vs farm rent (£30,000 vs £4 an acre); the difference is due to population (the ''collectively-earned increment'');
  migration raises land value, and because the land is held in trust for the community, the whole rise goes to the municipality in relief of rates'
- 'c07.p011-c07.p012: worked example: site bought at £40 an acre (£240,000), 4 per cent interest £9,600 a year; per head this falls from £8 (1,000
  people) to 6s. (32,000 people); this is all the rent ever ''paid away'', the rest is rates'
- 'c07.p013-c07.p014: if each person pays £2 in all, the Board receives £54,400 after interest, enough for a £4,400 sinking fund and all local-tax
  costs; comparison with national averages (£4 10s. for rent and rates)'
- 'c07.p015-c07.p016: farm rents will rise: 30,000 townspeople give farmers a market at their doors, cutting rail and middleman costs (milk example:
  over £1,900 a year saved)'
- 'c07.p017-c07.p018: town waste returned to the soil on a clean-sheet sewage plan raises fertility; more, well-placed allotments raise total
  rent'
- 'c07.p019: just tenure: farms let at fair rents; the sitting tenant stays while paying what any rival offers less, say, 10 per cent; the incoming
  tenant compensates the outgoing one for unexhausted improvements; this encourages cultivation and higher rent'
- 'c07.p020-c07.p021: the nature of the payment: part is interest on debentures, part redemption, the rest spent locally under shared administration;
  new terms ''landlord''s rent'', ''sinking fund'', ''rates'', total ''rate-rent''; the farmer will pay more rate-rent than rent to a private
  landlord, getting it back as roads, schools, markets'
- 'c07.p022-c07.p026: four reasons the rate-rent exceeds the old rent; prudent estimate: old rent £6,500 plus 50 per cent = £9,750 rate-rent from
  the agricultural estate; the town estate follows in the next chapter'
- 'c08.p001-c08.p002: footnotes (electric light and glass-houses; book references)'
- 'c09.p001-c09.p003: epigraph (Marshall on moving London workers out); town site of 1,000 acres cost £40,000, interest £1,600 a year, under 1s.
  1d. per head: all the landlord''s rent the town will pay; the rest goes to sinking fund or rates'
- 'c09.p004: what the town gets for this: home lots (20 by 130 feet), wide roads, sites for all public buildings, central park, a wide circular
  avenue, land for a circular railway, factory and market sites'
- 'c09.p005-c09.p007: leases carry no tenant covenant to pay rates; instead the landlord covenants to apply all receipts first to debenture interest,
  second to redemption, third the balance to a public fund (including outside authorities'' rates); home lots: avenue and boulevard frontages
  draw the highest tenders; average 6s. a foot frontage, £6 a lot, 5,500 lots = £33,000'
- 'c09.p008-c09.p009: business sites estimated at £2 per employee as a gauge only, the actual rent being raised by competition among tenants;
  10,625 employed = £21,250'
- 'c09.p010-c09.p019: gross revenue table £64,000 (£2 a head); applied as £9,600 interest, £4,400 sinking fund, £50,000 for purposes elsewhere
  paid from rates; question whether £50,000 suffices'
- 'c10.p001-c10.p004: footnote on leases; chapter heading (general observations on expenditure); public-works money borrowed on ''B'' debentures
  secured on the rate-rent, behind the interest and sinking fund of the ''A'' debentures that bought the estate; unlike the land, the works need
  not be funded in full at the outset'
- 'c10.p005: bridge vs town: a bridge earns nothing until complete, a town''s roads and schools earn rate-rent as soon as lots are let, so money
  is raised in stages and gets cheaper; each ward is a complete town, schools serve as halls at first, one ward is finished before the next, and
  unbuilt land earns as allotments, pasture or brickfields'
- 'c10.p006-c10.p008: a given revenue goes further: the first economy is that site costs (''landlord''s rent'') hardly enter municipal spending,
  since park and public-building sites were covered by the purchase; £50,000 is net revenue'
- 'c10.p009-c10.p010: second economy vs London: no purchase of old buildings, disturbance claims or legal costs; London school sites at £9,500
  an acre vs £40; argument that the comparison is fair because the workers should move'
- 'c10.p011-c10.p012: school-site saving restated (11s. 6d. a head, £517 a year); the two expedients: buy before migration raises value, and build
  on a clear site; the migrants themselves become the landowners'
- 'c10.p013-c10.p014: third economy: the town is planned as a whole, growing with unity at every stage; a new instrument is cheaper than patching
  an old one'
- 'c10.p015: illustration: the Holborn-Strand street rehousing (£1,400 a family in London vs seven cottages with gardens in Garden City)'
- 'c10.p016: fourth economy: services subways dug by machinery on a clear site before people arrive; machinery giving work'
- 'c10.p017-c10.p022: summary of the four economies (no site rent, no clearance costs, a definite plan, modern machinery)'
- 'c10.p023-c10.p027: footnotes (references; Shaw-Lefevre on London''s chaotic growth)'
- 'c11.p001-c11.p002: aim of the chapter: show that the £50,000 net revenue covers what rates usually pay for'
- 'c11.p003: expenditure table: capital and maintenance for city roads, country roads, circular railway, schools, town hall, library, museum,
  parks, sewage (capital £263,000, upkeep £29,000); interest on the works loan at 4-1/2 per cent, sinking fund over 30 years, and a balance for
  outside local rates, totalling £50,000'
- 'c11.p004-c11.p007: revenue-yielding works (markets, water, lighting, tramways) are left out as they make profits for the rates; notes on roads:
  builders usually pay for new streets, part of the roads count as park, subways would pay for themselves through the utilities'
- 'c11.p008-c11.p016: notes on country roads, the circular railway (charges to traders, rail rebates) and schools (cost per place, upkeep; Garden
  City bears the whole cost, ''proving more than I set out to prove'')'
- 'c11.p017-c11.p024: notes on management salaries, library and museum, parks (deferred until finances are sound, used meanwhile as farm land,
  clubs may contribute), sewage'
- 'c11.p025-c11.p031: interest on the works loan and the lenders'' security: money well spent, raised only as private building proceeds, on land
  turning from farm to town; a 3 per cent security later, 4-1/2 assumed at first'
- 'c11.p032-c11.p036: sinking fund clears the works debt in 30 years; little burden on outside authorities, so their rate per head falls; police
  and poor-law cannot be taken over, but pensions after the estate is paid for, sites given to institutions'
- 'c11.p037-c11.p039: conclusion: the rate-rent suffices for landlord''s rent, a sinking fund that abolishes it, and all municipal needs, with
  no compulsory rates; revenue-bearing undertakings would further lighten rates'
