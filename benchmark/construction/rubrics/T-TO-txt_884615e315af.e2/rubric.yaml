rubric:
  content_realization:
  - id: CR1
    item: The land of the estate is owned by the community, and the people on it hold their plots as the community's tenants
    anchors:
      '1': the town authority owns the estate's land and lets it, and occupiers hold their plots as its tenants, not as owners
      '0.5': plots are let, but the landlord is not the community (private landlords), or community-let plots sit beside privately owned land
        as an equal part of the town
      '0': 'no community ownership of the land: plots are simply private property'
    evidence:
    - c07.p007
    - c07.p010
    - c09.p005
    - c10.p012
  - id: CR2
    item: The estate is let as rent-paying holdings of two kinds, farm land as well as town lots
    anchors:
      '1': both farm holdings and town lots exist on the community's land, and each kind is let to tenants and pays rent
      '0.5': rent-paying holdings exist, but only town lots or only farm land
      '0': no lettable holdings
    evidence:
    - c07.p015
    - c07.p019
    - - c09.p007
      - c09.p009
    - - c09.p010
      - c09.p013
  - id: CR3
    item: 'There are two distinct debts: the loan that bought the land, and a separate loan for public works'
    anchors:
      '1': both loans exist, each with its own balance and purpose (buying the land, building public works)
      '0.5': works borrowing is folded into the land debt, or only one of the two debts exists
      '0': no debt at all
    evidence:
    - c10.p004
    - c11.p003
    - c11.p026
    - c11.p033
  - id: CR4
    item: The town land is divided into sections that are built one after another, and finished sections can be told apart from land not yet built
      on
    anchors:
      '1': the town is laid out in sections, and on the estate itself the built-out sections are distinguishable from those not yet built as the
        town grows
      '0.5': sections exist but the build-out state is given only as a list or label, not visible on the estate
      '0': no sections, or no difference between built and unbuilt land
    evidence:
    - c10.p005
    - c11.p029
  functions_playability:
  - id: FP1
    item: Each occupied plot pays a recurring rent into one common fund, and that single payment pays for the settlement's public needs in place
      of compulsory rates
    anchors:
      '1': recurring rent from each occupied plot flows into one fund, and that fund, not a separate compulsory tax, is what pays for public works
        and services
      '0.5': rent is collected once only, or it does not reach the fund that pays for public works, or a usual compulsory tax remains a separate
        main charge beside the rent
      '0': no rent from land, or the town is funded by the usual taxes only
    evidence:
    - c07.p007
    - c07.p012
    - - c07.p020
      - c07.p021
    - c09.p005
    - - c09.p010
      - c09.p014
    - c11.p037
  - id: FP2
    item: 'Each period the income is applied in priority order: land-debt interest, then its repayment, then the balance to public purposes, so
      a shortfall is felt first in public spending'
    anchors:
      '1': debt charges are always met first and only the remainder is available for public works, and a fall in income shrinks that remainder
      '0.5': the income is split among these uses but without priority, or the split is a fixed share regardless of income
      '0': no division of income
    evidence:
    - c09.p005
    - c07.p020
    - - c09.p015
      - c09.p018
  - id: FP3
    item: 'Growth raises land value: as people settle and the town develops, the rents plots fetch rise and the gain goes to the common fund'
    anchors:
      '1': rents respond to population and development over play, and the increase visibly adds to the common fund
      '0.5': rents rise over time but not because of growth, or the gain does not reach the fund
      '0': rents never change
    evidence:
    - - c07.p008
      - c07.p010
    - c07.p015
    - c07.p022
    - c10.p012
  - id: FP4
    item: Plots go to the best offer, but a sitting tenant keeps the holding while matching a rival offer less a margin
    anchors:
      '1': competing offers decide rents, and the sitting tenant's preference works in play
      '0.5': competing offers exist but without the sitting tenant's preference
      '0': rents are fixed, or no competition for plots
    evidence:
    - c07.p019
    - c09.p007
    - c09.p008
  - id: FP5
    item: 'Public works are paid for by borrowing against the rent income in stages: a new section is built as its plots are let, and the loan''s
      charges come out of the public share before the rest can be spent'
    anchors:
      '1': works are financed by loans raised as the town expands, section by section, and their interest and repayment reduce the money left
        for further spending
      '0.5': 'only one of the two: borrowing staged with letting but without an ongoing cost, or loan charges taken from the public share but
        all works funded at once'
      '0': no staged borrowing tied to expansion and no loan charges on the public share, or no way to build public works
    evidence:
    - - c10.p004
      - c10.p005
    - c11.p003
    - c11.p029
  - id: FP6
    item: The land debt is paid off over play through its repayment share, and once it is, the money that serviced it is freed for the town's
      public purposes
    anchors:
      '1': the land debt falls through its repayment share until it is paid off in play, after which its interest and repayment no longer come
        out of the income and the freed amount visibly adds to the money for public purposes
      '0.5': the land debt falls but is never paid off in play, or it is paid off but its charges still come out of the income or the freed amount
        does not reach public purposes
      '0': the land debt is never repaid
    evidence:
    - c07.p005
    - c07.p007
    - c11.p035
    - c11.p037
  visual_presentation:
  - id: VP1
    cat: spatial
    item: The estate looks like land divided into lettable plots, with farm land and town lots recognisable by their look
    anchors:
      '1': the plot divisions are visible on the land, and farm holdings look like farmland and town lots like town ground
      '0.5': plots are visible but farm and town holdings look the same, or the two uses look different but no plot divisions are visible
      '0': no visible estate
    evidence:
    - c07.p015
    - c09.p004
    - c09.p007
    - - c09.p008
      - c09.p009
  - id: VP2
    cat: presentation
    item: 'The common fund''s accounts are readable: income by source and how it is divided among interest, repayment and the public share'
    anchors:
      '1': the player can read the total income, where it comes from, and how much goes to each use
      '0.5': a total is shown, but not its sources or not its division
      '0': no readable account
    evidence:
    - - c09.p010
      - c09.p018
    - c11.p003
    - c07.p025
    - c09.p008
play_suggestions:
  FP1:
  - 'let several plots and watch the fund over a few periods: does each occupied plot add rent?'
  - 'build a public work: is it paid from the rent fund, with no separate tax needed?'
  FP2:
  - lower income (leave plots empty) and check which use loses money first
  - check that debt interest is paid even when the public balance is small
  FP3:
  - grow the population and compare a plot's rent before and after
  - check that the increase reaches the common fund, not a private owner
  FP4:
  - 'make a rival offer slightly above and then well above a sitting tenant''s rent: when does the tenant lose the plot?'
  FP5:
  - 'start a new section before its plots are let, and after: does borrowing follow letting?'
  - compare money left for spending before and after a works loan is taken
  FP6:
  - 'play until the land debt is repaid (or fast-forward): do its interest and repayment stop coming out of the income?'
  - 'compare the public share just before and after repayment: does it grow by the freed amount?'
  robustness:
  - 'let no plots at all: does the fund handle zero income sensibly?'
  - 'borrow far beyond the income: what happens?'
  - 'save and resume mid-period: are the fund and debts consistent?'
