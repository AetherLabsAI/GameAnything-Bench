rubric:
  content_realization:
  - id: CR1
    item: 'Grimwald is a rich, solitary miser who puts gain above people and turns away those around him: his nephew''s goodwill, his clerk''s
      claims and the plea for the poor'
    anchors:
      '1': a wealthy, cold, solitary miser shown turning away the people around him (family, clerk, those asking for the poor)
      '0.5': a rich or grumpy old man, without the coldness toward the people around him that the story is about, or turning away only one of
        them
      '0': missing
    evidence:
    - - c02.p006
      - c02.p011
    - - c02.p028
      - c02.p043
    - - c02.p057
      - c02.p064
  - id: CR2
    item: 'Carrow''s ghost, Grimwald''s dead partner, states the world''s moral law: a man whose spirit never went out among his fellow men in
      life must wander after death in remorse, bound by what he did, and Grimwald is on the same path'
    anchors:
      '1': the dead partner tells him that the selfish dead wander in remorse, bound by their own life, and that he is heading for the same doom
      '0.5': a warning from the dead partner, but the doom not tied to how one lived, or not applied to Grimwald
      '0': missing, or the ghost is only a scare with no law behind it
    evidence:
    - - c02.p128
      - c02.p136
    - c02.p141
    - c02.p148
    - c02.p170
  - id: CR3
    item: 'Three spirits are announced as Grimwald''s one chance to escape that fate, each with its own domain: the spirit of the past shows his
      own earlier life, the spirit of the present how others keep this holiday, the spirit yet to come the time after his death'
    anchors:
      '1': three distinct spirits, introduced as his chance of escape, each showing its own time (his past, others' present holiday, the future
        after his death)
      '0.5': three spirits whose domains are confused or not told apart, or fewer than three, or no link to his chance of escape
      '0': missing
    evidence:
    - c02.p156
    - c02.p163
    - c03.p026
    - c04.p008
    - c05.p006
  - id: CR4
    item: Walter Pennock, Grimwald's poorly paid clerk, heads a poor but loving family whose frail child, Little Ned, is the life at stake
    anchors:
      '1': the underpaid clerk, his poor and loving family, and frail Little Ned as the child whose life is in question
      '0.5': the clerk or Little Ned present without the other, or Ned's frailty / the danger to him missing
      '0': missing
    evidence:
    - c02.p043
    - c04.p041
    - c04.p050
    - c04.p069
    - c04.p085
  - id: CR5
    item: 'The foretold future is conditional: the game makes clear that the deaths the visions foretell follow only if Grimwald keeps his present
      course, and that an altered life can change them'
    anchors:
      '1': the future is shown as what will happen if he stays as he is, and it is made clear that his change of conduct can alter it
      '0.5': the future is presented as open to change, but not linked to his conduct
      '0': missing, or the future is presented as fixed fate
    evidence:
    - c04.p071
    - c05.p153
    - c05.p162
    - c06.p004
    - c06.p070
  functions_playability:
  - id: FP1
    item: 'Setup before the haunting: the opening with the miser''s hardness comes first, and the dead partner''s warning then turns the coming
      visits into his chance to escape his fate, setting the story in motion'
    anchors:
      '1': an opening that establishes his hardness toward others is played first, and the warning that follows sets up the visits and what is
        at stake
      '0.5': the warning comes without a preceding opening, or the opening is followed by no warning that motivates what follows
      '0': 'no setup: the visions begin unmotivated'
    evidence:
    - - c02.p012
      - c02.p078
    - - c02.p128
      - c02.p165
  - id: FP2
    item: The three vision stages are gone through in the order past, present, future, with clear transitions, and each confronts the protagonist
      with what his conduct has cost him or others
    anchors:
      '1': three distinct stages played in this order with clear transitions, each bearing on his conduct
      '0.5': fewer stages, the order changed, the stages blur into one, or the stages are shown without any bearing on his conduct
      '0': no vision stages
    evidence:
    - - c03.p053
      - c03.p145
    - - c04.p041
      - c04.p129
    - - c05.p014
      - c05.p124
  - id: FP3
    item: The future stage builds to the revelation, at the grave, that the unmourned dead man is the protagonist himself; the revelation brings
      his resolve to change and ends the visions
    anchors:
      '1': the dead man's identity is kept open, then revealed as the protagonist at the grave, leading to his resolve and the end of the visions
      '0.5': the death or the grave shown, but with no build-up (identity known from the start) or with no resolve following from it
      '0': missing
    evidence:
    - - c05.p014
      - c05.p103
    - - c05.p141
      - c05.p166
  - id: FP4
    item: After waking, the protagonist makes amends to those he wronged, and the ending shows the foretold outcome changed (Little Ned alive),
      closing the story
    anchors:
      '1': amends to the people wronged at the start lead to an ending in which the foretold outcome is changed
      '0.5': a happy ending that ignores the people he wronged, or amends that change nothing that was foretold
      '0': no transformation or no ending
    evidence:
    - - c06.p001
      - c06.p004
    - c06.p029
    - c06.p042
    - c06.p058
    - c06.p069
    - c06.p070
  visual_presentation:
  - id: VP1
    cat: style
    item: 'The town''s look carries the turn: dark and gloomy on Christmas Eve, clear and bright on Christmas morning after his change'
    anchors:
      '1': both looks shown, and the contrast between them readable
      '0.5': one of the two looks, or no visible change between before and after
      '0': neither
    evidence:
    - c02.p010
    - c02.p066
    - c06.p012
  - id: VP2
    cat: key_moment
    item: Carrow's ghost appears as his dead partner bound by a chain
    anchors:
      '1': a recognisably ghostly partner bound by a chain
      '0.5': a ghost without the chain, or a chain without a recognisable ghost
      '0': missing
    evidence:
    - c02.p096
    - c02.p097
    - c02.p131
  - id: VP3
    cat: key_moment
    item: The spirit yet to come looks ominous and faceless
    anchors:
      '1': an ominous spirit whose face is never shown
      '0.5': an ominous spirit that shows a face, or a faceless figure that does not read as ominous
      '0': missing
    evidence:
    - - c05.p001
      - c05.p011
  - id: VP4
    cat: key_moment
    item: The grave with the protagonist's own name readable on it
    anchors:
      '1': a grave on which his own name can be read
      '0.5': a grave shown, but the name not readable or not clearly his
      '0': missing
    evidence:
    - c05.p150
    - c05.p155
play_suggestions:
  FP1:
  - 'play the opening: is it clear, before anything supernatural, how the miser treats the people around him?'
  - after the warning, is it clear what the visits are for and what is at stake?
  FP2:
  - 'go through the whole night: are the three stages distinct and in order past, present, future?'
  - 'in each stage: does what is shown bear on how he has treated people?'
  - 'try to skip ahead or go back: does the order still hold?'
  FP3:
  - in the future stage, is the dead man's identity left open before the grave?
  - 'at the grave: does the revelation lead to his resolve and end the visions?'
  FP4:
  - after waking, try to make amends to each person he wronged at the start
  - check whether the ending shows Little Ned alive and the clerk's family helped; ignore the amends and see what the ending does
  robustness:
  - 'leave a vision early or idle in it: does the story still move on or offer a way to continue?'
  - 'replay from the start: is the arc start to end coherent the second time?'
  - 'talk to or touch the figures in a vision: does anything break?'
