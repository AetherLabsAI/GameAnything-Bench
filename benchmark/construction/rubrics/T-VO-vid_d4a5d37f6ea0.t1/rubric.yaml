  - compare vehicle density on a freeway, the bridge and a suburban street during the same race
  - 'keep driving for several laps: does the freeway / bridge traffic stay moving?'
  FP3:
  - 'look for a dusk / night version of the place (or a day-night switch): are streets, tower windows and the bridge''s arches lit?'
  - compare the same spot by day and at night
