source_inventory:
- '00:10-00:14 dusk downtown skyline, blue-to-orange sky: a dense cluster of high-rises of clearly different heights (glass and stone towers,
  a few crowned / spire-topped towers rising above the rest, one tall slender spire tower at the left edge), lit windows coming on, low mid-rises
  and a building signed ''ON WILSHIRE'' in front, faint mountains on the horizon; the drone moves slowly so the towers shift against each other
  (parallax)'
- '00:14-00:20.9 daytime park lake: multi-jet fountain in the middle, white pedal boats moored at a boathouse on the left shore, a few small boats
  out on the water, grass banks lined with tall palms, green plant islands near the shore, houses on low hills around it, the downtown skyline
  small and distant on the horizon across the water; the drone flies forward over the lake'
- 00:21-00:22.9 daytime, raised view down a straight street of low commercial buildings, parking lots and a crosswalk (store sign 'CORNER'), the
  street leading straight to the downtown towers, which fill the horizon
- '00:23-00:26.9 night freeway interchange: time-lapse / long-exposure light trails (cyan, white, red) on many lanes, a curving elevated ramp
  looping over the mainline, a lit office block behind, palm silhouettes'
- '00:27-00:32.7 hazy daytime downtown: towers directly beside a sunken freeway with a looping ramp, a green rooftop / plaza and low office blocks
  between road and towers; the drone moves toward the towers'
- '00:32.7-00:43.9 pink-purple dusk: a long bridge (viaduct) carried by a repeated series of white arches with hanging cables, the arches lit
  from below, a pedestrian railing, dense car traffic with headlights on the deck, power pylons and the downtown skyline in silhouette behind;
  the drone first moves along the arches (arches occlude and reveal the skyline, 00:33-00:39), then rises to show the whole viaduct with its arches
  receding toward downtown (00:39.5-00:43.5)'
- '00:44-00:50.5 top-down daytime multilevel interchange: curved elevated ramps crossing over a sunken multi-lane freeway at different heights,
  long shadows of the ramps, many cars in both directions, tree-covered slopes between the roads, houses and a pink-roofed building at the edges;
  the camera turns / drifts'
- '00:51-00:58.5 top-down night downtown: rectangular blocks, intersections with zebra crosswalks, warm-lit streets, rooftops with rooftop gardens
  and a rooftop pool, few cars; the drone moves along a street'
- '00:58.6-01:05.9 late-day coast (second clip): a wide sand beach along the sea, mountains across the bay, a palm park with green lawns between
  beach and town, low colorful buildings (pink, teal, white) and a larger hotel-like block, parking; the drone moves slowly forward and down'
- '01:06.1-01:16.6 top-down suburb: near-identical single-family houses with tile roofs (terracotta and grey, some solar panels), many backyard
  pools, curving streets and a cul-de-sac, few cars, dry vegetation strips behind the lots; the drone drifts across'
- 01:17.1-01:24.1 low flight down a straight avenue lined on both sides with very tall fan palms, yellow center line, moderate traffic in both
  directions, mid-rise apartment buildings, a red-roofed building and a yellow-flowering tree ahead / beside
- '01:24.6-01:31.0 oblique view in golden light over a hillside neighborhood: larger houses with pools, winding roads following the slope, hedges
  and dense trees'
- 'presentation throughout: hard cuts between shots (a montage of separate places, no continuous route, no stated geography between shots); drone-logo
