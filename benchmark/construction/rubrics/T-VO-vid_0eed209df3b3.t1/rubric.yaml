rubric:
  content_realization:
  - id: CR1
    item: 'The game contains the three characters in their roles: a mouse who hides and lives inside the walls of the house, the house cat who
      hunts him, and a mouse exterminator with a bag of tools working on the cat''s side'
    anchors:
      '1': all three present and told apart, the exterminator recognisably a tool-carrying specialist allied with the cat and the mouse living
        in the walls
      '0.5': all three present but the exterminator's role (tool kit, ally of the cat) or the mouse's home in the walls is missing or unclear
      '0': a character is missing, or the sides are mixed up
    evidence:
    - - 03:06
      - 03:10
    - - 03:33
      - 03:41
  - id: CR2
    item: 'The house is built in two layers: rooms whose walls have a small mouse hole in the baseboard at floor level and a wall vent, both opening
      into a hidden passage that runs inside the walls'
    anchors:
      '1': the rooms, the baseboard mouse hole and the wall vent exist, and both openings lead into one hidden in-wall passage
      '0.5': the room and a hidden passage exist but only one opening leads into it, or the hole leads to a closed pocket rather than a passage
      '0': no hidden space behind the walls
    evidence:
    - - 03:06
      - 03:07
    - - 03:22
      - 03:25
    - - 03:42
      - 03:48
  - id: CR3
    item: 'The first confrontation is in the game with its cause: the pursuers force the baseboard at the mouse hole open, and the mouse strikes
      back from inside with a big hammer, hurting their paws'
    anchors:
      '1': the forced baseboard, the mouse's hammer strike from inside as the answer to it, and the pursuers' hurt paws all present
      '0.5': the confrontation present but the hammer counterattack or the injury is missing, or not linked to forcing the opening
      '0': missing
    evidence:
    - - 03:11
      - 03:32
  - id: CR4
    item: 'The escalation follows from that failure: the hurt exterminator takes a heavier mallet from his kit and hands it to the cat, and the
      two then split the job, the cat smashing the walls from outside while the exterminator works the wall vent and later turns up under the
      floor'
    anchors:
      '1': the heavier mallet from the kit after the failure, its hand-over to the cat, and the split of roles (cat on the walls from outside,
        exterminator at the vent / under the floor)
      '0.5': the mallet and the hand-over without the role split, or the role split without the hand-over, or the escalation not placed after
        the failed first attempt
      '0': missing, or the cat takes the mallet against the exterminator
    evidence:
    - - 03:33
      - 03:53
    - - 04:03
      - 04:09
  - id: CR5
    item: 'The outcome backfires on the hunters: after the wall smashing, the cat''s final blow, meant for the mouse, lands on his own ally, the
      exterminator coming up through the floor, and the mouse gets away unharmed'
    anchors:
      '1': the final blow hits the exterminator instead of the mouse and the mouse escapes
      '0.5': the exterminator ends hurt but not by the cat's blow, or the mouse's escape is missing
      '0': missing, or the mouse is caught
    evidence:
    - - 04:02
      - 04:13
  functions_playability:
  - id: FP1
    item: 'Two-layer space in play: the mouse character can enter the hidden passage inside the walls through the hole, move through it out of
      sight and come out elsewhere, while the pursuers cannot simply follow and must force their way in or act from outside'
    anchors:
      '1': the mouse enters, traverses and exits the hidden passage, and pursuer access is restricted (forcing openings or acting from outside)
      '0.5': a hole or hiding place exists but the mouse cannot move through it to another place, or the pursuers can freely follow inside
      '0': no hidden in-wall space that the mouse uses
    evidence:
    - - 03:06
      - 03:07
    - - 03:22
      - 03:25
    - - 03:47
      - 03:48
  - id: FP2
    item: 'First attempt in play: forcing the hole open can be done or triggered in play, it sets off the mouse''s counterattack from inside,
      and the failed attempt moves the story on to the next stage'
    anchors:
      '1': forcing the opening triggers the counterattack and the failure leads on to the next stage
      '0.5': the counterattack happens but not as a result of forcing the opening, or the failed attempt leads nowhere
      '0': missing, or it cannot be triggered
    evidence:
    - - 03:11
      - 03:32
  - id: FP3
    item: 'Escalation stage in play: after the failed first attempt the sequence moves into a new stage in which the cat, now holding the mallet,
      can attack the walls from outside while the mouse is inside, and this stage leads on to the climax'
    anchors:
      '1': the stage starts after the failure, the cat can act with the mallet on the walls from outside, and the stage leads on to the climax
      '0.5': the stage exists but is not tied to the failure (open from the start), or the cat cannot actually act with the mallet, or it does
        not lead on to the climax
      '0': no escalation stage in play
    evidence:
    - - 03:33
      - 03:41
    - - 03:52
      - 04:03
  - id: FP4
    item: 'Climax and end in play: through normal play the sequence reaches the climax, the final blow can be triggered and resolves the chase,
      and the sequence then reaches a clear end (or a way to continue) without soft-locking'
    anchors:
      '1': the climax is reachable through normal play, the final blow can be triggered and resolves it, and a clear end or continuation follows
      '0.5': the climax is reached only through workarounds (skipping, debug), or it triggers but the sequence then stalls without a clear end
      '0': the climax cannot be reached or triggered; the sequence just stops
    evidence:
    - - 04:02
      - 04:15
