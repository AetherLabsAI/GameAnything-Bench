# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-VO-vid_0eed209df3b3.t1
source_inventory:
- 'cast: Jerry (small brown mouse); Tom (grey cat); a black cat with a small blue cap working as a mouse exterminator, carrying a yellow bag labelled
  ''MOUSE EXTERMINATOR'' full of tools'
- 'setting: a house with pink walls, a lilac baseboard with a small arched mouse hole, a brick fireplace / white column in the background, blue
  floor; later a corner with a brass wall vent grille beside a pink-shaded lamp on a round wooden table; a living room with an armchair, a yellow
  lamp and purple curtains; a hidden wall interior of rough wooden boards with dark wires and insulators'
- 03:06-03:07 Jerry runs across the floor and into the mouse hole in the baseboard
- 03:08-03:10 the exterminator and Tom rush up to the hole; the exterminator sets down the bag and pulls out a long crowbar
- 03:11-03:15 the exterminator pries at the baseboard with the crowbar, Tom beside him; cracks appear on the wall pillar; the baseboard lifts
  away from the floor
- 03:16-03:20 under the lifted baseboard Jerry stands on the floorboards holding a big hammer (blue head, yellow handle) and hits the cats' feet;
  Tom yells in pain (03:16, 03:19), the exterminator grimaces (03:20)
- 03:21 the exterminator lunges at the hole in a burst of plaster debris
- '03:22-03:25 inside the wall: the exterminator''s arm reaches in through the mouse hole; Jerry rigs the hammer on a lever and pounds the arm
  repeatedly (motion blur at 03:23)'
- 03:26-03:27 outside, the exterminator crouched at the hole jerks back and leaps away in pain
- '03:28-03:32 close-up of his two paws: the fingertips swell up bright red and steam rises from them'
- 03:33-03:35 he digs in the exterminator bag and pulls out a big mallet (red head, yellow handle)
- 03:36-03:41 he carries the mallet to Tom; Tom ends up holding it; the exterminator puts a finger to his lips (shush), gestures instructions
  to Tom and walks off
- 03:42-03:46 the exterminator sneaks to the brass vent grille next to the lamp, pulls the grille off (it lies by the baseboard) and peers into
  the dark opening
- '03:47-03:48 inside the walls: Jerry looks out / runs along a wooden passage with wires'
- 03:49-03:50 the exterminator at the open vent, startled, clutching his head
- 03:51 a cloud of grey dust and debris bursts at the vent, streaking across the lamp
- 03:52-03:53 Tom sits by the mouse hole with the mallet; a dust trail runs along the baseboard; he swings and smashes a jagged hole in the wall
  (laths visible), plaster flies
- 03:54-03:58 a line of smashed holes runs along the walls through several rooms (pink, then green), past a table and a chandelier; a wall sconce
  is knocked off (03:58)
- 03:59-04:02 in the living room Tom keeps swinging the mallet at the wall, leaving long vertical cracks; Jerry steps out of the mouse hole behind
  him (04:02)
- 04:03 the exterminator's head pokes up at floor level next to Jerry; Tom raises the mallet high
- '04:04-04:06 Tom brings the mallet down on the floor: floorboards burst, dust rings spread; Jerry runs off'
- 04:07-04:09 paws come up out of the floor hole; the dazed exterminator climbs halfway out, eyes rolled, Tom beside him with the mallet
- 04:10-04:13 a tall bump rises out of the exterminator's head and lifts his cap up into the air; Tom watches
- 04:14-04:15 the picture darkens (fade); end of range
- 'audio: no speech in the range (transcript empty); per the material the soundtrack is music only; sound effects could not be verified by the
  drafter'
