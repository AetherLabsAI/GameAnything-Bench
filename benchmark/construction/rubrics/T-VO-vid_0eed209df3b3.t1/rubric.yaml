play_suggestions:
  FP1:
  - 'follow the mouse into the hole: is there a passage inside the wall, and does it come out somewhere else?'
  - 'try to walk into the passage as a pursuer: is it blocked without forcing it?'
  FP2:
  - 'trigger or watch the forced opening of the hole: does the counterattack happen as a result?'
  - check that the failed attempt leads on to the next stage
  FP3:
  - check that the mallet stage only opens after the failed first attempt
  - 'act with the mallet on the walls as the cat: does the stage respond and lead on to the climax?'
  FP4:
  - 'play to the end through normal play: can the final blow be reached and triggered?'
  - after the end, is there a clear outcome and a way to restart or continue?
  robustness:
  - skip or interrupt a stage (leave the area, wait) and see whether the sequence breaks or soft-locks
  - trigger the climax out of order if possible (e.g. smash the floor before the hand-over)
  - 'save and reload in the middle of the wall-smashing stage: is damage and the tool holder kept?'
