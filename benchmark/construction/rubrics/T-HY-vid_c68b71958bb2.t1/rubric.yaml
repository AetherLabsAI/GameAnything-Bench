rubric:
  content_realization:
  - id: CR1
    item: Two-eyes, the heroine, is despised and starved by her mother and her sisters One-eye and Three-eyes because she is the ordinary one
    anchors:
      '1': the mother and both sisters visibly reject and deprive her, and the game makes clear the reason is that she is ordinary among them
      '0.5': the family mistreats her but the reason (her being ordinary) is missing or different
      '0': no mistreated heroine in an eye-marked family
    evidence:
    - p001
  - id: CR2
    item: When she weeps, a wise woman gives Two-eyes a food charm that works through her magic animal, the goat she tends
    anchors:
      '1': the wise woman as the giver of the charm, and the goat the heroine tends as the magic animal it works through
      '0.5': the charm and the magic animal present but no helper gives the charm
      '0': no charm and no magic animal
    evidence:
    - - p001
      - p009
  - id: CR3
    item: 'Her secret is found out and lost: her untouched food makes the family suspicious, Three-eyes is sent to watch her, her song lulls only
      two of Three-eyes'' eyes so the third stays awake and sees the charm, and the mother then kills the animal'
    anchors:
      '1': suspicion, Three-eyes sent to watch, the third eye left awake as the cause of the discovery, and the animal killed as its consequence,
        in this order
      '0.5': the animal is killed but the discovery chain is missing or wrong
      '0': no discovery and no loss of the animal
    evidence:
    - - p010
      - p033
  - id: CR4
    item: 'The loss turns into her rescue: the animal''s remains, buried before the house door on the wise woman''s advice, grow the magic tree,
      and the tree is what shows the knight she is the one, so he takes her away and marries her'
    anchors:
      '1': the chain remains -> tree -> the tree proves to the knight that she is the one -> he takes her away
      '0.5': the tree and the knight both present but not how one leads to the other
      '0': neither the tree from the remains nor the knight's rescue
    evidence:
    - p034
    - p035
    - p036
  - id: CR5
    item: 'The ending reverses the roles: the sisters, fallen into poverty, come to her castle as beggars, and she takes them in kindly, so they
      repent'
    anchors:
      '1': the sisters' return as beggars and her kindness leading to their repentance
      '0.5': a happy ending for her without the sisters' return, or the return without her kindness
      '0': no ending, or a different one
    evidence:
    - p037
  - id: CR6
    cross: true
    item: 'The family is introduced the way the clip introduces its gifted household: a night rite before the gathered household whose magic wakes
      the home (clip), then the relatives shown each with their own trait, the sisters'' single or third eye (text), with the heroine set apart
      as the one without (text)'
    anchors:
      '1': an opening rite that transforms the home, followed by a presentation of the relatives with their distinct traits in which the heroine
        stands apart as the ordinary one
      '0.5': the traits and the ordinary heroine presented without a rite, or a rite without the presentation of the relatives
      '0': neither
    evidence:
    - - 00:01
      - 00:14
    - - 00:21
      - '00:42.5'
    - p001
  functions_playability:
  - id: FP1
    item: 'The story can be played from start to end: each of its situations is reached through the player''s own play in the text''s order, each
      following from the one before, up to a clear ending'
    anchors:
      '1': the situations are reached in order through play, each caused by the one before, and the story ends
      '0.5': the story can be played but situations can be skipped or reached out of order, are disconnected, or it stops before the ending
      '0': no playable story progression, or a different story
    evidence:
    - - p001
      - p037
  - id: FP2
    item: 'The food charm works in play: used at the magic animal, one charm sets out food for the heroine and the other clears it away'
    anchors:
      '1': the player performs the charm and the food visibly appears and is cleared
      '0.5': the food appears only in a cut-scene with no player action, or only one half of the charm works
      '0': the charm does not work
    evidence:
    - - p001
      - p009
  - id: FP3
    item: 'The magic tree yields to the heroine alone in play: the other characters'' attempts at its fruit or branches fail, while hers succeed'
    anchors:
      '1': the player harvests the tree and the others visibly fail at it
      '0.5': the tree can be harvested but nobody is seen to fail, or it only happens in a cut-scene with no player action
      '0': no working tree
    evidence:
    - p035
    - p036
  visual_presentation:
  - id: VP1
    cat: key_moment
    keyframes:
    - '00:04.0'
    - '00:08.5'
    - '00:09.5'
    item: 'The rite''s magic looks like the clip''s: a warm golden glow that spreads from the rite and lights up the home'
    anchors:
      '1': a recognisable spreading golden light reaching the house
      '0.5': a light effect that does not spread or does not reach the home
      '0': no visible magic
    evidence:
    - - 00:04
      - 00:11
  - id: VP2
    cat: style
    keyframes:
