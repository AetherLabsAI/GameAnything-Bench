    - '00:16.5'
    item: 'The home and village have the look of the images'' colonial architecture: an arcaded courtyard under clay-tile roofs, brightly painted
      walls and balconies hung with flowers'
    anchors:
      '1': 'the setting reads as this architecture as a whole: arcades or a courtyard together with clay-tile roofs and colourful facades with
        balconies or flowers'
      '0.5': only isolated elements of it, and the setting otherwise reads as a generic farm or town
      '0': unrelated look
    evidence:
    - img01
    - img02
    - img03
    - img04
    - img06
    - - 00:11
      - 00:17
  - id: VP3
    cat: key_moment
    item: The magic tree before the house door is set apart by its silver leaves and golden fruit
    anchors:
      '1': a distinct silver-and-gold tree at the house
      '0.5': a special tree that does not look precious or is not at the house
      '0': no tree
    evidence:
    - p035
  - id: VP4
    cat: key_moment
    keyframes:
    - '00:46.0'
    - '00:47.5'
    - '00:54.0'
    item: The consolation is shown as an intimate, warmly lit talk in which the heroine's sadness and the comfort she receives are readable
    anchors:
      '1': a close, warm-lit consolation with her distress and the comfort both visible
      '0.5': the talk happens but the emotion is not readable, or it is shown only as plain text
      '0': no consolation scene
    evidence:
    - - 00:46
      - '00:55.5'
    - p001
    - p034
play_suggestions:
  FP1:
  - 'play from the start: note each story situation and what caused it'
  - 'try to skip ahead (go to the tree spot or meet the knight early): does the order hold?'
  - 'finish the story: is the sisters'' return and her kindness shown?'
  FP2:
  - 'go to the goat and use the charm: does food appear, and does the second charm clear it?'
  - use the charm while a watcher is awake and asleep
  FP3:
  - watch the other characters try the tree, then try it as the heroine
  robustness:
  - leave the area during the spying or the knight's visit and come back
  - 'talk to every family member at each stage: do their attitudes fit the story so far?'
  - 'save and reload mid-story: does progress hold?'
