- 'text p001: a woman''s daughters One-eye (one eye in her forehead), Two-eyes (two eyes like other people) and Three-eyes (a third eye in her
  forehead); mother and sisters hate Two-eyes for being ordinary, starve and mistreat her; tending the goat she weeps; a wise woman appears and
  asks why'
- 'text p001-p009: the wise woman teaches a rhyme: spoken to the goat it sets a table of food, a second rhyme takes it away; Two-eyes tries it,
  eats and is glad'
- 'text p010-p016: Two-eyes leaves her home scraps untouched; the sisters grow suspicious and send One-eye to the pasture; Two-eyes sings her
  to sleep with a song, eats in secret, wakes her; One-eye cannot report anything'
- 'text p017-p033: Three-eyes is sent; Two-eyes'' song by mistake names only two of her eyes, so the third stays awake and sees the charm; Three-eyes
  tells the mother, who kills the goat out of envy'
- 'text p034: Two-eyes weeps again; the wise woman returns and tells her to ask for the goat''s entrails and bury them before the house door;
  the sisters laugh and give them'
- 'text p035: next morning a tree with silver leaves and golden fruit stands there; the mother, One-eye and Three-eyes cannot pick the fruit,
  it escapes them; it comes into Two-eyes'' hand; the family takes the apples and treats her worse'
- 'text p036: a knight comes; the sisters hide Two-eyes under a barrel and claim the tree but cannot break off a branch; Two-eyes rolls golden
  apples to his feet; he calls her out, she breaks a branch with ease, asks him to free her from hunger and want; he takes her to his father''s
  castle and marries her; the tree vanishes and reappears before her window'
- 'text p037: long after, two poor beggar women come to her castle: her sisters, fallen into poverty; she welcomes and cares for them, and they
  repent'
