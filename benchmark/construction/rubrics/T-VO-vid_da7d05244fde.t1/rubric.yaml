rubric:
  content_realization:
  - id: CR1
    item: 'The chain and its head: the player controls the head at the free end of a chain of cubes it has laid; the head may be the player
      themself or a lead piece the player controls, told apart from the laid cubes'
    anchors:
      '1': a chain of laid cubes whose free end is the player themself or a distinct lead piece that the player controls
      '0.5': a chain of cubes exists, but a lead piece at its free end is not told apart from the laid cubes, or the chain is not tied to what
        the player controls
      '0': no chain of laid cubes
    evidence:
    - - 00:07
      - 00:12
    - - 00:31
      - 00:36
    - - 01:24
      - 01:28
  - id: CR2
    item: 'Pickups: collectable pickups are placed in the levels, recognisable as items set apart from the terrain and the chain'
    anchors:
      '1': pickups placed in the level(s), clearly recognisable as collectables
      '0.5': pickups exist only in one spot or are hard to tell from terrain / decoration
      '0': no pickups in the levels
    evidence:
    - - 00:27
      - 00:29
    - - 00:31
      - 00:34
  - id: CR3
    item: 'The black ink void: black void areas on the ground and/or black ink creatures are present in the levels, clearly set apart from the
      normal terrain'
    anchors:
      '1': black ink void patches or ink creatures placed in the level(s), clearly distinct from the terrain
      '0.5': a hazard area exists but does not read as a black void (e.g. ordinary lava or a generic danger zone)
      '0': no void in the game
    evidence:
    - - 01:23
      - 01:25
    - - 01:24
      - 01:28
  - id: CR4
    item: 'Level targets set in height: the levels are built on several height levels (terraces, ledges, walls) and hold targets placed up on
      a ledge, at the end of a long route, or as an object to wind round or build into'
    anchors:
      '1': ground with several height levels and at least one target placed up high, far off or as an object to surround / enter
      '0.5': targets exist but all sit on one flat level next to the start, or the levels have height but no target
      '0': no target in the levels
    evidence:
    - - 00:12
      - 00:17
    - - 00:47
      - 00:50
    - - 00:55
      - 00:57
    - - 01:18
      - 01:21
  functions_playability:
  - id: FP1
    item: 'Laying the chain: moving the head (the player or the lead piece) places one block per step that stays where it was placed, so the
      chain is the travelled path and can be closed into a loop'
    anchors:
      '1': blocks are placed as the player moves, stay fixed, and follow the route including loops and turns
      '0.5': blocks are placed but drift, follow the head like a snake, or gaps appear
      '0': no chain
    evidence:
    - - 00:07
      - 00:10
    - - 00:34
      - 00:36
  - id: FP2
    item: 'Building upward: the chain can rise as a column, letting the player climb onto a higher ledge that cannot be reached on the flat'
    anchors:
      '1': the player builds up and reaches a higher spot with the chain
      '0.5': the chain goes up only one step, or the player cannot get from the column onto the higher spot
      '0': flat only
    evidence:
    - - 00:10
      - 00:12
    - - 00:14
      - 00:17
  - id: FP3
    item: 'Cube budget: the number of blocks in use is tracked against a maximum, rises with every placed block and falls when the chain gets
      shorter, so freed blocks can be placed again'
    anchors:
      '1': the in-use count stays correct against a maximum, rising per placed block and falling when the chain shortens
      '0.5': a count without a maximum, or a count that never falls
      '0': no budget
    evidence:
    - - 00:07
      - 00:10
    - - 00:55
      - 00:59
  - id: FP4
    item: 'Pickups extend the budget: touching a pickup with the chain consumes it and raises the maximum'
    anchors:
      '1': pickup consumed and maximum raised
      '0.5': pickup consumed, but the maximum does not change (e.g. a separate score)
      '0': touching a pickup with the chain does nothing
    evidence:
    - - 00:27
      - 00:29
  - id: FP5
    item: 'Void hazard: the void destroys chain blocks it touches and lowers the maximum, while the rest of the chain stays in place'
    anchors:
      '1': blocks are destroyed on contact, the maximum drops, and the untouched part of the chain remains
      '0.5': the void resets the whole chain, or does not affect the budget
      '0': the void has no effect on the chain
    evidence:
    - - 01:23
      - 01:25
    - - 01:24
      - 01:28
  - id: FP6
    item: 'A goal that needs the chain: reaching or surrounding a target with the chain triggers it and visibly changes something, giving play
      a purpose'
    anchors:
      '1': the chain reaching / surrounding a target makes it react visibly, so the player has a clear objective
      '0.5': the target reacts without the chain (e.g. to the player alone), or its reaction is hard to notice
      '0': nothing reacts; free building only
    evidence:
    - - 00:47
      - 00:50
    - - 00:55
      - 00:57
    - - 01:18
      - 01:21
  visual_presentation:
  - id: VP1
    cat: spatial
    keyframes:
    - '00:09.0'
    - '00:24.5'
    - '01:03.9'
    item: 'Play space: compact plots that read as small floating islands in a bright sky, with other islands visible in the distance'
    anchors:
      '1': floating plot(s) with a sky backdrop and other islands in view
      '0.5': a bounded play area but on ordinary ground or without the floating-island read
      '0': an unrelated open world
    evidence:
    - - 00:07
      - 00:10
    - - 00:24
      - 00:26
    - - 01:03
      - 01:05
  - id: VP2
    cat: style
    keyframes:
    - '00:09.0'
    - '00:11.5'
    - '01:27.4'
    item: 'The chain''s look: an observable trail of placed blocks / segments left behind the player, winding over and stacking up from the
      terrain so it stands out from the ground'
    anchors:
      '1': a visible trail of placed blocks / segments behind the player, standing out from the ground and reading as one chain
      '0.5': blocks present but blending into the terrain, or not readable as one continuous trail
      '0': no visible chain
    evidence:
    - - 00:07
      - 00:12
    - - 01:24
      - 01:28
  - id: VP3
    cat: presentation
    keyframes:
    - '00:08.5'
    - '00:27.5'
    - '00:56.4'
    item: 'Budget readout: a corner HUD with in-use / maximum and a +/- delta always visible during play, and a number popup at the spot where
      a pickup is collected'
    anchors:
      '1': a constantly visible in-use / maximum readout with change feedback, and a popup at the pickup
      '0.5': the readout only on demand (menu, chat line) or no feedback at the pickup
      '0': the budget is not shown
    evidence:
    - - 00:07
      - 00:10
    - - 00:27
      - 00:29
    - - 00:55
      - 00:57
play_suggestions:
  FP1:
  - 'walk a square back to the start: is it a closed ring of fixed blocks?'
  - 'walk, then look back: did any block move or vanish?'
  FP2:
  - find a ledge higher than a jump and build up to it
  - 'try to reach that ledge without the chain (counter-case: it should not be reachable)'
  - 'build a tall column and step off: what happens to the chain?'
  FP3:
  - count placed blocks against the readout or game state
  - 'shorten the chain by whatever means the build offers (e.g. stepping back), then extend again: does the count stay correct?'
  - 'try to extend past the maximum (counter-case: the maximum should stop you)'
  FP4:
  - 'collect one pickup: note the maximum before and after'
  - try to collect a pickup with the player only, not the chain
  FP5:
  - 'lay the chain into a void area: which blocks go, and does the maximum drop?'
  - 'after a loss, keep building: is play still possible?'
  FP6:
  - try to reach the target without building the chain
  - 'reach it with the chain: what changes?'
  robustness:
  - cross your own chain or build into a wall
  - shorten to zero and start again
  - 'leave and rejoin mid-chain: is the chain and the count kept?'
v4_map:
  U1: FP1 (trace mechanism); existence of chain and lead piece -> CR1
  U2: FP2
  U3: FP3
  U4: CR2 (pickups exist) + FP4 (raise the maximum)
  U5: CR3 (void exists) + FP5 (destroys cubes, lowers maximum)
  U6: 'CR1 (lead piece vs laid cubes) + VP2 (one colour); per-area colours dropped: peripheral (colour variety across zones)'
  U7: CR4 (targets placed up high / far off / as objects to surround) + FP6 (they react to the chain)
  FP1: FP1
  FP2: FP2 (0.5 anchor no longer scores whether a ledge exists; that is CR4)
  FP3: FP3
  FP4: FP4 + CR2 (existence of pickups split off)
  FP5: FP5 + CR3 (existence of the void split off)
  FP6: FP6 + CR4 (target placement split off)
  FP7: 'removed: editing request (level time limit), moved to editing_seed.yaml (curator decision 2026-11-05)'
  VP1: VP1 (floating-island look); terraces and ledges at several heights -> CR4
  VP2: VP2
  VP3: VP3
