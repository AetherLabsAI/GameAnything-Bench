rubric:
  content_realization:
  - id: CR1
    item: The game contains the heroine as a good girl kept as the household drudge by her stepmother and two stepsisters, who go to the ball
      and leave her behind
    anchors:
      '1': the heroine, a stepmother and two stepsisters present, the stepfamily treating her as their servant and going to the ball without her
      '0.5': the stepfamily present but their role unclear (no mistreatment shown, or not the ones who leave her behind)
      '0': no stepfamily, or the heroine not mistreated
    evidence:
    - - p001
      - p003
    - p011
    - p012
  - id: CR2
    cross: true
    item: The heroine's magical helper is the fairy godmother of the text in the form of the clip's pointed-hat woman with a wand, and she transforms
      the heroine for the ball, giving her a carriage, a gown and glass slippers
    anchors:
      '1': a pointed-hat wand woman in the role of the godmother, who provides the carriage, the gown and the glass slippers that send the heroine
        to the ball
      '0.5': a godmother who transforms the heroine but without the clip's pointed-hat wand figure, or the transformation missing one of carriage,
        gown or slippers
      '0': no helper or no transformation
    evidence:
    - - '00:09.2'
      - '00:14.7'
    - - '00:16.7'
      - '00:18.2'
    - - p015
      - p027
  - id: CR3
    item: At the ball the prince receives the heroine as an unknown princess and dances with her, while her stepsisters there do not recognise
      her
    anchors:
      '1': the prince at the ball singling out and dancing with the heroine, and the stepsisters present without knowing who she is
      '0.5': the prince and the heroine together at the ball, but the stepsisters absent or knowing her
      '0': no ball with the prince
    evidence:
    - - p028
      - p033
    - - '00:34.5'
      - '00:35.0'
    - - '00:41.0'
      - '00:41.5'
  - id: CR4
    item: 'Turning point: absorbed in the prince, the heroine forgets the time, so in her flight at midnight she leaves one glass slipper behind,
      the prince keeps it, and she keeps the matching one'
    anchors:
      '1': her time with the prince shown as the reason she misses the deadline, and a slipper left at the palace and held by the prince afterwards,
        with the heroine still having the other
      '0.5': the slipper left with the prince but the missed deadline given no cause, or the slipper not ending up with the prince, or the heroine
        not keeping the matching one
      '0': no slipper left behind
    evidence:
    - - p042
      - p046
    - - '00:40.0'
      - '00:40.5'
  - id: CR5
    item: 'The ending is a reconciliation: the stepsisters recognise the heroine and beg her pardon, she forgives them, and she marries the prince'
    anchors:
      '1': the sisters' recognition and plea, her forgiveness, and the marriage
      '0.5': the marriage only, or forgiveness without the recognition and plea that prompt it
      '0': no ending, or a revenge ending
    evidence:
    - - p052
      - p054
  functions_playability:
  - id: FP1
    item: The story is played through the text's key situations in its order (left behind at home, the godmother's transformation, the ball with
      the prince, the midnight flight losing a slipper, the fitting, the forgiving ending) to a clear ending
    anchors:
      '1': the situations reached in the text's order to a clear ending
      '0.5': the order holds but key situations are skipped or the ending is missing
      '0': no progression, or the situations out of order
    evidence:
