play_suggestions:
  FP1:
  - 'play from the start to the end: note each situation and the order they come in'
  - try to reach the ball before the transformation, or the fitting before the ball
  FP2:
  - stay at the ball and watch how the time to midnight is shown
  - 'leave before midnight once, then stay past it: does the magic end and the flight follow?'
  FP3:
  - 'watch the slipper search: do others try it before the heroine?'
  - check that the fit reveals her and leads on to the ending
  robustness:
  - leave the ball area at once after arriving
  - 'skip or rush the dialogue during the transformation: is the midnight limit still known?'
  - 'save and reload during the ball: is the time kept?'
