instructions_meta:
  requirement_groups:
    riding and jumping:
    - CR1
    - FP1
    - FP2
    tricks on obstacles:
    - FP3
    - FP4
    - VP2
    complete attempts:
    - FP5
    skate spot and presentation:
    - CR2
    - VP1
    - VP3
  explicit_requirements:
  - type: keep
    text: I really want to keep the rail grinds, where you jump onto a rail with the board, slide along it and come off at its end.
    covers:
    - FP3
  - type: specify
    text: A trick should only count as done like in the clip, when you land back on the board and roll away without stopping.
    covers:
    - FP5
rubric:
  content_realization:
  - id: CR1
    item: 'The player rides a skateboard: the board is a distinct object under the rider''s feet while moving'
    anchors:
      '1': the player character stands on a visible board that stays under the feet while moving
      '0.5': skating is implied (a speed buff, a skating pose or an item) but no board is visible under the rider
      '0': no board; the player runs or walks
    evidence:
    - - 00:09
      - 00:17
    - - 00:30
      - 00:31
    - - 04:15
      - 04:16
  - id: CR2
    item: The skate spot contains a stair set from an upper to a lower level with a handrail running parallel down it from top to bottom, and
      open flat ground at the top for the run-up and at the bottom for the landing
    anchors:
      '1': stairs between two levels, a rail following them from the top to the bottom, and open ground at both ends
      '0.5': stairs and a rail exist, but the rail does not follow the stairs from top to bottom, or there is no open ground at one end
      '0': no stair set with a rail
    evidence:
    - - 00:07
      - 00:08
    - - 00:22
      - 00:28
    - - 04:07
      - 04:12
  functions_playability:
  - id: FP1
    item: 'Board riding: the player pushes to gain speed and rolls on the board, keeping that momentum while coasting so it carries into an obstacle'
    anchors:
      '1': speed builds by pushing and is kept while rolling, so a run-up toward an obstacle is possible
      '0.5': movement exists but is plain walking-speed movement with no build-up or momentum
      '0': no board riding
    evidence:
    - - 00:09
      - 00:12
    - - 00:17
      - 00:21
  - id: FP2
    item: 'Jump with the board: the player can jump with the board staying under the feet, including off the top of a stair set down to the lower
      level'
    anchors:
      '1': a jump that takes the board along and can carry the player from the top of the stairs down to the lower level
      '0.5': a jump exists, but the board is left behind, or the player cannot get down the stairs with it (stuck at the edge)
      '0': no jump
    evidence:
    - - 00:07
      - 00:09
    - - 00:21
      - 00:22
  - id: FP3
    item: 'Grinding: jumping onto a rail attaches the player to it, the player slides along it (down its slope on an inclined rail) and leaves
      at its end onto the ground below without falling through or getting stuck'
    anchors:
      '1': attach, slide along the rail's direction and exit at the end onto the ground, on an inclined rail
      '0.5': the player can stand or move on the rail, but there is no slide along it, or the exit leaves the player stuck / falling through
      '0': rails cannot be ridden
    evidence:
    - - 00:23
      - 00:28
    - - 00:30
      - 00:33
    - - 04:07
      - 04:10
    - - 04:16
      - 04:18
  - id: FP4
    item: 'Flip trick: while airborne the player can make the board flip under the rider and end up back on it'
    anchors:
      '1': a distinct board-flip action in which the board visibly rotates separately from the rider and comes back under the feet, usable on
        flat ground and off an obstacle
      '0.5': the rotation is partial or unclear, the rider does not end up on the board, or the flip works only in one place
      '0': no flip trick
    evidence:
    - - 00:07
      - 00:08
    - - 00:13
      - 00:16
    - - 00:34
      - 00:36
  - id: FP5
    item: 'One continuous line: run-up, trick at the obstacle and a landing back on the board that rides away link without a stop, cut or loss
      of control, and the landed trick is clearly the end of the attempt'
    anchors:
      '1': approach, trick and ride-away play out as one uninterrupted run, the rider lands on the board and keeps control rolling away
      '0.5': the parts work but are separated (e.g. the player stops dead on landing, lands off the board, or control is lost for a while)
      '0': tricks cannot be linked into a run
    evidence:
    - - 00:08
      - 00:09
    - - 00:18
      - 00:22
    - - 00:23
      - 00:28
    - - 00:30
      - 00:33
    - - 00:36
      - 00:38
    - - 04:15
      - 04:20
  visual_presentation:
  - id: VP1
    cat: spatial
    keyframes:
    - '00:22.5'
    - '04:10.2'
    - '04:07.2'
    item: 'The play space looks like a street-skate stair set: a run of hard steps with a thin metal handrail raised above them'
    anchors:
      '1': compared with the keyframes, the spot is recognisable as steps with a thin bar-like handrail raised above them
      '0.5': stairs and a rail are there, but the rail reads as a solid wall, ledge or floating platform rather than a thin raised bar
      '0': the obstacle does not look like stairs with a handrail
    evidence:
    - - 00:22
      - 00:28
    - - 04:07
      - 04:12
  - id: VP2
    cat: key_moment
    keyframes:
    - '00:25.0'
    - '04:08.7'
    - '04:11.2'
    item: 'The grind as seen: the rider on the board, the board visibly on top of the rail, the stairs running down below'
    anchors:
      '1': a recognisable rider-on-board-on-rail look above the stairs
      '0.5': the rider is on the rail but without the board under the feet, the rider seems to float beside rather than on the rail, or the stairs
        are not visible
      '0': none
    evidence:
    - - 00:24
      - 00:26
    - - 04:08
      - 04:09
    - - 04:11
      - 04:12
  - id: VP3
    cat: presentation
    keyframes:
    - '00:23.5'
    - '04:10.7'
    item: 'Framing of the attempt: the view keeps the rider, the obstacle and the landing area in frame together, so the whole attempt from top
      to bottom can be followed'
    anchors:
      '1': rider, rail and landing visible together through the whole attempt
      '0.5': the rider is followed but the rail or the landing is off-screen for part of the attempt
      '0': the attempt cannot be followed on screen
    evidence:
    - - 00:22
      - 00:28
    - - 04:10
      - 04:12
    - - 04:18
      - 04:20
play_suggestions:
  FP1:
  - 'push a few times on flat ground, then stop pushing: does speed build and then carry on?'
  - 'ride toward the stairs from a distance and from a standstill: does the run-up matter?'
  - 'steer while rolling: can the player line up with the rail?'
  FP2:
  - 'jump in place and while rolling: does the board stay under the rider?'
  - 'jump down the stair set without touching the rail: does the ride continue at the bottom?'
  FP3:
  - jump onto the inclined rail from the top and ride it to the end
  - jump onto the rail halfway down, and onto a flat rail if there is one
  - 'jump next to the rail (miss it): does the player attach anyway?'
  FP4:
  - flip on flat ground, then off the stairs, then over a rail
  - 'trigger a flip just before touching the ground: what happens?'
  FP5:
  - 'run a full line: push, grind the rail, land, keep riding to the next obstacle'
  - 'land at an awkward angle or mid-flip: is there a visible failure, or does the game silently accept it?'
  robustness:
  - after landing, go back to the top and repeat the same rail five times
  - get off the board at the bottom and try to climb the stairs
  - ride off the side of the rail mid-grind
  - approach the rail from the bottom and try to grind upward
  - stand still on the rail
  - ride into the hedges / planters and the walls at full speed
  - jump repeatedly on the stairs and at the rail ends to look for getting stuck or falling through the ground
