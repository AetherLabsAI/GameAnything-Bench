rubric:
  content_realization:
  - id: CR1
    item: The game contains a large enclosed corral whose inner wall is a yielding lining along its whole edge, the surface animals are pinned
      against, with a gate through which a finished animal is let out
    anchors:
      '1': a closed corral whose wall all along the edge has a yielding / padded lining meant for pinning, and a gate in it
      '0.5': a corral with a gate, but its wall is an ordinary fence with no lining that gives, or the lining covers only a small part of the
        edge
      '0': no recognisable corral
    evidence:
    - c11.p007
    - c11.p008
    - c11.p011
  - id: CR2
    item: The game contains a herd of cattle held in its own area of the corral, set apart from the open track along the wall, from which single
      animals are taken
    anchors:
      '1': several cattle kept together in a separated holding area inside the corral (fenced off or clearly marked), with the run track along
        the wall left free
      '0.5': a herd exists, but it is not held in an area of its own, or it is outside the corral with no link to the runs
      '0': no herd; single animals simply appear
    evidence:
    - c11.p007
    - c11.p008
    - c11.p010
  - id: CR3
    item: The game contains a long, stout bar, a structure of its own beside the corral, as the place of the rail contest
    anchors:
      '1': a long, solid bar or rail outside the corral that riders can line up their horses at
      '0.5': a bar exists, but it is part of the corral fence or too short for two sides to engage at it
      '0': no bar
    evidence:
    - c11.p007
    - c11.p014
  - id: CR4
    item: 'The pin-and-turn game has two complementary rider roles working one animal: one rider pins it against the wall, the partner pushes
      its hindquarters to turn it'
    anchors:
      '1': two riders per run (the player as one, the other a partner), one of them the pinning rider and the other the one who pushes the rear
        to turn the animal
      '0.5': two riders take part, but without distinct pin / push roles, or the player works the animal alone
      '0': no pair of riders
    evidence:
    - c11.p010
    - c11.p011
  functions_playability:
  - id: FP1
    item: One animal is cut out of the herd and driven round the edge of the enclosure; the animal moves on its own and heads back toward the
      herd
    anchors:
      '1': a single animal is separated from the herd and driven along the enclosure's edge by the riders; it has its own movement and is drawn
        toward the herd
      '0.5': an animal is chased, but it is not cut from the herd, or it follows a fixed path regardless of the riders
      '0': no animal-driving play
    evidence:
    - c11.p008
    - c11.p010
  - id: FP2
    item: Charging the animal against the enclosure wall pins and stops it, and pushing its hindquarters turns it back the other way, after which
      it can be driven again
    anchors:
      '1': a pin against the wall stops the running animal, a push on its rear turns it around, and play continues with the turned animal
      '0.5': the animal can be stopped or turned, but not by pinning against the wall, or the turn does not follow from the push
      '0': no pin or turn
    evidence:
    - c11.p010
    - c11.p012
  - id: FP3
    item: 'Pinning depends on timing and position: a charge that comes too late or catches the animal too far back fails, and the animal escapes
      back to the herd without the run being completed'
    anchors:
      '1': a mistimed or badly placed charge visibly fails and the animal returns to the herd, so the run is not completed
      '0.5': pins can fail, but the failure does not depend on timing / position, or has no consequence
      '0': every attempt succeeds automatically
    evidence:
    - c11.p011
  - id: FP4
    item: A run is completed when the animal has been turned three times; then the gate opens, the animal is let out, and another run can begin
    anchors:
      '1': the third turn completes the run, the gate opens and the animal leaves through it, and a further run is possible
      '0.5': runs end, but not after three turns, or the animal is not let out through the gate, or play stops after one run
      '0': no run structure or end
    evidence:
    - c11.p010
    - c11.p011
  - id: FP5
    item: 'Rail contest: two sides push horse against horse at the bar, without touching the opponent''s horse, gaining ground gradually until
      one forces the other off and breaks through along the bar'
    anchors:
      '1': a head-to-head push at the bar in which force is applied only horse against horse, position shifts gradually with sustained effort,
        and the contest ends when one side breaks through along the bar
      '0.5': a pushing contest exists, but it is decided instantly or by chance, the no-touching restriction is not respected, or it is not played
        at the bar
      '0': no rail contest
    evidence:
    - c11.p014
  visual_presentation:
  - id: VP1
    cat: spatial
    item: 'The corral''s wall visibly reads as a lined pinning surface: its inner lining looks like a layer of its own, different from an ordinary
      fence'
    anchors:
      '1': the lining is visible as its own padded / springy-looking layer on the inside of the wall, clearly told apart from the fence behind
        it
      '0.5': a lining is present, but it hardly differs in look from the fence
      '0': the wall looks like a plain fence or wall
    evidence:
    - c11.p007
    - c11.p010
  - id: VP2
    cat: key_moment
    item: 'The pin looks like an impact of its own: the horse visibly crashes into the running animal and jams it against the lining'
    anchors:
      '1': 'the moment reads as a collision: the horse drives bodily into the animal and the animal is seen jammed between horse and lining'
      '0.5': the animal is seen at the wall, but no contact between horse and animal is visible (it just halts there)
      '0': the pin cannot be seen as a moment of its own
    evidence:
    - c11.p011
    - c11.p012
play_suggestions:
  FP1:
  - 'start a run: is one animal separated from the others, and does it run on its own?'
  - 'stop chasing mid-run: does the animal drift back toward the herd?'
  FP2:
  - 'charge the animal in the open, away from the wall: does it still stop (it should not pin)?'
  - 'pin it against the wall, then push its rear: does it turn and run the other way?'
  FP3:
  - 'charge deliberately late, well behind the animal: does it escape back to the herd?'
  - compare a well-timed charge with a late one on the same stretch of wall
  FP4:
  - 'complete a run: does it end after the third turn, and does the gate open to let the animal out?'
  - 'after a completed run and after an escape: can another run start?'
  FP5:
  - 'push steadily against the opponent: does position change gradually?'
  - 'try to touch or strike the opponent''s horse directly: is it prevented or penalised?'
  - 'play until the end: does one side break through along the bar?'
  robustness:
  - 'ride into a gate or corner with the animal: does it get stuck or leave the enclosure unintentionally?'
  - fail several runs in a row, then restart
  - leave the rail contest mid-push and come back
