# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-TO-txt_4cebd9f709f6.e3
source_inventory:
- 'c10.p013-c10.p014: the narrator visits a cattle ranch in Parana (Brazil) run by an old friend; American foreman and Western hands; a ride over
  rolling country'
- 'c10.p015-c10.p017: shy Indians nearby; climate, ticks, cattle dipping; upgrading native cattle, pigs and horses with imported breeding stock'
- 'c10.p018-c10.p019: the twenty-mile ride: flat-top pines, flowers, a prairie deer, armadillo burrows, birds; the evening canter back'
- 'c11.p001-c11.p002: crossing the Andes into Chile by rail: barren pass, then lake, gorges and the fertile lowland valleys'
- 'c11.p003-c11.p004: a day at a great ranch near Santiago; hosts summon several hundred riders to a rondeo (round-up and sports); the huasos
  as a pastoral horse-riding class'
- 'c11.p005-c11.p006: huasos arriving on stocky native horses; mantas, hats, big-rowelled spurs, carved stirrups; their ease in the saddle; family
  parties'
- 'c11.p007-c11.p008: the setting: a pen full of cattle, a long stout hitching bar of tree trunks, a big corral lined with poles into a springy
  wall (needed for jamming cattle against it), gates at opposite ends, a short crescent fence near one gate separating worked from unworked stock;
  about thirty riders drive a mob of tame graded cattle in'
- 'c11.p009: gentry ride alongside the huasos; a ranchman and his son are the best pair'
- 'c11.p010: the main feat: two riders cut a steer from the bunch, race it round the corral edge past the far gate and back, one behind on the
  inside, one outside abreast; the outside rider wheels in and pins it against the lined wall, the other pushes its hindquarters so it turns;
  repeated; after the third turn the gate is opened and it trots out'
- 'c11.p011: a dozen pairs do it with different steers; the lining keeps the steer from being killed (one is hurt); if the rider charges too late
  and catches the steer too far back it escapes to the herd; riders never unseated, no horse hurt'
- 'c11.p012: bull riding: a footman baits the bull, horsemen rope horns and hind legs and throw it, a saddle and chest rope are put on, a man
  rides out the bucking; horsemen tease it with red blankets, throw it again, unsaddle it, then a pair races it round the corral pinning and turning
  it like the steers'
- 'c11.p013: the bull-rider passes his hat for silver; remarks on the gulf between gentry and ranch-hands in Chile'
- 'c11.p014: the rail contest: two champions with their horses'' heads over the bar push each other, alone or with two or three backers each;
  no one may touch another man''s horse; near-stalemate gained by inches until one side gets the vantage and bursts through along the bar; rough
  but good-natured'
- 'c11.p015-c11.p016: a lake-side pasture, the white courtyard ranch-house, breakfast under the trees; a huaso gallops beside the car to say good-by'
instructions_meta:
  requirement_groups:
    cattle driving:
    - CR2
    - CR4
    - FP1
    rider-animal interaction:
    - FP2
    - FP3
    - VP2
    run structure:
    - FP4
    rider contest:
    - CR3
    - FP5
    corral play space:
    - CR1
    - VP1
  explicit_requirements:
  - type: specify
    text: 'Each run should end like in the text: once the steer has been turned three times, the gate opens and it is let out.'
    covers:
