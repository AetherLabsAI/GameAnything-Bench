rubric:
  content_realization:
  - id: CR1
    item: 'The precinct''s approach: a straight pedestrian lane lined on both sides by continuous rows of small shops leads from the street to
      the large gate, and the path continues through the gate into the temple grounds'
    anchors:
      '1': a straight lane with continuous shop rows on both sides runs from the street to the gate, with temple grounds beyond the gate
      '0.5': the lane and the gate exist but not as one straight approach (the lane does not end at the gate, shops only on one side or scattered,
        or nothing beyond the gate)
      '0': no shop lane leading to the gate
    evidence:
    - img02
    - img03
    - img04
    - img05
  - id: CR2
    item: 'The precinct has its two traditional landmarks: a large two-storey gate and a five-storey pagoda'
    anchors:
      '1': both landmarks present with their defining form (a large two-storey gate; a five-storey pagoda)
      '0.5': only one of them, or both present without their defining form (a small single-storey gate, a pagoda of a few tiers)
      '0': neither
    evidence:
    - - 00:03
      - 00:05
    - img02
    - img04
  - id: CR3
    item: The pagoda stands right beside the gate, to one side of the approach axis
    anchors:
      '1': the pagoda next to the gate and off the line of the approach
      '0.5': the pagoda in the precinct but away from the gate, or its placement relative to the axis unclear
      '0': no pagoda, or the pagoda on the axis / far from the gate
    evidence:
    - - 00:03
      - 00:05
    - img02
    - img04
  - id: CR4
    cross: true
    item: 'Old within new under a mountain: the low traditional precinct is enclosed by dense modern city blocks and high-rises (images), and
      a mountain rises far beyond the city behind the precinct (clip)'
    anchors:
      '1': 'both parts: modern blocks and high-rises around the precinct on its sides, and a distant mountain beyond the city behind it'
      '0.5': only one of the two parts (or the city only on one side of the precinct)
      '0': neither
    evidence:
    - - 00:00
      - 00:03
    - - 00:10
      - '00:12.9'
    - - '00:22.4'
      - '00:24.4'
    - img01
    - img02
    - img03
  - id: CR5
    item: The district has a park whose moat or water channel is crossed by a footbridge (clip)
    anchors:
      '1': a park area with a moat or channel crossed by a bridge
      '0.5': a park without water and bridge, or a bridge over water with no park around it
      '0': no park
    evidence:
    - - 00:05
      - 00:10
  functions_playability:
  - id: FP1
    item: 'The precinct can be walked along its approach: from the street end of the shop lane, between the shop rows, through the gate and on
      into the temple grounds, with the pagoda reachable on foot beside the gate'
    anchors:
      '1': a continuous walkable route street -> shop lane -> gate -> temple grounds, the gate passable, the pagoda reachable on foot
      '0.5': the route can be walked only in part (gate blocked, lane cut off from the street or the grounds, pagoda unreachable)
      '0': the precinct cannot be walked through
    evidence:
    - img02
    - img03
    - img04
    - img05
  - id: FP2
    cross: true
    item: 'One district, not separate scenes: the clip''s park and signage-dense modern streets are reached on foot from the image-laid-out precinct
      in one continuous space'
    anchors:
      '1': the player walks from the precinct to the park and to the modern streets without teleporting or leaving the world
      '0.5': only one of the two areas is reachable on foot, or the areas are separate builds / need teleporting
      '0': only the precinct, or only isolated vignettes
    evidence:
    - - 00:05
      - 00:10
    - - '00:12.9'
      - '00:20.9'
    - img02
    - img03
  visual_presentation:
