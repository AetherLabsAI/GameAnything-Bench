      - 00:09
play_suggestions:
  FP1:
  - 'start at the street end of the shop lane and walk straight in: do you reach the gate without leaving the lane, and can you pass through it?'
  - 'from the gate, walk to the pagoda: can you reach it on foot?'
  FP2:
  - from the temple grounds, walk to the park and to a signage street without teleporting
  VP2:
  - look toward the horizon from the gate, the pagoda and the park
  robustness:
  - 'walk the perimeter of the district: are there holes, floating blocks or dead ends?'
  - 'try to enter the shops, the gate and the pagoda: solid where they should be, passable where the path goes'
  - 'visit at night as well as by day: are the landmarks still readable?'
