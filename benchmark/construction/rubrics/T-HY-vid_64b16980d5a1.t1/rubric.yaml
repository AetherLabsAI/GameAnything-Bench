    - '00:18.5'
    item: 'The modern streets are dense with signage: billboards and shop signs crowd the facades'
    anchors:
      '1': streets whose facades are crowded with signs and billboards
      '0.5': modern streets with only sparse or generic signage
      '0': none
    evidence:
    - - '00:13.8'
      - '00:19.3'
  - id: VP4
    cat: spatial
    keyframes:
    - '00:07.5'
    - '00:08.5'
    item: 'The park looks like the clip''s: green trees and lawn, a wooden bridge over a stone-walled moat, tall modern buildings rising beyond
      the trees'
    anchors:
      '1': a green park with a wooden bridge over stone-edged water, and towers visible above the trees
      '0.5': a green park, but the bridge / moat look unlike the clip's (not wooden, natural banks) or no towers seen beyond it
      '0': the park does not resemble the clip's (no greenery, or no bridge and water to be seen)
    evidence:
