task_id: T-TO-txt_21e75632c01e.e3
source_inventory:
- 'c33.p001-c33.p017: next morning Tom Harker regrets the failed escape; the Orion heads S.S.W., surfaces briefly in a gale, its position is pricked
  far from any coast; no means of flight'
- 'c33.p018-c33.p028: at night Captain Hargrave invites Marchand alone on a walk over the sea bottom in darkness (''we must climb a mountain'');
  diving-dresses and iron-pointed sticks, no electric lamps'
- 'c33.p029-c33.p031: on the Atlantic floor near midnight, black water; a reddish light about two miles off lights the way; rain patters on the
  surface above; the soil turns stony, faint phosphorescence, slippery seaweed; the Orion''s lantern pales behind'
- 'c33.p032-c33.p034: the rosy light grows; Marchand wonders if men made it; the glow is a reflection over the top of a mountain about 800 feet
  high, its source on the far side; the Captain leads surely through the stony maze'
- 'c33.p035-c33.p036: at one in the morning, the first slopes: a copse of dead, leafless, petrified trees overtopped by pines, hung with seaweed,
  branches black against the water, upper parts tinted red; dark galleries and glades'
- 'c33.p037-c33.p038: a perilous climb over narrow passes above gulfs, crevices, trunks thrown across abysses; leaning rocks and natural towers
  that seem to defy gravity'
- 'c33.p039: above the tree line, a hundred feet below the top; fractures and grottoes with giant crustacea and poulps, their eyes shining in
  the dark'
- 'c33.p040-c33.p043: a first platform with ruins of castles and temples overgrown with zoophytes and seaweed; the Captain points higher; the
  summit, a ten-yard circle commanding the rock mass'
- 'c33.p044-c33.p046: the far side drops twice as deep; the mountain is a volcano: a crater fifty feet above the peak pours lava in a cascade
  of fire, no flames under water, lighting the lower plain to the horizon'
- 'c33.p047-c34.p002: on the plain below lies a ruined town: fallen temples, columns, arches, an aqueduct, an acropolis, a quay, sunken walls
  and streets; the Captain writes one word on basalt: Atlantis'
- 'c34.p003-c34.p004: an hour of contemplation; tremors and rumbling from the mountain; moonlight through the water; quick descent through the
  mineral forest back to the Orion''s lantern at dawn'
- 'c35.p001-c35.p003: next day the Orion runs south at fifty fathoms; giant rays, sharks, swordfish and sea-dragons'
- 'c35.p004-c35.p005: the seabed turns stony and volcanic; a high wall closes the southern horizon (an island, perhaps the Canaries or Cape Verde);
  the Orion stops by it; next morning it floats on the surface in total darkness'
- 'c35.p006-c35.p015: ''Underground'', says the Captain; a faint circular gleam overhead; the lantern is lit: the Orion lies by a mountain forming
  a quay, on a lake enclosed by a circle of walls two miles across, level with the sea, the walls leaning into a funnel-shaped vault with a circular
  opening of daylight at the top'
- 'c35.p016-c35.p021: the heart of an extinct volcano invaded by the sea; reached by a natural canal about ten yards below the ocean surface;
  a hidden harbour sheltered from all storms; the crater now lets in air; an island that seems a sandbank to vessels'
- 'c35.p022-c35.p027: its use: drowned forests turned to coal are mined under the water by the crew in diving-dresses to make sodium for the Orion''s
  electricity; the smoke from the crater makes the volcano look active; one day''s stay, time to make the round of the lagoon'
- 'c35.p028-c35.p037: Marchand brings Gaspard and Tom, who looks for an exit; a sandy shore up to five hundred feet wide rings the lake below
  stony slopes of volcanic blocks and pumice; slippery inclined slopes climb; talk of how the sea flooded the crater'
- 'c35.p038: a steeper, harder climb; black basalt prisms like a colonnade supporting the vault, cold lava streams, sulphur; light from the crater
  above; stopped at about 250 feet under the overhanging vault, the ascent becomes a circular walk; sparse shrubs and flowers'
- 'c35.p039-c35.p046: at some dragon-trees Tom finds a hive of bees and smokes out the honey'
- 'c35.p047: the lit, motionless lake seen at every turn, the crew working on the platform and the mountain; hawks, kestrels and bustards; the
  crater gapes like a well, clouds visible through it; descent to the shore, sea-fennel and shellfish; back on board; the Orion leaves the next
  day beneath the waves'
