rubric:
  content_realization:
  - id: CR1
    item: 'The game contains the night route: a sea floor plain from which a mountain rises, with a way leading across the plain and up the mountain
      to its summit'
    anchors:
      '1': a sea floor plain, a mountain rising from it, and a route running from the plain up to a summit
      '0.5': the sea floor and the mountain both present but no route between them or no summit, or the mountain not under water
      '0': neither the sea floor plain nor the mountain
    evidence:
    - c33.p029
    - - c33.p033
      - c33.p035
    - c33.p043
  - id: CR2
    item: The distant reddish glow the night walk heads toward is the light of the mountain's own volcano, an active underwater volcano at its
      top
    anchors:
      '1': the red glow seen from the sea floor comes from an active volcano at the mountain's top
      '0.5': a red glow and a volcano both present but the glow has another source (lamps, a fire, a lit city), or the volcano is not on the mountain
        the route climbs
      '0': no volcano at the mountain
    evidence:
    - c33.p029
    - - c33.p032
      - c33.p033
    - - c33.p044
      - c33.p045
  - id: CR3
    item: The mountain's lower slopes are covered by a forest of dead, petrified trees that the route passes through
    anchors:
      '1': a stand of bare, dead, stone-like trees on the lower slopes, on the way up
      '0.5': trees present but living and leafy, or not on the mountain's slopes / not on the route
      '0': no forest on the mountain
    evidence:
    - - c33.p035
      - c33.p036
    - c34.p004
  - id: CR4
    item: Beyond the mountain, on the plain below the summit, lies a sunken ruined ancient city
    anchors:
      '1': a ruined city on the plain on the far side of the mountain, below and in view of the summit
      '0.5': a ruined city present but not placed on the plain below the summit (e.g. only ruins passed on the way up)
      '0': no ruined city
    evidence:
    - - c33.p043
      - c33.p044
    - c33.p047
    - c34.p001
  - id: CR5
    item: 'The game contains the lagoon: a sea-flooded lake inside an extinct volcano, closed in all round by walls that lean inward into a vault
      with an opening at its top'
    anchors:
      '1': a lake enclosed all round by crater walls closing into a rock vault, with an opening to the sky at the apex
      '0.5': a cave or underground lake without the volcanic crater form, or a crater lake open to the sky without the enclosing vault
      '0': no lagoon
    evidence:
    - c35.p015
    - c35.p017
    - c35.p035
    - c35.p038
  - id: CR6
    item: The lagoon is joined to the open sea only by a natural passage below the water's surface
    anchors:
      '1': a submerged natural passage between the open sea and the lagoon, and no other way in from the sea
      '0.5': a passage present but above water or an obvious open gap in the walls, or the link to the sea left unclear
      '0': no connection between the lagoon and the open sea
    evidence:
    - c35.p015
    - c35.p017
    - - c35.p035
      - c35.p037
  functions_playability:
  - id: FP1
    item: 'The night walk can be travelled on foot: across the sea floor and up the mountain to its summit, and back down'
    anchors:
      '1': a connected walkable route across the sea floor up the mountain to a reachable summit, with a way back
      '0.5': the summit cannot be reached on foot, the parts of the route are not connected in order, or there is no way back
      '0': no traversable route
    evidence:
    - c33.p029
    - c33.p031
    - - c33.p035
      - c33.p039
    - c33.p043
    - c34.p004
  - id: FP2
    item: 'The lagoon can be explored on foot: round the lake along its shore and up the walls to a high path under the vault'
    anchors:
      '1': walking the shore round the lake and climbing to a high path
      '0.5': only the shore walk or only the climb, or the lagoon only seen and not walked
      '0': the lagoon cannot be entered or explored
    evidence:
    - c35.p031
    - c35.p038
    - c35.p047
  - id: FP3
    item: The lagoon is reached from the open sea by travelling through the underwater passage into the enclosed crater
    anchors:
      '1': the player (or the vessel carrying the player) passes from the open sea through the submerged passage into the lagoon
      '0.5': the lagoon is reached, but the passage is only told and never travelled or seen
      '0': no way from the sea to the lagoon
    evidence:
    - c35.p004
    - c35.p005
    - c35.p017
    - c35.p047
  visual_presentation:
  - id: VP1
    cat: style
    item: The night sea floor is deep darkness with one distant reddish glow as its main light
    anchors:
      '1': a dark underwater scene lit mainly by a distant red / orange glow
      '0.5': dark but evenly lit, or the glow is not reddish or not the main light
      '0': neither the darkness nor the glow
    evidence:
    - c33.p029
    - c33.p032
    - c33.p033
    - c33.p036
  - id: VP2
    cat: key_moment
    item: 'The eruption: glowing lava pours from a crater at the mountain''s top and cascades down under water'
    anchors:
      '1': a crater at the top with visible streams of glowing lava running down
      '0.5': a volcano shown but without a visible lava flow
      '0': none
    evidence:
    - - c33.p044
      - c33.p046
    - c34.p003
  - id: VP3
    cat: spatial
    item: The ruined city seen from the summit looks like an ancient city of classical architecture fallen into ruin
    anchors:
      '1': recognisably classical ruins (temples, columns, arches) spread over the plain, seen from the summit
      '0.5': ruins visible but generic rubble, or the city's look cannot be made out from the summit
      '0': nothing of the city visible
    evidence:
    - c33.p044
    - c33.p047
  - id: VP4
    cat: style
    item: Inside the lagoon, the light is the daylight falling through the bright opening at the top of the vault
    anchors:
      '1': the lake and walls visibly lit by daylight coming from the bright opening overhead
      '0.5': the opening present but the inside evenly lit, or the opening not visible from the lake
      '0': no light from an overhead opening visible
    evidence:
    - c35.p005
    - c35.p015
    - c35.p038
    - c35.p047
play_suggestions:
  FP1:
  - 'start on the sea floor and walk to the summit without leaving the route: is every stretch connected?'
  - from the summit, try to get back down to where you started
  FP2:
  - start on the lagoon shore and walk all the way round the lake
  - 'climb the walls as high as possible: is there a high path under the vault, and a way back down?'
  FP3:
  - 'arrive from the open sea: is the passage into the lagoon travelled or seen, and is it below the surface?'
  robustness:
  - 'leave the route on the mountain (off a ledge, into a crevice): can you recover?'
  - walk into the lake water from the shore and come back
  - leave in the middle of a walk and come back
