rubric:
  content_realization:
  - id: CR1
    item: 'The main cast with their story roles: a fairy-godmother-like helper who wields the magic wand; the Cinderella-like heroine she makes
      over; a dark-haired girl cast as the heroine''s ''evil stepsister''; the prince, on whom the fix depends; a small frog tied to the curse'
    anchors:
      '1': all five are in the game, each recognisable in their story role
      '0.5': one of the five is missing, or some are present without a recognisable role (e.g. the dark-haired girl as a generic villager, the
        helper without her magic)
      '0': two or more of the five missing, or the cast is not in the game
    evidence:
    - - '00:09.2'
      - '00:16.2'
    - - '00:34.5'
      - '00:40.5'
    - - '00:45.5'
      - '00:51.0'
  - id: CR2
    item: 'The glass slipper: the slipper conjured by the helper''s magic at the makeover is the same item the fix depends on'
    anchors:
      '1': a glass slipper exists in the game, comes from the makeover magic and is the item of the fix
      '0.5': a slipper or special item exists but is not tied to the makeover, or it is a generic quest item not recognisable as a glass slipper
      '0': no such item
    evidence:
    - - '00:12.7'
      - '00:13.7'
    - - '00:35.5'
      - '00:40.5'
  - id: CR3
    item: 'Inciting turn: in the garden the dark-haired girl watches the heroine''s makeover from hiding, objects to being cast as the ''evil
      stepsister'', then holds the helper''s wand and sets out to crash the ball'
    anchors:
      '1': the game contains her watching the makeover, rejecting the stepsister role, and then holding the wand with the intent to crash the
        ball, in this order
      '0.5': she ends up with the wand but the rejection of the role or the intent to crash the ball is missing, or these garden events are out
        of order
      '0': missing, or the roles reversed (e.g. the heroine takes the wand)
    evidence:
    - - '00:14.2'
      - '00:24.2'
  - id: CR4
    item: 'Goal and stakes stated in the game: before the quest the helper gives the one way to fix the broken story, the prince putting the slipper
      on the girl''s foot before midnight, and the penalty for failing: everyone is doomed and someone becomes a frog forever'
    anchors:
      '1': the fix (the prince fits the slipper on the girl's foot), the midnight deadline and the frog-forever penalty are all stated by the
        helper in play before the quest
      '0.5': two of the three are stated, or they are stated only after the quest has begun or by no character
      '0': no stated goal
    evidence:
    - - '00:35.5'
      - '00:47.5'
  - id: CR5
    item: 'Allies on the quest: the heroine and the girl cast as her ''evil stepsister'' travel together with the frog as companions instead of
      keeping their fairy-tale roles'
    anchors:
      '1': the two girls are companions on one quest with the frog, no longer opposed as heroine and evil stepsister
      '0.5': they travel together but the frog is not with them, or they still act out their fairy-tale opposition
      '0': missing, or they are strangers or enemies on the journey
    evidence:
    - - '00:50.5'
      - '01:01.0'
  - id: CR6
    item: 'The story''s places: the palace at night with its hedge garden, where the makeover happens, and its ball; and, apart from the palace,
      a sunlit wild forest that the quest travels through'
    anchors:
      '1': a night palace area with its garden and a ball or ballroom, plus a separate forest area outside the palace
      '0.5': only the palace area or only the forest exists, or the ball has no place of its own
      '0': none of the story's places
    evidence:
    - - '00:08.2'
      - '00:22.7'
    - - '00:34.5'
      - '00:41.5'
    - - '00:49.5'
      - '00:57.5'
  functions_playability:
  - id: FP1
    item: 'Magic transformation event: a helper character''s magic visibly changes the main character''s state (new outfit, conjured ride and
      special item), and the changed state holds after the event instead of reverting at once'
    anchors:
      '1': the event plays in the experience and the before and after states clearly differ
      '0.5': the event is only narrated, or the change reverts at once
      '0': no transformation event
    evidence:
    - - '00:09.2'
      - '00:13.7'
  - id: FP2
    item: 'Inciting disruption: before the main goal is given, the planned story is established in play as broken, and the goal is presented as
      the way to fix that disruption'
    anchors:
      '1': the broken story is established (shown or told) before the goal and the goal is framed as fixing it
      '0.5': the disruption is present but disconnected from the goal, or the goal can be started before it
      '0': no disruption; the quest starts from nothing
    evidence:
    - - '00:15.2'
      - '00:24.2'
    - - '00:34.5'
      - '00:38.5'
  - id: FP3
    item: 'Deadline with consequence: the deadline is actually tracked in play; missing it leads to the stated penalty (a transformation into
      a small creature), and succeeding in time leads to a resolution or lets the story continue'
    anchors:
      '1': missing the deadline triggers the stated penalty and meeting it gives a distinct success / continuation
      '0.5': the deadline exists but nothing happens when it passes, or the outcome ignores the stated penalty
      '0': no deadline in play
    evidence:
    - - '00:38.5'
      - '00:47.5'
  - id: FP4
    item: 'The quest journey: after the setup the player leaves the starting place and crosses a wild area carrying the special item, with the
      other girl and the small creature present along the way'
    anchors:
      '1': a journey leg after the setup, the item carried and both companions present along the way
      '0.5': the journey exists but a companion is missing, or the item is not carried
      '0': no journey; the story jumps from setup to end
    evidence:
    - - '00:49.5'
      - '00:57.5'
  visual_presentation:
  - id: VP1
    cat: key_moment
    keyframes:
    - '00:10.2'
    - '00:11.7'
    - '00:13.2'
    item: 'The makeover moment: a burst of magic out of which the ride, the gown and the glass slippers take shape, set apart from the dark night
      around it'
    anchors:
      '1': a distinct magic effect that the conjured results visibly emerge from
      '0.5': a magic effect that is generic or not set apart from the scene, or the results pop in with no effect
      '0': none
    evidence:
    - - '00:09.2'
      - '00:13.7'
  - id: VP2
    cat: spatial
    keyframes:
    - '00:08.2'
    - '00:09.2'
    - '00:15.2'
    item: 'The look of the night garden: a stone fountain on a round plaza surrounded by tall clipped hedges, with the lit palace nearby, at night'
    anchors:
      '1': fountain, hedges and the palace readable in a night setting
      '0.5': a garden at night but without the fountain or the hedges, or the same layout by day
      '0': none
    evidence:
    - - '00:08.2'
      - '00:09.2'
    - - '00:15.2'
      - '00:22.7'
  - id: VP3
    cat: spatial
    keyframes:
    - '00:50.5'
    - '00:51.5'
    - '00:54.5'
    item: 'The look of the sunlit forest: huge mossy trunks, a fallen log across a shallow stream and logs in a clearing, in warm daylight that
      contrasts with the night palace scenes'
    anchors:
      '1': dense forest of big mossy trees with a fallen log over water, in warm daylight that sets it apart from the night palace
      '0.5': a forest without the log over water, or not in daylight / not distinct in look from the other areas
      '0': none
    evidence:
    - - '00:50.5'
      - '00:57.5'
  - id: VP4
    cat: presentation
    keyframes:
    - '00:38.5'
    - '00:40.0'
    - '00:52.5'
    item: 'Readable stakes: the slipper is visibly distinct (glowing) whenever it is held or carried, and the deadline has a visible cue (the
      reference cuts to the palace clock tower when midnight is spoken)'
    anchors:
      '1': the carried slipper stands out on screen and the deadline has a visible cue
      '0.5': only one of the two is readable
      '0': neither
    evidence:
    - - '00:38.5'
      - '00:40.5'
    - - '00:50.5'
      - '00:57.5'
play_suggestions:
  FP1:
  - 'watch the makeover, then walk away and come back: are the new outfit and the conjured ride still there?'
  - compare the heroine before and after the event
  FP2:
  - try to start the slipper quest before the disruption happens
  - check whether the rival holds the magic afterwards and that the planned story is established as broken
  CR4:
  - after the briefing, check whether the objective, the deadline and the penalty can be read again (log, dialogue, note)
  - 'skip through the briefing quickly: is the goal still clear?'
  FP3:
  - 'let the deadline pass on purpose: does the frog penalty happen?'
  - 'complete the fix just before the deadline and once well before it: is there a distinct success?'
  - 'sleep or pass time in other ways: does the deadline still hold?'
  FP4:
  - walk through the forest leg and check that both companions keep up
  - 'try to drop, sell or store the slipper during the journey: does it stay with the player until it is used?'
  robustness:
  - fail the quest and check that the game can continue or be retried sensibly
  - save and reload in the middle of the deadline
  - 'leave the forest leg early and return to the palace: does the story state stay consistent?'
