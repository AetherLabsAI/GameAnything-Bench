instructions_meta:
  requirement_groups:
    track network and junctions:
    - CR1
    - FP1
    - VP1
    route setting:
    - FP2
    signals and vehicle control:
    - CR2
    - FP3
    - VP2
    control place:
    - CR3
    - FP4
    - VP3
  explicit_requirements:
  - type: keep
    text: 'Keep the red and green signals by the track: a train has to stop at red and move on once it turns green.'
    covers:
    - CR2
    - FP3
rubric:
  content_realization:
  - id: CR1
    item: The game contains a rail network in which a line splits into two branches at a junction, with a rail vehicle placed on it
    anchors:
      '1': a rail line that divides into two branches at a switchable junction, with at least one vehicle placed on the rails
      '0.5': rails and a vehicle exist, but there is no junction (only a single line or loose parallel tracks), or no vehicle is placed on the
        network
      '0': no rail network or no rail vehicle
    evidence:
    - 'img03: one track splitting into two at a turnout'
    - 'img06: junction trackwork with a train'
  - id: CR2
    item: Each track leading into a junction has its own trackside signal that can show red or green
    anchors:
      '1': red / green signals stand by the track ahead of the junctions, one for each approaching track
      '0.5': red / green signals exist, but one signal serves all tracks, or they stand away from the junctions they guard
      '0': no red / green trackside signals (only decoration or road-style lights unrelated to the track)
    evidence:
    - img01
    - img02
    - 'img03: the signal mast at the turnout'
    - 'img06: separate green and red signals over neighbouring tracks ahead of the junction trackwork'
  - id: CR3
    item: The game contains a control place away from the track that holds a grouped set of controls, one for each switch and each signal
    anchors:
      '1': one place set apart from the track with a row or group of controls, each tied to one switch or one signal
      '0.5': controls exist but only at the devices themselves, or the place covers only the switches or only the signals
      '0': no controls for the switches and signals
    evidence:
    - 'img05: a row of labelled levers in a signal box, cables leaving through the floor'
  functions_playability:
  - id: FP1
    item: A vehicle runs over the junction and can continue onto either branch
    anchors:
      '1': a moving vehicle passes the junction and, on different runs, reaches each of the two branches
      '0.5': a vehicle moves on the rails but cannot pass the junction, or only ever reaches one branch
      '0': no vehicle can run on the rails
    evidence:
    - img03
    - img06
  - id: FP2
    item: The player sets the turnout through a control, and the vehicle follows the branch that is set
    anchors:
      '1': changing the control changes the switch, and the next vehicle takes the newly set branch
      '0.5': the control changes something visible but the route taken does not follow it reliably
      '0': the branch cannot be changed by the player
    evidence:
    - img03
    - img04
    - img05
  - id: FP3
    item: 'Signals govern the vehicles on their track: a signal can be switched between red and green, and a vehicle is held at red and goes on
      at green'
    anchors:
      '1': a signal changes between red and green during play and a vehicle halts at red and moves on after green
      '0.5': the signal changes but vehicles obey it only partly (stop without resuming, or only sometimes)
      '0': signals are fixed or have no effect on vehicles
    evidence:
    - img01
    - img02
    - img06
  - id: FP4
    item: Each control at the control place acts on its own switch or signal from there, without the player going to the track
    anchors:
      '1': using a control at the control place changes the one switch or signal it belongs to, and nothing else
      '0.5': the controls act from the control place only for some devices, or one control changes several devices
      '0': the devices can only be changed on the spot, or the controls have no effect
    evidence:
    - 'img05: levers whose cables run out of the signal box to the track'
  visual_presentation:
  - id: VP1
    cat: spatial
    item: At the junction the switch is visibly set to one branch
    anchors:
      '1': looking at the junction, one can see which branch the switch is set to
      '0.5': the junction is visible but its setting cannot be told apart, or only by trying it
      '0': no junction visible
    evidence:
    - img03
    - img04
  - id: VP2
    cat: style
    item: Each signal's current red or green state is clearly readable from the track
    anchors:
      '1': a signal's current colour is recognisable at a glance from a vehicle's or player's view on the track
      '0.5': the colour can be told only from close by or with effort (small, dim, similar-looking states)
      '0': the signal's state cannot be seen
    evidence:
    - img01
    - img02
    - img06
  - id: VP3
    cat: presentation
    item: The current state of each control is visible to the player
    anchors:
      '1': the controls' current states are readily distinguishable at a glance
      '0.5': the state is shown only for some controls or only after using them
      '0': control states are not visible
    evidence:
    - img05
play_suggestions:
  FP1:
  - drive or send a vehicle over the junction from both directions
  - check that the vehicle can reach both branches
  FP2:
  - 'set the turnout, send a vehicle, then reset it and send another: does each take the set branch?'
  - 'throw the switch while a vehicle is on it: what happens?'
  FP3:
  - toggle each signal several times and watch its lamp
  - 'set a signal to red ahead of a moving vehicle: does it stop before the signal?'
  - 'turn the signal green after the stop: does the vehicle move on?'
  - check a vehicle on a parallel track with a green signal while the other is red
  FP4:
  - from the control place, set a full route (switch + signal) without walking to the track
  - check that each control acts on only its own device
  robustness:
  - send two vehicles toward the same junction with conflicting settings
  - break or remove a control or rail piece and see whether the system still behaves sensibly
  - 'leave and return: are switch and signal states kept?'
