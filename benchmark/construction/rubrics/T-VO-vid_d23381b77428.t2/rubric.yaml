rubric:
  content_realization:
  - id: CR1
    item: 'The story''s premise: the player character is a living boy stranded among the skeleton dead who has to get back home'
    anchors:
      '1': the game establishes the player as a living one stranded in the land of the dead and makes returning him home the goal that follows
        from it
      '0.5': 'only one of the two is established: the player is a living one among the dead but there is no go-home goal, or there is a go-home
        goal but the player is not a living one among the dead'
      '0': 'the premise is missing: neither the player as a living one among the dead nor a go-home goal'
    evidence:
    - - 01:02
      - 01:03
    - - 01:08
      - 01:13
    - - 01:18
      - 01:20
  - id: CR2
    item: A group of skeletons the player meets turns out to be the player's own family, whom the player does not recognise at first
    anchors:
      '1': a skeleton group is identified in the game as the player's family, after the player first meets them as strangers
      '0.5': the skeletons are called his family without the first non-recognition, or they stay unknown strangers whose kinship is only hinted
      '0': missing, or the skeletons are strangers or enemies
    evidence:
    - - 01:02
      - 01:08
    - - 01:16
      - 01:20
  - id: CR3
    item: The land of the dead has a Department of Family Reunions, a grand hall of the dead with an office where a skeleton clerk handles the
      family's paperwork
    anchors:
      '1': a place recognisable as the family-reunions department of the dead, with a clerk at work on papers in an office
      '0.5': an official building or a clerk, but not recognisable as a family-reunions office
      '0': missing
    evidence:
    - - 00:59
      - 01:01
    - - 01:05
      - 01:07
  - id: CR4
    item: 'An arrival checkpoint: a marigold-petal path crosses a plaza of the dead to a welcome station, where a uniformed skeleton officer at
      a counter controls the arrivals'
    anchors:
      '1': plaza, petal path and welcome station connected in one layout, with an officer's counter where arrivals are checked
      '0.5': the counter with an officer or the plaza alone, or the two not connected
      '0': missing
    evidence:
    - - 01:13
      - 01:16
    - - 01:16
      - 01:19
  - id: CR5
    item: An old family photo from the family altar ties the player to the family's past; in it a guitar player's identity is missing, so who
      he is stays a mystery
    anchors:
      '1': a family photo found at a family altar is part of the story, linking the player to the family, with the guitar player's identity unknown
      '0.5': a photo without the altar / family link, or without the unknown guitar player
      '0': missing
    evidence:
    - - 01:07
      - 01:11
  - id: CR6
    item: 'Turning point at the arrival checkpoint: asked by the officer what they have to declare, the family answers yes and brings the living
      boy forward, the one who does not belong among the dead (no outcome is shown)'
    anchors:
      '1': at the checkpoint, the question of what is declared leads to the family presenting the living player as the one out of place among
        the dead
      '0.5': the checkpoint questioning without the player being presented, or the player presented without the declaration question
      '0': missing
    evidence:
    - - 01:15
      - 01:20
  functions_playability:
  - id: FP1
    item: 'A clear start: the experience opens with the player arriving in a place of the dead (for example at the doors of an official building,
      as in the clip), so where the player is and what to do first are clear'
    anchors:
      '1': the opening makes clear where the player is and points clearly to a first step that starts the story
      '0.5': an opening exists but it is unclear where the player is or what to do first
      '0': no recognisable start
    evidence:
    - - 00:59
      - 01:02
  - id: FP2
    item: 'Story through encounters: the player meets the family and the officials of the dead as encounters the player reaches and triggers,
      and each acknowledges the player and moves the story on'
    anchors:
      '1': encounters with the family and with officials are reachable, are started by the player and give clear feedback that moves the story
        on
      '0.5': encounters are present but are only scenery, or triggering them changes nothing
      '0': no story encounters
    evidence:
    - - 01:02
      - 01:08
    - - 01:15
      - 01:20
  - id: FP3
    item: 'A gate the player must pass: reaching the officials of the dead starts a check of the arrivals in which the player, a living one among
      the dead, is at issue; the player can respond, and the officials react so play continues'
    anchors:
      '1': reaching the officials starts the check, the player as a living one is what is at issue, the player can respond, and the officials
        react in some way so play continues
      '0.5': the check exists but the player cannot respond, or the response has no reaction, or it has nothing to do with the player being alive
      '0': no such gate
    evidence:
    - - 01:15
      - 01:20
  - id: FP4
    item: 'A coherent journey: the go-home goal frames the encounters, which form one play-through with clear milestones, feedback at each step
      and no dead end; the order between scenes is the agent''s choice'
    anchors:
      '1': the chosen steps are all reachable in one play-through in a sensible order toward the goal, with feedback at each step, and the player
        can go on or reach an end afterwards
      '0.5': the steps exist but are disconnected, or one step blocks progress
      '0': isolated scenes with no progression
    evidence:
    - - 00:59
      - 01:20
  visual_presentation:
  - id: VP1
    cat: key_moment
    keyframes:
    - '00:59.0'
    - '01:00.5'
    item: 'Entering the dead''s bureaucracy: official doors open onto a grand hall crowded with skeleton people'
    anchors:
      '1': doors open onto a large, grand hall visibly crowded with skeleton people
      '0.5': the hall or the doors without the reveal of one through the other, or the hall reads as empty or generic
      '0': none
    evidence:
    - - 00:59
      - 01:02
  - id: VP2
    cat: key_moment
    keyframes:
    - '01:09.5'
    - '01:10.5'
    item: 'The torn family photo: the old photo from the family altar, with the guitar player''s face torn off'
    anchors:
      '1': the family photo is shown to the player with one figure's face visibly torn off
      '0.5': a family photo without the tear, or the tear not readable
      '0': none
    evidence:
    - - 01:09
      - 01:11
  - id: VP3
    cat: style
    keyframes:
    - '01:05.0'
    - '01:06.5'
    - '01:18.5'
    item: 'The living among the dead: a cast of individual, festively decorated skeleton people, with the living boy clearly standing out among
      them'
    anchors:
      '1': varied skeleton NPCs with decorated skulls and a visibly different living player character
      '0.5': skeletons all alike / undecorated, or the player character indistinguishable from them
      '0': no skeleton cast
    evidence:
    - - 01:02
      - 01:07
    - - 01:16
      - 01:20
play_suggestions:
  FP1:
  - 'start a new game: is it clear where you are and what to do first?'
  - 'wander away from the start first: is there still a pointer to the first step?'
  FP2:
  - 'trigger every encounter you find (relatives, officials): does each acknowledge you and move the story on?'
  - 'accept and refuse anything offered to you, if there is an offer: is either choice handled?'
  - 'skip an encounter and go on: does the story still make sense or is it blocked?'
  FP3:
  - 'approach the officials alone and with the party: does the check start?'
  - 'try each response: do the officials react differently, and can you continue?'
  FP4:
  - 'play from start to end without help: note each step and whether it leads toward the go-home goal'
  - do the steps in a different order where possible
  robustness:
  - 'talk to the officer or the clerk repeatedly: do lines loop sensibly?'
  - leave an area mid-conversation and come back
  - 'save and reload after an encounter that changes the story: is the state kept?'
  - 'walk around and behind the counter and the desk: any stuck spots?'
