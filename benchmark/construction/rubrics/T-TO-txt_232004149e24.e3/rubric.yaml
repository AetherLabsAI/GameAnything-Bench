source_inventory:
- 'c11.p001-c11.p006: the Timid Panther wakes after the poppy field; the party walks back to the road of yellow brick and turns toward the Jade
  City'
- 'c11.p007-c11.p010: the road is smooth and paved; the countryside has green-painted fences and farmhouses; people in emerald-green clothes and
  peaked hats keep away for fear of the Panther; Hannah concludes this is the Land of Zorn'
- 'c11.p011-c11.p017: Hannah knocks at a farmhouse; the woman lets them in once told the Panther is tame; a man with a hurt leg and two children'
- 'c11.p018-c11.p038: the farmer says Zorn never lets anyone into his presence, sits in the Throne Room of his Palace, and can take any form;
  the companions name their wishes (brains, a heart, courage, the way back to Iowa)'
- 'c11.p039-c11.p040: supper and the night at the farmhouse'
- 'c11.p041-c11.p045: next morning a green glow in the sky ahead grows brighter; in the afternoon the high, thick, bright-green wall around the
  City; a big emerald-studded gate at the end of the road; a bell beside it; the gate opens into a high arched room whose walls glisten with emeralds'
- 'c11.p046-c11.p054: the Guardian of the Gates, a small green man with a large green box, warns that Zorn is terrible to idle visitors; everyone,
  residents included, must wear spectacles or the City''s brightness would blind them; they are locked on and he has the only key'
- 'c11.p055-c11.p057: he fits green-glassed spectacles on all of them and locks them at the back of the head; then he takes a golden key from
  the wall and opens a second gate into the streets'
- 'c12.p001-c12.p003: the streets: houses of green marble studded with emeralds, green marble pavement with rows of emeralds in the joints, green
  window glass, a green-tinted sky and green sun rays; green-clad, green-skinned people; shops where everything sold is green; no horses or animals,
  goods moved in small green pushcarts'
- 'c12.p004-c12.p012: the Palace of Zorn stands exactly in the middle of the City; a green-bearded soldier at the door takes them into a green
  room to wait; he speaks to Zorn behind a screen; Zorn will receive each of them alone, one a day'
- 'c12.p013-c12.p017: a green girl leads Hannah through passages and up stairs to a green room at the front of the Palace (fountain, books, wardrobe
  of dresses); the companions spend the night in their own rooms'
- 'c12.p018-c12.p023: next morning Hannah is taken to a great hall where courtiers wait outside the Throne Room every morning without ever seeing
  Zorn; the soldier tells why Zorn agreed (the silver shoes, the mark on her forehead); a bell gives the signal and she goes in alone through
  a little door'
- 'c12.p024-c12.p025: the Throne Room: a big round room with a high arched roof, walls, ceiling and floor covered with emeralds, a great light
  in the centre of the roof; a green marble throne in the middle holding an enormous bodiless Head'
- 'c12.p026-c12.p051: the Head asks about the silver shoes and the mark, then demands she kill the Wicked Witch of the West before he sends her
  home; Hannah leaves in tears'
- 'c12.p052-c12.p065: the Strawman''s audience: Zorn as a lovely winged Lady makes the same demand in return for brains'
- 'c12.p066-c12.p077: the Tin Chopper''s audience: Zorn as a terrible five-eyed, five-armed Beast demands the same for a heart'
- 'c12.p078-c12.p087: the Panther''s plan; his audience: Zorn as a Ball of Fire demands proof of the Witch''s death for courage; the heat drives
  him out'
- 'c12.p088-c12.p101: the friends decide to go to the land of the Marlings to seek the Witch; preparations in the Palace (axe on a green grindstone,
  fresh straw, a basket of food); they wake to a green cock in the Palace yard'
