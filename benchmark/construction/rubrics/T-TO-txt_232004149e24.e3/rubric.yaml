rubric:
  content_realization:
  - id: CR1
    item: A high wall encloses the whole City, and the road that leads to it ends at a big gate in that wall, through which the City is entered
    anchors:
      '1': a wall rings the City all round and the approach road arrives at a gate in it that is the way in
      '0.5': a wall or a gate exists, but the wall does not enclose the City or the road does not lead to the gate
      '0': no enclosing wall and no gate
    evidence:
    - - c11.p043
      - c11.p044
    - c11.p006
  - id: CR2
    item: Between the outer gate and the streets lies a gatekeeping point that holds the green spectacles, with a second gate beyond it opening
      into the streets
    anchors:
      '1': inside the outer gate there is a checkpoint with the green spectacles, and a second gate past it leads into the streets
      '0.5': a checkpoint or a second gate exists, but the green spectacles are missing (or the checkpoint is not between the gates and the streets)
      '0': the gate opens straight onto the streets with no checkpoint and no spectacles
    evidence:
    - - c11.p045
      - c11.p055
    - c11.p057
  - id: CR3
    item: Inside the walls, streets lined with houses fill the City between the inner gate and the Palace
    anchors:
      '1': a street network lined with houses runs inside the walls and connects the inner gate with the Palace
      '0.5': streets or houses exist, but sparsely, or they do not connect the gate with the Palace
      '0': no streets inside the walls (an empty enclosure or a lone building)
    evidence:
    - c11.p057
    - - c12.p001
      - c12.p004
  - id: CR4
    item: The Palace of Zorn, a big building set apart from the houses, stands exactly in the middle of the City
    anchors:
      '1': a large, distinct Palace stands at the centre of the walled City
      '0.5': a distinct Palace exists inside the City but not at its centre
      '0': no distinct Palace, or it stands outside the walls or by the gate
    evidence:
    - c12.p004
  - id: CR5
    item: Inside the Palace is the Throne Room, a big round room with a high arched roof and the throne standing in its middle
    anchors:
      '1': the Palace holds a big round, high-roofed Throne Room with the throne at its centre
      '0.5': a throne room exists inside the Palace but is not round, or the throne is not in the middle
      '0': no Throne Room inside the Palace
    evidence:
    - c11.p024
    - c12.p008
    - - c12.p024
      - c12.p025
  functions_playability:
  - id: FP1
    item: Passing the gate where the road arrives takes the player through the checkpoint, where the green spectacles are put on and stay on,
      before the way into the streets opens
    anchors:
      '1': entering at the gate goes through a gatekeeping step at which the spectacles are fitted and cannot be taken off in the City, and only
        then does the City open
      '0.5': the City is entered at the gate through the checkpoint, but the spectacles are not required before the streets open, or can simply
        be taken off
      '0': the City can be entered without the checkpoint, or there is no way in
    evidence:
    - - c11.p052
      - c11.p057
  - id: FP2
    item: Inside the walls the player can walk through the streets from the gate to the Palace
    anchors:
      '1': the player can walk on foot along the streets from the inner gate all the way to the Palace
      '0.5': the streets can be walked, but the route to the Palace is blocked or broken
      '0': the City cannot be moved through on foot (only shown, or blocked)
    evidence:
    - c11.p057
    - - c12.p001
      - c12.p004
  - id: FP3
    item: The Palace can be entered and the Throne Room reached inside it
    anchors:
      '1': from the entrance the player can go inside the Palace and reach the Throne Room
      '0.5': the Palace can be entered but the Throne Room is not reachable
      '0': the Palace is a closed facade
    evidence:
    - - c12.p004
      - c12.p008
    - - c12.p018
      - c12.p024
  visual_presentation:
  - id: VP1
    cat: style
    item: The City is seen as a ring of high, bright-green wall with a gate that glitters with emeralds where the road arrives
    anchors:
      '1': the wall reads as high and bright green around the City, and the gate is set with glittering emeralds
      '0.5': the wall and gate are there, but the wall is not green, or the gate is plain
      '0': the wall and gate look like an ordinary wall and gate (no green, no emeralds)
    evidence:
    - - c11.p043
      - c11.p044
  - id: VP2
    cat: style
    item: The City is green throughout, its buildings and pavement set with sparkling emeralds
    anchors:
      '1': the City reads as one green, gem-glittering place, streets and buildings alike
      '0.5': green is prominent, but large parts look ordinary or the gem sparkle is absent
      '0': the City does not look green
    evidence:
    - - c12.p001
      - c12.p003
    - c12.p007
  - id: VP3
    cat: style
    item: The Throne Room is covered with emeralds on walls, ceiling and floor, made to sparkle by a great light in the centre of its roof
    anchors:
      '1': the room glitters with emeralds all over, lit by a bright light at the centre of its roof
      '0.5': the room is green or gem-covered, but without the central roof light, or only partly covered
      '0': the Throne Room looks like an ordinary room
    evidence:
