rubric:
  content_realization:
  - id: CR1
    item: The play space is a court split across the middle by a net into two halves, each with a baseline at its back, and the player and the
      opponent take position on opposite halves
    anchors:
      '1': a bounded court with a net across the middle, a baseline at each end, and the two sides on opposite halves
      '0.5': two sides on a divided play area, but no net or no marked bounds / baselines
      '0': 'no divided court: both sides share one area, or there is no opponent'
    evidence:
    - - '00:49.6'
      - '01:01.6'
    - - '01:10.6'
      - '01:21.1'
  - id: CR2
    item: 'The game has a scoreboard holding the reference''s match state: both sides'' names, the games won in each set, the current tiebreak
      points, a marker of who serves, and a tag naming the current situation (the tiebreak; set point when it arises)'
    anchors:
      '1': names, games per set, current points, the server marker and the situation tag are all part of the scoreboard
      '0.5': a scoreboard with only some of these parts (e.g. points only, or no server marker or no situation tag)
      '0': no scoreboard
    evidence:
    - - '00:49.6'
      - '00:50.0'
    - - '01:04.6'
      - '01:04.6'
    - - '01:28.1'
      - '01:30.6'
  - id: CR3
    item: 'The match situation of the reference: a set whose games stand at 6-6 goes to a tiebreak as its deciding game'
    anchors:
      '1': the game contains a set level at 6-6 in games that is then decided by a tiebreak (reached through play or set up as the starting situation)
      '0.5': a tiebreak or deciding game exists but is not tied to a set at 6-6 in games (e.g. a standalone points race with no games or sets)
      '0': no tiebreak situation; only ordinary games
    evidence:
    - - '00:49.6'
      - '00:50.0'
    - - '01:04.6'
      - '01:04.6'
    - - '01:28.1'
      - '01:28.6'
  functions_playability:
  - id: FP1
    item: 'Long baseline rallies against an opponent: the two sides hit the ball back and forth over the net from the back of their halves over
      several shots, both moving side to side to reach it'
    anchors:
      '1': multi-shot rallies played from the baselines, with the opponent as well as the player chasing the ball side to side and returning it
      '0.5': the opponent returns in a scripted way without moving, rallies never pass one exchange, or play is not from the back of the court
      '0': no opponent hitting the ball back
    evidence:
    - - '00:50.0'
      - '01:01.6'
    - - '01:10.6'
      - '01:21.1'
    - - '01:31.1'
      - '01:39.1'
  - id: FP2
    item: 'Points decided by play, then reset: a point ends when the rally ends in play, the side that won it (either side, the opponent included)
      gets the point and the score advances, and play resets for the next point'
    anchors:
      '1': every point is settled by how the rally ends, the score advances for the side that won it, both sides win points through play, and
        the next point starts from reset positions
      '0.5': points end through play but sometimes go to the wrong side, the opponent never wins a point by its own play, play stalls, or does
        not reset cleanly
      '0': points awarded by a timer, a button or chance, or no scoring or reset at all
    evidence:
    - - '00:50.0'
      - '01:04.6'
    - - '01:10.6'
      - '01:24.1'
  - id: FP3
    item: 'Serve and change of server: every point starts with a serve from behind the server''s baseline, and within the tiebreak the serving
      side changes after the first point and then after every two points'
    anchors:
      '1': a serve starts every point from behind the baseline and within the tiebreak the server changes after the first point and then after
        every two points
      '0.5': a serve exists but one side always serves, the server changes after every point or only between games, or it can be served from anywhere
      '0': points start without a serve
    evidence:
    - - '00:49.6'
      - '00:50.0'
    - - '01:04.6'
      - '01:11.1'
    - - '01:24.1'
      - '01:24.1'
    - - '01:28.1'
      - '01:31.1'
  - id: FP4
    item: 'Tiebreak scoring with an end: tiebreak points are counted one by one toward 7, not 15-30-40, the first side to reach the target (by
      the rule the game states) wins the set, and the game then shows the result and lets the player continue or restart'
    anchors:
      '1': a single-point count toward 7, a winner declared when it is reached, and a way to play again; a win-by-two rule is not required
      '0.5': single points counted toward a target, but the end is unclear or there is no way to continue
      '0': no score, a score that does not count single points (e.g. 15-30-40 only), or no target that ends the game
    evidence:
    - - '00:49.6'
      - '00:50.0'
    - - '01:04.6'
      - '01:04.6'
    - - '01:24.1'
      - '01:24.1'
    - - '01:28.1'
      - '01:28.6'
  - id: FP5
    item: 'Set point arises from the score: when a side is one point from winning the tiebreak and so the set, the game flags set point and the
      flag stays up while that point is played'
    anchors:
      '1': the flag appears exactly when a side is one point from winning and is visible during the following point
      '0.5': a flag appears but at the wrong score, or disappears before the point is played
      '0': no such state
    evidence:
    - - '01:24.1'
      - '01:24.1'
    - - '01:28.1'
      - '01:39.1'
  - id: FP6
    item: 'Player control decides rallies: the player''s movement and hitting input decide whether the ball comes back, and the player can send
      it to different sides of the court'
    anchors:
      '1': reaching the ball needs movement and timing, and input sends the return to clearly different sides of the opponent's court
      '0.5': only hit-or-miss timing with a fixed return path, or the player never needs to move
      '0': returns are automatic
    evidence:
    - - '00:50.0'
      - '01:01.6'
    - - '01:31.1'
      - '01:39.1'
  visual_presentation:
  - id: VP1
    cat: spatial
    keyframes:
    - '00:50.1'
    - '01:12.1'
    item: 'The court reads as a tennis court in play: the net and the boundary lines are readable together with both players at opposite ends'
    anchors:
      '1': net, boundary lines and the two opposing players at opposite ends readable in one view
      '0.5': the court is there but the net or the lines are hard to read, or both sides are never visible together
      '0': the play space does not read as a court
    evidence:
    - - '00:49.6'
      - '01:01.6'
    - - '01:10.6'
      - '01:21.1'
  - id: VP2
    cat: key_moment
    keyframes:
    - '01:09.1'
    - '01:10.1'
    - '01:10.6'
    item: 'The serve looks like a tennis serve: the ball is tossed up and struck overhead'
    anchors:
      '1': a recognisable serving motion showing both the toss and the overhead strike
      '0.5': only one of the toss or the overhead strike is shown, or the motion does not read as a serve (e.g. a ground-stroke swing)
      '0': no serving motion is shown
    evidence:
    - - '01:08.6'
      - '01:11.1'
  - id: VP3
    cat: presentation
    keyframes:
    - '00:49.6'
    - '01:04.6'
    - '01:28.1'
    item: 'The match state stays readable during play: the scoreboard is on screen while points are played and its score, server marker and tag
      can be read without stopping play'
    anchors:
      '1': the scoreboard is readable throughout the rallies, not hidden by the action or shown only between points
      '0.5': readable only between points, or partly covered or too small during play
      '0': no on-screen match state
    evidence:
    - - '00:49.6'
      - '01:39.1'
play_suggestions:
  FP1:
  - 'play several points returning only to the middle: does the opponent move and hit back?'
  - 'hit to the far corners: does the opponent chase the ball or stay put?'
  FP2:
  - 'let a ball pass without swinging, and hit one far out or into the net: who gets the point?'
  - count how many points the opponent wins by its own shot rather than by your miss
  - after each point, check that both sides reset and the next point starts
  FP3:
  - 'note who serves each point through a whole tiebreak: does the server change after the first point and then after every two points?'
  - try to serve from inside the court or out of turn
  FP4:
  - 'play a tiebreak to its end: is a winner named, and can you play again?'
  - 'lose it on purpose: is the result shown just as clearly?'
  FP5:
  - 'reach one point from winning for yourself, then let the opponent reach it: does the flag appear for both?'
  - 'win and lose a flagged point: does the flag clear or end the game correctly?'
  FP6:
  - return the same ball to different sides and depths
  - 'stand still during a rally: can the opponent win by placing the ball away from you?'
  robustness:
  - quit or restart in the middle of the tiebreak and check the score resets
  - run far out of the court during a rally and back
  - check that the target game's normal combat or enemies do not break or interrupt a point
