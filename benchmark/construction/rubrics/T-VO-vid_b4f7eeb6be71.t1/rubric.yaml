rubric:
  content_realization:
  - id: CR1
    item: 'The game contains a target face of concentric scoring rings: a small centre ring worth the most and ring values falling outward'
    anchors:
      '1': a target with several concentric rings whose values fall from a highest-valued centre outward
      '0.5': a target with a highest-valued centre but no graded rings (e.g. centre / rest only), or rings whose values do not fall outward
      '0': no ringed target
    evidence:
    - - '01:34.6'
      - '01:39.6'
    - - '02:27.6'
      - '02:29.1'
  - id: CR2
    item: 'The game contains a shooting range: a shooting position for the archer facing ringed targets set far away across open ground'
    anchors:
      '1': a recognisable shooting position and distant ringed targets across open ground, the distance clearly long against the target's centre
      '0.5': a shooting position and a target, but the target is close or the shooting position is not recognisable
      '0': no recognisable range
    evidence:
    - - '01:28.6'
      - '01:41.4'
    - - '02:09.6'
      - '02:16.0'
  - id: CR3
    item: The match has two opposing sides (the player against an opponent or a second player), each with its own per-arrow scores, end total
      and set points
    anchors:
      '1': two sides, each with per-arrow scores, an end total and a separate set-points tally
      '0.5': two sides with a single running score each, or end totals without a set-points tally
      '0': no opponent (a solo score attack) or no match tallies
    evidence:
    - - '01:56.6'
      - '01:56.6'
    - - '02:25.6'
      - '02:29.1'
  functions_playability:
  - id: FP1
    item: 'Draw to a repeatable full draw, then release: the player draws and holds the shot, a clear signal marks the same full-draw point every
      time (like the clicker), and shots released at that signal behave consistently'
    anchors:
      '1': a draw-and-hold phase with a clearly signalled, repeatable full-draw point, and shots released at it behave consistently
      '0.5': a draw or charge exists but there is no recognisable full-draw signal, or shots released at it vary without cause
      '0': a single click fires instantly
    evidence:
    - - '01:41.4'
      - '01:53.7'
  - id: FP2
    item: 'Arrow flight: the released projectile visibly travels on an arc to a distant target and takes a noticeable moment to arrive, and where
      it lands follows the aim'
    anchors:
      '1': a visible, non-instant, curved flight to a far target that lands where it was aimed (within the player's error)
      '0.5': a visible projectile, but straight and near-instant, or the landing point is unrelated to the aim
      '0': hitscan or no projectile
    evidence:
    - - '02:03.1'
      - '02:23.8'
  - id: FP3
    item: 'Ring scoring: each arrow is awarded the value of the ring it actually lands in'
    anchors:
      '1': every shot's score matches the ring it landed in, centre highest
      '0.5': hit / miss only, or scores that do not match the landing point
      '0': shots are not scored
    evidence:
    - - '01:34.6'
      - '01:39.6'
    - - '02:27.6'
      - '02:29.1'
  - id: FP4
    item: 'Head-to-head match play: the two sides shoot in alternation, arrow scores add up into end totals, set points are awarded from the ends
      by one consistent rule and carried across them, and the match goes on end after end until it reaches a result that agrees with the set points'
    anchors:
      '1': alternating turns, per-arrow scores summed into end totals, set points awarded consistently from the ends and carried across them,
        and a match that reaches a result agreeing with the set points
      '0.5': turns and scores work, but end totals are not summed, set points never change or contradict the end results, play stalls after one
        end, or the match never reaches a result
      '0': no working match flow
    evidence:
    - - '01:56.6'
      - '01:56.6'
    - - '02:25.6'
      - '02:29.1'
  - id: FP5
    item: 'Shot clock: each archer has their own countdown that runs only on their turn while the other''s waits at full time, and it is back
      at full time when that side''s next turn comes'
    anchors:
      '1': a per-archer countdown that runs only for the active shooter, the waiting side's clock at full time, reset for each turn
      '0.5': a timer exists but is global, runs for both sides at once, or never resets
      '0': no time limit
    evidence:
    - - '01:56.6'
      - '01:56.6'
    - - '02:25.6'
      - '02:29.1'
  - id: FP6
    item: 'Aiming and precision: an aiming reference (like the sight pin) lets the player hold a point of aim on the target centre, the top-scoring
      centre is small at the shooting distance, so careful aiming can hit it while a slight aim or timing error drops the arrow into lower rings;
      results depend on the player''s skill, not chance'
    anchors:
      '1': a usable aiming reference tied to where shots land, a centre hittable with care where a small error visibly costs points, and careful
        shots scoring better than careless ones
      '0.5': no usable aiming reference, or the target is either trivially easy (centre every time) or nearly impossible, or results look random
      '0': no aiming challenge
    evidence:
    - - '01:28.6'
      - '01:41.4'
    - - '02:23.8'
      - '02:29.1'
  visual_presentation:
  - id: VP1
    cat: key_moment
    keyframes:
    - '02:04.6'
    - '02:07.6'
    - '02:08.6'
    item: 'The shot: the player shoots with a recognisable bow and arrow; the bow''s forward jump / swing at release and its stabiliser rods are not
      required'
    anchors:
      '1': a recognisable bow and a recognisable arrow at the shot (a forward jump / swing of the bow or stabiliser rods may add to it but are not
        needed)
      '0.5': only one of bow or arrow is recognisable, or a generic weapon is used but shows a visible kick or recoil at release
      '0': neither a recognisable bow nor arrow, and no visible reaction at release
    evidence:
    - - '02:03.6'
      - '02:10.0'
  - id: VP2
    cat: style
    keyframes:
    - '01:36.6'
    - '02:27.6'
    item: 'The target face looks like an archery target: a gold centre, then red, blue, black and white rings outward'
    anchors:
      '1': rings coloured gold at the centre, then red, blue, black and white outward
      '0.5': coloured concentric rings, but not in this order or with only some of the colours
      '0': plain or uncoloured rings, or no ringed face
    evidence:
    - - '01:34.6'
      - '01:39.6'
    - - '02:27.6'
      - '02:29.1'
  - id: VP3
    cat: presentation
    keyframes:
    - '02:25.6'
    - '02:27.6'
    item: 'Readable match state: a scoreboard shows both sides'' per-arrow scores, end totals, set points and the running shot clock, and the
      player can make out which ring each arrow landed in on the target face'
    anchors:
      '1': per-arrow scores, totals, set points and the clock readable together, and where the arrows landed on the face can be made out
      '0.5': only a total score, or where the arrows landed cannot be made out
      '0': no score display
    evidence:
    - - '01:56.6'
      - '01:56.6'
    - - '02:25.6'
      - '02:29.1'
play_suggestions:
  FP1:
  - 'draw and hold just short of the full-draw signal, release: compare with a full-draw release (counter-case, unscored)'
  - 'release at full draw several times aiming at the same point: are the shots consistent?'
  FP2:
  - 'shoot at the farthest target and watch the projectile: does it arc and take time?'
  - 'aim high, low and to the side: does the landing point move accordingly?'
  FP3:
  - hit the centre, an outer ring and miss the face entirely; compare the scores with the landing points (a miss should sensibly score nothing)
  - hit a ring boundary
  FP4:
  - 'play several ends: do turns alternate, do end totals and set points update?'
  - 'play to the end of a match: is a winner declared and does it agree with the set points?'
  - 'after the result: can you play again? (unscored)'
  FP5:
  - 'wait without shooting until the clock runs out: what happens?'
  - check that only the active shooter's clock runs and that it resets each turn
  FP6:
  - 'take ten careful shots and ten hasty ones: does care score better?'
  - try to hit the centre from the shooting line repeatedly
  - check that the aiming reference matches where arrows land
  robustness:
  - shoot during the opponent's turn
  - move off the shooting line or walk toward the targets mid-match
  - spam the fire input while drawing
  - leave in the middle of a match and come back
