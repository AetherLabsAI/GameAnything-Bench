# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-TO-txt_3d7bba04a8dc.e1
source_inventory:
- 'c10.p001-c10.p004: a merry dinner (Holmes brilliant after days of gloom, Jones sociable); a toast to the expedition; Watson is told to bring
  his revolver'
- 'c10.p005-c10.p014: at Westminster wharf they board a fast police launch, its green police lamp removed; crew of four plus Jones, Holmes, Watson;
  heading for the Tower, opposite Jacobson''s Yard; the launch outpaces barges and a steamer'
- 'c10.p015-c10.p019: Holmes explains his reasoning: the Aurora was at no wharf; Small needed time to settle his affairs and his companion''s
  look would draw gossip, so they did not go far and kept the launch for a final night escape to a ship at Gravesend'
- 'c10.p020-c10.p023: the launch must be hidden close by: handed to a boat-builder for a trifling repair; Holmes searched the yards in disguise
  and found it at the sixteenth, Jacobson''s; Mordecai Smith, the drunk owner, ordered it for eight o''clock; a boy is posted as sentry to wave
  a handkerchief when they start'
- 'c10.p024-c10.p027: Jones would have put police in the yard, Watson would have followed Smith; Holmes rejects both (Small would scout and lie
  low; Smith knows nothing)'
- 'c10.p028-c10.p034: the launch runs under the bridges past St Paul''s at sunset; at twilight it cruises off Jacobson''s Yard behind a string
  of lighters; Holmes watches the sentry through night-glasses; talk about the yard workers and the riddle of man'
- 'c10.p035-c10.p040: Holmes on Winwood Reade (individuals unpredictable, averages certain); the handkerchief flutters; the Aurora has slipped
  out and is flying downstream; Jones doubts they can catch her; Holmes orders every pound of steam'
- 'c10.p041-c10.p044: the night chase: roaring furnaces, the bow lantern''s beam, the Aurora a dark blur ahead with white foam; weaving past barges,
  steamers and merchant ships; they gain a little'
- 'c10.p045 (first half): a tug with three barges cuts across; they swerve and lose about two hundred yards; the run goes through the Pool, past
  the West India Docks, Deptford Reach, round the Isle of Dogs; the search-light shows the figures on the Aurora''s deck (a crouching man, a dark
  bundle, the boy at the tiller, Smith stoking)'
- 'c10.p045 (second half): they close yard by yard (three hundred paces at Greenwich, two hundred and fifty at Blackwall); Jones hails them between
  Barking Level and Plumstead Marshes; the man in the stern stands and curses: he has a wooden right leg; the bundle rises as a small man with
  tangled hair; Holmes and Watson draw revolvers'
- 'c10.p046-c10.p048: the small man raises a blow-pipe, both pistols fire; the wooden-legged man runs the launch onto the southern mud-bank of
  a moonlit marsh; he jumps out, his stump sinks in the mud and he is hauled aboard with a rope; the Smiths surrender; a heavy, keyless Indian
  iron chest is taken; no trace of the Islander, whose bones lie in the river ooze; a dart is found stuck just behind where they stood'
- 'c11.p001-c11.p007: the captive, Jonathan Small, described (sunburned, about fifty, bearded jutting chin, grey-shot curly hair, more sorrow
  than anger); he swears Tonga killed Mr. Sholto with a dart without his part; he says he would gladly have killed the old major; he calls the
  Agra treasure a curse on everyone who held it'
- 'c11.p008-c11.p012: Jones congratulates them, regrets the other was not taken alive; Smith innocent and the Aurora among the fastest launches;
  Small says they were to reach the Esmeralda at Gravesend, bound for Brazil'
- 'c11.p013-c11.p018: Jones lets Watson take the chest to Miss Morstan with an inspector; the key is at the bottom of the river, says Small; Watson
  drives to Mrs. Cecil Forrester''s house'
- 'c11.p019-c11.p031: Miss Morstan, melancholy by the lamp, brightens at Watson''s arrival; he presents the treasure (half hers, half Thaddeus
  Sholto''s) with forced joy; she is cool; he tells the chase and she pales at the dart'
- 'c11.p032-c11.p037: the heavy Benares-work chest is levered open at its Buddha hasp with a poker: it is completely empty; ''The treasure is
  lost,'' she says'
- 'c11.p038-c11.p041: Watson feels relief, the ''golden barrier'' gone; he says he loves her; she returns it'
- 'c12.p001-c12.p006: the inspector mourns his lost reward; at Baker Street Jones is dismayed by the empty box; Small laughs aloud'
- 'c12.p007-c12.p009: Small: the treasure is his and three men''s in the Andaman convict-barracks; ''the sign of four''; he threw it in the Thames
  when the launch had to catch them, rather than let Sholto''s or Morstan''s kin have it; scattered over some five miles, harder to recover than
  a box'
- 'c12.p010-c12.p013: Jones invokes justice; Small erupts: twenty years in a fever swamp earned the treasure; Holmes asks to hear his story and
  Small agrees to tell the truth'
- 'c12.p014-c12.p016: Small''s youth near Pershore; joins the army for India; loses his right leg while swimming in the Ganges, saved by his sergeant;
  invalided out, becomes an overseer on an indigo plantation'
- 'c12.p017: the mutiny breaks out; his fellow workers found dead, the bungalow burning, rebels around it; he flees across paddy-fields to Agra'
- 'c12.p018-c12.p019: Agra a precarious refuge; Small joins the volunteers; after a failed sortie they fall back on the city, in the heart of
  the revolt'
- 'c12.p020-c12.p022: the garrison holds the old fort: a modern part and a vast, deserted old quarter of halls and twisting passages; each gate
  held by one white man and two or three natives; Small guards an isolated south-west door with two Sikhs, far from the central guard'
- 'c12.p023-c12.p026: on a rainy third night the two Sikhs seize him with musket and knife; ''with us or silenced''; he refuses anything against
  the fort''s safety'
- 'c12.p027-c12.p035: Abdullah Khan offers a quarter of a treasure by an unbreakable oath; a rajah has split his hoard and sent his jewels in
  an iron box with a servant disguised as the merchant Achmet; Dost Akbar will lead Achmet to this postern to be killed'
- 'c12.p036-c12.p041: Small, thinking of riches, agrees ''heart and soul''; his musket is returned; the plan is Dost Akbar''s'
- 'c12.p042-c12.p049: in rain and darkness a shaded lantern crosses the moat; Small challenges and lights up a giant Sikh and a small, frightened
  fat man with a bundle who begs protection'
- 'c12.p050-c12.p054: the bundle holds an iron box; the Sikhs lead the merchant in; a scuffle; the merchant runs back past Small chased by the
  giant with a knife; Small throws his musket between his legs and he falls'
- 'c12.p055-c12.p057: Watson''s horror at Small and his flippancy; Small argues it was his life or the merchant''s'
- 'c12.p058-c12.p059: the body is buried under loose bricks in a sunken floor of a ruined hall; the chest opened by lantern light holds a dazzling
  counted list of gems (diamonds including the ''Great Mogul'', emeralds, rubies, sapphires, pearls; a pearl coronet later missing)'
- 'c12.p060: the four renew their oath, hide the chest in a hollow in the best-preserved wall of the same hall to divide when peace comes; Small
  draws four plans signed with the sign of the four: each always acts for all'
- 'c12.p061-c12.p062: the mutiny is crushed; a second servant of the rajah, set to shadow Achmet, raises the alarm; the body is found; the four
  are tried for murder (the jewels never mentioned): the Sikhs get life, Small''s death sentence is commuted to the same'
- 'c12.p063-c12.p064: imprisoned with their secret; Small moved to the Andamans (Blair Island, Hope Town), trusted, dispenses drugs for the surgeon,
  always looking for escape'
- 'c12.p065-c12.p066: through a window Small watches the officers'' card games; the soldiers (Major Sholto, Captain Morstan, Lieutenant Bromley
  Brown) lose to the prison officials; Sholto worst, drinking'
- 'c12.p067-c12.p080: Sholto, ruined, is overheard with his friend Morstan; Small offers him the secret of hidden treasure ''for the authorities'';
  Sholto is tempted and hears the (disguised) story'
- 'c12.p081-c12.p099: Sholto and Morstan bargain at night: Small asks freedom for himself and his three companions in return for a fifth share;
  Sholto wants only Small freed; ''None or all ... four or none'''
- 'c12.p100: agreement with all four present: charts given to the officers; Sholto to verify the treasure, send a yacht to Rutland Island and
  return; Morstan to meet them at Agra for the division; two charts signed with the sign of four'
- 'c12.p101: Sholto goes to India and never returns (an uncle''s fortune, leaves the army); Morstan finds the treasure gone; Small lives only
  for vengeance on Sholto'
- 'c12.p102-c12.p104: Small nurses a dying Andaman Islander, Tonga, who becomes devoted to him; Tonga brings his canoe; at the wharf Small unstraps
  his leg and attacks a hated guard; they escape to sea under a mat sail and are picked up by a pilgrim ship'
- 'c12.p105-c12.p106: years of wandering; in England Small finds Sholto guarded by prize-fighters, sons and a servant; Sholto dies before he can
  reach him; Small searches his papers in vain and pins the sign of the four on his body'
- 'c12.p107-c12.p108: the treasure is found in Bartholomew Sholto''s roof laboratory; Tonga climbs in by the roof with a rope and kills Bartholomew
  uninstructed; Small beats him with the rope''s end, takes the box, leaves the sign of the four; he hires Smith''s fast Aurora; he tells all
  to show how Sholto wronged him and that he is innocent of the son''s death'
- 'c12.p109-c12.p116: Holmes says the account adds only the rope; Tonga''s last dart was the one in his blow-pipe; Jones takes Small away under
  guard'
- 'c12.p117-c12.p128: Watson announces his engagement to Miss Morstan; Holmes cannot congratulate him (love clouds reason), praises her; reaction
  sets in; the butler Lal Rao was the confederate; Watson: he gets a wife, Jones the credit; Holmes: ''the cocaine-bottle'''
