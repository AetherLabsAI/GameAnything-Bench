rubric:
  content_realization:
  - id: CR1
    item: The game contains Jonathan Small, the captured fugitive, as a one-legged former soldier and convict who holds the treasure to be rightfully
      his, earned by his years of suffering in prison
    anchors:
      '1': Small is in the game as the wooden-legged ex-soldier / ex-convict who claims the treasure by right of what he suffered for it
      '0.5': Small is in the game as the wooden-legged fugitive or thief without his claim to the treasure, or the claim is given without who
        he is
      '0': Small is missing, or confused with another character
    evidence:
    - c10.p045
    - c11.p007
    - - c12.p007
      - c12.p011
    - c12.p015
  - id: CR2
    item: 'The game shows why the recovered chest is empty: Small, seeing that the pursuers would catch him, threw the treasure into the river
      so that nobody outside the four sworn men could have it'
    anchors:
      '1': the empty chest is explained in the game by Small disposing of the treasure in the river during the chase, with his motive (no one
        outside the four, in particular no Sholto or Morstan kin, shall have it)
      '0.5': the game says Small got rid of the treasure, but the motive is missing or wrong
      '0': no explanation of the empty chest, or the treasure is found / still in the chest
    evidence:
    - - c11.p035
      - c11.p037
    - - c12.p005
      - c12.p009
  - id: CR3
    item: The game shows the loss of the treasure freeing Watson to declare his love to Miss Morstan, since her coming fortune had kept him silent;
      she accepts him
    anchors:
      '1': 'the causal link is in the game: the empty chest removes the barrier of her wealth, Watson declares his love and she accepts'
      '0.5': the romance or engagement is in the game without its link to the lost treasure
      '0': no romance between Watson and Miss Morstan in the game
    evidence:
    - - c11.p021
      - c11.p023
    - - c11.p038
      - c11.p041
    - c12.p117
  - id: CR4
    item: 'The game contains the treasure''s origin: at the Agra fort during the mutiny, Small, under threat and for a share, joins three conspirators
      in murdering the man carrying the hoard into the fort, and the four men swear an oath to share it and always act together'
    anchors:
      '1': the game shows the hoard-carrier's murder at the fort by Small and his three accomplices, and the oath binding the four to share and
        act as one
      '0.5': the murder and theft without the binding oath of the four, or the oath without how the treasure was obtained
      '0': no origin of the treasure in the game, or a different one (e.g. found, inherited, or first stolen by Sholto)
    evidence:
    - - c12.p023
      - c12.p041
    - - c12.p053
      - c12.p054
    - c12.p060
  - id: CR5
    item: 'The game contains, in order and cause, Small''s road to London: convicted of the merchant''s murder, he sells the secret to the officers
      Sholto and Morstan for the freedom of all four; Sholto takes the treasure and breaks the bargain, which turns Small to vengeance'
    anchors:
      '1': 'in order in the game: conviction, the bargain with Sholto and Morstan (freedom for all four for a share), Sholto''s betrayal, Small''s
        turn to revenge on Sholto'
      '0.5': Sholto's betrayal is in the game, but the bargain or the resulting revenge motive is missing, or the order is wrong
      '0': missing, or the betrayer is someone else (e.g. Morstan or the Sikhs)
    evidence:
    - - c12.p061
      - c12.p062
    - - c12.p086
      - c12.p100
    - c12.p101
    - c12.p105
  - id: CR6
    item: The game contains Tonga, the Islander devoted to Small, killing Bartholomew Sholto on his own during the theft; Small did not order
      it and disowns the killing
    anchors:
      '1': Tonga is in the game as Small's devoted companion, and the son's death is shown as Tonga's unordered act that Small disowns
      '0.5': Tonga is the killer acting unbidden, but his bond to Small or Small's disowning of the killing is missing
      '0': missing, Small or someone else is the killer, or Small orders the killing
    evidence:
    - c11.p003
    - - c12.p102
      - c12.p104
    - c12.p107
    - c12.p108
  functions_playability:
  - id: FP1
    item: 'The hunt moves from locating the fugitives to the chase: the hidden boat is first found by Holmes''s reasoning about where it must
      be kept concealed yet ready, a watch is set on it, and the pursuit starts from its departure'
    anchors:
      '1': a locating phase (reasoning, search or watch) that finds the hidden boat, and the pursuit begins when the watched boat moves
      '0.5': a locating phase exists but the pursuit does not follow from it, or the transition into the chase is unclear
      '0': no locating phase; the chase simply starts with the quarry already in sight, or the boat is found by chance or a tip-off
    evidence:
    - - c10.p017
      - c10.p023
    - - c10.p029
      - c10.p038
  - id: FP2
    item: A river pursuit of a fast fugitive boat in which catching up is not a foregone outcome, and closing in on the quarry leads to its capture
    anchors:
      '1': the player pursues the fugitive boat on the river, catching up is not automatic (the quarry can pull away or the pursuit can be held
        up), and closing in ends in Small being caught
      '0.5': a pursuit exists but closes on its own regardless of play, or the capture does not follow from closing in
      '0': no pursuit, or the capture happens without a chase
    evidence:
    - - c10.p038
      - c10.p045
    - c10.p047
    - c11.p010
  - id: FP3
    item: The recovered chest is opened after the capture and turns out to be empty, a reversal the player reaches through the story's flow
    anchors:
      '1': after the chase the chest is opened in play and found empty
      '0.5': the chest is found empty but out of the story's flow (e.g. before the capture, or only outside normal play)
      '0': no chest opening, or the treasure is recovered
    evidence:
    - - c11.p035
      - c11.p037
    - c12.p005
  - id: FP4
    item: Watson's declaration of love to Miss Morstan and her acceptance are a story beat the player reaches in normal play after the empty-chest
      reveal
    anchors:
      '1': the declaration and acceptance are reached in normal play, after the chest has been opened empty
      '0.5': the romance is present but cannot be reached through normal play, or comes before the chest reveal
      '0': no romance beat in the experience
    evidence:
    - - c11.p038
      - c11.p041
    - c12.p117
  - id: FP5
    item: Small's account of the past is a story stage of its own that the player reaches after the empty-chest reveal and can follow through
      to its end (told, read or played)
    anchors:
      '1': the account is reached in normal play after the chest reveal and can be followed to its end before the story closes
      '0.5': the account is present but cannot be reached through normal play, comes out of sequence, or breaks off before its end
      '0': no account of the past in the experience
    evidence:
    - - c12.p013
      - c12.p108
  - id: FP6
    item: 'The story closes after the account: Small is taken into custody and the experience reaches a clear ending'
    anchors:
      '1': after the account the culprit is taken away and the story reaches a clear ending
      '0.5': the experience stops after the capture or the account without a clear close (e.g. Small's fate left hanging)
      '0': no ending; the experience breaks off or loops without closure
    evidence:
    - - c12.p114
      - c12.p117
    - c12.p128
  visual_presentation:
  - id: VP1
    cat: spatial
    item: The chase space looks like a river at night whose surroundings change from a busy city reach to a desolate, empty stretch where the
      chase ends
    anchors:
      '1': a night river with the change readable from an active city reach upstream to an empty, isolated stretch downstream
      '0.5': a night river but the same along its length (no busy city reach or no isolated downstream stretch)
      '0': no river setting, or a daylight / open-sea setting
    evidence:
    - c10.p028
    - c10.p041
    - c10.p045
    - c10.p047
  - id: VP2
    cat: key_moment
    item: 'The empty chest: the recovered treasure chest opened to show nothing inside'
    anchors:
      '1': a set-apart moment of the chest opened and visibly empty
      '0.5': the emptiness given only as text or a message
      '0': no chest-opening moment
    evidence:
    - - c11.p032
      - c11.p036
  - id: VP3
    cat: spatial
    item: 'The Agra fort''s old quarter: a deserted, labyrinthine part of the fort where the murder and the hiding of the treasure take place'
    anchors:
      '1': the fort's old quarter shown as a deserted, maze-like place where the backstory takes place
      '0.5': a fort or stronghold shown without its deserted, maze-like character, or the place only named
      '0': the fort is not shown
    evidence:
    - - c12.p020
      - c12.p022
    - c12.p054
    - c12.p058
    - c12.p060
play_suggestions:
  FP1:
  - 'start the hunt: is the hidden boat found first, and does the chase start from that discovery?'
  - 'try to start the pursuit before the boat is located or has moved: what happens?'
  FP2:
  - 'fall behind on purpose (slow down, steer badly): can the quarry pull away or escape?'
  - 'push hard all the way: does closing in lead to the capture?'
  FP3:
  - 'after the capture, open the chest: is it empty?'
  - 'try to reach the chest before the capture: what happens?'
  FP4:
  - 'after the chest reveal, go on: do Watson and Miss Morstan reach the declaration and acceptance in normal play?'
  FP5:
  - 'after the chest reveal, go on: is Small''s account reached, and can it be followed to its end?'
  FP6:
  - 'play to the end: is Small taken away and does the story close?'
  - 'after the ending: can the experience be ended or replayed?'
  robustness:
  - 'lose the chase: is there a sensible failure and a retry?'
  - 'skip or rush through dialogue: does the story still progress coherently?'
  - 'quit mid-chase and resume: is the state kept or cleanly restarted?'
