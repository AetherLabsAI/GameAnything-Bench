- 'img04: photo of two free-standing stone arches on a ruined wall among bare trees in thick fog'
- 'img05: photo of a roofless Gothic abbey ruin on a meadow in morning mist, a stone wall in front'
- 'img06: photo of a broken masonry arch bridge that ends part-way across a river, a small chapel on it, evening light'
- 'img07: old photo of a stone bridge with one tall pointed arch and a small house on top, a jagged mountain behind'
- 'img08: photo of a natural rock arch spanning a forest stream'
