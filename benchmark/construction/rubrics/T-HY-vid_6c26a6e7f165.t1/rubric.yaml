- 'clip 00:33.0-00:35.0: dark castle and cathedral silhouettes over a misty, blue-lit marsh, the glowing tree above them'
- 'clip 00:35.5-00:37.0: jagged mountain range under a golden sky, banner and small fires in a field; subtitle ''The golden order is broken to
