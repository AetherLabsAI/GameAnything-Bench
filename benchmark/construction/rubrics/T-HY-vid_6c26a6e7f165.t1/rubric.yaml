- 'clip 00:37.5-00:39.0: ruins with stone debris floating in a white sky'
- 'clip 00:39.5-00:41.5: a lone bonfire under a large dark tree at night, a figure beside it'
- 'clip 00:42.0-00:43.5: an armoured warrior seen from behind in tall grass at sunset, a pillar of light in the distance'
- 'clip 00:44.0-00:45.5: a figure wrapped in blue-white sparkling light on a rock, golden rays behind'
- 'clip 00:46.0-00:47.5: a rider leaps from a rock outcrop under the glowing tree; a stone pillar with a horned figure; a rider passes rocks'
- 'clip 00:48.0-00:49.5: a rider through a misty forest with shafts of light'
- 'clip 00:50.0-00:51.0: grassland with rock pillars above a fog-filled valley, a castle on a crag in the distance, a rider in the foreground;
