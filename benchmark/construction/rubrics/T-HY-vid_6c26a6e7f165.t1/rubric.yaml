rubric:
  content_realization:
  - id: CR1
    item: The game contains an enormous tree up in the sky that towers over the ruins and dominates the skyline of the region
    anchors:
      '1': a gigantic tree set high in the sky above the ruins, dominating the skyline
      '0.5': a large tree, but on the ground or not clearly above the ruins / not dominating the skyline
      '0': no such tree
    evidence:
    - - '00:25.0'
      - '00:30.5'
    - - '00:33.0'
      - '00:35.0'
    - - '00:46.0'
      - '00:46.5'
  - id: CR2
    item: 'The game contains the arcade as a ruin: a row of broken, roofless stone arches standing among fallen stones'
    anchors:
      '1': a recognisable row of free-standing broken arches in rubble
      '0.5': a ruin without the arched row, or a row of intact arches
      '0': no arcade
    evidence:
    - - '00:25.0'
      - '00:30.5'
    - img01
    - img03
    - img04
  - id: CR3
    cross: true
    item: A deep gorge splits the region as on the map img01 (tree and arcade on one side, statue and castle on the other), and the crossing that
      joins the two sides is a narrow stone span like the clip's
    anchors:
      '1': the gorge divides the region along the map's line and is crossed by a narrow stone span like the clip's
      '0.5': 'only one reference carried: the map''s gorge and crossing with an ordinary bridge, or a clip-like stone span not placed as the map''s
        divide'
      '0': no gorge or no crossing
    evidence:
    - img01
    - - '00:51.5'
      - '00:54.0'
  - id: CR4
    item: The game contains the colossal stone statue with a great bell hanging from it, standing with a gap between its feet wide and high enough
      for a mounted player to pass through
    anchors:
      '1': a giant stone figure with a hanging bell, its feet set apart with visible room for a mounted player beneath
      '0.5': a large statue without the bell, or a bell statue too small or too closed for a rider to fit between its feet
      '0': no statue
    evidence:
    - - '00:54.5'
      - '00:56.0'
    - img01
  - id: CR5
    item: The game contains a ruined castle on a height at the far end of the region, beyond the gorge
    anchors:
      '1': a ruined castle on a hilltop or crag on the far side, as the route's end
      '0.5': a castle present but not on a height, or not on the far side
      '0': no castle
    evidence:
    - img01
    - - '00:33.0'
      - '00:35.0'
    - - '00:50.0'
      - '00:51.0'
    - - '00:51.5'
      - '00:54.0'
  - id: CR6
    item: 'The landmarks lie on one connected route in the map img01''s arrangement: it starts at the tree, branches to the arcade on the near
      side, crosses the bridge, branches to the statue and climbs to the castle as the end'
    anchors:
      '1': one route with the map's positions and order, tree first and castle last
      '0.5': the landmarks present but the order, the branches or the start / end differ from the map
      '0': no route, or the landmarks placed without relation to the map
    evidence:
    - img01
  functions_playability:
  - id: FP1
    item: The player can travel the route from the tree to the castle in normal play and reach every landmark on it, the side branches included
    anchors:
      '1': the whole route can be walked or ridden from start to end and every landmark is reached
      '0.5': the route works but one landmark cannot be reached, or a stretch needs leaving the way or building
      '0': no traversable route
    evidence:
    - img01
    - - '00:46.0'
      - '00:54.0'
  - id: FP2
    item: 'The gorge works as the divide of the region: it is too deep to simply walk through, and the bridge is a way across it that the player
      can walk or ride over'
    anchors:
      '1': the gorge is not simply walked through and the bridge is the clear way across that carries the player
      '0.5': a bridge exists but the gorge is shallow enough to walk through anywhere, or the bridge is decorative
      '0': no gorge or no crossing
    evidence:
    - img01
    - - '00:51.5'
      - '00:54.0'
  - id: FP3
    item: 'Distant landmarks guide the way: from the route the glowing tree and the castle are visible far away across the valleys, so the player
      can steer toward them'
    anchors:
      '1': the tree and the castle can be seen from afar along the route and serve as goals
      '0.5': only one of them is visible from a distance, or only from close by
      '0': landmarks are seen only when the player is next to them
    evidence:
    - - '00:33.0'
      - '00:35.0'
    - - '00:46.0'
      - '00:46.5'
    - - '00:50.0'
      - '00:54.0'
    - img01
  visual_presentation:
  - id: VP1
    cat: spatial
    keyframes:
    - '00:28.5'
    - '00:30.0'
    - '00:34.0'
    item: The sky tree glows golden and sends shafts of light down through the haze onto the land
    anchors:
      '1': a golden glow with visible light shafts falling over the ruins and the land
      '0.5': a glowing tree without light shafts, or shafts without a golden glow
      '0': a plain, unlit tree
    evidence:
    - - '00:25.0'
      - '00:30.5'
    - - '00:33.0'
      - '00:35.0'
  - id: VP2
    cat: spatial
    keyframes:
    - '00:52.0'
    - '00:53.5'
    item: 'The crossing looks like the clip''s: a weathered stone span high above the gorge with mist filling the drop below'
    anchors:
      '1': a weathered stone span over a deep drop filled with mist
      '0.5': a stone span without mist below, or a crossing that looks new or wooden
      '0': none
    evidence:
    - - '00:51.5'
      - '00:54.0'
    - img06
    - img07
    - img08
  - id: VP3
    cat: key_moment
    keyframes:
    - '00:55.0'
    item: 'The statue''s surface looks like the clip''s: old, weathered stone grown over with moss'
    anchors:
      '1': weathered, moss-grown old stone like the clip's
      '0.5': stone that looks old but bare of moss, or moss on clean, new-looking stone
      '0': a clean, new-looking statue, or none
    evidence:
    - - '00:54.5'
      - '00:56.0'
  - id: VP4
    cat: style
    keyframes:
    - '00:34.0'
    - '00:50.5'
    - '00:42.0'
    item: Mist fills the valleys and lies between the viewer and distant landmarks, under warm golden or dusk light
    anchors:
      '1': layered valley fog and golden / dusk light across the region
      '0.5': fog or the light, but not both, or only in one spot
      '0': clear, neutral daylight
    evidence:
    - - '00:33.0'
      - '00:35.0'
    - - '00:42.0'
      - '00:43.5'
    - - '00:50.0'
      - '00:54.0'
    - img04
    - img05
play_suggestions:
  FP1:
  - 'start at the tree and follow the route: are the landmarks met in the map''s order, and does it end at the castle?'
  - compare each stop with the clip shots of the arcade, the bridge and the statue
  - 'check the side branches: is the arcade off the main way, the statue reached after the bridge?'
  - 'at the statue, ride a mount between its feet: does the rider pass through without getting stuck?'
  FP2:
  - try to cross the gorge away from the bridge (walk down, jump, swim)
  - walk and ride across the bridge
  FP3:
  - 'from the start and from the bridge, turn the camera: can the glowing tree and the castle be seen?'
  - steer only by sight toward the castle
  robustness:
  - travel the route backwards from the castle to the tree
  - 'leave the route and wander off: can you find the way back by the landmarks?'
  - 'visit the region at another time of day if the game cycles: does the mist and light still read?'
hybrid:
  modality: video+image
  roles:
    video: 'the look of the place: its landmarks (an enormous glowing tree in the sky over a ruined arcade, a stone span over a misty gorge, a
      colossal moss-covered statue with a hanging bell, far castle silhouettes), the fog in the valleys and the golden / dusk light'
    images: 'img01 is an illustrated map that fixes the layout: five numbered landmarks (tree, arcade, bridge, statue, castle) on a dotted route
      across a river gorge; img03-img08 are real ruined arcades and stone bridges that give form to those landmarks'
  cross_reference_requirement: The region must be laid out as the map img01 lays it out (the tree at the start, the arcade on the near side, the
    bridge as the crossing of the gorge, the statue and the castle on the far side, the castle last) while its landmarks, mist and light look
    like the clip's. The map alone gives no look, the clip alone gives no layout.
