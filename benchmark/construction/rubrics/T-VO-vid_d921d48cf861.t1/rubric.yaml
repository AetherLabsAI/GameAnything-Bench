rubric:
  content_realization:
  - id: CR1
    item: The player races in a field of rival cars, and the cars are fast road supercars / touring cars
    anchors:
      '1': several rival cars are on the course with the player, and the player's car and the rivals read as road supercars / touring cars
      '0.5': rival cars exist but the vehicles are generic karts or other vehicles with nothing of a road supercar, or only one rival
      '0': no rival cars on the course
    evidence:
    - - '00:31.0'
      - '00:32.0'
    - - '00:41.0'
      - '00:42.0'
    - - '00:47.5'
      - '00:49.0'
  - id: CR2
    item: The course mixes open fast stretches with sections of tight bends
    anchors:
      '1': the driven route has both open fast stretches (straights, a bridge or similar) and a section of tight bends
      '0.5': the route is uniform (all straights or all gentle curves)
      '0': no course, or a plain featureless loop
    evidence:
    - - '00:35.0'
      - '00:37.5'
    - - '00:44.5'
      - '00:49.0'
  functions_playability:
  - id: FP1
    item: Rival cars race the course at competitive pace, so track position is contested in normal play
    anchors:
      '1': rivals keep a competitive pace along the course and the player's position against them changes in normal play (passing and being passed)
      '0.5': rivals are trivially slow, stop, or leave the course, so position is never contested
      '0': rivals do not race (they stand still or do not move along the course)
    evidence:
    - - '00:31.0'
      - '00:32.0'
    - - '00:41.0'
      - '00:42.0'
    - - '00:47.5'
      - '00:49.0'
  - id: FP2
    item: 'Boost: the player can enter a boost state that gives a clearly felt burst of speed over normal driving'
    anchors:
      '1': the player can trigger boost and the car clearly speeds up while it is active
      '0.5': a speed gain exists but is barely noticeable or not under player control
      '0': no boost
    evidence:
    - - '00:34.5'
      - '00:38.0'
  - id: FP3
    item: 'Drift: the player can start and control a sideways slide while cornering at speed, and take tight bends without stopping'
    anchors:
      '1': a controllable sideways slide through bends at speed with a clean exit
      '0.5': a slide exists but is uncontrollable or purely cosmetic (no change in handling)
      '0': no drift; cars only grip-turn
    evidence:
    - - '00:44.5'
      - '00:45.5'
    - - '00:47.5'
      - '00:49.0'
  - id: FP4
    item: 'Boost and drift combine: the player can keep boosting while sliding through a bend, so the boost carries through and out of the drift'
    anchors:
      '1': boost stays active (or can be triggered) during a drift, and the car keeps the boost's extra speed through the slide and on the exit
      '0.5': both can be active together only briefly or inconsistently, or the boost effect shows during the drift without its speed
      '0': starting a drift always ends or blocks the boost, or one of the two techniques is missing
    evidence:
    - - '00:38.0'
      - '00:38.5'
    - - '00:48.5'
      - '00:49.0'
  - id: FP5
    item: 'Driving at speed: acceleration, steering and braking respond reliably, so the car can be held on the road at high speed before boost
      or drift are used'
    anchors:
      '1': responsive acceleration, steering and braking; the car stays on the road at speed under normal control
      '0.5': the car drives but control is sluggish, twitchy or it leaves the road easily under normal driving
      '0': the car cannot be driven
    evidence:
    - - '00:31.0'
      - '00:49.0'
  - id: FP6
    item: 'The course is reliably drivable at speed end to end, and its sections call for the techniques: boost pays off on the open stretches,
      drift in the tight bends'
    anchors:
      '1': the whole route can be driven at speed with no dead ends or stuck spots; boosting gains most on the open stretches and the tight bends
        are taken best by drifting
      '0.5': drivable but with spots where the car gets stuck or falls off under normal driving, or the sections make no difference to which technique
        pays off
      '0': no drivable course
    evidence:
    - - '00:34.5'
      - '00:37.5'
    - - '00:44.5'
      - '00:49.0'
  visual_presentation:
  - id: VP1
    cat: key_moment
    keyframes:
    - '00:34.5'
    - '00:37.5'
    - '00:45.0'
    item: 'Technique looks: each technique reads on screen while active: boosting shows a flame / glowing blue exhaust trail with a sense of speed
      (blur, speed streaks), drifting leaves tyre smoke and / or skid marks'
    anchors:
      '1': a distinct exhaust flame or trail plus a speed effect while boosting, and visible tyre smoke or skid marks while drifting, both readable
        from a screenshot
      '0.5': only one technique has a distinct look, or the looks are faint, incomplete (flame without speed effect or vice versa) or also show
        in normal driving / grip turns so the technique cannot be told from them
      '0': boosting and drifting both look the same as normal driving
    evidence:
    - - '00:34.5'
      - '00:38.0'
    - - '00:44.5'
      - '00:45.5'
    - - '00:47.5'
      - '00:49.0'
  - id: VP2
    cat: style
    keyframes:
    - '00:27.0'
    - '00:28.5'
    - '00:29.5'
    item: 'Setting: the course runs through palm jungle with carved stone temples along it'
    anchors:
      '1': palm jungle lines the course and carved stone temple structures are visible from the road
      '0.5': only one of the two (jungle without stone temples, or temples without jungle), or either only as a token prop
      '0': neither palm jungle nor stone temples; a generic or unrelated setting
    evidence:
    - - '00:27.0'
      - '00:30.0'
    - - '00:42.5'
      - '00:44.0'
play_suggestions:
  CR1:
  - 'look at the starting field and along the course: how many rival cars, and do they read as road supercars?'
  FP1:
  - 'drive a full lap at moderate pace: do rivals pass you? then drive well: can you pass them?'
  - 'watch a rival in a tight section: does it stay on the road?'
  FP2:
  - time a straight with and without boost
  - 'hold / spam the boost input: does it run out or stay on forever? (not scored: the clip shows no duration or limit)'
  FP3:
  - take the same tight bend with and without drifting; compare exit speed and line
  - 'drift and release: is the slide controllable? (its smoke / skid-mark look is VP1)'
  FP4:
  - 'start a boost, then drift through a bend: does the boost stay on and keep its speed?'
  - 'start a drift, then trigger boost mid-slide: does it fire?'
  FP5:
  - accelerate from standstill to full speed on a straight, then brake hard
  - 'weave left and right at full speed: does the car stay on the road under normal steering?'
  FP6:
  - drive the whole route; note straights vs tight bends
  - 'try to get stuck: drive into walls, off the edge, backwards'
  robustness:
  - 'check whether a race start, finish and standings exist (not scored: the clip shows none)'
  - 'bump and ram rivals at full speed: do cars interact physically, can one be wrecked and does it recover? (not scored: the clip shows a crash
    but not its cause or aftermath)'
  - restart a race after finishing or crashing
  - 'stand still for a while: do rivals keep racing and does the game stay consistent?'
