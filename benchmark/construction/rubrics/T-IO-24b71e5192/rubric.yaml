source_inventory:
- 'img01: a plan drawing on a sign (caption ''DERİNKUYU YERALTI ŞEHRİ''): an irregular network of chambers of many sizes joined by long, winding,
  narrow tunnels, spread wide across the sheet; a long shaded rectangular hall at top left, a hatched rectangular room left of centre, a chain
  of small rooms running down the left side; small tree-like symbols along the top edge and at the right'
- 'img02: looking down into a deep, narrow, round vertical shaft cut in the rock, its bottom lost in darkness; seen from a landing with metal
  railings and stairs; cables hang into it; a dark side opening in the wall above the shaft'
- 'img03: a large round stone disc with a hole in its centre, standing upright in a recess beside a low, narrow passage, separated from it by
  a rock pillar; sign ''SÜRGÜ KAPI / STONE DOOR'' and a red arrow; a person crouches to squeeze through the passage'
- 'img04: looking down from an upper level into a carved chamber: a round hole in the floor with a metal staircase going down to the level below,
  a grille over a further opening, doorways cut into the walls above, rough boulders, a railing'
- 'img05: a wide, low-ceilinged hall carved in pale soft rock, ceiling blackened with soot, rock pillars left standing; several doorways and round
  openings lead into side rooms and further spaces, some higher up via steps; a grating over an opening in the floor; small electric lights and
  cables'
- 'img06: a narrow, low doorway opening onto a steep tunnel barely one person wide with carved steps, lit warm orange further along; a crack in
  the rock beside it; a cable along the wall'
