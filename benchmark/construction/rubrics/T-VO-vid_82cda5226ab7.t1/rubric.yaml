source_inventory:
- '00:00-00:01 overhead start view: eight four-person kayaks stationary on an aligned start line, one per lane; lane boards painted on the water
  left of the line, each with a three-letter country code, flag and lane number 1-8 (UKR 1, LTU 2, SRB 3, GER 4, AUS 5, HUN 6, ESP 7, NZL 8);
  pink/red buoys mark the lane ends; Olympic rings top right'
- 00:01-00:06 all eight boats leave the line together and accelerate in parallel lanes, white wakes behind them; a race clock (0:01, 0:02, ...)
  and 'FINAL A' label appear bottom right; title card 'MEN'S KAYAK FOUR 500M - Final' bottom left 00:03-00:05
- 00:06-00:09 close-up of an Australian paddler (green cap, sunglasses, green-and-yellow kit); clock keeps running
- '00:10-00:17 low side-on and wide shots across the lake: the field moves in parallel, yellow buoys line the lanes, tree line in the background;
  from 00:13 the HUD adds ''DISTANCE TO GO'' above the clock, counting down (439M, 431M, 417M ...)'
- 00:18-00:22 side-on close-ups of single paddlers in the front seats (white German and Spanish kits, boat names on the hulls), double-bladed
  paddles, yellow buoys; distance to go 409M -> 380M
- 00:23-00:27 side-on wide shot of the whole field, still within a few boat lengths; from 00:24 a ranking panel top-left lists the leading five
  boats with rank, flag, country and gap to the leader in metres (e.g. Germany +0.6M, Australia +1.9M, Serbia +1.9M, Hungary +2.4M; the leader's
  row is covered by the frame label); distance 366M -> 345M
- 00:28-00:33 close-ups of the Spanish front paddler; ranking panel with metre gaps until 00:31; distance 338M -> 311M
- '00:34-00:43 overhead view at the half-way mark: a second set of lane boards (number, code, flag) painted on the water beside a timing line;
  the HUD label reads ''250M'' instead of distance to go; 00:41-00:42 the ranking panel shows a split: the leader''s time 38.35 and the others''
  gaps in seconds (+0.16, +0.31, +0.60, +0.71)'
- 00:44-00:46 front view of crews paddling in unison (German crew, then Hungarian), large pink buoys; distance to go 219M
- '00:47-00:51 side-on wide shot: the field compact, red buoys near the lanes; ranking panel back with metre gaps from 00:50; distance 207M ->
  189M'
- 00:52-00:58 side-on close-ups of Spanish, German and Australian front paddlers side by side; ranking panel changes (Lithuania, then Ukraine,
  enter fifth place); distance 182M -> 145M
- '00:59-01:01 head-on aerial from behind the finish towards the field: eight boats abreast with wakes, grandstand on the left bank; ranking lists
  Spain and Australia behind the hidden leader; distance 139M -> 120M'
- '01:02-01:06 side-on wide shot: boats nearly level; ranking panel now lists Australia second and Spain third (the leader''s row covered); distance
  120M -> 95M; panel fades at 01:05'
- 01:07-01:11 side-on close-ups of Spanish, Australian and German boats in tight contention, red buoys; distance 83M -> 77M; from 01:11 the HUD
  label reads 'FINISH'
- 01:12-01:17 overhead tracking shot of the field approaching the line in parallel lanes, the two lowest boats (red hull and dark hull) slightly
  ahead
- 01:17-01:21 the finish line enters from the left with the timing towers and lane markers; OMEGA timing logo; boats cross the line; the race
  clock stops at 1:19 and stays frozen
- '01:22-01:25 result labels appear painted on the water at the finish line in each boat''s lane: ''PF GER'' and ''PF AUS'' (photo finish, place
  not yet given) and ''3 ESP'' (numeric third place); HUD removed by 01:25'
- 'audio: English commentary throughout (Whisper): lists the nations ''in the battle for the medals'', ''men''s kayak four racing over 500 meters
  ... off the start line ... perfect synchronicity'', ''a sensational start from Germany'', Craviotto ''a fast starter'', ''the charge comes on
  the second 250'', ''past mid-race distance, Spain, Germany and Australia'', ''can he hold that pace ... found a second gear'', ''the narrowest
  of margins, Germany hit the front'', ''Germany look to have it ... are they going to be caught'', ''under the line ... Germany lunged''; no
  other audio is identifiable from the material'
- 'not visible: no false start, collision, lane change, capsizing or penalty; no medal ceremony inside the range; the final 1-2 order between
  GER and AUS is not resolved on screen (both PF)'
