rubric:
  content_realization:
  - id: CR1
    item: 'The field: one racing boat per lane, each a long, narrow kayak crewed by four paddlers who propel it by paddling in unison with double-bladed
      paddles, the player''s boat in one lane and computer-controlled rival boats in the others, each boat identified by its lane number and a
      team label'
    anchors:
      '1': a full field of four-person crewed kayaks, one per lane (player plus rivals), whose crews visibly paddle in unison as the boat moves,
        each identified by lane number and team label
      '0.5': a field of boats in lanes, but the crews are not four-person kayak crews, the boats move without the crew visibly paddling, the lanes
        are not all filled, or the boats carry no lane / team identification
      '0': no field of boats (no rivals, or racers that are not crewed boats at all)
    evidence:
    - - 00:00
      - 00:02
    - - 00:18
      - 00:22
    - - 00:44
      - 00:46
  - id: CR2
    item: 'The course: one straight course of fixed length made of parallel lanes side by side, running from an aligned start line across all
      lanes, past a half-way timing mark, to a finish line across all lanes, with no laps or turns'
    anchors:
      '1': a single straight fixed-length course of parallel lanes with an aligned start line, a half-way mark and a finish line across all lanes
      '0.5': a straight lane course with start and finish, but the lanes are not parallel / separate, the half-way mark is missing, or laps /
        turns are added
      '0': a lap circuit or open track without lanes, or no defined start and finish
    evidence:
    - - 00:00
      - 00:06
    - - 00:13
      - 00:17
    - - 00:34
      - 00:43
    - - 01:17
      - 01:25
  - id: CR3
    item: 'The race tracking the reference uses: a running race clock with a distance-to-go readout, a ranking of the leading boats with each
      one''s gap to the leader in metres, and at the half-way mark a timed split that ranks the boats with gaps in seconds'
    anchors:
      '1': 'all three present: clock with distance to go, a ranking with gaps in metres, and a half-way split with gaps in seconds'
      '0.5': one or two of the three present, or the gap units confused (e.g. only time gaps throughout)
      '0': no race tracking beyond a bare clock or position number
    evidence:
    - - 00:13
      - 00:31
    - - 00:34
      - 00:43
    - - 00:50
      - 01:05
  functions_playability:
  - id: FP1
    item: 'Synchronised start: every racer waits stationary on the start line in its own lane and all are released by the same start signal'
    anchors:
      '1': all racers, including the player, are held still on the line and start moving on one signal; moving early is impossible or handled
      '0.5': a common start exists but racers (or the player) can move before the signal unhandled, or are released at slightly different times
      '0': no start procedure; racers spawn already moving or start at different times
    evidence:
    - - 00:00
      - 00:06
  - id: FP2
    item: 'Lane-bound sprint: each racer stays in its own lane the whole way, the run ends after the one fixed distance, and the order is decided
      by how fast each racer covers it'
    anchors:
      '1': racers are kept in their own lanes the whole way, the race ends after one run of the distance, and the order follows the racers' speed
      '0.5': the race runs over the distance but racers can leave or cross into other lanes, or the order does not follow speed reliably
      '0': racers move freely without lanes or the race does not end after the distance
    evidence:
    - - 00:00
      - 00:06
    - - 00:34
      - 00:43
    - - 00:59
      - 01:01
  - id: FP3
    item: 'Player-driven propulsion: the player controls one racer and drives its propulsion and pace over the distance, so the player''s own
      effort decides how fast it goes'
    anchors:
      '1': the player's racer moves only through the player's input, and the player can push or ease its pace during the race
      '0.5': the player controls the racer, but its propulsion or pace is automatic (e.g. only steering or only a start button)
      '0': the player cannot influence the race, or the racer moves on its own
    evidence:
    - - 00:12
      - 00:22
    - - 00:44
      - 00:46
    - - 00:52
      - 00:58
  - id: FP4
    item: 'Close rivals: the computer-controlled racers race the full distance at a pace close to the player''s, with different pacing, so the
      order changes during the race, the top places can stay open until the line, and the player can both win and lose'
    anchors:
      '1': rivals race close to the player, positions change during a race, and both a win and a loss are reachable
      '0.5': rivals race but are clearly much faster or slower, move at one fixed speed so the order never changes, or the player always wins
      '0': the rivals do not race
    evidence:
    - - 00:23
      - 00:31
    - - 00:41
      - 00:42
    - - 00:50
      - 01:11
  - id: FP5
    item: 'Live tracking: during the race the distance to go counts down with the actual progress, the ranking follows the racers'' current order
      with their gaps and updates when positions change, and the half-way split is taken when the boats pass the half-way mark'
    anchors:
      '1': the distance counts down with progress, the ranking and its gaps match the actual order and update on an overtake, and the split reflects
        the passage at half-way
      '0.5': the tracking runs but lags behind or does not match the actual order, or the distance does not count down
      '0': the tracking shown does not follow the race at all
    evidence:
    - - 00:13
      - 00:31
    - - 00:41
      - 00:42
    - - 00:50
      - 01:05
  - id: FP6
    item: 'Finish rule: crossing the finish line ends each racer''s run, placings follow the actual crossing order, the race clock stops at the
      finish, a finish too close to call gets a pending photo-finish (PF) status instead of a place while a clear finish gets its place at once,
      and the race ends with a way to race again'
    anchors:
      '1': placings match the crossing order, the clock stops at the finish, a near-dead-heat is marked PF rather than given a place, and a new
        race can be started
      '0.5': placings follow the crossing order but the PF status for a too-close finish is missing, the clock does not stop, or there is no way
        to race again
      '0': the race never ends or the placings are not based on crossing the line
    evidence:
    - - 01:17
      - 01:25
  visual_presentation:
  - id: VP1
    cat: spatial
    keyframes:
    - '00:00.0'
    - '00:37.0'
    - '01:21.0'
    item: 'Lane course look: the lanes lie on open water (or the target game''s equivalent surface), separated by lines of buoys, with the start,
      half-way and finish lines visibly marked across the lanes on the surface'
    anchors:
      '1': buoy-lined lanes on a water-like surface, with the course lines visibly marked across the lanes
      '0.5': the lanes are visible but not marked by buoy lines, or the course lines are not visibly marked on the surface
      '0': no readable lane look
    evidence:
    - - 00:00
      - 00:02
    - - 00:34
      - 00:43
    - - 01:17
      - 01:25
  - id: VP2
    cat: key_moment
    keyframes:
    - '01:20.0'
    - '01:23.0'
    - '01:25.0'
    item: 'Finish moment: the racers are seen crossing the line side by side, and the finishers'' result labels (a place, or a pending / photo-finish
      status) appear right at the line in their own lanes'
    anchors:
      '1': the crossing of the line is visible, with per-lane result labels (place or pending status) at the finish
      '0.5': the crossing is shown but the result only appears later in a separate list, or the result appears without the crossing
      '0': no finish moment, the race just cuts to a menu
    evidence:
    - - 01:17
      - 01:25
  - id: VP3
    cat: presentation
    keyframes:
    - '00:16.0'
    - '00:35.0'
    - '01:12.0'
    item: 'Race readout: the clock and distance readout stay readable in a corner through the main race phases alongside the ranking, without
      hiding the race, and its label visibly switches at the half-way mark and on the final stretch to the finish'
    anchors:
      '1': the readout is readable through the race next to the ranking, with a visible label change at half-way and before the finish
      '0.5': the readout is readable but its label never changes, or it covers the race / is unreadable in parts of the race
      '0': the readout is not readable during play
    evidence:
    - - 00:13
      - 00:33
    - - 00:34
      - 00:43
    - - 01:11
      - 01:24
play_suggestions:
  FP1:
  - 'press accelerate before the start signal: does the racer move? is it a false start?'
  - check all racers are level on the line at the signal
  FP2:
  - 'steer hard sideways: does your racer keep to its own lane?'
  - check whether the course loops or has laps; measure that it ends after one straight run
  - check that the finishing order follows how fast each racer covered the distance
  FP3:
  - 'stop giving input mid-race: does the racer slow down?'
  - 'push hard early and ease off, then the reverse: does the pace follow?'
  - 'race once with steady input and once with sloppy / slow input: compare the finishing time'
  FP4:
  - 'race several times: do you sometimes win and sometimes lose?'
  - 'watch the ranking: does the order change during a race?'
  FP5:
  - overtake a rival and check the ranking and gaps update
  - compare the ranking with what you see on screen
  - check the distance to go falls as you advance and the split appears when the boats pass half-way
  FP6:
  - 'finish level with a rival: is it marked PF, and is the result consistent and not random?'
  - 'finish last on purpose: is the place right and can you race again?'
  - check the clock stops when the finish line is crossed
  robustness:
  - pause or leave mid-race and come back
  - 'restart the race several times in a row: do all racers reset to the line?'
  - 'idle at the start without input for the whole race: does it still end?'
