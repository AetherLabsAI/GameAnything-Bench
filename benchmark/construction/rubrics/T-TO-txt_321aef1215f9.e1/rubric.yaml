# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-TO-txt_321aef1215f9.e1
source_inventory:
- 'c09.p001-c09.p008: how to mount: leading rein slack in the left hand, reins and a tuft of mane in the right, spring up and swing the leg over
  without touching the back; translator footnotes'
- 'c09.p009-c09.p010: practise mounting from the right side as well, so the soldier is ready on a sudden'
- 'c09.p011-c09.p015: the seat: upright as if standing with legs apart, lower leg hanging loose, upper body supple so a tug or shove does not
  unseat; the horse taught to stand quiet while the rider settles; well-balanced reins'
- 'c09.p016-c09.p021: start at a walk to calm the horse, reins high or low by head carriage, then a natural trot, then the gallop; the gallop
  signal timed to a step of the right foot gives the left lead; a horse turning left leads with the left'
- 'c09.p022-c09.p026: the volte trains turning to either hand and both sides of the mouth; the oval volte preferred to the circular; the horse
  held up at the curve, since a sharp turn at full speed is unsafe, worse on broken or slippery ground'
- 'c09.p027-c09.p029: collect him without swaying him with the bit or leaning, or horse and rider fall; urge to full speed once his eyes are on
  the straight after a turn; after a pause, sudden dashes away from and toward the other horses, short halts and about-turns'
- 'c09.p030-c09.p032: dismount only on the exercising-ground, never among horses or people, so the place of exertion is also the place of relief'
- 'c10.p001-c10.p005: horse and rider must be trained for uphill and downhill, slopes, leaps across obstacles, off banks and down from heights;
  this is teaching, not the purchase test given earlier'
- 'c10.p006-c10.p007: jump training: lead the untrained horse, cross the trench first and tighten the rein; if he refuses, a switch from behind,
  later the mere sight of someone behind suffices; then ridden over smaller, then larger trenches; spur at the spring; a whole-body effort is
  safer than lagging hindquarters'
- 'c10.p008-c10.p010: steep inclines taught first on soft ground, after which the horse prefers the downward slope at speed; fear of shoulder
  injury answered by foreign horsemen racing down slopes'
- 'c10.p011-c10.p013: the rider''s posture by movement: bend forward when the horse breaks into a gallop, lean back when pulling up, hold the
  mane and free the reins over a ditch or up a steep slope, throw himself back and hold in going down'
- 'c10.p014: vary the exercises in place and in length; the horse takes to them more kindly'
- 'c10.p015-c10.p018: to keep the seat at speed and use weapons, train in the chase or in a two-rider drill: a fugitive with lance reversed and
  a pursuer with blunted javelins hitting within range; a drag-then-thrust trick to unhorse, countered by pressing the horse forward'
- 'c10.p019-c10.p020: skirmishing before an enemy camp: charge hard near one''s own side, keep the horse in hand near the foe'
- 'c10.p021-c10.p022: the core principle: the horse cannot learn by speech, so kindness follows obedience and chastisement follows disobedience;
  it holds for taking the bit, ditches, embankments and every task'
- 'c11.p001: summary of the topics so far (purchase, avoiding injury by mishandling, training a war horse)'
- 'c11.p002-c11.p004: the spirited horse: spirit is like anger in a man; avoid annoying him from mounting on, sit quiet longer, gentlest signals,
  raise the pace so gradually he reaches full speed unnoticing; any sudden signal or shock bewilders him'
- 'c11.p005-c11.p010: pull him up gently, coaxing not compelling; long steady stretches calm him, frequent turns do not; repeated fast gallops
  to tire him make him fight by force and with temper; keep him in check and never race him against another'
- 'c11.p011-c11.p012: smooth bits better than rough; a quiet seat on a spirited horse, touching him as little as possible'
- 'c11.p013-c11.p014: the calming and rousing sounds are only conventions: whatever sound is paired with soothing or rousing comes to soothe or
  rouse; at the trumpet do not excite the horse, halt, rest and feed him; best not to take an over-spirited horse to war'
- 'c11.p015: the sluggish horse: do the opposite of what is advised for the spirited one'
- 'c12.p001-c12.p004: the showy horse: pulling the mouth up and spur and whip achieve the opposite, a blinded, bewildered horse with ugly tricks;
  ride on a loose bridle so he holds his head high and arches his neck, as he does by nature when showing off among other horses'
- 'c12.p005-c12.p010: two bits: a rough spiked one he drops, then a smooth one he welcomes and works on with more relish; large discs; any bit
  must be flexible, chain-like, not stiff like a bar'
- 'c12.p011-c12.p013: flexible vs stiff defined; with any bit the same rules: pull neither too hard nor too softly, give the bit at once when
  he raises his neck, reward every compliance, caress rather than tax him when he enjoys arching his neck'
- 'c12.p014-c12.p015: a horse at liberty takes to trot or gallop, never a walk: swift movement pleases him unless carried to excess'
- 'c12.p016-c12.p019: once he wheels into a canter on cue, collecting him with the bit while giving the go signal makes him throw his chest forward
  and lift his legs; giving him the rein then sends him forward proudly, admired by spectators'
- 'c12.p020: closing line'
