rubric:
  content_realization:
  - id: CR1
    item: The game contains a horse that the player mounts and rides as its rider.
    anchors:
      '1': a horse the player can mount, ride and dismount, with the player in the rider's role
      '0.5': a horse exists but is only led, driven or controlled from outside, not ridden by the player
      '0': no horse, or none the player can control
    evidence:
    - c09.p011
    - c09.p016
  - id: CR2
    item: The game contains horses of different temperament, at least a spirited one and a sluggish one, told apart in the game.
    anchors:
      '1': a spirited and a sluggish horse both exist and the player can tell which is which (by behaviour or by any indicator)
      '0.5': only one temperament exists, or temperaments exist but cannot be told apart
      '0': no horse temperament at all
    evidence:
    - c11.p002
    - c11.p015
  - id: CR3
    item: 'The game contains a riding ground for the exercises: room for straight runs and turns, smaller and larger obstacles to leap, and slopes
      to ride up and down.'
    anchors:
      '1': a riding ground with room for straight runs and turns, obstacles in at least two sizes (smaller and larger), and slopes
      '0.5': a riding ground with room to run and turn, but obstacles of one size only, or no slopes, or no obstacles
      '0': no riding ground, or no room to run and turn
    evidence:
    - c09.p022
    - c09.p030
    - c10.p001
    - c10.p006
    - c10.p008
  functions_playability:
  - id: FP1
    item: 'Graded paces in play: the horse has distinct paces, walk, trot and gallop, and the player works it up from the walk through the trot
      to the gallop and can slow back down to a halt.'
    anchors:
      '1': walk, trot and gallop are clearly distinct paces, the player can work the horse up through walk and trot to the gallop, and can slow
        it back down to a halt (a dash to full speed straight from a halt may also be allowed)
      '0.5': speed varies but without three distinct paces, or there is no way to slow to a halt
      '0': the player cannot change the horse's pace (a single fixed speed)
    evidence:
    - c09.p016
    - c09.p027
  - id: FP2
    item: 'Turning against speed: a sharp turn at full speed risks a fall, while checking the horse into the turn and accelerating once it faces
      the straight gets through safely.'
    anchors:
      '1': a real fall risk for turning sharply at full speed, and the checked turn followed by acceleration on the straight succeeds
      '0.5': turning sharply at full speed carries only a slight or token risk, or the checked turn is no safer
      '0': turns are free at any speed
    evidence:
    - - c09.p022
      - c09.p027
  - id: FP3
    item: 'Keeping the seat: the rider can be unseated by changes of the horse''s motion or of the terrain, and adapting balance to them keeps
      the seat.'
    anchors:
      '1': the rider can be unseated, and adapting balance or posture to the horse's movement prevents it
      '0.5': posture changes shown but without consequence, or unseating happens at random
      '0': the rider cannot be unseated and balance plays no role
    evidence:
    - c10.p011
    - c09.p011
  - id: FP4
    item: 'Training by consequence: the player can reward or punish the horse after its response, and this changes how reliably it obeys later.'
    anchors:
      '1': reward and punishment both available and both change the horse's later behaviour (a rewarded response becomes more reliable)
      '0.5': reward or punishment exists with no lasting effect, or only one of them
      '0': no training through consequences
    evidence:
    - c10.p021
    - c10.p006
    - c12.p011
  - id: FP5
    item: 'Terrain learned in stages: an untrained horse may refuse a jump, and graded practice, easier obstacles and easier ground first, makes
      it able to take larger obstacles and steep slopes.'
    anchors:
      '1': jump or slope ability is trained through easier steps before harder ones, with a visible change from refusing to clearing at least
        for jumps
      '0.5': any horse takes obstacles and slopes at once, or training is a single unlock with no grading
      '0': the horse's ability over obstacles and slopes never changes with practice
    evidence:
    - c10.p001
    - c10.p006
    - c10.p008
  - id: FP6
    item: 'Temperament in play: a spirited horse becomes agitated and harder to control under abrupt or forceful handling and calms under gentle,
      gradual handling, while a sluggish horse needs the opposite.'
    anchors:
      '1': the player's handling changes the horse's state in the stated directions, at least for the spirited horse, with the sluggish one needing
        the opposite
      '0.5': handling changes the state of one temperament only, or temperament is a label with no effect of handling
      '0': handling has no effect on the horse's state
    evidence:
    - - c11.p002
      - c11.p009
    - c11.p015
  - id: FP7
    item: 'Show training: the player can train the horse toward a proud display, which forceful aids spoil into a bewildered, unruly horse and
      timely release and reward bring out.'
    anchors:
      '1': a display / collected bearing the player works toward, where forcing it makes the horse worse and releasing or rewarding at the right
        moment produces it
      '0.5': a display exists but is triggered directly with no effect of handling, or only one side (force spoils / release produces) works
      '0': no show training
    evidence:
    - c12.p001
    - c12.p011
    - c12.p016
  visual_presentation:
  - id: VP1
    cat: presentation
    item: The horse's reaction to handling is readable while riding (e.g. calm or agitated, complying or refusing), so the player can time reward
      and handling.
    anchors:
      '1': the player can tell during riding how the horse is reacting to the handling (by its behaviour or by any indicator)
      '0.5': readable only in part, or only in a menu away from play
      '0': the horse's reaction cannot be seen
    evidence:
    - c10.p006
    - c11.p002
    - c11.p005
    - c12.p011
  - id: VP2
    cat: key_moment
    item: 'The proud display is seen as a set-apart moment: when it is brought out, the horse visibly carries its head high with an arched neck
      in a proud, lifted bearing, clearly different from ordinary riding.'
    anchors:
      '1': in the display the horse visibly holds its head high and arches its neck (a lifted, proud carriage, e.g. with chest forward and high-stepping
        legs), clearly set apart from ordinary riding; the exact pose or animation is the agent's choice
      '0.5': the display is set apart only weakly (barely different from ordinary riding, or without the raised head and arched neck), or only
        by a text or icon, not by how the horse looks
      '0': the display moment cannot be seen as anything different from ordinary riding
    evidence:
    - c12.p001
    - c12.p016
play_suggestions:
  FP1:
  - build up from a walk through the trot to the gallop; then from a standstill, dash straight to full speed
  - slow from a gallop to a halt
  FP2:
  - take the same sharp turn at full speed and after checking the horse
  - accelerate as soon as the horse faces the straight after a turn
  FP3:
  - start a gallop and stop short without adjusting the rider; then with the adjustment
  - ride down a steep slope both ways
  FP4:
  - reward a correct response several times, then test the same command
  - punish a refusal, then repeat the request; check the effect persists later
  FP5:
  - put an untrained horse straight at the largest obstacle or steepest slope
  - train on small obstacles first, then retry the large one
  FP6:
  - on a spirited horse give sudden, harsh signals and repeated fast gallops; then gentle signals and a long steady pace
  - 'try to tire a spirited horse with gallop after gallop: does it calm or fight?'
  - handle a sluggish horse the way that suits a spirited one
  FP7:
  - 'try to force the display with hard rein, spur or whip: does the horse get worse?'
  - 'collect the horse, then give the rein and reward the raised neck: does the display come out?'
  robustness:
  - dismount mid-exercise and remount
  - ride off the training ground and come back
  - 'punish a horse continuously for a long time: does it stay controllable and the game playable?'
  - 'reward the horse for a refusal: does the system stay consistent?'
