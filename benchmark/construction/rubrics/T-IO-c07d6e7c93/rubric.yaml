- 'img04: a long line of yellow cylindrical floats linked end to end across green water in front of reeds, curving away; gulls and a cormorant
  perch on them'
- 'img05: high aerial view of a harbour on a narrow channel: ships with cranes and a container barge moored along the quays, small yachts at the
  far quay; on the near quay a yard of buoys laid out in rows (red, green, yellow, grey; cones, spars, cylinders); town behind'
