instructions_meta:
  requirement_groups:
    vessel control:
    - FP1
    marks in the water:
    - CR1
    - CR2
    - FP2
    - FP3
    - FP4
    - VP2
    water play space:
    - VP1
  explicit_requirements:
  - type: keep
    text: I want that long line of floats linked end to end across the water, and my boat must not be able to get through it.
    covers:
    - CR2
    - FP3
rubric:
  content_realization:
  - id: CR1
    item: The water contains floating marks of several visibly distinct kinds
    anchors:
      '1': several floating marks in the water, of at least two kinds that are clearly told apart by their look (colour or shape)
      '0.5': floating marks present, but all of one kind or differing only barely
      '0': no floating marks in the water
    evidence:
    - img03
    - img04
    - img05
    - img06
  - id: CR2
    item: A long line of floats linked end to end runs unbroken across the water
    anchors:
      '1': a long line of floats joined end to end, continuous with no gaps, stretching across the water
      '0.5': a row of floats, but spaced apart or with gaps, so it does not read as one linked line
      '0': no line of floats
    evidence:
    - img04
  functions_playability:
  - id: FP1
    item: The player steers a vessel over open water among the marks
    anchors:
      '1': a controllable vessel moves freely on the water
      '0.5': a vessel moves, but only on a fixed track
      '0': no steerable vessel
    evidence:
    - img05
    - img06
  - id: FP2
    item: 'The marks are moored: they stay at their set positions in the water while the vessel moves among or bumps them'
    anchors:
      '1': marks keep their positions over time and when the vessel approaches or bumps them
      '0.5': some marks hold their positions, but others drift or get pushed away when bumped
      '0': no marks, or the marks drift or are pushed around freely
    evidence:
    - img02
    - img03
    - img06
  - id: FP3
    item: 'The vessel does not get through the linked float line: it is a barrier across the water'
    anchors:
      '1': the vessel cannot pass or slip through the float line anywhere along it
      '0.5': the line stops the vessel in places, but it slips through at gaps or joints
      '0': the vessel passes through the float line as if absent, or there is no float line
    evidence:
    - img04
  - id: FP4
    item: 'A single buoy stands free in open water: the vessel can sail up to it and round it on either side'
    anchors:
      '1': the vessel can come close to a single mark and sail all the way round it, open water on every side
      '0.5': the vessel can reach a single mark but cannot get round it (it stands against a bound or is hemmed in by other marks)
      '0': no single marks in open water, or the vessel cannot get near them
    evidence:
    - img02
    - img03
    - img06
  visual_presentation:
  - id: VP1
    cat: spatial
    item: The play space is open water with marks standing in it, each clearly readable against the water
    anchors:
      '1': an open water surface with marks that stand out clearly against it
      '0.5': water and marks, but the marks are hard to make out
      '0': no recognisable water space with marks
    evidence:
    - img02
    - img04
    - img06
  - id: VP2
    cat: style
    item: The marks look like the painted buoys and floats of the images, riding at the waterline
    anchors:
      '1': marks read as brightly painted buoys and floats (as red, red-and-white or yellow in the images) sitting in the water at the waterline
      '0.5': marks read as floating objects but look generic (plain blocks or posts, no buoy shape or paint), or hover above / sink below the
        surface
      '0': marks do not read as buoys or floats
    evidence:
    - img03
    - img04
    - img06
play_suggestions:
  FP1:
  - steer in circles in open water, then head out among the marks
  - 'head straight for the shore at full speed: what happens?'
  - 'sail into a harbour, if there is one: does arriving have any effect?'
  FP2:
  - 'ram a buoy: does it stay in place?'
  - 'wait a while near a mark: does it drift?'
  - 'list the mark kinds you see: are they handled differently?'
  FP3:
  - drive straight at the float line at full speed
  - try to slip through a gap between two floats
  FP4:
  - sail a full circle round a single buoy
  - 'pass a mark on one side, then on the other: does play react differently?'
  robustness:
  - 'wait for or switch to night, if available: are the marks still visible?'
  - run aground and try to get free
  - leave the marked area entirely and try to come back
