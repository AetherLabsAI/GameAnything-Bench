source_inventory:
- 'clip 00:11-00:23: full moon over a sea of clouds; a horseless carriage piled with trunks, books and cases, lanterns lit, a barn owl perched
  on top, flies through the clouds; the owl takes off ahead of it'
- 'clip 00:23-00:27: fade to near black'
- 'clip 00:27-00:37: a many-towered castle with lit windows on a cliff above a lake, in mist; the carriage flies toward it and between its spires;
  caption ''Hogwarts, Late 1800s'' (00:32-00:36)'
- 'clip 00:37-00:43: the carriage passes close to the castle walls and descends into a cloistered courtyard at night (a driver on the box); 00:44-00:45
  black'
- 'clip 00:46-00:48: doors open onto a great hall: long parallel tables with seated students in robes, hundreds of floating candles, a tall stained-glass
  window at the far end'
- 'clip 00:49-00:55: a library with tall shelves and a large portrait; a spiral stair tower with books flying in a swarm; a reading room with
  long tables, lamps and a globe; a student takes a book from the air'
- 'clip 00:56-00:57: a robed student walks along a panelled corridor with suits of armour'
- 'clip 00:58-01:01: in the hall, before the seated tables, an adult places a pointed hat on a new student''s head while an older teacher watches'
- 'clip 01:02-01:07: a sunlit cloister courtyard with a fountain, trees and students on benches; a lawn where a yellow-trimmed student swings
  a long staff'
- 'clip 01:08-01:11: a potions room: a cauldron, a bottle set on a table'
- 'clip 01:12-01:13: a glass greenhouse classroom with flowering planters and a teacher at the front'
- 'clip 01:14-01:18: two students stir a cauldron with wands; purple sparks rise into a column of light and a bright burst'
- 'clip 01:19-01:20: a row of blue big-eyed creatures in a night forest, a student facing them'
- 'clip 01:21-01:22: a common room with tall arched windows, armchairs and a fire'
- 'clip 01:23-01:25: a wand lights up; a spell swirls in a classroom; a mannequin-like figure on a wheeled stand'
- 'clip 01:26-01:27: a half-timbered village gate with a carved sign and a cobbled street beyond'
- 'audio: narrator (Whisper): ''Magic ... binds together our long history ... the legacy of Hogwarts. Now it is time to add your own story to
  these hallowed halls ... Every corridor, every portrait, every stone in this castle tells the story of witches and wizards who came before.
  Here you will meet lifelong friends and grow into your own magical abilities in the classrooms of the world''s most talented professors. And
  while your journey begins at Hogwarts, brewing potions, taming fantastic beasts and mastering spells ...''; orchestral music'
- 'text p001-p003: chapter heading ''The Stage Coach''; at an inn before 3 a.m. in November the boots wakes Tom; he and his father came up the
  day before and chose the early coach that passes through the school town itself'
- 'text p004-p011: the night before, his father (the Squire) reminds him he goes at his own request, warns of cruel things at school, and charges
  him to tell the truth and keep a brave and kind heart so he will never be ashamed to come home; checks his money and keys'
- 'text p012-p020: coffee by the fire; the coach arrives, the guard loads the luggage, Tom climbs up, a last handshake, and the coach leaves into
  the darkness; Tom looks back at his father; three cold hours before dawn'
- 'text p021: (after a gap) the coach passes parties of boys and comes in sight of the town; Tom thinks it the greatest day he will ever spend'
- 'text p022-p024: chapter heading ''Rugby and Football''; the coach passes the school field with football games, the long line of grey buildings
  from chapel to School-house with a flag on its tower, and the school gates with boys standing there; Tom is already proud'
- 'text p025-p031: a boy scrambles onto the coach, asks if he is Brown: his aunt, who knows Tom''s family, asked him to give Tom a lift; Tom resents
  his patronising air but admires his coolness; East has a porter carry the luggage up'
- 'text p032-p038: East makes Tom swap his cap for a hat, gets him a proper one at the hatter''s; explains that a great deal depends on how a
  new fellow carries himself at first, and that he helps because his father knows Tom''s and to please his aunt; East is frank and good-natured,
  one half-year at the school; Tom feels friends with him at once'
- 'text p039-p040: East acts as guide: through the gates (boys ask the stock questions), the quadrangle and a small courtyard, to the matron''s
  room; shows him the schools, predicts they will be in the same form; proposes his study before dinner and the close after'
- 'text p041-p050: through the School-house hall (two great tables running its length, two fireplaces) into dark passages lined with studies;
  East''s small study, shared with another boy, with its furniture and prints; Tom will be given a study of his own with a chum on Monday; Jones
  the praepostor holds the study at the fire end and watches the passage at night'
- 'text p051: the dinner bell; in the hall Tom sits at the bottom of the second table next to the praepostor, who keeps order; the school comes
  in; a big-bearded man calls over the names, Tom''s last; grace'
- 'text p052-p053: neighbours question Tom; East takes him out past the fives court to the close: the chapel, the place for fights, the little-side
  and big-side grounds, the island; the two race across and arrive together at the island moat'
