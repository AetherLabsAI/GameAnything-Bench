rubric:
  content_realization:
  - id: CR1
    item: 'The game contains the two main characters: the newcomer (Tom), the player''s character arriving at the school, and East, a boy of about
      his age who has been there a little longer and becomes his guide and friend'
    anchors:
      '1': 'both characters present with these roles: the newcomer as the arriving player character, East as the slightly senior boy who guides
        and befriends him'
      '0.5': both present but East's guide role or the friendship is missing or confused
      '0': missing, or the roles are wrong
    evidence:
    - - p025
      - p038
    - p052
  - id: CR2
    item: 'The game shows that East takes the newcomer in hand because of a family connection: his aunt, who knows the newcomer''s family, asked
      him to'
    anchors:
      '1': the guidance is given this cause in the game (the aunt's request, or the families' acquaintance)
      '0.5': East helps him but the reason is missing or invented
      '0': missing
    evidence:
    - p028
    - p036
  - id: CR3
    item: 'The game contains the first day''s situations in the text''s order: the farewell from the father and the night departure by coach,
      the arrival at the school where East meets him, East showing him round (with his study) before the first dinner in the hall, and afterwards
      the school grounds'
    anchors:
      '1': departure, arrival and meeting East, the tour with the study, the dinner in the hall and then the grounds, all present in this order
      '0.5': most of these present in order, with one missing or misplaced
      '0': missing, or the order is largely wrong
    evidence:
    - - p002
      - p020
    - - p023
      - p030
    - - p039
      - p053
  - id: CR4
    cross: true
    item: 'The text''s story is told in the video''s world: the school is the video''s castle school, where students learn magic (lessons, brewing,
      spells, magical creatures), the newcomer''s journey (text) ends with the arrival coming down into its courtyard, and the first dinner with
      the whole school (text) is held in its great hall'
    anchors:
      '1': 'all three found in the game: the school presented as a place where magic is learned, the arrival ending in the castle''s courtyard,
        and the dinner held in its great hall'
      '0.5': one of the three missing (a castle with no sign that magic is taught there, or the arrival or the dinner set somewhere else)
      '0': 'two or more missing: the text''s events set in places with nothing of the video''s world'
    evidence:
    - - p018
      - p024
    - p040
    - p051
    - - 00:37
      - 00:43
    - - 00:46
      - 00:48
    - - 01:02
      - 01:25
  - id: CR5
    item: 'The game states what is at stake on the first day: the newcomer must make good at the school, as the father''s charge (tell the truth,
      keep a brave and kind heart) or East''s rule (how a new boy carries himself at first decides how he gets on) says'
    anchors:
      '1': the first day is framed in the game as a test of making good, with at least one of the two sources (the father's charge or East's first-impressions
        rule), and this goal is shown at the start
      '0.5': a vague goal of settling in without what is at stake, or the stakes only appear late
      '0': missing
    evidence:
    - - p004
      - p011
    - p036
  - id: CR6
    item: 'The school''s places exist and connect as the text walks them: the gates lead into a courtyard, the hall opens onto it, small studies
      lie off passages beyond the hall, and the grounds lie outside'
    anchors:
      '1': gates, courtyard, hall, studies off passages and the grounds all present and connected in this arrangement
      '0.5': the places exist but are not connected this way, or one of them is missing
      '0': missing
    evidence:
    - p039
    - p041
    - p053
  functions_playability:
  - id: FP1
    item: 'The story advances through play: each situation of the day opens once the player has finished the one before (by walking, talking,
      following the guide), from the departure to the close'
    anchors:
      '1': the player goes through the situations in sequence by normal play, each one triggered by finishing the previous
      '0.5': 'the progression works only in part: a step must be forced or skipped, or the steps can be taken in any order so the sequence breaks'
      '0': no story progression, or only free roaming
    evidence:
    - - p012
      - p053
  - id: FP2
    item: A guide companion meets the newcomer on arrival and leads them from place to place, talking about the school, so the player always has
      a next step
    anchors:
      '1': a guide character who meets the player at the arrival, leads or sends them to each next place and explains it
      '0.5': the guide appears but only once, or the next step is unclear without him
      '0': no guide character
    evidence:
    - - p025
      - p030
    - - p039
      - p041
    - - p052
      - p053
  - id: FP3
    item: 'The player walks the day''s route on foot through normal play: from the arrival courtyard through the gates and courtyard into the
      hall, along the passages to the study, and out to the grounds, each place reached by walking from the one before'
    anchors:
      '1': every place of the route can be reached by walking from the previous one (map transitions work both ways where the route needs it),
        without teleporting or getting stuck
      '0.5': most of the route is walkable but one link is missing, one-way when the story needs a return, or a transition is broken
      '0': the places cannot be walked between, or are reached only by cuts
    evidence:
    - - p039
      - p041
    - p053
