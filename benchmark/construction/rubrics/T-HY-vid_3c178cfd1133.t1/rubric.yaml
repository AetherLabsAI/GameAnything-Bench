      long-table hall lit by floating candles, a hall reception of a new student, and school life in which magic is everyday'
    text: 'the story: the characters (the new boy Tom, his guide East, his father), the cause of the guidance, the stakes of a new boy''s first
      day, and the order of the events from the night departure to the first dinner in the hall and the walk over the grounds'
  cross_reference_requirement: 'The text''s first-day story (departure, arrival, being taken in hand by East, his study, the first dinner in the
    hall, the grounds) must be told in the video''s world: the arrival staged as the video''s night approach to the castle school and the dinner
    in its long-table hall.'
