play_suggestions:
  FP1:
  - 'play from the start and note the order of the situations: farewell and departure, arrival, meeting the guide, the study, the dinner, the
    grounds'
  - 'try to go to the hall before the guide has shown you round: what happens?'
  FP2:
  - after each scene, check whether the guide tells or leads you to the next place
  - 'walk away from the guide: does he wait, call you back or follow?'
  FP3:
  - 'walk from the arrival courtyard to the grounds without skipping: is every link a walkable transition?'
  - 'walk back from the study to the hall and from the grounds to the courtyard: do the transitions work in reverse?'
  robustness:
  - 'talk to the guide repeatedly at each stage: does the dialogue stay consistent with the story step?'
  - 'save and reload in the middle of the day: is the story state kept?'
  - 'skip optional talk: can the story still be finished?'
hybrid:
