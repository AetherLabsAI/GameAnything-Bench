source_inventory:
- '01:25.9-01:28.0 low-angle close shot: a young man in a dark green / red patterned poncho, seen from behind-left, looks up and to the right;
  above him a large balloon with navy and yellow vertical stripes, a red band and a basket; smaller striped balloons (navy / yellow, white, teal)
  nearby and many tiny balloons further off; clear teal-blue sky'
- '01:28.4-01:31.0 wide shot over a flat, dry plain with low scrub: a large dark balloon with red horizontal bands hangs low over the plain with
  its basket just above the ground; many small balloons (orange, striped) are spread over the plain, some at ground level, others higher; long
  flat-topped hills on the horizon; pastel pink-orange sky at the horizon fading to blue (low-sun, early light)'
- 01:31.4-01:32.4 a person in the poncho and white trousers stands on top of a pale, rounded rock ridge, back to camera, looking out; a huge navy
  / lime-green balloon fills the left of the frame very close; a red / white checkered balloon behind it; below, a valley of pale cream and pink
  eroded rock formations with green trees, roads, a few buildings and glowing lights; hills on the horizon
- '01:32.9-01:33.4 wider shot of the same ridge: soft, rounded white rock humps in the foreground, the person small on a top; a dark brown pointed
  rock spire rises to the right; balloons at many distances (a large white balloon with orange pattern and a logo, the navy / lime balloon, striped
  ones, small distant ones); buildings and lights in the valley; hazy hills behind'
- 01:33.9-01:36.4 black (cut / fade to black)
- 01:36.9-01:38.9 fade in from black, still dark, to the terrace view below
- '01:39.4-01:43.3 a flat stone terrace on high ground: a tall, sunlit, warm orange rock face on the left, a tall black street-lamp post, a wooden
  barrel and baskets, low floor seating with kilim-patterned cushions and bolsters along a low railing; a man in a white shirt sits on the cushions,
  back to camera, looking out; below and beyond, a town of low pale buildings with rock cones / spires among them, dozens of small balloons spread
  over the town, long flat-topped hills on a hazy horizon; warm, low sunlight'
- no on-screen text; camera mostly static or slowly moving; shallow depth of field in the close shots
- 'audio (from the Whisper transcript only, not checked by ear; may be unreliable over music): narration ''... hundreds of balloons breathe fire
  into the sky, rising like a symphony. So this is a reminder'' (a segment 01:06.3-01:39.1 that likely covers only the end words) and ''... to
  myself, to anyone listening. Sometimes, the most magic places ...'' (01:39.9-01:47.7, continues past the clip end); presumably a music bed under
  the narration'
- 'not shown: how the ridge and the terrace connect, whether they are the same location, the full valley layout, any balloon launch or burner
  flame inside this range'
