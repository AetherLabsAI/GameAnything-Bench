  modality: video+text
  roles:
    video: the lane-grid play space, the two defender roles (repeating row shooter, one-shot mine) and the two enemy toughness tiers with their
      stat cards (cost, damage, recharge, toughness, speed), the resource counter with per-defender costs, and how shots and the mine blast look
    text: 'the generic tower-defense frame: a base that must be defended and survive, enemies arriving in waves of a set number and types, player-placed
      obstructions that damage or kill enemies before they destroy the base, and a currency that can be time, in-game currency or experience,
      e.g. earned by defeating an attacker'
  cross_reference_requirement: 'The built game must give the video''s lane grid, unit roles and costs the text''s rule frame: the left end of
    the lanes is the base that must survive, enemies of the clip''s two toughness tiers arrive in waves, and the clip''s per-defender costs are
    paid from a currency earned during play the way the text describes (time-based, or by defeating attackers).'
