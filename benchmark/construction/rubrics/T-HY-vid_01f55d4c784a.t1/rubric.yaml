- 'text p001-p002: tower defense is a strategy subgenre where the goal is to defend territory by obstructing attackers or stopping them reaching
  exits, by placing structures that automatically block, impede, attack or destroy enemies; strategic choice and positioning of defences is essential'
- 'text p003-p009: basic elements: a ''base'' that must be defended; waves of multiple incoming enemies; placement of towers or obstructions along
  the path of attack; the player''s character is often invincible, the objective is the survival of the base'
- 'text p010-p020: features of modern tower defense: placed obstructions that damage or kill attackers before they destroy the base; repair and
  upgrade of obstructions; a currency for upgrades and repairs (time, in-game currency or experience, e.g. earned by defeating an attacker); multiple
  paths; each wave usually has a set number and types of enemies; unlocking maps and levels; moving towers; build / defend / repair / celebrate
  phases in turn-based variants'
- 'text p021-p022: preset maze paths vs mazes built from towers; ''mazing'' to lengthen the enemies'' route; ''juggling''; changing the towers''
  attack strategy'
- 'text p023-p025: degrees of player control; ''air'' units that ignore the board layout; tower wars, where players also send enemies to opponents''
  boards'
