task_id: T-HY-vid_1d8d10692142.t1
source_inventory:
- 'clip 00:27.4-00:34.3: elevated view down a long straight avenue to the stone arch, which stands on an open round place; the low sun glows through
  the arch''s opening and lights the roadway orange; cars on the avenue and circling the place; trees along the avenue; uniform low blocks around'
- 'clip 00:34.3-00:41.2: close view of the arch''s corner and opening: sculpted relief panels, statue groups, engraved names on the inner pier;
  a large red-and-white flag hangs and waves in the opening'
- 'clip 00:41.2-00:48.0: high aerial view: the arch at the centre of a large round open place, about a dozen straight avenues radiating out, wedge-shaped
  blocks of even height between them, trees along some avenues, long low-sun shadows, a dense even city to the horizon'
- 'clip 00:48.0-00:54.9: rooftop-level view over grey mansard roofs with dormers and chimney pots; the lattice tower, already lit warm, rises
  far above the low roofline; teal sky with a pink band at the horizon'
- 'clip 00:54.9-01:01.7: dusk, view along a long straight avenue lined with dark trees and full of car lights, running to a cluster of high-rise
  towers with a cube-shaped gate building on the horizon; orange sky; a dark park mass on the left; the low city has a few lit windows'
- 'clip 01:01.7-01:08.6: the lattice tower floodlit gold-orange against a red cloudy sky above the city; a searchlight beam appears at its top
  (01:06.4-01:07.9)'
- 'clip 01:08.6-01:18.8: night aerial, nearly static: a lit avenue as a bright orange band running to a rectangular lit park / plaza area, a large
  glass-roofed hall to the right; the city dark blue with scattered lights'
- 'clip audio: music only, no speech'
- 'img01: street map of the star: twelve straight named avenues radiate evenly from a round place with the arch (labelled, a rectangle) at its
  centre; wedge-shaped blocks between the avenues; a ring street one block out; one avenue with a wide green strip; compass and 100 m scale bar'
- 'img02: close plan of the round place: the arch as a dark rectangle on a round central island, twelve road openings around the open ring, numbered
  markers 1-8 around the place, five avenue names (the two on each axis opposite each other)'
- 'img03: the arch at blue hour, floodlit warm: block-shaped mass, large arched opening on the long face, smaller opening on the short side, relief
  panels, statue groups, flat attic; the lattice tower lit in the distance; street lamps, light trails of traffic'
- 'img04: the arch from a roof above the avenue, cloudy day: cars circling the wide open round place, people on the arch''s top, a tree-lined
  avenue with wide pavements in front, cream blocks with grey roofs around, the high-rise cluster with a cube-shaped gate on the horizon behind
  and left of the arch'
- 'img05: corner of an apartment block: cream stone facade, wrought-iron balconies, grey mansard roof with dormers, chimneys, street trees in
  front'
- 'img06: street facade of a six-storey block: cream stone, continuous iron balconies on two floors, grey mansard roof with dormers, shops at
  ground level, street trees, a lamp post'
