play_suggestions:
  FP1:
  - play from the start and write down the order of the beats and where each happens
  - 'try to reach the castle before the curse: is it possible, and does the story still make sense?'
  FP2:
  - 'after the curse, change maps, save and reload: is the heroine still old?'
  - 'talk to NPCs after the curse: do they treat her as an old woman?'
  FP3:
  - 'talk to the fire demon: is the deal''s goal stated, and is it tracked anywhere?'
  - 'follow the goal as far as the game goes: is there an ending or a clear next step?'
  FP4:
  - 'enter and leave the castle twice: is it in the same place both times, and is it ever seen moving?'
  robustness:
  - 'skip or rush through dialogue: does the story still advance?'
  - 'walk away from the scripted path in the town or the hills: can you get stuck?'
  - try to enter the castle before the scarecrow leads you there
hybrid:
  modality: video+text+image
  roles:
    video: 'the look and staging of the opening: the old-town alley and rooftops where the girl meets the wizard, the hat shop and the mirror
      of the curse, the hillside road, the hearth with the flame creature, the walking castle, the scarecrow'
    text: who the characters are and what they are (milliner, wizard Howl, Witch of the Waste, fire demon Calcifer, Turnip Head), the order and
      causes of the events, the deal and the rules of the curse and the contract, how the curse is resolved, the castle described as a collage
      on bird legs
    images: design art of the castle (patchwork of houses, domes, chimneys and pipes on thin legs), of the flame demon in the hearth, and of the
      main characters' looks (the wizard's diamond-patterned cloak, the girl's hat, braid and long dress, her old form)
  cross_reference_requirement: The story order and causes come from the text (meeting the wizard, the Witch's curse in the hat shop, leaving home,
    the scarecrow leading her to the castle, the deal with Calcifer) and must be staged with the characters, places and creatures as the clip
    and the design art show them; the text names who the clip's figures are (the large woman in the shop is the Witch of the Waste, the flame
    in the hearth is Calcifer, the power of the walking castle).
