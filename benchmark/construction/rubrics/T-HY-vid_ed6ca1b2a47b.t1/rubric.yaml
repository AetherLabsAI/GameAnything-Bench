rubric:
  content_realization:
  - id: CR1
    cross: true
    item: The game contains the Witch of the Waste (text) as the large dark-hatted woman who comes into the hat shop (clip), shown as the one
      whose curse turns the girl into an old woman, and the old woman is the girl herself
    anchors:
      '1': a witch figure visits the hat shop and is shown or told as the Witch of the Waste who curses the girl there, and the aged heroine is
        clearly the same character as the young one
      '0.5': the girl is cursed into an old woman, but the curse is not tied to the witch or to her visit to the shop
      '0': missing, or the old woman is a different character from the girl
    evidence:
    - - '00:14.9'
      - '00:20.4'
    - p002
    - p004
  - id: CR2
    cross: true
    item: The game contains the fire demon Calcifer (text) as the flame in the castle's hearth (clip, art), presented as the source of the magic
      and the movement of the walking castle
    anchors:
      '1': a flame character in the castle's hearth that is named or presented as the fire demon Calcifer AND as what powers and moves the castle
      '0.5': the flame creature is a fire demon or named Calcifer, but has no role for the castle, or the castle's power is named without linking
        it to the creature
      '0': missing, or the hearth flame is an ordinary fire or a pet without a role
    evidence:
    - - '00:41.5'
      - '00:43.0'
    - - '00:44.5'
      - '00:45.5'
    - p004
    - p009
    - img10
    - img11
  - id: CR3
    item: 'The game''s story contains the opening events in the text''s order and with its cause: she meets the wizard, the Witch curses her in
      the hat shop, she leaves home to seek a cure, a living scarecrow leads her to the moving castle, and she enters it'
    anchors:
      '1': the meeting, the curse, the departure, the scarecrow as guide and the entry into the castle, in this order and with the cure as the
        reason she leaves
      '0.5': most of these events in a mostly right order, or the right order without why she leaves
      '0': missing, or the order is broken at its core (e.g. she is cursed after reaching the castle)
    evidence:
    - p004
    - - '00:02.4'
      - '00:22.9'
    - - '00:46.0'
      - '00:47.4'
  - id: CR4
    cross: true
    item: 'The game contains the story''s settings (clip, art) as distinct places along her route (text): the old town where she meets the wizard,
      the hat shop that is her home, the open hill country beyond, and the castle out in that country with the hearth room inside it'
    anchors:
      '1': all four exist as distinct places, connected so that she goes from the town and the shop out into the hills and reaches the castle
        there, and the hearth is inside the castle
      '0.5': one of these places is missing or merged into a generic place, or the castle stands somewhere unconnected to the route, or the hearth
        is not inside the castle
      '0': the story has no distinct settings
    evidence:
    - - '00:02.4'
      - '00:12.9'
    - - '00:14.9'
      - '00:16.4'
    - - '00:20.9'
      - '00:22.2'
    - - '00:41.5'
      - '00:45.5'
    - p002
    - p004
    - p012
    - img03
  - id: CR5
    item: 'Inside the castle the fire demon strikes a deal with her: he will break her curse if she breaks the link between him and the wizard'
    anchors:
      '1': 'the game shows both sides of the deal: her curse lifted in return for freeing the demon from the wizard'
      '0.5': a deal with the demon is shown, but one side of the bargain is missing or wrong
      '0': missing
    evidence:
    - p004
    - p012
  functions_playability:
  - id: FP1
    item: 'The opening can be played through: each beat (the meeting, the curse, the departure, the scarecrow''s guidance, entering the castle)
      is reached or triggered by the player''s own play, and each leads on to the next'
    anchors:
      '1': the player plays each beat in turn and is led from one to the next up to entering the castle
      '0.5': one key beat (the curse, or reaching the castle) is only narrated or skipped by text, or progress stalls and needs a workaround
      '0': no playable story sequence
    evidence:
    - p004
    - - '00:02.4'
      - '00:20.4'
    - - '00:20.9'
      - '00:22.2'
    - - '00:44.5'
      - '00:47.4'
  - id: FP2
    item: 'The curse changes the heroine: after the Witch''s visit she is an old woman, and stays one in play until the curse is lifted'
    anchors:
      '1': the playable heroine visibly becomes old at the curse and remains so afterwards (until lifted, if the game gets that far)
      '0.5': the curse happens but has no lasting effect on the heroine, or is only stated in dialogue
      '0': no curse
    evidence:
