  - id: FP3
    item: 'Lifting the curse is the goal: the deal with the fire demon in the castle gives the player this goal, play progresses toward it, and
      the experience either reaches the text''s resolution or stops at a clear next step toward it'
    anchors:
      '1': meeting the demon sets the goal of the deal, there are steps toward it, and the experience either ends the way the text resolves it
