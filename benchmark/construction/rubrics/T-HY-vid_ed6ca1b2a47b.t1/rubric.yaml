source_inventory:
- 'clip 00:02.4-00:03.9: narrow cobbled alley between ochre half-timbered walls; dark, blob-like figures in straw boater hats move at its far
  end'
- 'clip 00:03.9-00:06.9: close-up, a blond man in a pink-and-grey diamond-patterned cloak with a blue pendant has his arm round a girl in a straw
  hat with a red band and a green dress; they walk quickly down the alley, the dark figures reaching after them from behind (00:06.4-00:06.9)'
- 'clip 00:07.4-00:11.3: they hold hands and are seen walking in the air above steep red-tiled roofs of half-timbered houses; pink-and-yellow
  banners and a crowd in the street below; text card ''From Academy Award-winning director Hayao Miyazaki'' (00:09.1-00:11.3)'
- 'clip 00:11.3-00:12.9: the girl lands on a covered timber balcony while the man stays outside in the air; he stands against blue sky with the
  cloak spread'
- 'clip 00:13.4-00:14.4: the girl (braid, green dress) embraces a blonde young woman in pink at a large wooden door'
- 'clip 00:14.9-00:16.4: a dim, cluttered hat shop: shelves and stands of hats, green patterned walls, red curtains; the girl stands in it'
- 'clip 00:16.9-00:17.9: a large woman in a dark wide hat and furs with a red necklace looms in the shop, smiling; the girl, holding her hat,
  looks round startled'
- 'clip 00:18.4-00:20.4: a dark smoky shot, then a hunched grey-haired old woman in the same green dress stares at her own old face in the shop
  mirror'
- 'clip 00:20.9-00:22.2: text card ''The critically acclaimed epic adventure'' over a sunset hillside; a small figure with a red scarf on the
  grassy rocks'
- 'clip 00:22.4-00:22.9: an old woman in a red head-scarf and apron in an interior; a round dial with four coloured segments on the wall by the
  door'
- 'clip 00:41.0: close-up of a young woman with silver-grey hair against a night sky'
- 'clip 00:41.5-00:43.0: the silver-haired young woman in a blue dress leans over a brick hearth where a small orange flame with eyes and a mouth
  sits on logs'
- 'clip 00:43.5-00:44.0: she floats or falls against a burning sunset sky'
- 'clip 00:44.5-00:45.5: a huge patchwork castle of domes, little houses, turrets, chimneys and pipes, venting steam and throwing light beams,
  stands on thin legs on a rocky hilltop under a dark dusk sky'
- 'clip 00:46.0-00:47.4: a scarecrow with a grinning turnip-like head, top hat and outstretched arms on one pole hangs over the old woman (red
  shawl, straw hat, walking stick) on a rocky slope'
- 'audio: no transcript is available inside the clip ranges; nothing scored rests on speech'
- 'text p001-p002: film lead; a fictional kingdom with magic and early 20th-century technology at war; Sophie, a young milliner, is turned into
  an old woman by a witch who enters her shop; she meets the wizard Howl, who refuses to fight for the king'
- 'text p003-p004: plot of the film''s first act: Sophie, eldest of three sisters, meets Howl on her way to her sister Lettie; at home the Witch
  of the Waste turns her into an old woman, unable to reveal the curse; she leaves home through the countryside; a living scarecrow, ''Turnip
  Head'', leads her to Howl''s moving castle, which she enters uninvited; she meets the apprentice Markl and the fire demon Calcifer, source of
  the castle''s magic and movement; Calcifer will break her curse if she breaks his link with Howl; she tells Howl that Calcifer hired her as
  a cleaning lady'
- 'text p005: the war; the King summons Howl; Sophie goes to the king posing as Howl''s mother with a charmed ring; Suliman drains the Witch of
  the Waste''s power; Howl rescues Sophie; the castle''s magic door opens on two false shopfronts'
- 'text p006: Howl''s life is bound to Calcifer''s; Howl turns into a bird-like creature, harder each time to undo; the castle is linked to Sophie''s
  home; the town is bombed; Sophie takes Calcifer out of the fireplace and the castle collapses; the Witch grabs Calcifer, who holds Howl''s heart;
  Sophie falls into a chasm'
- 'text p007: the ring leads Sophie into the past, where young Howl catches a falling star, Calcifer, and gives him his heart; back in the present
  the heart is returned to Howl, reviving him and freeing Calcifer; Sophie''s curse is broken but her hair stays silver; her kiss turns Turnip
  Head back into Justin, the missing enemy prince; the war ends; they fly off in a new flying castle'
- 'text p008-p009: comparison with the novel: the film''s castle is a ''rotund collage of chimneys, roofs, steam pipes, and other odd appendages,
  borne along on mechanized bird legs'', vaguely organic, driven by steam and magic; Calcifer is endearing; fantastic elements shown as mundane
  routine'
- 'text p010-p012: novel plot: Sophie Hatter, eldest of three in Market Chipping, Ingary, resigned to running the family hat shop; the Witch of
  the Waste turns her into a crone; she becomes cleaning lady to the wizard Howl and bargains with his fire demon Calcifer; neither Howl nor Calcifer
  can disclose the contract''s main clause, so Sophie must work it out herself'
- 'img01: ink-and-watercolour painting of the castle: a heap of small houses, turrets, riveted metal domes with eye-like portholes, cannon-like
  pipes and a gaping jaw-like front, on legs, in clouds of smoke'
- 'img02: castle design sheet: the same patchwork body with chimneys pouring smoke on thin bird-like legs, a tiny figure beside it; sketches of
  old Sophie, of the scarecrow with a hat, and of a jointed leg'
- 'img03: rough sketches of the castle from several sides, walking over a hill, a door low in its body with an old woman with a stick at it, the
  castle crouched on the ground'
- 'img04: watercolour sketch of a hunched old woman with a stick crouching at a big hearth where a flame with a face burns under a hood, kettle
  and pans around'
- 'img05: watercolour of a blond young man in a pink-and-dark-green diamond-patterned jacket with a red pendant, a flame with a face behind him,
  a plate before him'
- 'img06: character sketches: old woman with a braid, a dark-haired young man, a boy in a green waistcoat, the blond man in the diamond jacket
  with the flame demon behind, a startled old woman (Japanese name labels)'
- 'img07: watercolour of a girl in a hat and long dress with a braid facing a tall blond man in a long pink-and-green diamond cloak; a pencil
  sketch; a layout sheet with the blond man and other figures'
- 'img08: model sheet of the girl: long braid tied with a ribbon, high-collared buttoned long dress, brimmed hat, turnaround views'
- 'img09: pencil sketches of the wizard''s figure in the long diamond-patterned coat: running, from behind, reaching out a hand'
- 'img10: film still of the castle on a rocky hilltop under a stormy dusk sky: domes, little houses, chimneys venting steam, a light beam, thin
  legs'
- 'img11: film still of the flame demon in the hearth: a round orange flame with big eyes and a wide mouth on logs, two small carved figures either
  side'
