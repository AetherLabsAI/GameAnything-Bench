      - 00:25
    - - 00:43
      - 00:44
play_suggestions:
  FP1:
  - 'move the player from the tower core to the waterfront, to the park and onto the statue island: is every area reachable?'
  - 'try to move through tower blocks and along the shore: is blocking consistent?'
  FP2:
  - cross from one shore to the other by the bridge
  - 'try to cross open water directly: does the water act as a boundary? (design expectation, not scored)'
  - 'block or occupy the bridge: does it still behave as the crossing?'
  FP3:
  - 'play from the start to the end or the goal: does the goal involve the city''s areas?'
  - after the end, is there a result and a way to replay or continue?
  robustness:
  - leave the scene in the middle of play and return
  - 'push to the map edges and the far shore: are there holes, floating geometry or unintended exits?'
  - check whether moving elements (ferry, skaters, traffic), if built, keep working over a long session
