source_inventory:
- 00:00-00:05.5 title 'ROME' in large pale-yellow serif capitals fades in at 00:00 and fades out by about 00:05.5, over a slow forward drone glide
  above a river
- 00:00-00:05.5 the river with a stone arched bridge lined with statues leading to a round drum-shaped fortress-like building on the far bank;
  stone embankment walls, a tree-lined bank on the right, ochre and terracotta-roofed buildings in the foreground, a long pale palace block behind,
  hills on the horizon
- '00:06-00:12.8 cut to a higher, wider aerial: the river bends through the city, crossed by several bridges (a multi-arched stone bridge at the
  back, flatter bridges in front); both embankments tree-lined, walled; a dense carpet of low ochre / terracotta-roofed blocks with scattered
  domes fills the far side to the horizon; warm low sun; slow forward move'
- '00:13-00:15.5 close aerial of a white marble monument: a square colonnaded block topped by a bronze chariot group, beside a roundabout with
  green lawns, a plaza, trees and brick palazzi with a tower; slow orbit'
- 00:16-00:18.5 aerial of a large elliptical amphitheatre ruin with tiers of arches; the outer ring is broken lower on one side, exposing inner
  tiers; red-roofed blocks in front, trees behind, streets around; slow orbit with long shadows
- 00:19-00:25.5 low aerial over rooftops toward a round domed temple with a triangular-pediment portico, sunk among low roofs; church bell towers
  / facades in the foreground, small domes and spires on the skyline; clear blue sky; slow forward drift
- '00:26-00:31.5 near top-down oblique view of a fountain: a turquoise basin set against a sculpted pale palace facade, hemmed in by tight alleys
  and rooftops; slow rotation'
- '00:32-00:38 golden-hour aerial, partly backlit and hazy: the wide white colonnaded monument on stepped terraces, with a long straight tree-lined
  avenue running from it toward the horizon; mountains silhouetted far away'
- 00:38.5-00:41.5 aerial of a large dome behind a church facade, with curved colonnades enclosing an oval square; a straight street on the right;
  palazzi around; hazy warm light
- 00:42-00:44.5 the amphitheatre again, farther away and lit warm gold, among trees and streets, with a pale building complex in the foreground
  and hills on the horizon
- 00:45-00:51 the white monument again, now from the front at a distance, long shadows across the city, two ochre buildings in the foreground
  and a dome at lower left; slow drift
- '00:51.5-00:57.5 street-level shot: a stone lion-head (mask) fountain spouting water into a basin in the foreground, the columned portico of
  the domed temple with an inscribed frieze behind, cars and a few pedestrians, pale buildings on the right; slow lateral move'
- 'throughout: only slow camera moves (forward glides, orbits, drifts) cut together; no interaction, no on-screen text after the title, no night
  shots'
- 'audio: music only (no speech detected; transcript empty)'
