instructions_meta:
  requirement_groups:
    at-bat:
    - FP1
    fielding and outs:
    - CR3
    - FP3
    - FP4
    - FP5
    - FP6
    calls on screen:
    - FP2
    - VP2
    ballpark:
    - CR1
    - VP1
    players:
    - CR2
    - VP3
  explicit_requirements:
  - type: specify
    text: It should play in real time, so I swing the bat myself as the pitch comes in and run my fielder down to the play myself, not through menus
      or turns.
    covers:
    - FP1
    - FP3
  - type: specify
    text: Like in the clip, my fielder should be able to dive across the ground to get to a play he can't reach on foot.
    covers:
