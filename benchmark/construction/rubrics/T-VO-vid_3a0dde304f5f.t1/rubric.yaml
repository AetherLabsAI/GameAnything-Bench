- '02:58.3-02:59.3 high aerial fly-over of a jungle/ruins region: racers crossing a stone bridge, a road continuing through the landscape'
- '02:59.8-03:00.3 aerial view of a desert region: a long straight road with a pack of racers, sponsor flags and an item box by the road'
- 03:00.8-03:01.8 aerial view of a farmland region with a checkered flag and a dirt road, racers spread along it
