# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-VO-vid_1d8d10692142.t1
source_inventory:
- 00:27.4-00:33.9 elevated drone view straight down a wide avenue to a monumental stone arch standing in a large roundabout; the low sun sits
  inside the arch opening and throws a bright orange strip of light down the centre of the avenue; cars drive on the avenue and circle the roundabout;
  rows of trees line both sides of the avenue; streetlamps (unlit); pale uniform buildings at the edge of the roundabout; a single tall building
  on the horizon to the right of the arch; pink-orange horizon under a blue-grey sky; camera slowly descends / pushes in
- 00:31.9-00:33.9 a faint, illegible watermark text at the bottom right of the frame
- '00:34.4-00:40.9 close-up of the arch: carved relief panels with crowds of figures, a sculpted group on the pillar, inscribed pillar faces,
  a decorated cornice; a very large flag hangs inside the arch opening and waves in the wind (red and white clearly, a dark blue stripe visible
  from 00:38.4); warm side light on the stone; city buildings and trees glimpsed through the opening'
- '00:41.4-00:47.4 high aerial, near top-down: the arch at the centre of a large circular roundabout with about a dozen straight avenues radiating
  out like a star; wedge-shaped blocks of uniform pale mid-rise buildings with grey roofs fill the spaces between the avenues; trees (some yellowing)
  along the avenues and in a ring around the circle; very long shadows from a low sun at the upper left, orange haze on the horizon; the camera
  slowly rotates / drifts'
- '00:47.9-00:54.4 rooftop-level view: grey zinc mansard roofs with round dormer windows and red chimney pots, a white blank gable wall and tree
  tops in the foreground; the lattice iron tower stands in the distance on the left third, its lights on (warm gold), rising far above the low
  uniform skyline; teal sky with a pink-red band at the horizon; slow lateral drift'
- 00:54.9-01:01.4 dusk, elevated view along a long straight avenue lined by two dark rows of trees toward a distant cluster of modern high-rise
  towers on the horizon; a large cube-shaped open gate building sits in the middle of the cluster, on the avenue's axis; red tail-lights and white
  headlights stream along the avenue, a few windows lit; a dark wooded park area on the left; the city below is blue-teal, the sky solid orange
- 01:01.9-01:07.9 the lattice tower centred in frame, fully lit in warm orange-gold, against streaky red-orange clouds; the dense city below is
  dark with scattered lights; from about 01:06.4 a white searchlight beam appears from the top of the tower and is clearly visible at 01:06.9-01:07.9,
  pointing to the upper right
- '01:08.4-01:18.4 night aerial, nearly static: a wide avenue lit orange runs straight from the foreground to a large rectangular plaza / garden
  whose perimeter is outlined by lights, the axis continuing beyond it; dark tree rows flank the avenue; a large glass-roofed hall on the right,
  a small domed building on the left; the surrounding city is dark blue with sparse lit windows'
- 'editing: hard cuts between the shots at about 00:34.3, 00:41.2, 00:47.9, 00:54.9, 01:01.7 and 01:08.4; the light gets darker shot by shot (low
  sun -> dusk -> night)'
- 'on-screen text: none apart from the faint watermark'
- 'audio: music only, no speech (annotation audio_relevance music_only; the Whisper transcript of the range is empty)'
- 'not visible: no people at readable scale, no interaction or rules; the connection between the shots (one route or separate places) and the
  real distances are not shown'
