rubric:
  content_realization:
  - id: CR1
    item: The game contains a monumental stone arch with carved relief / sculpture on its faces and a very large flag hanging inside its opening,
      moving in the wind
    anchors:
      '1': a monumental arch with visible carved relief / sculpture and a large flag hanging inside the opening that moves
      '0.5': an arch without the carving or without the flag, or the flag placed elsewhere (on top, beside it) or rigid
      '0': no monumental arch
    evidence:
    - - 00:34
      - 00:41
    - - 00:27
      - 00:34
  - id: CR2
    item: The arch stands at the centre of a large circular roundabout from which about a dozen straight avenues radiate in a star, with wedge-shaped
      building blocks filling the spaces between them
    anchors:
      '1': the arch centred in a circle with many (about 10 or more) straight radiating avenues and built blocks between them
      '0.5': a roundabout around the arch with fewer (fewer than about 10, e.g. 4-9) or irregular radial roads, empty wedges, or the arch not
        at the centre
      '0': no radial hub around the arch
    evidence:
    - - 00:41
      - 00:48
    - - 00:27
      - 00:34
  - id: CR3
    item: A long straight avenue runs continuously to a distinct cluster of modern high-rise towers, with a large cube-shaped open gate building
      standing in the cluster on the avenue's axis
    anchors:
      '1': one continuous straight avenue ending on a distinct high-rise cluster with a cube-like gate building on its axis
      '0.5': a high-rise cluster at the end of the avenue but no gate on the axis, or the avenue is broken / bends so the cluster is off its axis
      '0': no high-rise cluster at the end of a long avenue
    evidence:
    - - 00:55
      - 01:02
  - id: CR4
    item: Another long straight avenue leads to a large rectangular plaza / garden that sits on its axis
    anchors:
      '1': a straight avenue ending on a large rectangular plaza or garden on its axis
      '0.5': a plaza exists but not at the end of a straight avenue, or it is small / not rectangular
      '0': no such plaza
    evidence:
    - - 01:08
      - 01:19
  - id: CR5
    item: A tall lattice iron tower stands in the city and rises far above the buildings around it
    anchors:
      '1': a tall lattice tower that clearly towers over the surrounding city
      '0.5': a tall tower that is not a lattice form, or one that does not stand out (surrounded by buildings of similar height)
      '0': no tower landmark
    evidence:
    - - 00:48
      - 00:55
    - - 01:02
      - 01:08
  functions_playability:
  - id: FP1
    item: 'Hub junction works: the radial roads are actually connected to the circular junction around the monument, and vehicles drive around
      the circle and enter and leave it by the radial roads'
    anchors:
      '1': radial roads connected to the circle, with vehicles circulating and passing through it over time
      '0.5': the roads are drawn next to the circle but not all connected, or vehicles appear but stand still / do not pass through
      '0': no working junction, or no traffic on it
    evidence:
    - - 00:27
      - 00:34
    - - 00:41
      - 00:48
  - id: FP2
    item: 'Long avenue as a working link: vehicles travel the long avenue along its length to the high-rise area at its far end'
    anchors:
      '1': moving vehicles use the avenue end to end, reaching the high-rise area
      '0.5': traffic only on part of it, or vehicles stuck / not reaching the far end
      '0': no traffic on the avenue, or no such avenue
    evidence:
    - - 00:55
      - 01:02
  - id: FP3
    item: 'Time-of-day progression: the experience passes from a low-sun daylight through dusk into night, and street and vehicle lights turn
      on as it darkens'
    anchors:
      '1': observable day -> dusk -> night change with street and vehicle lights switching on in the dark phases
      '0.5': the light changes but the lights do not come on (or are always on), or only a fixed sunset / fixed night
      '0': a single static lighting state with no lights
    evidence:
    - - 00:27
      - 00:34
    - - 00:55
      - 01:02
    - - 01:08
      - 01:19
  visual_presentation:
  - id: VP1
    cat: key_moment
    keyframes:
    - '00:29.4'
    - '00:37.9'
    item: 'The arch looks like the reference''s: a massive, blocky pale-stone arch that dominates the view at the end of its tree-lined avenue'
    anchors:
      '1': a massive pale stone arch of the reference's heavy, square-built proportions, dominating the view down the avenue
      '0.5': an arch of a different look (slender, a gate or modern structure, wrong material) or one lost in the view
      '0': no arch visible
    evidence:
    - - 00:27
      - 00:41
  - id: VP2
    cat: key_moment
    keyframes:
    - '01:02.4'
    - '00:50.4'
    item: 'The lit tower at dusk: the lattice tower glowing warm gold over a darker city'
    anchors:
      '1': the lattice tower lit warm gold against a dusk sky, standing out over a darker city
      '0.5': the tower lit but not with a warm glow, or not standing out from an equally bright city
      '0': the tower never seen lit
    evidence:
    - - 01:02
      - 01:08
    - - 00:48
      - 00:55
  - id: VP3
    cat: style
    keyframes:
    - '00:49.4'
    - '00:42.9'
    item: 'Uniform historic city fabric: pale stone mid-rise buildings of even height with grey mansard roofs, dormer windows and chimney pots,
      forming a low, even skyline'
    anchors:
      '1': even-height pale buildings with grey pitched / mansard roofs giving a uniform low skyline
      '0.5': even height but a modern / mixed look, or the right look with very uneven heights
      '0': unrelated building style
    evidence:
    - - 00:48
      - 00:55
    - - 00:41
      - 00:48
play_suggestions:
  FP1:
  - 'watch the hub for a few in-game minutes: do vehicles enter, circle and leave by different radial roads?'
  - check that each radial road is connected to the circle, not just drawn next to it
  FP2:
  - 'follow one vehicle from the district along the long avenue: does it reach the high-rise area?'
  - check from above that the avenue is one continuous straight road
  FP3:
  - 'advance time from late afternoon into night: when do street and vehicle lights turn on?'
  - check that lights are off (or not prominent) in full daylight
  robustness:
  - 'pause and unpause, and run at the fastest speed for a while: does the hub still flow without gridlock?'
  - 'save and reload: are the monument, tower, high-rise cluster and lighting state intact?'
  - 'bulldoze one radial road: does traffic reroute instead of the whole hub locking up?'
  - 'let the simulation run for a while: do the blocks between the avenues stay built (no abandoned or empty lots)?'
