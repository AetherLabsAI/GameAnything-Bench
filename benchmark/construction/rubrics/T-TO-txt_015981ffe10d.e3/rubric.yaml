task_id: T-TO-txt_015981ffe10d.e3
source_inventory:
- 'c33.p001-c33.p005: Konrad steps out of a dark grotto and sees a sea; his uncle names it the Haldenwang Sea; a wide indented shore of fine sand
  with small shells, waves and a breeze, a huge wall of cliffs rising about a hundred fathoms back from the water, its spurs forming capes and
  promontories, a hazy horizon; the coast looks desert and wild'
- 'c33.p006-c33.p008: the light is neither sun nor moon but a diffuse, trembling, bright white, cold glow of apparently electric origin, like
  a permanent aurora; the ''sky'' is a vault of shifting cloud with deep shadows below and occasional bright rays between the clouds; the effect
  is melancholy, the space felt as walled in by granite; an English captain''s hollow-earth theory is recalled'
- 'c33.p009-c33.p013: the cavern''s width and length cannot be estimated (the shore widens out of sight, the horizon is dim), its height several
  leagues, a cloud estimated at 12,000 feet; comparisons with the Guachara grotto and the Mammoth Cave (with a translator''s footnote); Konrad''s
  awe and some fear'
- 'c33.p014-c33.p020: the dense, salty air restores Konrad after forty-seven days in a narrow gallery; he leaves the grotto; his uncle proposes
  a walk following the windings of the shore'
- 'c33.p021-c33.p025: along the shore, on the left, huge piled rock pyramids with many waterfalls and clear streams, vapours of hot springs, streams
  running down gentle slopes into the sea; among them the Sigurdbach, the stream that guided their journey, ends in the sea'
- 'c33.p026-c33.p030: five hundred paces on, at the turn of a high promontory, a dense forest of umbrella-shaped growths that do not move in the
  wind; up close, thousands of pale mushrooms thirty to forty feet high with caps as wide, packed so close that it is completely dark and chilly
  beneath; they wander in it half an hour and come back out to the shore'
- 'c33.p031-c33.p035: farther on, groups of tall trees with colourless foliage, giant forms of plants known from coal mines (lycopodiums, sigillaria,
  tree ferns, lepidodendra); the uncle calls it the flora of the transition period, ''a conservatory'' and also ''a menagerie'''
- 'c33.p036-c33.p047: dust and bones of extinct animals scattered on the ground, whole skeletons among them (mastodon jaw, deinotherium teeth,
  megatherium femur; translator''s footnote); debate on how animals came to a granite cavern (subsidence of sedimentary soil); Konrad fears living
  monsters in the forests or behind the crags, but no living creature appears on the barren strand'
- 'c33.p048-c33.p051: Konrad rests at the end of a promontory beaten by spray, overlooking the whole bay; at its far end a small harbour lies
  between pyramidal cliffs, its water calm and sheltered from the wind; deep silence on the naked rocks when the wind drops; questions about where
  the sea ends and its opposite shore; after an hour they return along the shore to the grotto to sleep'
- 'c34.p001-c34.p002: next morning Konrad bathes in the sea; Sigurd, the guide, cooks breakfast with water and fire, coffee'
- 'c34.p003-c34.p019: the uncle leads them to the shore to observe high tide; the waves slowly encroach on the sand, ridges of foam show the sea
  will rise about twelve feet; attributed to the sun and moon; talk of seas, continents and unknown fish in the earth''s interior, a plan to make
  fishing lines'
- 'c34.p020-c34.p033: the uncle''s readings: 350 leagues horizontally from Iceland, 35 leagues deep, compass deviation and an upward needle dip
  (magnetic pole above them); Scotland overhead; the vault compared to bridges and cathedral arches, radius three leagues'
- 'c34.p034-c34.p046: the uncle will not return to the surface: they will cross the sea, which must have a granite coast with fresh passages on
  the far side (he guesses thirty or forty leagues), and set sail tomorrow on a raft; Sigurd is already hammering'
- 'c34.p047-c34.p055: half an hour''s walk away, on the other side of the promontory that forms the little harbour, Sigurd is building a raft
  on the sand from surturbrand (fossil northern conifers, a kind of lignite); a piece thrown into the sea sinks briefly and floats; by next evening
  the raft (ten by five feet, planks bound with cords) is finished and floats when launched on the Haldenwang Sea'
