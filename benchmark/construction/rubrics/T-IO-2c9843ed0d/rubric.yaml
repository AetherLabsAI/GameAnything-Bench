rubric:
  content_realization:
  - id: CR1
    item: 'The game''s main characters are a crew of three with split roles: two go down to the Moon''s surface, one stays aboard the craft orbiting
      the Moon'
    anchors:
      '1': three crew and the two-down / one-in-orbit split
      '0.5': a three-person crew or two moonwalkers, without the split of roles
      '0': missing, or a single hero
    evidence:
    - img01
    - img02
    - img04
    - img05
  - id: CR2
    item: 'The game has distinct craft: a separate lander that carries the two down to the surface and back up, and the orbiting craft that waits
      for them and brings the crew home'
    anchors:
      '1': a separate lander for the surface leg, distinct from the orbiting craft that brings the crew home
      '0.5': one generic spaceship does everything, or the lander's or the return craft's role is missing
      '0': missing
    evidence:
    - img03
    - img05
  - id: CR3
    item: 'The game contains the story''s stages in their order: launch from Earth, landing on the Moon, the walk on the surface, lift-off and
      rejoining the orbiting crewmate, return to Earth'
    anchors:
      '1': all five stages present in this order
      '0.5': most stages in order, or one stage missing or misplaced
      '0': missing or scrambled
    evidence:
    - img03
    - img05
  - id: CR4
    item: 'The game presents the mission''s goal: to be the first humans to set foot on the Moon and come back'
    anchors:
      '1': first footsteps on the Moon AND the return given as the goal
      '0.5': only one of the two halves
      '0': no goal given
    evidence:
    - img01
    - img05
  functions_playability:
  - id: FP1
    item: 'Play carries the player from one stage of the story to the next: finishing a stage through play leads into the following one, through
      to the end'
    anchors:
      '1': the player advances through the stages by playing them, without breaks, to the end
      '0.5': the stages are reached mostly by cutscenes, menus or skips rather than by play, or the progression stalls or breaks between stages
      '0': no progression; a single sandbox or a single scene
    evidence:
    - img03
    - img05
  - id: FP2
    item: 'The surface excursion: playing as one of the two surface crew, the player leaves the lander, spends playable time on the Moon''s surface,
      and must get back to the lander to leave'
    anchors:
      '1': playable time on the surface and a required return to the lander to leave
      '0.5': the surface can be walked but the return to the lander does not matter, or the surface is only shown
      '0': no surface play
    evidence:
    - img05
  - id: FP3
    item: Lift-off from the Moon and rejoining the orbiting craft is a step the player goes through, and the return home depends on it
    anchors:
      '1': a lift-off / rejoin step the player takes part in, required before the return home
      '0.5': the step is only told or shown (text, cutscene), or present but not tied to the return
      '0': the crew simply returns, no such step
    evidence:
    - img01
    - img05
  - id: FP4
    item: Completing the return to Earth ends the game with a clear success payoff that sets the mission apart as accomplished
    anchors:
      '1': reaching home triggers an ending that clearly marks the mission as accomplished
      '0.5': the game stops at the return without a payoff, or the ending is not set apart from ordinary play
      '0': no ending
    evidence:
    - img04
    - img05
  visual_presentation:
  - id: VP1
    cat: spatial
    item: 'The lunar setting: a barren, cratered plain under a black sky'
    anchors:
      '1': a barren cratered plain and a black sky together
      '0.5': a barren ground, but generic (no craters, or a blue or bright sky)
      '0': no lunar setting
    evidence:
    - img03
    - img05
  - id: VP2
    cat: key_moment
    item: 'The launch: a rocket rising from its pad on fire and billowing smoke'
    anchors:
      '1': a recognisable rocket lift-off with flame and smoke
      '0.5': a launch shown without the rocket's look, or only implied
      '0': none
    evidence:
    - img05
  - id: VP3
    cat: key_moment
    item: 'The lander over the surface: a legged craft flying just above the ground on its engine plume'
    anchors:
      '1': a legged lander on an engine plume close over the surface
      '0.5': a generic ship landing or taking off, without the lander's look or the plume
      '0': none
    evidence:
    - img03
    - img05
  - id: VP4
    cat: style
    item: 'The surface crew look like the reference''s astronauts: pressure suits with helmet and backpack'
    anchors:
      '1': suited astronauts with helmet and backpack
      '0.5': suited figures lacking the helmet or the backpack
      '0': ordinary clothing
    evidence:
    - img05
play_suggestions:
  FP1:
  - play from the start and note how each stage leads into the next
  - note which transitions are played and which are only cut to or skipped
  FP2:
  - walk away from the lander and try to leave without returning to it
  - note what there is to do on the surface (unscored)
  FP3:
  - 'fail the lift-off or the rejoin on purpose, if the game lets you: what happens? (unscored)'
  - try to skip the step and go straight home
  FP4:
  - 'finish the game: does reaching home trigger an ending that clearly marks success?'
  robustness:
  - wander far across the surface away from the lander and come back
  - after a failure ending, can you retry or restart?
  - 'stand idle in each stage: does the story stall sensibly or break?'
