# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-IO-2c9843ed0d
source_inventory:
- 'img01: typed memo ''To: H. R. Haldeman / From: Bill Safire / July 18, 1969'', headed ''IN EVENT OF MOON DISASTER'': a statement for the case
  that the two men who went to the Moon (Neil Armstrong and Edwin Aldrin) stay there with no hope of recovery; they will be mourned by families,
  nation and world; ''others will follow, and surely find their way home''; instructions that the President phone the ''widows-to-be'' and that
  a clergyman commend their souls as at a burial at sea once NASA ends communications'
- 'img02: black-and-white TV studio: three men in armchairs (two in patterned short-sleeve shirts, one in a polo shirt) before a dark curtain
  with a US flag and an ''APOLLO 11'' eagle-over-the-Moon emblem, small spacecraft models on a low table; a fourth man seated left; TV cameras
  and crew in the foreground (a crew press appearance)'
- 'img03: colour composite (watermark ''Created by: Cristian Ibarra Santillan''): a legged, gold-foil and grey lunar lander hovering just above
  a grey cratered plain on a downward engine plume, blowing up dust, under a black sky'
- 'img04: pavement of terrazzo star plaques (James Stewart, Kirk Douglas, Edward R Murrow, Wendy Barrie) around a round plaque ''NEIL A. ARMSTRONG
  / EDWIN E. ALDRIN JR. / MICHAEL COLLINS / 7/20/69 / APOLLO XI'' with a TV emblem'
- 'img05: museum display (''Reliquias do Mundo'', Portuguese placard: a piece of the inner lining, ''KAPTON FOIL'', of the craft that took man
  to the Moon; Armstrong stepped on the Moon on 20 July 1969). Framed: rocket launch from the pad (two photos), three-man crew portrait in white
  spacesuits, mission emblem, a capsule floating in the ocean with a raft and swimmers (recovery), a suited astronaut on the lunar surface, astronaut
  beside a flag and the lander, Earth above the lunar horizon, the lander''s upper stage flying above the Moon; an English panel: on July 20,
  1969 Armstrong became the first human to set foot on the Moon; after 21 1/2 hours he and Aldrin left in the Lunar Module ''Eagle'' and rejoined
  Michael Collins in the Command Module ''Columbia'' for the trip back to Earth; a gold foil swatch ''removed from the heat shield after splashdown'';
  date stamp 22-AGO-14'
- 'img06: dimly lit museum case: an open handwritten ''Test Supervisor''s Log Book, Apollo 11, July 16-24, 1969'' (entries on water in the spacecraft,
  inspections by IBM and Douglas, a hatch problem); faint caption: one of four log books of the testing exercises, a programme rushed to meet
  a 1969 deadline for a Moon landing'
instructions_meta:
  requirement_groups:
    story progression and ending:
    - CR3
    - FP1
    - FP4
    characters, roles and goal:
    - CR1
    - CR2
    - CR4
    playable key situations:
    - FP2
    - FP3
    settings and key moments:
    - VP1
    - VP2
    - VP3
    character appearance:
    - VP4
