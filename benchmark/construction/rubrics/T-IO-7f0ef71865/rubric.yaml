instructions_meta:
  requirement_groups:
    cart movement and control:
    - FP1
    - FP2
    cargo and its readable state:
    - CR1
    - FP3
    - VP2
    track arrangement:
    - CR2
    haulage route:
    - FP4
    mine spaces:
    - CR3
    - VP1
  explicit_requirements:
  - type: specify
    text: The track should be a network like in the pictures, with several lines that join or cross, not just one single line.
    covers:
    - CR2
rubric:
  content_realization:
  - id: CR1
    item: The game contains mine carts that hold a load of mined material, and both loaded and empty carts occur
    anchors:
      '1': carts that are containers for mined material (ore, rock, coal), with loaded and empty carts both present
      '0.5': carts that hold a load, but loaded and empty carts are not both present, or the load is not mined material
      '0': no carts, or carts that carry nothing
    evidence:
    - 'img02: loaded carts left, empty cart right'
    - img03
    - img04
    - img01
  - id: CR2
    item: 'The track is a network, not one line: several lines join or cross'
    anchors:
      '1': several track lines that join or cross one another
      '0.5': several separate tracks that do not connect
      '0': a single line only, or no track
    evidence:
    - img02
    - img06
  - id: CR3
    item: 'The mine layout: an underground tunnel or gallery with the track along its floor, and an entrance through which that track runs out
      to the surface'
    anchors:
      '1': underground workings with track, and an entrance where the same track passes from the tunnels to the outside
      '0.5': underground track and an entrance both exist but the track does not run through the entrance between them, or only one of the two
        exists
      '0': no underground track space
    evidence:
    - img01
    - 'img02: light from the tunnel mouth'
    - img04
  functions_playability:
  - id: FP1
    item: 'Carts run on the track: they are guided by it and cannot travel where there is no track'
    anchors:
      '1': carts stay on and follow the track wherever it goes
      '0.5': carts follow the track mostly but leave it or float off it in some places
      '0': no rail-bound carts
    evidence:
    - img01
    - img02
    - img05
  - id: FP2
    item: 'The player moves the carts: by their own action the player makes a cart move along the track'
    anchors:
      '1': a cart moves along the track by the player's own input
      '0.5': carts move along the track but only on their own or on a script, not by the player's action
      '0': carts cannot be moved
    evidence:
    - img06
  - id: FP3
    item: A loaded cart keeps its load while it moves along the track
    anchors:
      '1': the load stays with the cart as it moves along the track
      '0.5': the load stays only some of the time, or is lost or reset when the cart moves
      '0': carts carry no load in play
    evidence:
    - img02
    - img03
    - img04
  - id: FP4
    item: 'Hauling route: a loaded cart can be brought along the track from the underground workings out through the entrance to the surface'
    anchors:
      '1': a loaded cart can be taken along the track from inside the mine to the outside
      '0.5': a cart can be moved only part of the way, e.g. inside the mine but not out through the entrance
      '0': no cart can be taken between the workings and the entrance
    evidence:
    - img01
    - img02
  visual_presentation:
  - id: VP1
    cat: spatial
    item: 'The underground play space looks like a mine: a rough rock tunnel or gallery around the track'
    anchors:
      '1': the track and carts sit in a space that clearly reads as a rock-cut mine tunnel or gallery
      '0.5': underground, but it reads as a generic cave or room rather than a mine tunnel
      '0': the track space does not look underground, or there is none
    evidence:
    - img02
    - img04
  - id: VP2
    cat: presentation
    item: 'A cart''s load state is readable: loaded and empty carts are told apart at a glance'
    anchors:
      '1': loaded and empty carts distinguishable at a glance, by the load in the cart or another clear indicator, without opening a menu
      '0.5': the load state only in a menu / tooltip that must be opened, or hard to see
      '0': load state not shown
    evidence:
    - img02
    - img03
    - img04
play_suggestions:
  FP1:
  - follow a cart round a curve and over the full track
  - try to push or drive a cart past the track end or off a curve
  FP2:
  - start a cart, stop it halfway, start it again
  - try to move a cart in both directions
  FP3:
  - 'fill an empty cart and move it: does the load stay?'
  - 'empty it at the destination: does anything count it?'
  FP4:
  - take a loaded cart from deep in the mine to the entrance and check for feedback
  - 'deliver a second load: does play continue?'
  robustness:
  - put two carts head-on on one line
  - leave a loaded cart on the track, leave the area and come back
  - break or remove a piece of track under a moving cart
  - couple two or three carts, if possible, and move them through a curve
  - at a junction, if any, send one cart onto each line
