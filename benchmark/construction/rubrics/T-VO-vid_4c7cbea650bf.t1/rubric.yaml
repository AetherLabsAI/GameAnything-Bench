instructions_meta:
  requirement_groups:
    run structure:
    - FP1
    riding and air tricks:
    - FP2
    - FP3
    - VP2
    scoring and competition standing:
    - CR2
    - FP4
    - FP5
    - FP6
    result presentation:
    - VP3
    skate park:
    - CR1
    - VP1
  explicit_requirements:
  - type: keep
    text: I want the on-screen countdown clock from the clip that ticks down while I ride and ends my run when it hits zero.
    covers:
    - FP1
  - type: specify
    text: Also, like in the clip, each skater gets three runs and only their best single run counts in the standings, not the total.
    covers:
    - FP5
rubric:
  content_realization:
  - id: CR1
    item: The skate park play space contains a sunken bowl with coping on its edge and curved transitions, a hip / pyramid topped by a deck, and
      raised boxes / decks at the bowl rim, joined into one rideable park
    anchors:
      '1': bowl with coping, hip / pyramid with a deck, and rim boxes / decks all present and connected so the player can ride from one to the
        other
      '0.5': only one or two of these features, or the pieces stand apart without riding connections between them
      '0': flat arena, a street course / rails only, or an unrelated map
    evidence:
    - - 00:45
      - 00:54
    - - 01:00
      - 01:01
  - id: CR2
    item: The competition has other competitors, each with a best score, listed in a standings table ordered by score that the player can see
      before a run
    anchors:
      '1': several other competitors with scores, in a standings list ordered by best score, viewable before the player's run
      '0.5': competitors exist but the list is not ordered by score, or it is never shown before a run
      '0': no other competitors or no standings list
    evidence:
    - - 00:42
      - 00:44
    - - 01:08
      - 01:13
  functions_playability:
  - id: FP1
    item: 'Timed run: a run starts with a visible countdown of a fixed, short length that governs the remaining run time; when the time runs out
      the run is over, and riding after that does not change the run'
    anchors:
      '1': a countdown starts with the run, is visible while riding, and ends the run every time the time runs out
      '0.5': a time limit exists but is not visible, varies, or the run does not reliably end when the time runs out
      '0': no time limit; the run ends only by quitting or never
    evidence:
    - - 00:46
      - 01:03
  - id: FP2
    item: 'Riding a line: the player can carve curved walls to gain or keep speed, launch off an edge into the air, land on the transition and
      keep riding without stopping'
    anchors:
      '1': speed gained from transitions, launches off edges, and landings that continue the line
      '0.5': movement and jumps exist, but speed does not come from the walls or every landing stops the player
      '0': plain walking / running with no launch from obstacles
    evidence:
    - - 00:46
      - 00:54
    - - 01:00
      - 01:02
  - id: FP3
    item: 'Air tricks: while airborne the player controls rotation tricks, and different tricks can be told apart'
    anchors:
      '1': the player chooses and performs different rotation tricks in the air, recognisably distinct from one another
      '0.5': only one kind of trick, or tricks happen automatically without player control
      '0': no tricks in the air
    evidence:
    - - 00:53
      - 00:59
    - - 01:04
      - 01:07
  - id: FP4
    item: 'Run score: when the run ends, the player gets one run score that reflects what was performed (harder tricks and a clean run without
      bails score higher)'
    anchors:
      '1': one overall score per run presented after the run, clearly higher for a run with hard, cleanly landed tricks than for an idle run or
        one with failed / unlanded tricks
      '0.5': a score exists but is not tied to the run end, or barely depends on what was performed
      '0': no run score
    evidence:
    - - 00:46
      - 01:09
    - - 01:08
      - 01:13
  - id: FP5
    item: 'Three runs, best counts: in one competition the player gets three runs, each scored on its own, and the best single run is what counts
      in the standing'
    anchors:
      '1': three runs per competition, each keeping its own score, and the standing uses the best run score (a worse later run does not lower
        it)
      '0.5': several runs but not three, or the runs are scored but the standing uses their sum / average or the last run, or only a running total
        is kept
      '0': a single run only, or the run scores do not decide the standing at all
    evidence:
    - - 00:42
      - 00:44
    - - 01:08
      - 01:13
  - id: FP6
    item: 'Standings update: after each completed run the player''s place among the competitors changes with the player''s best score (beating
      a higher-ranked best moves the player above it), and the current placing is shown after the run'
    anchors:
      '1': the ranking changes correctly with the player's best score after each run, and the new placing is shown
      '0.5': the ranking is static, ordered wrongly after a run, or the placing is not shown after the run
      '0': the player's runs are never compared with the other competitors
    evidence:
    - - 00:42
      - 00:44
    - - 01:08
      - 01:13
  visual_presentation:
  - id: VP1
    cat: spatial
    keyframes:
    - '00:45.0'
    - '00:46.5'
    - '00:53.5'
    item: 'Park look: the play space reads as a concrete bowl park, smooth curved walls dropping into the sunken bowl with the coping edge marked
      in a contrasting colour, the hip and rim decks rising around it'
    anchors:
      '1': recognisably a concrete bowl park with curved walls and a visibly marked coping edge, the hip and decks seen around the bowl
      '0.5': ramps / a bowl are there but look like generic blocks, or the coping edge is not visible
      '0': does not look like a skate park
    evidence:
    - - 00:45
      - 00:54
  - id: VP2
    cat: key_moment
    keyframes:
    - '00:53.5'
    - '00:56.5'
    - '00:57.5'
    item: 'Aerial rotation above the coping: the rider high above the bowl edge, body and board visibly rotating in the air'
    anchors:
      '1': a recognisable rider (or avatar) shown airborne above an edge, visibly rotating
      '0.5': a jump is shown but without visible rotation, or not above an edge
      '0': no aerial moment
    evidence:
    - - 00:53
      - 00:59
  - id: VP3
    cat: presentation
    keyframes:
    - '01:08.0'
    - '01:09.5'
    item: 'Result reveal: right after a run, one set-apart result display shows the player''s name with the scores of all runs side by side and
      the current rank'
    anchors:
      '1': a distinct result display after the run with every run's score and the rank together
      '0.5': only the latest score, or the rank without the run scores, or shown in a console / log line
      '0': no result display
    evidence:
    - - 01:08
      - 01:13
play_suggestions:
  FP1:
  - 'start a run and stand still: does the countdown run and end the run when the time runs out?'
  - 'keep riding and jumping as the time runs out: does anything still count?'
  - 'start two runs: is the run length the same?'
  FP2:
  - 'ride down and up a curved wall repeatedly: does speed build or hold?'
  - launch off the coping, a hip and a box edge; land on a slope and on flat ground
  FP3:
  - try each available trick input in the air
  - 'start a trick too low to finish it: what happens?'
  FP4:
  - 'do one idle run and one run with several landed rotations: compare the scores'
  - 'fail or land tricks sideways repeatedly in a run: is the score lower than a clean run?'
  FP5:
  - 'score a good run, then a deliberately bad run: does the standing keep the better one?'
  - count the runs offered in one competition
  FP6:
  - check the standings before your first run
  - 'beat the top score: do you move to first?'
  - 'finish all runs: is a final placing shown? (expected of a game, not shown in the clip)'
  robustness:
  - 'quit or respawn in the middle of a run: is the run state sensible?'
  - ride out of the park or onto the deck edges
  - 'restart the competition after it ends: are old scores cleared?'
  - 'fire weapons or use other default game actions during a run: do they break the run?'
