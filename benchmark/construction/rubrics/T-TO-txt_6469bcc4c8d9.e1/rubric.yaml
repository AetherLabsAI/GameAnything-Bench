rubric:
  content_realization:
  - id: CR1
    item: 'The course is laid out as one route whose main areas follow the text''s order: the riverside start at Hammersmith, the Hammersmith
      market, the wood, Piccadilly, the orchard square, and the Museum at the end'
    anchors:
      '1': all these areas are present along the course and in this order, starting by the river and ending at the Museum
      '0.5': start by the river and end at the Museum are right, but areas in between are missing or out of order
      '0': the areas are not arranged as one route, or the start or the end is wrong or missing
    evidence:
    - c04.p044
    - c05.p015
    - c06.p005
    - c07.p001
    - c08.p002
    - - c09.p011
      - c09.p012
  - id: CR2
    item: The course starts on the river bank, where the river is crossed by a solid stone-arched bridge with small buildings along its parapet
    anchors:
      '1': a river at the start crossed by an arched stone bridge carrying small buildings along its parapet
      '0.5': a bridge over the river at the start, but without buildings on it or not arched
      '0': no river or no bridge at the start
    evidence:
    - c03.p015
    - c03.p019
  - id: CR3
    item: Between the Hammersmith market and the centre the road runs through a wood of big trees, a forest belt across the former city
    anchors:
      '1': a clearly wooded stretch of big trees that the road passes through, between the Hammersmith market and Piccadilly
      '0.5': a few trees or a park beside the road, not a stretch of wood the road runs through, or the wood in the wrong place
      '0': no wood on the course
    evidence:
    - - c06.p003
      - c06.p005
    - c07.p001
  - id: CR4
    item: 'The district centres on the way are market places with their own public buildings: at the Hammersmith market a great hall and a theatre
      face each other across the main road, and Piccadilly is a market street with a big public building'
    anchors:
      '1': both Hammersmith and Piccadilly are built as market places with their public buildings, the Hammersmith hall and theatre on opposite
        sides of the road
      '0.5': only one of the two market centres is realised, or the markets lack their public buildings, or the Hammersmith hall and theatre do
        not face each other across the road
      '0': neither place is built as a market centre with public buildings
    evidence:
    - - c05.p002
      - c05.p005
    - - c07.p001
      - c07.p004
  - id: CR5
    item: A large open square on the way to the Museum is planted over as an orchard
    anchors:
      '1': a large open space filled with orchard trees, on the route before the Museum
      '0.5': an orchard or an open square, but not an open square planted as an orchard
      '0': missing
    evidence:
    - c08.p002
    - c08.p003
  - id: CR6
    item: 'The course ends at the old Museum standing in open, unfenced greenery, beside its market quadrangle: a paved court ringed by an arcade
      with a fountain in the middle and stalls'
    anchors:
      '1': at the end both the Museum building set in open greenery and the arcaded market court with a central fountain and stalls
      '0.5': only one of the two, or the court lacks the arcade or the fountain
      '0': neither at the end of the course
    evidence:
    - c09.p011
    - c09.p012
    - c09.p013
    - c09.p017
  functions_playability:
  - id: FP1
    item: The place can be driven as one continuous course from the riverside start to the Museum without breaks or dead ends, and the drive has
      a clear end there
    anchors:
      '1': a continuous drive from the start by the river to the Museum, with no gaps, and the course ends (or completes its lap) at the Museum
      '0.5': drivable, but broken into disconnected parts, or the drive stops before the centre or the Museum
      '0': no drivable route, or only one location
    evidence:
    - - c04.p053
      - c05.p002
    - c05.p015
    - - c06.p001
      - c06.p005
    - c07.p001
    - c08.p002
    - - c09.p001
      - c09.p013
  - id: FP2
    item: 'The signature places are driven through, not just passed as backdrops: the road runs into the wood, across the orchard square and in
      through an archway into the Museum Market court'
    anchors:
      '1': the driver passes through the wood, crosses the orchard square and enters the market court
      '0.5': one or two of these are only seen beside the road or cannot be entered
      '0': none of them can be driven through
    evidence:
    - c06.p005
    - c08.p002
    - c09.p013
  visual_presentation:
  - id: VP1
    cat: style
    item: 'The bridge looks like a wonder: clean, graceful stonework, its parapet buildings fanciful and topped with painted and gilded vanes
      and spirelets'
    anchors:
      '1': 'the bridge reads as ornate and fanciful: clean stone and decorated parapet buildings with gilded tops'
      '0.5': some ornament, but the bridge otherwise looks plain, utilitarian or grimy
      '0': a plain, utilitarian or grimy bridge with no ornament, or no bridge
    evidence:
    - c03.p015
  - id: VP2
    cat: style
    item: The public buildings at the market places are ornate and handsome, standing out against the low, modest houses around them
    anchors:
      '1': the market-place public buildings are visibly richer and grander than the low houses around them
      '0.5': public buildings present but no different in look from the houses, or only one of them stands out
      '0': no distinct public buildings, or all plain boxes
    evidence:
