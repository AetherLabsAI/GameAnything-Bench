source_inventory:
- 'c03.p001-c03.p003: the narrator wakes in heat; it was winter last night, now a bright early-June morning by the Thames; a landing-stage before
  his house, a bathers'' boat with a sculler'
- 'c03.p004-c03.p012: the water is strikingly clear; he swims, sees the bridge and is astonished; the waterman is described (friendly, strong,
  fourteenth-century-like dress, wrought buckle)'
- 'c03.p013-c03.p014: plank stages with windlasses on the Surrey bank are for salmon nets'
- 'c03.p015-c03.p019: the soap, engine and lead works are gone; the bridge is of solid stone arches with small booth-like buildings and gilded
  vanes along the parapet, unsooted; built 2003, replacing a plain timber bridge'
- 'c03.p020-c03.p022: both banks have low red-brick tiled houses set back behind a continuous flowering garden down to the water, great plane
  trees behind; the reaches toward Putney look like a lake with a forest shore'
- 'c03.p023-c03.p031: back at the landing-stage the narrator offers money; the waterman does not understand payment for his work; the coins belong
  in a museum; he works in gold'
- 'c03.p032-c03.p039: the waterman offers to guide the stranger; a weaver friend will take over his ferrying; a hay-harvest trip upstream is planned;
  the friend lodges at the Guest House'
- 'c03.p040-c03.p046: a bugle call brings Bob the weaver from the house on the site of the narrator''s old dwelling; the sculler is Dick; they
  go into the Guest House for breakfast'
- 'c04.p001-c04.p003: the Guest House, a long red-brick building with lead roof, gables away from the road, traceried windows and a baked-clay
  figure frieze; inside a hall with marble mosaic floor, open timber roof, arches to chambers and frescoes'
- 'c04.p004-c04.p006: three young women serve breakfast (roses, strawberries, several breads); their dress is described'
- 'c04.p007-c04.p009: a gilded inscription says the hall stands on the site of the Hammersmith Socialists'' lecture-room (May 1962)'
- 'c04.p010-c04.p024: the narrator is named Guest, claims to come from Epping Forest; Dick says its trees regrew after the great clearing of houses
  in 1955; Bob asks about pollards and is teased for questioning'
- 'c04.p025-c04.p035: Guest is 56 and looks older; Annie is 42 and looks 20; she leaves for her work'
- 'c04.p036-c04.p040: Bob''s work (weaving, dying-out machine printing, mathematics, an antiquarian history); Dick works gold and steel'
- 'c04.p041-c04.p046: Boffin, a showily dressed man, wants to question Guest; Dick sends him for a carriage, as he will take Guest to his great-grandfather
  in Bloomsbury'
- 'c04.p047-c04.p053: Boffin is Henry Johnson, a dustman who writes reactionary novels; a light graceful carriage with a grey horse; they drive
  off'
- 'c05.p001: the main road through Hammersmith runs through meadows and garden tillage; the Creek is open with boats; houses of brick or timber
  and plaster in gardens; gaily dressed, happy people'
- 'c05.p002-c05.p007: at the Broadway, low ornate buildings and a great hall (the winter Mote-House) north of the road, an octagonal high-roofed
  theatre with an arcade south of it; market carts with produce; Dick made the theatre''s bronze doors'
- 'c05.p008-c05.p015: Guest sees no sellers and no poor people; Dick does not understand; they drive on eastward'
- 'c06.p001-c06.p002: a brook, Kensington Market, a short street of timber-and-plaster houses with an arcade'
- 'c06.p003-c06.p007: Dick describes the forest strip running from Kensington north and west and on round to the Lea; the road plunges into a
  wood of big trees; children camp in tents; small houses in the forest'
- 'c06.p008-c06.p032: conversation on education: no schools; children learn swimming, riding, cooking, crafts, read early, pick up languages and
  follow their tastes'
- 'c06.p033-c06.p036: down a glade on the right Westminster Abbey, cleaned, its monuments cleared out'
- 'c06.p037-c06.p039: the Houses of Parliament are kept as a subsidiary market and manure store; old buildings are kept as a foil to the new ones;
  Dick on building and ornament'
- 'c07.p001-c07.p004: out of the wood into Piccadilly, a street of handsome houses with shop-like fronts and arcades, guest-houses above, a big
  public building; a market for the handsomer goods'
- 'c07.p005-c07.p014: Guest has left his money behind; Dick says anything left can be got again in the market; he should keep his old clothes
  for the great-grandfather'
- 'c07.p015-c07.p022: a woman holds the horse; Dick speaks of love and a recent fatal quarrel'
- 'c07.p023-c07.p049: in a booth two children serve Guest: tobacco, an embroidered bag and a jewelled carved pipe, all given without weighing
  or payment; a lost pipe would be found and used by someone; they offer wine'
- 'c07.p050-c07.p054: an old man has taken over holding the horse and rides along toward Bloomsbury'
- 'c07.p055-c07.p063: children often serve in the markets; a mock history of the disease Idleness; Dick laughs at it'
- 'c08.p001: ornate houses each in a flowering garden full of fruit trees; children offer fruit; the main roads follow the old lines'
- 'c08.p002-c08.p003: a large open space sloping south, planted as an apricot orchard with a small gilded wooden stall; a pear-shaded road south
  to the Parliament tower (Dung Market); Guest recalls the old Trafalgar Square'
- 'c08.p004-c08.p026: the old name kept; a battle there in 1952; the 1887 attack on a meeting; prisons, which no longer exist'
- 'c08.p027-c08.p028: the National Gallery at the end of a plane grove on the left, an old building kept for its pictures'
- 'c08.p029-c08.p035: the pipe as a toy; almost everyone carves; work may become scarce'
- 'c08.p036-c08.p043: a Banded-workshop where people make pottery and glass by hand together; no smoke from the furnaces'
- 'c08.p044-c08.p049: a cheerful road-mending gang eases the carriage past; work as sport'
- 'c09.p001-c09.p008: Long Acre, a lane under meeting plane trees with low close-set houses, still being built on; the old man (about ninety)
  gets down'
- 'c09.p009-c09.p010: down through rose gardens on the site of Endell Street; across Holborn / Oxford Road with scattered houses'
- 'c09.p011-c09.p012: a wide road with a long gabled public building (the Museum Market) on one side and open unfenced greenery opposite, through
  which the British Museum portico shows; the great-grandfather lives there'
- 'c09.p013-c09.p016: through an archway into a large paved quadrangle with a sycamore in each corner, a fountain in the middle, a few awninged
  stalls and an arcade round it; busy and musical on Fridays; a stable; people greet Guest'
- 'c09.p017-c09.p022: the Museum forecourt without railings, among trees, pigeons on the pediment; the old building is kept for its collections
  and library; Dick leads Guest to the great-grandfather''s dwelling'
