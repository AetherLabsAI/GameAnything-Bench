play_suggestions:
  FP1:
  - 'play from the start to the end: are the situations met in order, and does the break-out end it?'
  - 'fail during the trap (and at any other challenge that can fail): is there a clear failure and a way to retry?'
  FP2:
  - try to cross the barrier on the surface or go around it
  - try to surface while the ice overhead is still thick, then again where it thins
  FP3:
  - try to confirm the pole at the wrong time or in bad conditions
  - 'miss the last chance: what happens?'
  FP4:
  - after the trap closes, look for any open exit
  - 'wait without acting: does the air run down and does running out matter?'
  FP5:
  - 'ignore the freezing: does the space close in?'
  - 'heat the water around the vessel: does the freezing stop?'
  FP6:
  - 'dig only: does it finish before the air runs out?'
  - try to break out before the ice has been thinned
  robustness:
  - 'leave in the middle of the trap and come back: is the air and the progress kept?'
  - rush through the under-ice passage without stopping
  - replay after an escape
