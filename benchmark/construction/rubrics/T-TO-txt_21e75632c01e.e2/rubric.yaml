task_id: T-TO-txt_21e75632c01e.e2
source_inventory:
- 'c38.p001-c38.p002: the Orion runs south on the surface; first floating ice, the ice blink, ever larger and more brilliant ice masses; the captain
  slips through narrow passes that close behind him; bitter cold outside, electric warmth inside; the nights are lengthening toward the six-month
  polar night'
- 'c38.p003: the polar circle is crossed; ice on all sides; the captain finds pass after pass, then rams and splits the ice-fields; gales, fog,
  ice coating the hull; on 18 March the vessel is stopped by an immovable barrier of ice mountains'
- 'c38.p004-c38.p005: ''An iceberg!''; noon position taken; a frozen, silent plain; no way forward or back, every pass closed behind; fresh ice
  forms round the hull and the Orion is held fast'
- 'c38.p006-c38.p021: Marchand thinks they are caught; Hargrave declares the Orion will go to the pole, not over the ice but under it, if the
  pole lies on open sea'
- 'c38.p022-c38.p035: the reasoning: deep water stays liquid below the frozen surface, an iceberg is about one part above to three below, so the
  Orion can pass beneath; the dangers are days without renewing air (the reservoirs can be filled) and a pole sea that might be iced over (the
  spur could break the ice); open water at the pole is possible'
- 'c38.p036-c38.p039: pumps store air in the reservoirs; about ten men free the hull with pickaxes; the Orion dives below the iceberg''s base
  and heads for the pole, about forty hours away'
- 'c38.p040: the night run; on rising the vessel strikes the ice ceiling again and again; Marchand charts the thickness; the daily air renewal
  is overdue; the ice slowly thins into an ice-field'
- 'c38.p041-c39.p001: ''The sea is open!'': an open polar sea beyond the iceberg, birds and fish, milder air, the iceberg on the northern horizon'
- 'c39.p002-c39.p005: are they at the pole? the captain will take bearings at noon if the sun shows through the fog'
- 'c39.p006-c39.p010: an island and a large land beyond, perhaps a continent (Maury''s theory); the boat lands; Tom Harker stays away; Hargrave
  sets foot first and silently takes possession'
- 'c39.p011-c39.p013: volcanic soil, lava and pumice, smoking sulphurous cracks; meagre plant life, shellfish, swarms of birds (penguins, albatrosses,
  petrels); Gaspard''s joke about petrels as lamps'
- 'c39.p014-c39.p015: nesting grounds; the fog stays; noon passes without the sun; snow; ''Till to-morrow'''
- 'c39.p016-c39.p023: a snowstorm; the Orion moves further south along the coast; on 20 March Marchand and Gaspard land again; a bay crowded with
  seals, described at length; seals are harmless unless their young are attacked'
- 'c39.p024-c39.p031: behind a promontory bellowing is heard; a slippery climb; a white plain covered with walruses at play'
- 'c39.p032: the walruses described; back at the landing the captain waits with his instruments; noon again without sun; the next day is the equinox,
  after which the sun is gone for six months: the last chance'
- 'c39.p033-c39.p039: Hargrave''s method: with the chronometer only; if at noon on the 21st the sun''s disc is cut exactly by the northern horizon,
  they are at the pole'
- 'c39.p040-c39.p042: the morning of the 21st, the weather lightening; Tom refuses to come, his sullenness growing; the boat crosses among whales
  and medusae'
- 'c39.p043: the climb to a volcanic peak; the view over the sea and the endless land; barometer reading; the sun sinks along the horizon; Marchand
  holds the chronometer'
- 'c39.p044-c39.p051: ''Twelve!'', ''The South Pole!'': the sun cut in equal halves; Hargrave takes possession of the land in his own name, unfurls
  a black banner with a gold N and bids the sun farewell for the six-month night'
- 'c40.p001 (first part): departure on 22 March as night falls and new ice forms; seals and walruses stay on the coast; the Orion dives and runs
  north under the iceberg'
- 'c40.p001 (rest)-c40.p010: at three in the morning a violent shock; the Orion lies motionless on its side; Tom and Gaspard join Marchand; the
  manometer shows a depth of over 180 fathoms'
- 'c40.p011-c40.p022: the captain arrives, uneasy: ''an accident this time''; the vessel is stranded by natural law, not by error'
- 'c40.p023-c40.p031: an undermined iceberg has turned over, struck the Orion and lifted it; the pumps raise the vessel with the block until it
  stops; the Orion rights itself'
- 'c40.p032-c40.p042: the Orion floats in a tunnel of ice, walls on both sides, ceiling above, the block below; the lantern makes the ice blaze
  like gems; at full speed the glare blinds them'
- 'c40.p043-c40.p058: a shock at the bow: that end is closed; the Orion reverses toward the other opening; Marchand reads his own book without
  noticing; the three stay together'
- 'c40.p059-c41.p001: a second shock from behind; the iceberg has shifted and closed every outlet: they are prisoners of the iceberg'
- 'c41.p002-c41.p009: Hargrave: death by crushing or by suffocation; the reservoirs hold two days'' air and have already been drawn on; they will
  cut through the wall, the thinnest side found by sounding; the Orion is set down on the lower ice'
- 'c41.p010-c41.p014: Tom Harker offers to work with the pickaxe for the general safety'
- 'c41.p015: the crew in diving suits; soundings: the floor is the thinnest side (about ten yards); a trench is cut round the vessel''s outline;
  shifts of two hours, Marchand and Gaspard among the diggers; the air aboard is fouled; twelve hours cut one yard: the work would take far longer
  than the air lasts; Tom: even once out they are still under the iceberg'
- 'c41.p016-c41.p018: the side walls are freezing and closing in; the captain: the only chance is to go faster than the freezing'
- 'c41.p019: more digging; suffocating air aboard, no means of absorbing the carbonic acid; reserve air let into the vessel; on 26 March the walls
  are visibly closing, Marchand despairs and the captain takes him aboard'
- 'c41.p020-c41.p029: freezing could burst the ice but would crush the Orion, so it must be stopped; the reservoirs will be empty after the next
  day'
- 'c41.p030-c41.p038: ''Boiling water!'': the distilling machines heat sea water that the pumps inject outside; the temperature rises and the
  freezing is stopped'
- 'c41.p039-c41.p042: 27 March, two more days of work needed; Marchand near collapse, Gaspard wishes he could stop breathing to leave him air;
  the diggers hand on their breathing apparatus in turn, the captain first; two yards remain; the reservoirs are almost empty'
- 'c41.p043-c41.p047: the sixth day: the captain decides to crush the remaining ice; the vessel is floated over the trench and flooded to add
  weight; the ice cracks and the Orion falls through; pumps stop the fall and it runs north under the iceberg'
- 'c41.p048: Marchand suffocating; Tom and Gaspard give him the last air of one apparatus; near the surface the Orion tilts and rams the thin
  ice-field from beneath until it breaks through; the panel opens and fresh air pours in'
