rubric:
  content_realization:
  - id: CR1
    item: The game shows Captain Hargrave as the commander whose bold, near-rash ambition drives the vessel to the pole and who claims the pole
      for himself, with Professor Marchand, the narrator, aboard as his companion who goes through the expedition and its dangers
    anchors:
      '1': Hargrave is present as the commander, his daring ambition sets the goal of reaching the pole and he claims it as his own, and Marchand
        is present as the companion aboard who goes with him through the pole and the ice trap
      '0.5': a captain leads the vessel, but his ambition as the driving force or his personal claim to the pole is missing, or Marchand is missing
        or plays no part
      '0': no captain character, or the goal comes from somewhere else
    evidence:
    - c38.p005
    - - c38.p006
      - c38.p017
    - - c39.p007
      - c39.p009
    - c39.p043
    - - c39.p047
      - c39.p049
    - c41.p015
    - c41.p019
    - c41.p048
  - id: CR2
    item: 'The game''s world is laid out as the route south: an ice-choked sea ending in an impassable ice barrier with open water beneath it,
      and beyond the barrier an open polar sea with the polar land on its shore'
    anchors:
      '1': an ice barrier shuts off the sea, it reaches down only so far with water passable beneath it, and an open polar sea with a polar land
        lies beyond it
      '0.5': the barrier and the open polar sea both exist, but not connected by a way beneath the ice, or the open sea and land do not lie beyond
        the barrier
      '0': no ice barrier, or no open polar sea or land beyond it
    evidence:
    - c38.p003
    - c38.p005
    - - c38.p019
      - c38.p023
    - c38.p041
    - c39.p001
    - c39.p006
  - id: CR3
    item: The game establishes that the pole is confirmed by seeing the sun, and that the coming long polar night makes the last day before it
      the final chance
    anchors:
      '1': the game makes clear that sighting the sun confirms the pole and that the polar night about to begin leaves a last chance (no exact
        method required)
      '0.5': a confirmation of the pole is in the game, but not what it depends on, or without the polar-night deadline
      '0': 'no confirmation of the pole: the arrival is simply declared'
    evidence:
    - c39.p003
    - c39.p014
    - c39.p032
    - - c39.p033
      - c39.p037
    - - c39.p043
      - c39.p045
  - id: CR4
    item: 'On the way back an overturning iceberg strikes the vessel and leaves it in a prison of ice closed on every side: walls to both sides,
      the iceberg as a ceiling, ice below, every exit shut'
    anchors:
      '1': the trap happens on the return, is caused by an iceberg turning over, and the vessel ends in an enclosure of ice with walls, ceiling
        and floor and no open exit
      '0.5': an ice trap exists, but without the overturning iceberg as its cause, or it is not closed on every side
      '0': no ice trap
    evidence:
    - c40.p001
    - c40.p024
    - c40.p032
    - c40.p061
    - c41.p001
  - id: CR5
    item: In the ice prison the water around the vessel freezes and closes in, threatening to crush it, and the answer to this threat is heating
      the water around the vessel
    anchors:
      '1': the freezing walls closing in are in the game as a threat of crushing, together with heating the surrounding water as the way to stop
        them
      '0.5': the freezing threat is there without the heating, or the heating without the threat it answers
      '0': missing
    evidence:
    - c41.p016
    - c41.p018
    - c41.p020
    - c41.p026
    - - c41.p032
      - c41.p038
  - id: CR6
    item: 'The escape goes down through the ice floor, the thinnest side: once it is thinned, the vessel breaks through it by its own weight and
      then rises through thin ice to open air'
    anchors:
      '1': the way out is through the thinned floor of the prison, broken by the vessel's own weight, followed by breaking up through thin ice
        into open air
      '0.5': an escape through the ice exists, but not by the vessel's own weight on the thinned floor, or it ends without reaching open air
      '0': no escape from the ice prison
    evidence:
    - c41.p008
    - c41.p015
    - - c41.p043
      - c41.p045
    - c41.p048
  functions_playability:
  - id: FP1
    item: The experience runs as one progression through the story's key situations in their order (ice barrier, under-ice passage, pole, trap,
      escape) and ends when the vessel breaks out to open air
    anchors:
      '1': the player goes through these situations in this order, the experience reaches a clear ending with the break-out, and wherever the
        player can fail there is a clear failure and a way to retry
      '0.5': the situations exist but out of order, one is missing, there is no clear ending, or a challenge that can fail has no clear failure
        or no way to retry
      '0': 'no progression: isolated scenes or free roaming'
    evidence:
    - c38.p005
    - c38.p041
    - c39.p045
    - c40.p061
    - c41.p048
  - id: FP2
    item: The ice barrier cannot be crossed on the surface; the player gets through by going beneath the ice and can surface only once the ice
      above thins out
    anchors:
      '1': the surface route is blocked, the player passes under the ice, and surfacing is impossible under thick ice and possible where it has
        thinned
      '0.5': the player can pass under the ice, but the ceiling never blocks surfacing, or the barrier can simply be bypassed
      '0': the barrier cannot be passed beneath in play
    evidence:
    - c38.p003
    - c38.p005
    - c38.p019
    - c38.p040
    - c38.p041
  - id: FP3
    item: At the pole, reaching the pole must be confirmed by a step that conditions can block, with a last possible chance before the long night
    anchors:
      '1': the confirmation of the pole can fail or be delayed by conditions, with a final chance
      '0.5': a confirmation is required but it cannot fail or has no deadline
      '0': the pole is reached without any confirmation step
    evidence:
    - c39.p014
    - c39.p032
    - c39.p037
    - - c39.p043
      - c39.p045
  - id: FP4
    item: While the vessel is trapped under the ice, a depleting air supply is the time limit the player must beat
    anchors:
      '1': the player cannot leave the trap by an exit, the air runs down noticeably to the player, and running out has a consequence (failure
        or loss)
      '0.5': the air limit is only narrated, or running out has no consequence
      '0': no air limit while trapped
    evidence:
    - c41.p001
    - c41.p004
    - c41.p019
    - c41.p039
    - c41.p042
  - id: FP5
    item: The freezing water closes in on the trapped vessel unless the player stops it, and heating the water around the vessel stops it
    anchors:
      '1': left alone, the freezing visibly closes in with a consequence, and heating the surrounding water stops it
      '0.5': the freezing closes in, but stopping it does not depend on heating the water, or ignoring it has no consequence
      '0': the freezing threat does not act in play
    evidence:
    - c41.p016
    - c41.p019
    - c41.p026
    - c41.p035
    - c41.p038
  - id: FP6
    item: Working through the ice alone is too slow for the air, so the player must break through the thinned ice with the vessel itself
    anchors:
      '1': work on the ice makes progress but too slowly to finish before the air runs out, and the break-out succeeds by the vessel's own force
        or weight once the ice is thinned
      '0.5': the escape is a single action or digging alone, or breaking through works before any thinning
      '0': no escape sequence
    evidence:
    - c41.p015
    - c41.p042
    - c41.p045
    - c41.p048
