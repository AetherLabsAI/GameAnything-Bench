      '1': the building runs along the bank, the clock tower stands at its bridge end, and a multi-arch bridge leaves from the tower's foot across
        the river
      '0.5': the building is beside a river with a bridge, but the clock tower is not at the bridge end, or the bridge is not a multi-arch one
