rubric:
  content_realization:
  - id: CR1
    item: 'The station''s layout: a long platform beside a track lane that leads out of a dark tunnel, with an edge strip along the platform separating
      the waiting area from the track'
    anchors:
      '1': a long platform, a track lane beside it and a tunnel mouth the track runs into, with an edge strip along the platform edge, arranged
        as one connected station
      '0.5': a platform beside a track, but without the tunnel or without the edge strip separating the waiting area from the track
      '0': no recognisable platform-and-track station
    evidence:
    - - 00:32
      - 00:38
    - - 00:38
      - 00:42
    - - 00:43
      - 00:48
  - id: CR2
    item: 'The train: a long train of several carriages with doors along its side and a driver''s front with headlights, running on the track
      beside the platform'
    anchors:
      '1': a multi-carriage train with doors along the side facing the platform and a front with headlights stands or runs on the track beside
        the platform
      '0.5': a train is present but reads as a single block, or has no doors on the platform side, or never stands beside the platform
      '0': no train
    evidence:
    - - 00:32
      - 00:37
    - - 00:38
      - 00:42
    - - 00:44
      - 00:48
  - id: CR3
    item: 'The order of events at the station: people wait on the platform, a train comes in out of the tunnel and stops, its doors open and passengers
      get off and on; the crowded escalators follow the platform scenes'
    anchors:
      '1': the game presents waiting, the train's arrival and stop, the door exchange and then the escalators in this order
      '0.5': the platform events are in order but the escalators are missing or come before them, or the door exchange is missing from the
        sequence
      '0': no recognisable sequence of station events
    evidence:
    - - 00:32
      - 00:38
    - - 00:38
      - 00:43
    - - 00:43
      - 00:48
    - - 00:49
      - 00:53
  - id: CR4
    item: 'An escalator hall: several wide parallel escalators link the platform level with the level above (in Flare''s view they may be sloped
      or stepped lanes, moving walkways or ramps, as long as they read as the way up between levels)'
    anchors:
      '1': a hall of several parallel escalator lanes that is reachable from the platform side and reads as leading up to another level (by
        slope, steps, a raised far end or a level change at its top)
      '0.5': a single escalator or stair only, or parallel lanes that read as a flat corridor with no sense of going up, or a hall not connected
        to the station
      '0': no escalator hall
    evidence:
    - - 00:49
      - 00:53
  - id: CR5
    item: 'The facts the reference tells about the place: it is the oldest underground railway in the world, a large network of lines and stations
      used by millions of people every day'
    anchors:
      '1': the game states the oldest-underground-railway claim together with the network's scale (lines, length, stations or daily riders as
        the reference gives them)
      '0.5': only the claim or only the scale is stated, or the facts are given in vague words that do not match the reference
      '0': no facts about the place
    evidence:
    - - 00:31
      - 00:53
  functions_playability:
  - id: FP1
    item: 'The train service runs: a train arrives, stops at the platform with its doors visibly open for long enough to use, then leaves, and
      another train follows'
    anchors:
      '1': while the player waits on the platform, a train arrives, stops with open doors for a usable interval, departs, and a next train arrives
        within a few minutes of play
      '0.5': a recognisable but incomplete service (one visit and no next train, or an arrival and stop without a departure)
      '0': no arrival and departure, or a train that is always standing there
    evidence:
    - - 00:32
      - 00:37
    - - 00:38
      - 00:48
  - id: FP2
    item: 'Boarding: the player can get on the train only while it is stopped at the platform with its doors open, and boarding leads on to the
      next scene'
    anchors:
      '1': the player boards at an open door during the stop, a transition leads on, and boarding is refused (blocked or with a message) while
        no train is stopped or its doors are closed
      '0.5': boarding works but is always available regardless of the train, or it works and no transition follows
      '0': no way to board
    evidence:
    - - 00:44
      - 00:48
  - id: FP3
    item: 'The crowd lives with the train: many commuters wait on the platform before an arrival, walk along it, and get off and on at the open
      doors during the stop'
    anchors:
      '1': people visibly wait before an arrival, walk along the platform and use the doors while the train is stopped
      '0.5': one or two of the three behaviours (waiting, walking along the platform, using the doors) are shown
      '0': the people are static or move with no link to the train
    evidence:
    - - 00:34
      - 00:35
    - - 00:43
      - 00:48
  - id: FP4
    item: 'Going up through the escalator hall: the player reaches the hall from the station and goes up along the escalator lanes to the upper
      level among people moving in both directions'
    anchors:
      '1': the player reaches the hall, travels along the lanes and arrives at the upper level (by walking, being carried or a transition at
        the top), with people moving both ways around them
      '0.5': the hall is reached but the player cannot get through it to the upper level, or the crowd is sparse, one-way or static
      '0': the hall cannot be reached
    evidence:
    - - 00:49
      - 00:53
  visual_presentation:
  - id: VP1
    cat: spatial
    keyframes:
    - '00:33.0'
    - '00:35.0'
    - '00:37.0'
    item: 'The platform view: a long covered platform with a roof and a row of ceiling lights, the train alongside and the edge strip on the floor'
    anchors:
      '1': one view shows a long platform under a roof with ceiling lights, a train along it and a yellow edge strip on the floor
      '0.5': a recognisable platform-and-train view that lacks the roof and lights or the edge strip
      '0': no such view
    evidence:
    - - 00:32
      - 00:38
  - id: VP2
    cat: key_moment
    keyframes:
    - '00:39.0'
    - '00:41.0'
    - '00:42.0'
    item: 'The train''s arrival: the train''s lit front with bright headlights comes out of the dark tunnel into an old brick-walled station
      with a ''Way out'' sign'
    anchors:
      '1': the arriving train shows bright headlights against a dark tunnel, in a station part with old brick walls and a 'Way out' style sign
      '0.5': a recognisable arrival without the headlight-and-dark-tunnel contrast or without the old brick setting and sign
      '0': no visible arrival moment
    evidence:
    - - 00:38
      - 00:43
  - id: VP3
    cat: style
    keyframes:
    - '00:32.0'
    - '00:42.0'
    - '00:46.0'
    item: 'The Underground''s look: red, white and blue carriages with red door frames, and the round Underground emblem on the carriages and
      the station walls'
    anchors:
      '1': the train is drawn red, white and blue and the round emblem appears on it and in the station
      '0.5': the colours without the emblem, or the emblem on a train of other colours
      '0': neither
    evidence:
    - - 00:32
      - 00:37
    - - 00:42
      - 00:48
  - id: VP4
    cat: spatial
    keyframes:
    - '00:50.0'
    - '00:51.0'
    - '00:52.0'
    item: 'The escalator hall: several wide parallel escalator lanes side by side, packed with people'
    anchors:
      '1': a view of several parallel lanes side by side with a dense crowd on them
      '0.5': escalator-like lanes with a thin crowd, or a crowd without visible lanes
      '0': no such view
    evidence:
