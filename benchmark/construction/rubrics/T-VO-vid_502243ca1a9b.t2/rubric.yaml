      - 00:53
play_suggestions:
  CR3:
  - 'play from the station start to the escalator hall without help: note the order in which waiting, the arrival, the door exchange and the escalators
    come'
  CR5:
  - 'talk to every NPC and read every sign and message in the station; compare with the narration facts in the source inventory'
  FP1:
  - 'stand on the platform for 3 minutes and note arrival, stop and departure times: do trains keep coming?'
  - stand next to the doors while they are open and watch whether they close at the end
  FP2:
  - 'try to enter the train while it arrives, while its doors are open and just after they close (counter-case)'
  - walk into a non-door part of a carriage
  FP3:
  - 'watch two arrivals: do the commuters wait, walk along the platform, step off and on?'
  FP4:
  - after the ride walk to the escalator hall; try to walk against the lanes
  - 'does the hall read as going up (slope, steps, raised end, level change at the top)? the isometric view need not show real height'
  robustness:
  - board and get off repeatedly
  - stand in a doorway as the doors close and on the edge strip as a train arrives; can the player always walk away?
  - save during the train's stop and reload
  - 'leave the station map and come back: is the train cycle still running?'
