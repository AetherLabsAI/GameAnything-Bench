# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-TO-txt_6b6b5b7ebb21.e1
source_inventory:
- 'c05.p013-c05.p015: letter heading, written at the volcano of Kilauea; the writer is exhausted and elated after the visit'
- 'c05.p016-c05.p017: the party (the writer, Miss Karpe, the guide Upa) sets out on horseback from Hilo with their gear; a gallop on the soft
  grassy track out of town, the writer nearly falls; women swimming in a roadside pool laugh'
- 'c05.p018: Hilo thins out into native houses, kalo patches and fish ponds; after some miles a narrow hard-lava track enters a belt of dense,
  impassable tropical jungle (palms, ferns, lianas, flowering climbers), only crossable on the track'
- 'c05.p019: the jungle opens onto a coconut grove in the glare of day; rest at two poor grass huts with natives, who part with aloha'
- 'c05.p020-c05.p021: single file across an immense grey plain of pahoehoe (smooth, ropy, coiled lava, as opposed to jagged a-a), the cooled flow
  from Kilauea toward Hilo, slippery where smooth; reflections on the volcanic building of the island; glimpses of Mauna Loa''s dome'
- 'c05.p022: no water; ferns, ohias, ohelos and ti plants clothe the lava; the sea''s palm fringe on the left, the dense timber belt around Mauna
  Loa on the right'
- 'c05.p023: the track is a constant scramble over rock steps and ledges; the climb is so gradual that only the cooler air shows it, though it
  rises a great deal over the whole route'
- 'c05.p024-c05.p025: a locked, run-down grass hut at the halfway point; Upa hurries the party on with spurs; the country barely changes (ohia
  only); a drove of half-wild cattle passes, their herders report the volcano active'
- 'c05.p026-c05.p027: at dusk a strip of tree-fern forest, then total darkness and rain in a belt of ohias; the writer near collapse'
- 'c05.p028-c05.p029: a red glare suddenly lights the whole sky, sulphur smell and a surf-like roar; at the crater-house, red vapour and flame
  curl out of an invisible pit; a warm room with a fire; jets of flame seen through the night'
- 'c05.p030-c05.p032: in the morning the mist lifts: the crater''s wall is a few yards from the house; not a cone but a vast pit on a rolling
  plain, with a sunken lowest floor, steam cracks, sulphur and earthquakes; the lake Hale-mau-mau (home of the goddess Pele), a pit within the
  pit, lies in the southern part, miles from this side; its spectacle varies daily; little sign of it this morning'
- 'c05.p033-c05.p034: the descent with native guides: down the steep, vegetated terminal wall and a vegetated slope, then a second descent over
  broken lava where vegetation ends; a black, glassy, sulphur-stained region, fissured and hot underneath'
- 'c05.p035-c05.p036: crossing the lowest floor (ropy, cracked, steaming lava, a few ferns in a crack; a cooled lava fall on a ledge), then a
  steep hot ascent up a recent flow from Hale-mau-mau (contorted lava, Pele''s hair); the crust grows hotter and weaker, single file behind the
  guide, the writer falls into acid steam holes'
- 'c05.p037-c05.p038: no sign of fire until, suddenly, red drops are tossed up and the party stands on the brink of Hale-mau-mau, a short drop
  above the lake; overwhelming noise and sight; the lake rises, forms a cone, is never the same two minutes together'
- 'c05.p039-c05.p041: the lake: irregular, nearly divided in two by a low lava bank that grows; low sheer near walls, high craggy far cliffs;
  a field of blowing cones; surface crusting silver-grey with rose cracks; fire fountains merging and reappearing; waves driven southward over
  the bank and against the far cliffs; a cone building just below the brink; intense heat burns boot soles; the only risk is the ledge giving
  way'
- 'c05.p042-c05.p045: a final surge overflows the lake''s rim; farewell; the long trudge back across the black crater and up the vegetated wall
  into the green upper world'
- 'c05.p046: the Volcano Book of visitors'' entries, mostly flippant jokes about Pele and boasts of travel times'
- 'c05.p047: the inn: a nail-free grass and bamboo house with a steep roof, verandah, a centre room with a constant wood fire, side rooms and
  a grass cookhouse; it stands in steaming, quaking ground, cooks with natural steam behind the house; supplies are brought from far away; host
  Mr. Gilman'
- 'c05.p048: evening in the inn: rainbound native travellers stringing leis and smoking by the fire'
- 'c05.p049: a sulphur steam bath (a grass shed over a steam crack) a short walk away, and the Sulphur Banks with fragile sulphur crystals'
- 'c05.p050: an old bullock-hunter tells of the 1868 eruption and the recent summit eruption of Mauna Loa; its snow-capped dome is visible from
  the inn'
