rubric:
  content_realization:
  - id: CR1
    item: 'The approach consists of successive zones in this order: a coastal town, a dense jungle belt crossed by a track, and a long lava plain
      rising toward the crater'
    anchors:
      '1': all three zones are present and follow one another in this order, the lava plain rising toward the crater
      '0.5': the zones are present but out of order, or one is missing, or the lava plain is flat / does not lead up to the crater
      '0': no approach zones; the level starts at the crater
    evidence:
    - c05.p018
    - c05.p020
    - c05.p023
    - - c05.p028
      - c05.p030
  - id: CR2
    item: The crater is a vast pit sunk below the level of the surrounding plain, not a cone-shaped mountain, with the inn standing at its rim
    anchors:
      '1': a huge pit below the plain's level (not a summit cone), with the inn close to its edge
      '0.5': a crater is present but it is small or built as a cone, or the inn is missing or far from the rim
      '0': no recognisable crater
    evidence:
    - c05.p030
    - c05.p047
  - id: CR3
    item: 'The lava lake lies inside the crater on its far side from the inn: between them are the crater wall, the crater floor and a rise ending
      at a brink above the lake'
    anchors:
      '1': the lake is far across the crater from the inn, with the wall, the floor and a brink overlooking the lake arranged between them
      '0.5': the lake is inside the crater but next to the inn, or the floor or the brink above the lake is missing
      '0': no lake, or the lake is outside the crater
    evidence:
    - c05.p030
    - c05.p031
    - - c05.p034
      - c05.p038
    - c05.p041
  - id: CR4
    item: Hale-mau-mau is a lake of molten lava sunk in an inner pit of its own within the crater, nearly divided into two basins by a low lava
      bank
    anchors:
      '1': a molten lava lake in its own inner pit, with a low bank nearly splitting it in two
      '0.5': a molten lava lake inside the crater but as one undivided pool, or level with the crater floor instead of in its own pit
      '0': no molten lava lake
    evidence:
    - c05.p031
    - c05.p038
    - c05.p039
    - c05.p041
  functions_playability:
  - id: FP1
    item: The player can travel the approach as one continuous route on foot, zone after zone, from the coastal town to the inn on the crater's
      edge
    anchors:
      '1': the whole route is walkable without breaks and leads from the town through each zone to the inn at the crater
      '0.5': the zones are disconnected (teleport, separate levels with no route), or part of the route cannot be walked
      '0': no approach route can be travelled; the player starts at the crater
    evidence:
    - c05.p018
    - c05.p020
    - c05.p023
    - - c05.p028
      - c05.p030
  - id: FP2
    item: From the crater's edge the player can descend into the crater, cross its floor and reach the brink of the lava lake, and come back up
    anchors:
      '1': a traversable path down the wall, across the floor and up to the brink, and a way back out to the rim
      '0.5': the lake brink is reachable only by a shortcut that skips the descent and the floor, or there is no way back
      '0': the lake cannot be reached
    evidence:
    - c05.p034
    - c05.p035
    - c05.p038
    - c05.p045
  - id: FP3
    item: 'Watched from the brink, the lava lake keeps changing: its surges, fountains and cones rise, merge and die away instead of holding one
      state'
    anchors:
      '1': over a short observation at the brink the lake's activity visibly changes (outbursts, fountains or surges appear and subside)
      '0.5': the lake moves, but as one constant loop with no visible change in its activity
      '0': the lake is static
    evidence:
    - c05.p031
    - c05.p038
    - - c05.p039
      - c05.p040
    - c05.p042
  visual_presentation:
  - id: VP1
    cat: key_moment
    item: 'The lake seen from the brink looks violently alive: glowing lava thrown up in fountains and surging waves, its darkening crust broken
      by glowing cracks'
    anchors:
      '1': a glowing lake surface with fire fountains or surging waves and a crust broken by glowing cracks
      '0.5': a glowing surface with some movement (bubbling, ripples) but no fountains, surges or crust
      '0': a flat, uniform lava surface with no visible activity
    evidence:
    - c05.p038
    - - c05.p039
      - c05.p040
    - c05.p042
  - id: VP2
    cat: style
    item: The inside of the crater is a barren expanse of dark lava, in stark contrast to the green vegetation of the land above the wall
    anchors:
      '1': a barren dark lava interior that clearly contrasts with green land on the rim / outside
      '0.5': a barren lava interior without the contrast to the green land above
      '0': no distinct crater interior
    evidence:
    - c05.p034
    - c05.p035
    - c05.p045
  - id: VP3
    cat: style
    item: 'Each approach zone has its own look: the town with houses and cultivated plots, the jungle as a dense, lush green mass closing in on
      the track, the lava plain as a wide expanse of grey ropy lava with only low, sparse plants'
    anchors:
      '1': the town, the jungle and the lava plain are each clearly recognisable by their look and distinct from one another
      '0.5': only some zones look distinct (e.g. the jungle and the lava plain look alike, or the town has no look of its own)
      '0': the approach zones look the same
    evidence:
    - c05.p018
    - c05.p020
    - c05.p022
play_suggestions:
  FP1:
  - 'walk from the start to the crater without shortcuts: do the town, the jungle belt and the lava plain follow one another?'
  - check whether the plain rises toward the crater rather than being flat (for CR1)
  FP2:
  - from the inn, find the way down into the crater and walk to the lake brink
  - after reaching the brink, walk back up to the rim and the inn
  FP3:
  - stand at the brink for a minute or two and note whether the lake's activity changes or repeats one fixed loop
  robustness:
  - 'try to walk into the lava lake or off the brink: what happens?'
  - try to leave the marked track in the jungle and on the crater floor
  - 'reload or restart mid-route: does the player resume on the route?'
