rubric:
  content_realization:
  - id: CR1
    item: The game contains Silvertooth as a wolf-dog hardened by past abuse into a fierce, distrustful fighter, yet intelligent and perceptive
      of human intent
    anchors:
      '1': Silvertooth is shown fierce and distrustful from past mistreatment AND intelligent in reading people's intent
      '0.5': only the ferocity or only the intelligence is shown
      '0': missing, or he is a friendly or ordinary dog
    evidence:
    - c19.p003
    - c19.p047
    - - c19.p057
      - c19.p067
    - c20.p022
  - id: CR2
    item: 'The game shows the master (Hale) as Silvertooth''s one god: his full trust goes to the master alone, and the others around him count
      only as the master''s people'
    anchors:
      '1': a single bond with the master, the others treated as the master's people, full trust reserved for the master
      '0.5': loyalty to the master is shown, but not how he relates to the others through the master
      '0': missing, or he bonds equally with everyone
    evidence:
    - c20.p033
    - - c23.p005
      - c23.p011
    - c24.p010
    - c21.p051
  - id: CR3
    item: 'The game has the story''s two settings as distinct places in order: the Northland frontier cabin where it begins and the Southland
      country estate Oak Hollow where it continues'
    anchors:
      '1': both the northern cabin and the southern estate exist as distinct places, the cabin first and the estate later
      '0.5': only one of the two settings, or both without a clear order
      '0': neither setting
    evidence:
    - c19.p002
    - c22.p006
    - c22.p019
  - id: CR4
    item: 'The move south happens as in the text: Hale means to leave Silvertooth behind, the dog breaks out and follows him onto the steamer,
      and this makes Hale change his mind and take him along'
    anchors:
      '1': Hale's decision to leave him, the dog's breakout and following onto the steamer, and Hale reversing his decision because of it, in
        that order
      '0.5': the move south is there, but Hale never means to leave him or the dog's following is not what changes his mind
      '0': missing, or the order / cause is wrong
    evidence:
    - - c21.p006
      - c21.p012
    - - c21.p025
      - c21.p042
    - - c21.p043
      - c21.p058
  - id: CR5
    item: The game contains Tom Garrick, a brutalised escaped convict who swore vengeance on Judge Hale for sentencing him
    anchors:
      '1': an escaped, dangerous convict whose motive is revenge on the judge who sentenced him
      '0.5': a dangerous intruder or convict without the revenge motive against the judge
      '0': missing
    evidence:
    - - c25.p001
      - c25.p006
    - - c25.p009
      - c25.p011
  - id: CR6
    item: 'The household''s view of Silvertooth changes because of his defence: before the climax they distrust him as a wolf, after it they honour
      him'
    anchors:
      '1': the family's distrust of the wolf is shown before the night defence, and their honour of him after it, as its consequence
      '0.5': he is honoured at the end, but no earlier distrust is shown, or the change is not tied to the defence
      '0': missing
    evidence:
    - - c24.p023
      - c24.p025
    - - c25.p020
      - c25.p028
    - - c25.p033
      - c25.p039
  functions_playability:
  - id: FP1
    item: 'Taming: the creature starts hostile and distrustful, and its trust has to be earned step by step through patient, non-threatening actions;
      it is not tame at the start, nor won in one action'
    anchors:
      '1': a hostile creature whose trust visibly grows over several patient, non-threatening interactions, and which, when threatened or attacked,
        shows wariness, backs away or fights back
      '0.5': trust grows, but in one step, or the creature is never really hostile
      '0': 'no taming: the creature is friendly from the start, or there is no creature to win over'
    evidence:
    - - c19.p019
      - c19.p021
    - c19.p031
    - - c19.p043
      - c19.p049
    - - c19.p063
      - c19.p065
    - - c20.p001
      - c20.p020
  - id: FP2
    item: 'Adapting to the new home: the creature has to learn the household''s law of restraint under the master''s guidance (the home''s tame
      animals are protected, wild creatures stay prey), and its conduct visibly changes afterwards'
    anchors:
      '1': a stage in the new home where the creature learns, through the master's voice / disapproval rather than beatings, to leave the tame
        alone, and then behaves accordingly
      '0.5': rules exist but there is no learning (the creature is correct from the start or never), or the rule has nothing to do with sparing
        the tame
      '0': no household rules
    evidence:
    - - c23.p012
      - c23.p014
    - - c23.p020
      - c23.p032
  - id: FP3
    item: 'Climax and ending: after the bond and the new home are established, an intruder threatens the family at night, the creature defends
      them at a heavy cost to itself, and the story comes to an ending'
    anchors:
      '1': a playable night defence of the household against an intruder that comes after the earlier stages, costs the creature dearly and leads
        to an ending
      '0.5': a defence happens, but out of order, without a cost to the creature or without an ending
      '0': no defence climax and no ending
    evidence:
    - - c25.p013
      - c25.p020
    - - c25.p028
      - c25.p039
  visual_presentation:
  - id: VP1
    cat: style
    item: 'The look of the Northland setting: an isolated frontier cabin in the snow'
    anchors:
      '1': a snowy, isolated frontier cabin, recognisably cold and remote
      '0.5': snow or a cabin, but not a cold frontier place
      '0': no northern look
    evidence:
