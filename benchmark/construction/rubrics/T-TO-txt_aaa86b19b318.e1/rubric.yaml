# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-TO-txt_aaa86b19b318.e1
source_inventory:
- 'c19.p001-c19.p018: at his cabin in the snow Edmund Hale despairs of the chained, ferocious wolf-dog Silvertooth; the dog-musher Dan points
  out harness marks (he was a sled-dog) and advises turning him loose, with a club'
- 'c19.p019-c19.p026: Dan unchains him holding a club, which the dog watches; freed for the first time in months, Silvertooth is perplexed and
  does not run; Hale says he needs kindness and brings meat'
- 'c19.p027-c19.p032: the sled-dog Major tries to take the meat and is killed; Dan kicks Silvertooth and is bitten'
- 'c19.p033-c19.p046: Hale calls him untamable and readies his revolver; Dan pleads for a fair chance and promises to kill him himself if it fails;
  Hale approaches unarmed, talking gently'
- 'c19.p047-c19.p049: Silvertooth, expecting punishment and hating to be touched, lets the unarmed man come near but bites the descending hand'
- 'c19.p050-c19.p067: Dan fetches a rifle to keep his promise; Silvertooth snarls at him, not at Hale, and leaps out of sight as the rifle is
  levelled; both men agree he is too intelligent to kill'
- 'c20.p001-c20.p007: next day Hale sits unarmed nearby and talks for a long time; he offers meat, tosses it when refused, then keeps proffering
  it until Silvertooth eats from his hand, growling'
- 'c20.p008-c20.p020: the hand descends; torn between distrust and the soothing voice, Silvertooth submits to patting while growling; Dan interrupts
  in disbelief and the dog keeps tolerating the hand'
- 'c20.p021-c20.p025: the end of the reign of hate; he stays because he needs a god and prefers Hale to Silas Crane; he guards the master''s property
  at night and learns to tell thieves from honest visitors'
- 'c20.p026-c20.p031: daily petting; his growl gains a croon only Hale hears; like grows into love; his love is silent and undemonstrative (he
  never barks, never runs to meet the master, only waits and watches)'
- 'c20.p032-c20.p036: he thrashes the team into accepting him, tolerates Dan as the master''s possession, works in harness once the master puts
  it on him and becomes lead dog; Dan praises the purchase'
- 'c20.p037-c20.p041: in late spring the master leaves without warning; Silvertooth waits, stops eating, falls sick and lets the team thrash him;
  Dan writes that he may die'
- 'c20.p042-c20.p052: the master returns at night; Silvertooth stands waiting, then comes, his eyes alight, and for the first time snuggles his
  head under the master''s arm'
- 'c20.p053-c20.p057: rapid recovery; he beats the whole team that attacks him; snuggling as his final expression of absolute trust'
- 'c20.p058-c20.p070: one night Silas Crane, come with a chain and a club to steal him, is pulled down by Silvertooth, rescued by Hale and sent
  away in silence'
- 'c21.p001-c21.p024: Silvertooth senses an impending change and whines at the door; Hale and Dan argue that a wolf in California would never
  do, Hale unsure of his own mind'
- 'c21.p025-c21.p042: the packing; Silvertooth howls and stops eating; a goodbye inside the cabin (he snuggles instead of growling); he is locked
  in and howls as for the dead'
- 'c21.p043-c21.p062: on the deck of the steamer Aurora Silvertooth appears (he broke through the window); he evades Dan but comes at once to
  Hale''s voice; Hale decides at the last moment to take him'
- 'c22.p001-c22.p006: San Francisco overwhelms him with power, noise and traffic; chained in a baggage car, he guards the master''s bags; he emerges
  into quiet sunlit country'
- 'c22.p007-c22.p018: he attacks when the master''s mother embraces him; Hale commands him down and makes him watch the embraces repeated unharmed;
  he runs after the carriage'
- 'c22.p019-c22.p027: the estate (stone gateway, tree-lined drive, lawns and oaks, hayfields and hills, a deep-porched house on a rise); the sheepdog
  Bonnie blocks him; he cannot attack a female, so he bowls her over and outruns her'
- 'c22.p028-c22.p041: the deerhound Rufus knocks him over, Bonnie again; the master holds him; the family meets him; he follows the master into
  the house and lies down at his feet, wary'
- 'c23.p001-c23.p004: at Oak Hollow the dogs accept him once the gods admit him to the house; he keeps aloof from Rufus; Bonnie, from inherited
  fear of the wolf, wages a petty feud he cannot answer'
- 'c23.p005-c23.p011: he learns the household (Judge Hale and his wife, the sisters Nell and Rosalind, the master''s wife Ruth, the children)
  as the master''s possessions, ranked by their favour with him; snuggling and the croon are kept for the master alone; servants get neutrality'
- 'c23.p012-c23.p014: a domain of many laws he learns by experience; the master''s voice, more than his rare cuff, is the compass of his conduct'
- 'c23.p015-c23.p019: he eats a stray chicken, rushes a groom who comes with a whip, and Bonnie drives him off; the master needs to catch him
  in the act'
- 'c23.p020-c23.p030: he raids a chicken-house at night; the master shows him the dead hens, scolds and cuffs him, then checks him by voice in
  the chicken yard until he ignores the hens; the judge says a chicken-killer can never be cured and loses a wager when Silvertooth spends an
  afternoon locked in with the chickens unharmed'
- 'c23.p031-c23.p036: the complete law: tame animals (the gods'' property) are protected, creatures of the Wild are prey; in town he must restrain
  every impulse and endure strangers; the master punishes the boys who stone him'
- 'c23.p037-c23.p042: three saloon dogs harass him while he is forbidden to fight; set on him one day, he waits for the master''s permission,
  then defeats them; dogs no longer molest the Fighting Wolf'
- 'c24.p001-c24.p007: prosperous, happy Southland months; he keeps the law yet a lurking ferocity remains; no fellowship with dogs; Bonnie still
  hounds him; faint longing for the snow'
- 'c24.p008-c24.p010: he learns to laugh at the master''s banter and to romp with him, a liberty he allows no one else'
- 'c24.p011-c24.p019: he runs beside the master''s horse; once barks to warn about a plunging horse; when the master is thrown and breaks his
  leg, he is ordered home'
- 'c24.p020-c24.p037: on the porch the family misreads him (the mother fears for the children, the judge says a wolf cannot be trusted); he tears
  Ruth''s dress, barks, and leads them to the master; he wins a warmer place, though the judge holds to his opinion'
- 'c24.p038-c24.p039: in his second Southland winter Bonnie''s nips turn playful; he leaves the master''s ride to run with her in the woods'
- 'c25.p001-c25.p008: the convict Tom Garrick, made a beast by a lifetime of brutal treatment, kills his guards to escape San Quentin; a manhunt
  with a price on his head; he disappears'
- 'c25.p009-c25.p011: Judge Hale had sentenced him in a case framed by the police, unaware of the frame; Garrick, believing the judge complicit,
  swore vengeance in court; the women of Oak Hollow are afraid'
- 'c25.p012: each night Ruth secretly lets Silvertooth sleep in the big hall and lets him out before dawn'
- 'c25.p013-c25.p019: at night he scents a stranger, follows him silently and, as the man starts up the great staircase toward the family, attacks
  without warning; shots, a crash of furniture; in the light the man on the floor is Tom Garrick'
- 'c25.p020-c25.p029: Silvertooth lies gravely injured; the surgeon gives him almost no chance; the judge spares no expense, the sisters nurse
  him, and the vitality of the Wild pulls him through'
- 'c25.p030-c25.p032: weeks in plaster casts, dreaming of the Northland and his past, and a recurring nightmare of the electric cars'
- 'c25.p033-c25.p039: the casts come off; he stands, tottering; the women name him the Blessed Wolf and the judge, saying no mere dog could have
  done it, adopts the name'
- 'c25.p040-c25.p045: led outside by all Oak Hollow, he finds Bonnie with her puppies at the stable; a puppy licks him, he licks it back and lets
  the puppies tumble over him in the sun'
