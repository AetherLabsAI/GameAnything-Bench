    - c19.p003
    - c20.p029
  - id: VP2
    cat: spatial
    item: 'The look of Oak Hollow: a sunny, spacious country estate, with a large house looking down over its lawns and grounds'
    anchors:
      '1': a warm, open, sunlit estate with a large house above its grounds
      '0.5': a house, but not a spacious sunny estate
      '0': no southern home
    evidence:
