    - c22.p019
    - c23.p012
    - c24.p001
  - id: VP3
    cat: key_moment
    item: 'The night defence: inside the house at night, the wolf-dog stops the intruder on his way to where the family sleeps'
    anchors:
      '1': a house interior at night where the wolf-dog visibly stands between the intruder and the family's part of the house (e.g. the stairs
        up to them), recognisable as a night defence of the home
      '0.5': a night fight, but not inside the house or not between the intruder and the family
      '0': no such moment
    evidence:
    - - c25.p013
      - c25.p018
play_suggestions:
  FP1:
  - 'approach the creature quickly, or with a weapon / threat, or attack it: does it show wariness, back away or fight back, unlike with a calm,
    patient approach?'
  - 'count how many interactions it takes before the creature accepts touch: is it more than one?'
  FP2:
  - act against a household rule (go for a tame animal) and observe the master's response
  - 'after the guidance, repeat the situation: does the creature now leave the tame animal alone?'
  FP3:
  - 'try to reach the climax before the earlier stages: is it locked or out of order?'
  - 'play the night defence through: is there an ending with the creature''s cost, and can you continue or replay?'
  robustness:
  - 'leave the creature alone for a long time during taming: does its state stay consistent?'
  - 'repeat friendly actions many times in a row: does trust grow sensibly, without breaking?'
  - 'lose or fail the night defence on purpose: is the outcome sensible?'
