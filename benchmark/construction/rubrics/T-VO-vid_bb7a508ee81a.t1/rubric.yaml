# GameAnything-Bench scoring material: never shown to agents during a trial.
task_id: T-VO-vid_bb7a508ee81a.t1
source_inventory:
- '00:00-00:09.5 slow drone push along a river at mid height: dark glass and bronze-glass towers on the left bank with a riverside road (car lights)
  and a tree-lined lower walk; a round-topped glass tower and a dark glass tower edge on the right bank; a slim, stepped blue-glass tower stands
  far ahead at the end of the river view; a low flat bridge crosses the water in the middle distance, further bridges beyond; small white boats
  on the water'
- 00:00.5-00:05.0 title overlay 'CHICAGO' with small 'USA' and a thin red underline, centred over the river; it writes on and fades out
- 00:00-00:05 dim, desaturated grey sky; from about 00:05.5 the sky is bright cream and the towers catch warm low sunlight (light grading brightens
  over the shot)
- from about 00:06 a faint 'DRONE ...' watermark in the bottom-right corner (present in most later shots; not content)
- 00:10-00:17.5 close drone pass beside a slim white ornate tower with clock faces near the top, between a dark green curved-base glass tower
  (left) and a white grid-facade glass tower (behind right); an ornate stone roof below right; a dense district of brick and concrete mid-rises
  and scattered high-rises spreads behind to the horizon; from 00:15.5 the sun flares over the right tower
- '00:18-00:21.3 high oblique view over the river: green water, a low red-painted bridge crossing it, two cylindrical towers with stacked ring-shaped
  floors standing on the bank, a brown grid-facade tower casting a dark shadow, a curved blue-glass tower filling the right edge; several more
  bridges in a row upriver; trees with yellow leaves on the bank'
- 00:21.5-00:25.3 high view straight down a narrow street canyon between an orange-brick building (left) and a grey-brown building (right), both
  with regular punched windows; a long straight road with cars and street lamps; an elevated structure crosses the street at the far end, with
  trees and taller buildings beyond
- 00:25.5-00:32.8 camera tilted steeply down between a cream stone high-rise (left) and a dark red high-rise (right), an ornate stone facade at
  the right; below, an elevated track comes down the street from the top of the frame and curves into a junction above a street intersection;
  a white / silver train with lit windows sits on the curve; crosswalks and cars on the street under the tracks
- '00:33-00:40.9 straight-down top view: the top edge of a red-roofed / red grid building at the top; a street with an elevated double track running
  horizontally across the frame, a white train moving left to right along it toward the junction; at the right the tracks curve down into the
  junction over a crossing street; below the track a surface parking lot with rows of parked cars between a brown building (lower left) and a
  tan rooftop (lower right); crosswalks'
- cuts at about 00:10, 00:21.4 and 00:25.4; 00:32.8-00:33 cut to the top view; clip ends at 00:41
- 'audio: music only, no speech (per the curated annotation; loudness jumps line up with the cuts)'
- 'not visible: no people at readable size, no street names or landmark names besides the title overlay, no night or weather change, no lakefront
  in this range'
