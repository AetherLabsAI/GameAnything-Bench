  functions_playability:
  - id: FP1
    item: 'The water market can be explored on foot: walkways and docks over water lead between stalls, buildings and the landmarks, and the water
      behaves consistently (it can be waded or swum, or it clearly blocks), without dead ends the player cannot leave'
    anchors:
      '1': the player moves freely along walkways over water between several market spots and the landmarks; water is either traversable or clearly
        bounded; no stuck spots or falls out of the world
      '0.5': the market is walkable but cramped to one spot, the water behaves inconsistently or it is unclear whether it can be entered, or the
        player can get stuck or fall out of the map
      '0': the market cannot be explored on foot
    evidence:
    - - 00:45
      - 00:47
    - - 00:50
      - 00:55
  - id: FP2
    item: 'The player can walk through the corridor into the club: it is reached in normal play, walked through without a break, and the player
      clearly arrives in the club interior'
