      '1': the player walks through the corridor straight into the club interior without a teleport or load, and the corridor can be found and
        entered in normal play
      '0.5': the club is reached from the corridor only by a teleport, menu or load, or the corridor is very hard to find or enter
      '0': the corridor cannot be walked through into the club
    evidence:
    - - 00:55
      - 00:58
  - id: FP3
    item: 'The round hatch works as a tube passage: entering it carries the player down and away through a tube'
