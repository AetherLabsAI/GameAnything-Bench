task_id: T-TO-txt_27babbacad50.e1
source_inventory:
- 'c20.p001-c20.p007: introduction: the palace with its marble court, fountains, gardens, park and the two Trianons as a vast, varied ensemble;
  Sunday crowds today; the gardens as the grand framing of a royal court; the town exists only because of the palace; old criticism of its cold
  statuary and clipped trees'
- 'c20.p008-c20.p010: origin as Louis XIII''s humble hunting lodge (1624) with a garden and a larger park; architect Le Roy'
- 'c20.p011: Boyceau''s original parterres: a central basin where two wide avenues cross, four compartments with broderies, trimmed hedges and
  coloured sands; a flower parterre next to the palace; alleys toward the wood; Menours'' pay and the costs'
- 'c20.p012-c20.p014: the entrance: the great Cour Royale behind the long range of iron gates on the Place d''Armes, the Cour de Marbre as an
  extension at its foot; Damiens'' attack on Louis XV there in 1757 and its background'
- 'c20.p015: behind the palace: parterres, tapis vert, fountains and the grand canal, with the park of the Trianons off to the right'
- 'c20.p016-c20.p022: Le Notre''s redesign from 1664: Parterre du Nord, an alley of four rows of lindens enclosing the park, the Parterre a Fleurs
  between chateau and Orangerie; the Rondeau / Bassin du Dragon and the Jardin Bas; the Menagerie at one end of the park; the south region after
  1679; two epochs and royal changes; early garden of sand and gravel more than grass, great enclosing trees since cut'
- 'c20.p023-c20.p025: the Potager du Roy (fruit and vegetable garden) created after the ornamental gardens, still in its outlines; humid but drained
  soil; drainage works and the Eaux des Suisses replacing a stagnant pool; La Quintinye'
- 'c20.p026-c20.p028: espalier planting: the eight-hectare plot divided into many wall-enclosed subdivisions to multiply wall space and shelter
  plants; terraces at least two metres wide around a central garden of about three hectares; twenty-eight compartments, nine kinds of garden'
- 'c20.p029-c20.p032: forced culture of early vegetables for the king''s table (asparagus in December ... strawberries in April); costs and maintenance;
  foreign visitors; since 1875 the National Horticultural College; some terraces and walls gone, sixteen gardens remain'
- 'c20.p033-c20.p039: maintenance below its old standard; a military aerostation camp planned in the park near Rocquencourt that would fell its
  trees; deforestation, lost lease revenue, the Societe des Amis de Versailles'
- 'c20.p040-c20.p045: winter: crowds skate on the shallow Grand Canal despite posted 1849 no-skating notices; haze over the snowy Tapis Vert,
  snow on the figures of the Bassin d''Apollon and the statues of the Allee Royale'
- 'c20.p047-c20.p049: the fountains (Grands Eaux, Petits Eaux), costly to play; the Orangerie just below the terrace of the Parterre du Midi with
  many orange trees; the Eaux des Suisses basin dug by the Swiss Guard to irrigate the Potager and to adorn the garden facing the palace''s long
  front'
- 'c20.p050: farther toward the Bois de Satory, past the Tapis Vert: the Bassins de Latone and Apollon, the Bassin du Miroir, then the Grand Canal,
  one transverse branch leading to the Menagerie (now a stud farm), the other to the Trianons'
- 'c20.p051-c20.p056: the Grand and Petit Trianons as satellite palaces; the Grand Trianon a sprawling one-storey horseshoe-shaped villa by Mansart
  for Madame de Maintenon; recent restoration; de Musset''s remarks'
- 'c20.p057-c20.p063: Louis XV''s small subdivided apartments and the blue-room anecdote; his pastoral taste in the gardens (bowers, labyrinths,
  vases, statues); in the Grand Trianon''s garden a great basin with a cascade over the red and white marble Buffet de l''Architecture'
- 'c20.p064-c20.p068: the Petit Trianon by Gabriel, Marie Antoinette''s, bored caretakers; its garden an English garden of sweeps and curves instead
  of formal lines; the Hameau with the queen''s dairy just behind it, looking like a stage set for a pastoral play'
- 'c20.p069-c20.p071: nearby Chateau de Clagny, the Couvent des Recollettes across the Bois de Satory, Noisy and Molineaux; the rest left to guidebooks'
