rubric:
  content_realization:
  - id: CR1
    item: 'The palace is fronted by the entrance sequence: iron gates on the town square open into a great main court, and a second court extends
      it at its foot, in front of the palace'
    anchors:
      '1': gates on a town square, then a large main court, then a second court at its foot, then the palace, in this order
      '0.5': an entrance court before the palace exists, but the second court or the gates on the square are missing, or the order is wrong
      '0': 'no entrance courts: the palace stands without a gated forecourt'
    evidence:
    - c20.p012
  - id: CR2
    item: 'Behind the palace the gardens lie along one axis, in this order outward: parterres, the long lawn of the Tapis Vert, a series of basins,
      and finally the Grand Canal'
    anchors:
      '1': on the garden side of the palace, parterres, then a long lawn, then basins, then the canal, laid out outward in this order (basin names
        not required)
      '0.5': most of these features exist behind the palace, but one is missing or they are not in the outward order
      '0': no gardens behind the palace, or only a generic park
    evidence:
    - c20.p015
    - c20.p050
  - id: CR3
    item: 'The Grand Canal is cross-shaped: its two transverse arms lead one toward the Menagerie and the other toward the Trianons'
    anchors:
      '1': a canal with two cross arms; one arm leads toward the Menagerie, the other toward the Trianons
      '0.5': a canal exists, but it has no cross arms, or only one arm leads toward an outlying destination
      '0': no Grand Canal
    evidence:
    - c20.p015
    - c20.p019
    - c20.p050
  - id: CR4
    item: The Grand Trianon and the Petit Trianon stand in the park as two separate satellite palaces, smaller than the main palace and away from
      it, off to one side of the garden axis
    anchors:
      '1': two distinct smaller palaces, the Grand and the Petit Trianon, set apart from the main palace in the park beside the garden axis
      '0.5': only one Trianon exists, or the two are merged into one building or attached to the main palace
      '0': no Trianons
    evidence:
    - c20.p015
    - c20.p051
    - c20.p052
    - c20.p064
  - id: CR5
    item: The Petit Trianon has a garden of its own, set around it and separate from the main gardens
    anchors:
      '1': a garden that belongs to the Petit Trianon, set by it and apart from the main garden axis
      '0.5': greenery near the Petit Trianon, but not a garden of its own (only a lawn, or simply part of the main gardens)
      '0': no garden at the Petit Trianon
    evidence:
    - c20.p066
  - id: CR6
    item: The Potager du Roy is a separate kitchen garden, walled and divided inside by walls into many enclosed plots
    anchors:
      '1': a distinct kitchen garden whose ground is divided by walls into many separate walled plots
      '0.5': a kitchen garden exists but is one open field or has only an outer wall
      '0': no kitchen garden
    evidence:
    - c20.p023
    - c20.p026
  functions_playability:
  - id: FP1
    item: 'The player can walk in through the entrance sequence: through the gates, across the main court and the second court, up to the palace'
    anchors:
      '1': a continuous walkable approach that passes the gates and crosses both courts in order to reach the palace
      '0.5': the palace is reached on foot, but the approach skips a court or bypasses the gates
      '0': no walkable approach; the player starts at or inside the palace
    evidence:
    - c20.p012
  - id: FP2
    item: From the back of the palace the player can walk outward through the parterres, along the Tapis Vert and past the basins to the Grand
      Canal
    anchors:
      '1': one connected walkable route from the palace's garden side through the garden features, in order, to the canal
      '0.5': the garden features can be visited, but the route is broken, blocked or does not lead out to the canal
      '0': the gardens behind the palace cannot be walked
    evidence:
    - c20.p015
    - c20.p050
  - id: FP3
    item: 'The canal''s transverse arms work as routes to the outlying destinations: following one arm the player reaches the Trianons, following
      the other the Menagerie'
    anchors:
      '1': walking along one arm leads to the Trianons and along the other to the Menagerie
      '0.5': the Trianons can be reached, but not by way of the canal arms (e.g. a teleport or an unrelated path), or only one arm leads anywhere
      '0': the Trianons cannot be reached
    evidence:
    - c20.p015
    - c20.p050
  - id: FP4
    item: The player can enter the Potager du Roy and move from one walled plot to the next
    anchors:
      '1': the kitchen garden can be entered and its walled plots are reachable from one another on foot
      '0.5': the kitchen garden can be entered, but its walled plots are closed off or only seen from outside
      '0': the kitchen garden cannot be entered
    evidence:
    - c20.p026
  visual_presentation:
  - id: VP1
    cat: style
    item: 'The main gardens look grand and formal: geometric parterres and straight, ordered lines'
    anchors:
      '1': a clearly formal, geometric garden laid out in straight lines
      '0.5': a garden with some formal parts, but its overall look is not formal or geometric
      '0': a generic or natural park
    evidence:
    - c20.p003
    - c20.p016
    - c20.p066
  - id: VP2
    cat: style
    item: 'The Petit Trianon''s garden looks informal: sweeps and curves instead of the straight formal lines of the main gardens'
    anchors:
      '1': a visibly curving, informal garden at the Petit Trianon that contrasts with the main gardens
      '0.5': some curving or informal parts, but the garden still reads mostly formal or the contrast is weak
      '0': the Petit Trianon's garden looks as formal as the main gardens
    evidence:
    - c20.p066
  - id: VP3
    cat: spatial
    item: The Grand Trianon is a low, sprawling, one-storey, horseshoe-shaped villa
    anchors:
      '1': a low single-storey building curved in a horseshoe
      '0.5': a low villa that is not horseshoe-shaped, or a horseshoe building of several storeys
      '0': a generic building
    evidence:
    - c20.p052
