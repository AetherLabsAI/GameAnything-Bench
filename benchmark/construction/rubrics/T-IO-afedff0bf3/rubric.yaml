source_inventory:
- 'img01: old engraved floor plan of the whole abbey (title ''Plan du Mont St Michel'', numbered legend in French, two coats of arms); the church
  in the centre (a long nave of pillars, a rounded choir with radiating chapels at the top), surrounded on all sides by smaller rooms, crypts
  and halls drawn with rib vaults; a range of long pillared, rib-vaulted halls along the left side next to a curving outer wall; walled terraces
  / gardens at the lower left'
- 'img02: old plan of one level (title ''Abbaye du Mont St Michel'', ''Plan du 1er étage''): two long rectangular halls in a row (''Salle d''Aumônes'',
  ''Cellier des Moines'') with rows of pillars and vaults, built directly against the bare rock (''Rocher'') along their back wall, buttressed
  front wall, a wall-walk (''Chemin de ronde'') running along the outside, spiral stairs and stairways at both ends, a rampart and a round tower
  at the lower left'
- 'img03: aerial photo at high water, golden evening light: a small steep rocky island standing in calm water; a ring of rampart walls with round
  towers at the waterline, a village of tightly packed stone and half-timbered houses with slate roofs climbing the slope, trees on the slopes,
  massive stone abbey buildings on top, the church with a tall pointed spire at the summit; a sandy strip / causeway leading off to the left'
- 'img04: high aerial photo at low water: the island on an immense expanse of grey-beige sand flats cut by meandering water channels; a long straight
  causeway / road with car parks runs from the island to the mainland, whose shore is green salt meadow crossed by creeks; a second small islet
  far off in the bay'
- 'img05: the summit seen from below, blue sky: the church with a square Romanesque bell tower, a steep slate roof and a tall slender green-and-gilt
  spire topped by a golden winged statue; a Gothic east end bristling with pinnacles; below, tall sheer granite walls of the abbey buildings with
  small windows, partly under scaffolding; an arcaded buttress wall on the left; rock and greenery at the foot'
- 'img06: panorama inside the cloister: a covered walkway with a wooden barrel-vaulted roof running round a square garden of clipped hedges and
  lawn open to the sky; the inner side is a double row of slender columns carrying pointed arches with carved friezes above; stone-flag floor,
  sunlight casting column shadows'
