  U5: CR1
  FP1: FP1 (reachability); existence of entrance, hall, rooms, verandah -> CR1, CR4
  FP2: FP2
  VP1: CR4 (rooms in a row along verandah and garden); paper-screen look -> VP3
  VP2: 'CR2 | dropped: same property as CR2 (two distinct recesses), merged there'
  VP3: VP1 (look of the straw mats only; uniform mat grid and mat-module sizing moved to CR3)
  VP4: VP2 (paper-screen part moved to VP3)
