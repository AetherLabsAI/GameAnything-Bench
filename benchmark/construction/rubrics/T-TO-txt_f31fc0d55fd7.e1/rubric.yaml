rubric:
  content_realization:
  - id: CR1
    item: The house has a vestibule with an earth floor, which leads to the hall and from the hall into the matted rooms
    anchors:
      '1': an earth-floored entrance distinct from the matted interior, connected through a hall to the rooms
      '0.5': an entrance exists, but without the earth floor in contrast to the matted rooms, or with no hall between it and the rooms
      '0': no distinct entrance; the map starts inside a room
    evidence:
    - c08.p008
    - c08.p009
    - c08.p037
    - c08.p052
  - id: CR2
    item: 'The guest room has two recesses side by side: the tokonoma, an open alcove holding a hanging scroll and an object on its floor, and
      a companion bay of shelves and closets'
    anchors:
      '1': 'both recesses in the guest room, told apart: a display alcove with a scroll and an object on its floor, and a bay of shelves and closets'
      '0.5': an alcove or recesses exist, but the two bays are not told apart, or they are not in the guest room
      '0': no recesses
    evidence:
    - c08.p002
    - c08.p074
    - c08.p082
    - c08.p120
    - c08.p125
  - id: CR3
    item: The rooms are floored with mats of one standard rectangular size, and each room's size is a whole (or half) number of those mats
    anchors:
      '1': every main room covered by same-size mats, room sizes following the mat module (rooms of different mat counts allowed)
      '0.5': matted floors, but the rooms do not follow a common mat size
      '0': no matted floors
    evidence:
    - c08.p007
    - c08.p012
    - c08.p022
    - c08.p034
  - id: CR4
    item: The main rooms, the guest room among them, lie side by side along a verandah that faces a garden
    anchors:
      '1': a row of main rooms, including the guest room, opening onto a verandah with a garden beyond
      '0.5': a verandah or a garden exists, but not along the row of main rooms, or the guest room is not on it
      '0': no verandah and no garden
    evidence:
    - c08.p012
    - c08.p022
    - c08.p047
  - id: CR5
    item: The walls between the rooms, and the verandah side of the main rooms, are sliding paper screens rather than solid walls
    anchors:
      '1': rooms divided by sliding screens, with screens also forming the verandah side of the main rooms
      '0.5': sliding screens present, but most rooms still divided by solid walls, or the verandah side solid
      '0': only solid walls and ordinary doors
    evidence:
    - c08.p005
    - c08.p006
    - c08.p047
    - c08.p125
  functions_playability:
  - id: FP1
    item: The player enters the house from outside and can walk through it as one connected interior, reaching the matted rooms, the guest room
      and the verandah
    anchors:
      '1': a connected interior entered from outside, where the matted rooms, the guest room and the verandah can all be reached (any route)
      '0.5': the interior can be explored, but it cannot be entered from outside, or the guest room or the verandah cannot be reached, or rooms
        are disconnected
      '0': no walkable interior
    evidence:
    - c08.p008
    - c08.p009
    - c08.p012
    - c08.p022
    - c08.p052
  - id: FP2
    item: 'The sliding partitions work as the walls between rooms: the player can open or remove them, so adjoining rooms open into one larger
      space'
    anchors:
      '1': partitions that the player slides or removes, visibly merging rooms into one space
      '0.5': screens that open only like ordinary doors, never merging rooms into one space
      '0': partitions are static scenery
    evidence:
    - c08.p044
    - c08.p005
    - c08.p022
  visual_presentation:
  - id: VP1
    cat: style
    item: 'The room floors look like thick straw mats: woven matting with bound edges, clearly unlike the earth floor of the entrance or ordinary
      boards'
    anchors:
      '1': floors recognisable as woven straw mats, their bound edges showing between the mats
      '0.5': straw-coloured or woven floors, but not recognisable as separate mats
      '0': ordinary floors (boards, stone, carpet)
    evidence:
    - c08.p007
    - c08.p017
    - c08.p030
  - id: VP2
    cat: style
    item: A plain, uncluttered interior of natural, unpainted wood, with posts and beams left in plain sight
    anchors:
      '1': sparsely furnished rooms with an exposed natural wood structure
      '0.5': wood present, but painted over, the structure hidden, or the rooms cluttered like a generic interior
      '0': a generic interior
    evidence:
    - c08.p002
    - c08.p006
    - c08.p017
    - c08.p022
    - c08.p023
  - id: VP3
    cat: style
    item: 'The partitions look like paper-covered wooden frames: light, translucent white paper screens on the verandah side, opaque paper screens
      between rooms'
    anchors:
      '1': screens recognisable as paper on light wooden frames, the outer ones bright and translucent, the inner ones opaque
      '0.5': paper screens recognisable, but outer and inner alike
      '0': partitions look like ordinary walls or doors
    evidence:
    - c08.p005
    - c08.p047
    - c08.p048
    - c08.p066
play_suggestions:
  FP1:
  - 'start outside and enter: is there an earth-floored entrance before the matted rooms?'
  - walk from the entrance to the guest room and out to the verandah
  FP2:
  - 'open and close the screens between two rooms, then remove them: do the rooms become one space?'
  - 'open the screens along the verandah rooms one after another: do they form one long room?'
  robustness:
  - try to walk through closed screens or out of the house through walls
  - remove and replace several screens in a row, then reload or leave and return
  - walk on the verandah and around the guest room recesses for clipping or stuck spots
