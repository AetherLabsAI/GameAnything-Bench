source_inventory:
- 'img01: elevated view down a valley onto a fjord: steep, partly forested mountain walls on both sides; a flat green valley floor with fields,
  scattered farm houses (red, white) and a cluster of village houses; a river winding across the floor toward the fjord; a road with a bridge
  and a tunnel portal in the left mountainside, a campsite and a gravel area; the fjord water at the valley mouth continues between the mountains
  into the distance; overcast sky'
- 'img02: elevated view of a small harbour village at the water: a concrete quay with a docking edge and flags on the fjord, small boats at a
  pier; wooden buildings with dark and red pitched roofs right behind the quay; railway tracks and platforms running inland directly behind the
  quay buildings, a yellow station-style building (''KAFE'' sign), a large white hotel with a glass-fronted section; car parks, a footpath along
  the rocky shore with people walking; a forested mountainside rising behind'
- 'img03: elevated view (from a moving train or road, blurred foliage at right) of a hamlet beside a broad stony river: a small dark wooden church
  with a steeple and a walled churchyard, white and red wooden houses along a road, a new red barn-like building; at the time of the photo the
  riverbanks are under construction (gravel, trucks, a loader, cones); a bridge over the river at the left'
- 'img04: a railway station at the foot of steep mountains: several tracks with switches, a low platform with steps, overhead catenary on steel
  gantries, a red electric locomotive with a train of green passenger carriages, another carriage on a siding; ochre-yellow wooden buildings including
  a two-door engine shed; valley and mountains behind'
- 'img05: a coloured relief map (Cyrillic labels, ''Карта на Согнефиорд'', R. Botev 2020) of a long fjord running in from the coast with many
  branching arms reaching deep inland between high ground; towns marked as circles, roads as red lines, ferry crossings as dotted lines, church
  symbols, a glacier and spot heights; no marker identifies the village of the photos'
- 'img06: from the water: a near-vertical grey rock wall, forested at its base, plunging straight into dark fjord water; low cloud and mist cling
  to the cliff; the shoreline recedes into haze'
