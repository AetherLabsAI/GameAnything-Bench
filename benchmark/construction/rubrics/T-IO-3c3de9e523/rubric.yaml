rubric:
  content_realization:
  - id: CR1
    item: The village lies on a flat valley floor at the head of the fjord, with a river running down the valley into the fjord water
    anchors:
      '1': valley floor with the village opening onto the fjord, the river flowing across it into the water
      '0.5': a valley or a fjord with a village, but not the valley opening onto the fjord, or no river into it
      '0': no valley-and-fjord arrangement
    evidence:
    - img01
    - img02
  - id: CR2
    item: The fjord is narrow water hemmed in by very high, steep rock walls that drop directly into it
    anchors:
      '1': narrow fjord water with high, steep walls rising straight from it
      '0.5': water with mountains, but gentle slopes, a shore strip between, or an open coast
      '0': no fjord
    evidence:
    - img01
    - img06
  - id: CR3
    item: 'The waterfront joins harbour and railway: a quay on the fjord where boats dock, with the railway station and its tracks right behind
      it running inland'
    anchors:
      '1': a quay on the water and a station with tracks adjacent to it as one waterfront
      '0.5': harbour and station both present but apart or unrelated
      '0': neither, or only one of them
    evidence:
    - img02
    - img04
  - id: CR4
    item: A small steepled church stands among the houses of a settlement beside the river
    anchors:
      '1': a small church with a steeple among houses by the river
      '0.5': a church but not with a steeple, large, or not in a riverside settlement
      '0': no church
    evidence:
    - img03
  functions_playability:
  - id: FP1
    item: 'The player can drive and race through the place as a valley corridor: a continuous route from the fjord shore across the valley floor
      and up the valley, with the steep mountain walls bounding it'
    anchors:
      '1': a continuous route from the shore up the valley floor that can be driven through as a race, enclosed by the mountain sides
      '0.5': drivable, but not as a shore-to-up-valley route (e.g. a flat open map or a strip that ignores the valley), the route breaks off so
        a race cannot be driven through, or the sides do not bound it believably
      '0': the place cannot be driven through
    evidence:
    - img01
    - img06
  - id: FP2
    item: 'The landmark areas are places the player reaches and recognises in play: the harbour-and-railway waterfront and the church settlement'
    anchors:
      '1': both the waterfront and the church settlement are reached by driving and recognisable on arrival
      '0.5': only one reachable, or the landmarks present only as unreachable backdrop
      '0': no landmark reachable
    evidence:
    - img02
    - img03
    - img04
  visual_presentation:
  - id: VP1
    cat: style
    item: 'The fjord walls look like the reference: bare grey rock above dark water, with low cloud or mist clinging to them'
    anchors:
      '1': grey rock faces over dark water under a misty, low-cloud atmosphere
      '0.5': rock by water but green or brightly coloured, or no mist / low cloud
      '0': none
    evidence:
    - img06
    - img01
  - id: VP2
    cat: style
    item: 'The village character: small painted wooden houses with pitched roofs scattered among green fields'
    anchors:
      '1': painted wooden buildings with pitched roofs among fields
      '0.5': buildings present but generic (e.g. concrete blocks or one uniform model)
      '0': none
    evidence:
    - img01
    - img02
    - img03
    - img04
  - id: VP3
    cat: style
    item: 'The church looks like the reference: dark wooden, in keeping with the wooden village around it'
    anchors:
      '1': a dark wooden church that fits the wooden houses around it
      '0.5': a church generic in look or out of keeping with the village (e.g. white stone chapel, grey cathedral-like building)
      '0': none
    evidence:
    - 'img03: the dark church with steeple among the houses'
play_suggestions:
  FP1:
  - 'drive from the water''s edge up the valley as far as it goes: does the valley floor continue and do the mountain sides enclose it?'
  - 'start a race on the location: can it be driven through along the route without dead ends or getting lost?'
  - 'try to leave sideways: do the mountain walls bound the space in a believable way?'
  FP2:
  - 'find the waterfront with the quay and the station, then the church settlement by the river: can each be reached and recognised without being
    told where it is?'
  robustness:
  - 'leave the main route at several points (onto fields, into the river, toward the water): does the game recover sensibly?'
  - 'restart from different points: is the layout consistent?'
