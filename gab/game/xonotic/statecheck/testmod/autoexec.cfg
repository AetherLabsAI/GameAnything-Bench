// GameAnything-Bench state self-check test mod (Xonotic): a custom cvar, a changed stock cvar, a new alias, a centerprint at
// game start (Xonotic's own `cl_cmd localprint`); zz-gabtest.pk3dir/maps/stormkeep.ent (the stock entities + a shotgun and a
// second mega health) adds map entities
set gab_test_quest "stage_two"
set g_balance_health_start 150
alias gab_test_hello "echo gab test hello"
set hud_panel_centerprint_time 60          // the centerprint stays up for the whole check
alias cl_hook_gamestart_dm "defer 3 \"cl_cmd localprint \\\"GAB TEST CENTER: find the shotgun\\\"\""
