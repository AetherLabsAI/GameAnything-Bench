# USD per million tokens, used when a harness reports no cost (gab.agent.base.price_usd) and by the opencode adapter (declared
# as the provider's model cost). input = uncached input, cached_input = cache reads.
# Source: OpenRouter model catalog (https://openrouter.ai/api/v1/models), standard (non-batch) prices, read 2026-10-30.
# For first-party routes (Codex via ChatGPT login) the OpenRouter price of the same model is used as the list price; a
# subscription is not billed per token.
source: "openrouter.ai/api/v1/models, 2026-10-30"
models:
  # Claude Code (the CLI reports total_cost_usd itself; listed for completeness)
  claude-opus-5-5:          {input: 4.0,   output: 20.0,  cached_input: 0.20,  cache_write: 5.0,  route: anthropic/claude-opus-5.5}
  claude-fable-5-1:         {input: 10.0,  output: 50.0,  cached_input: 0.25,  cache_write: 12.5, route: anthropic/claude-fable-5.1}
  claude-sonnet-5-5:        {input: 2.0,   output: 10.0,  cached_input: 0.10,  route: anthropic/claude-sonnet-5.5}   # judge
  # Codex CLI
  gpt-6-astra:              {input: 10.0,  output: 50.0,  cached_input: 1.0,   route: openai/gpt-6-astra}
  gpt-5.6-sol:              {input: 4.0,   output: 20.0,  cached_input: 0.40,  route: openai/gpt-5.6-sol}
  # OpenCode / the refinement critic (OpenRouter ids)
  google/gemini-3.8-flash:  {input: 0.825, output: 4.125, cached_input: 0.0825}
  moonshotai/kimi-k3:       {input: 0.192, output: 15.0,  cached_input: 0.182}
  qwen/qwen3.8-flash:       {input: 0.15,  output: 0.47,  cached_input: 0.016}
  deepseek/deepseek-v4.1-flash: {input: 0.045, output: 0.50,  cached_input: 0.006}
  z-ai/glm-5.3-flash:           {input: 0.15,  output: 0.50,  cached_input: 0.03}
  qwen/qwen3.8-max-0902:        {input: 2.0,   output: 6.0,   cached_input: 0.25}
  qwen/qwen3.8-27b:             {input: 0.15,  output: 1.875, cached_input: 0.0375}
  # model ids without a vendor prefix (as some OpenAI-compatible gateways name them): the OpenRouter list price of the same model
  gemini-3.8-flash:         {input: 0.825, output: 4.125, cached_input: 0.0825, route: google/gemini-3.8-flash}
  qwen3.8-flash:            {input: 0.15,  output: 0.47,  cached_input: 0.016, route: qwen/qwen3.8-flash}
  qwen3.8-max:              {input: 2.0,   output: 6.0,   cached_input: 0.25,  route: qwen/qwen3.8-max-0902}
  deepseek-v4.1-flash:      {input: 0.045, output: 0.50,  cached_input: 0.006, route: deepseek/deepseek-v4.1-flash}
  glm-5.3-flash:            {input: 0.15,  output: 0.50,  cached_input: 0.03,  route: z-ai/glm-5.3-flash}
  kimi-k3:                  {input: 0.192, output: 15.0,  cached_input: 0.182, route: moonshotai/kimi-k3}
